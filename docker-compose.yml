# Autonomy home base — sovereign Compose distribution (H5, DEPLOY.md).
#
#   git clone <source you chose> autonomy && cd autonomy
#   AUTONOMY_FIRST_ORG=myorg docker compose up -d
#   → https://localhost:8080  (self-signed cert; accept once)
#
# Everything builds from this checkout. No registry login, no license
# check, no phone-home. The only external fetches are anonymous
# (base image, PyPI, tailwind binary) and each is overridable via build
# args to point at mirrors you control.
#
# Optional beads issue-tracker backend (dolt SQL server):
#   docker compose --profile beads up -d
# Without it the dashboard runs fine — beads surfaces are simply empty.

services:
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Point at mirrors you control, e.g.:
        #   AUTONOMY_BASE_IMAGE=registry.example.internal/python:3.12-slim
        #   AUTONOMY_TAILWIND_URL=https://mirror.example.internal/tailwindcss-linux-x64
        BASE_IMAGE: ${AUTONOMY_BASE_IMAGE:-python:3.12-slim}
        TAILWIND_URL: ${AUTONOMY_TAILWIND_URL:-}
        # No version build arg: the build reads the commit hash + date from the
        # checkout's .git itself and stamps /app/VERSION, then strips only the git
        # REMOTE (see deploy/Dockerfile — the image keeps a working local repo so
        # the launcher can clone /workspace/repo from it). Plain `docker compose up`
        # self-stamps; nobody passes a version.
    # Published path: set AUTONOMY_IMAGE to the verified immutable reference
    # from image-lock.env (repo/image@sha256:...), then use
    # `docker compose pull && docker compose up -d --no-build`.
    # Unset remains the sovereign checkout build above; no registry required.
    image: ${AUTONOMY_IMAGE:-autonomy-node:local}
    restart: unless-stopped
    # Explicit, matching the Dockerfile CMD default — spelled out here because
    # the entrypoint is now shared with the dispatcher service below (it execs
    # whatever command it's given), so this is no longer implicit.
    command: sh /app/deploy/serve.sh
    # Every session the node launches joins THIS network (the launcher discovers
    # it via `docker inspect` self — agents/mount_plan.discover_topology) and
    # reaches the dashboard by the `dashboard` alias. That is the only path a
    # sibling session has to a CONTAINERIZED dashboard: host.docker.internal
    # resolves to the host gateway, where a container-published, tailscale-bound
    # port does not answer. The compose service name already aliases here; this
    # block pins it so the contract survives a service rename. External exposure
    # is unchanged — this is the internal control-plane name only.
    networks:
      default:
        aliases:
          - dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      AUTONOMY_FIRST_ORG: ${AUTONOMY_FIRST_ORG:-}
      AUTONOMY_FIRST_ORG_NAME: ${AUTONOMY_FIRST_ORG_NAME:-}
      AUTONOMY_FLEET_INVITE: ${AUTONOMY_FLEET_INVITE:-}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      DASHBOARD_TLS: ${DASHBOARD_TLS:-}
      # Points at the optional `beads` profile service; unreachable is a
      # supported state (beads surfaces degrade to empty, one warning).
      DOLT_SQL_HOST: dolt
      # Reach the optional `voice` profile service on the project network.
      # Unset would default to loopback, which inside this container is the
      # container itself — dictation would fail with nothing obviously wrong.
      WHISPERLIVE_URL: ${WHISPERLIVE_URL:-ws://whisper:9090}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      # The three-volume node model (graph b20f2468-b12 "FINAL ARCHITECTURE").
      #
      # autonomy-code -> /app : the platform code, as files. Seeded from the
      # image on first boot, then hot-reloaded in place (the entrypoint runs
      # uvicorn --reload). Keeps a working local repo, remote removed: the node
      # never phones home, but the launcher can clone /workspace/repo from it. Code
      # updates are a deliberate operator action into this volume, on the
      # operator's schedule — not an image rebuild and not an origin pull. (An
      # operator who prefers to edit a host checkout directly can bind-mount it
      # here instead: `- /path/to/checkout:/app`.)
      - autonomy-code:/app
      # THE persistent state: per-org DBs (identity + credential Settings
      # — the secret store), graph.db, auth.db, TLS keypair, traces.
      # Back this volume up and you have backed up the deployment.
      - autonomy-data:/app/data
      # Org-partitioned workspace inputs the node provisions and resolves:
      # /app/orgs/<org>/<subpath>. Held by the NODE (never handed to a session
      # wholesale — a session receives only the resolved concrete dir, via the
      # hybrid resolver, auto-fteke). Nothing else lives here.
      - autonomy-orgs:/app/orgs
      # The Docker socket. REQUIRED, not optional: the node launches each
      # session as a HOST-LEVEL sibling container through this socket, never as
      # a child of a node-owned daemon — because session images can run their
      # own nested docker daemon (agents/Dockerfile.dind, for project stacks
      # such as the Anchore Enterprise compose), and nesting the node too would
      # make that DOUBLE docker-in-docker, which is unsupported. The launcher
      # (`docker run`), topology discovery (`docker inspect`) and secret-ramfs
      # provisioning all shell out to `docker` against this socket. It is
      # effective host-root: a node that deliberately will not launch sessions
      # or hold secrets may drop it, but then it is a viewer, not a working node.
      - /var/run/docker.sock:/var/run/docker.sock
      # The dashboard's memory-class key cache (auto-a1pub): opened key material
      # lives on ramfs, never disk, never swap. This is only the mountpoint +
      # rslave propagation; the entrypoint mounts the ramfs on the host at boot
      # (agents.secret_ramfs) and rslave carries that host mount into this
      # running container. Propagation, not a plain bind, so no restart is
      # needed to see the mount and no CAP_SYS_ADMIN is added here. Provisioning
      # needs the Docker socket (see the compose override that grants it, the
      # same one session-launching needs); without it the mount stays an empty
      # dir and the vault's per-write ramfs check fails closed.
      #
      # The delivery root is also bound into the trusted dashboard because the
      # settled vault-open chokepoint decrypts the exact approved Setting there
      # and writes it directly into the requester's per-session ramfs. Sessions
      # still mount only their own subdirectory at /run/secrets. Both binds use
      # rslave so a ramfs provisioned after container start propagates in.
      - type: bind
        source: /run/autonomy-secrets
        target: /run/autonomy-secrets
        bind:
          propagation: rslave
          create_host_path: true
      - type: bind
        source: /run/autonomy-keycache
        target: /run/autonomy-keycache
        bind:
          propagation: rslave
          create_host_path: true

  # Polls for approved beads and launches session containers for them
  # (agents/dispatcher.py). Was host-only prior to this (agents/start-dispatcher.sh,
  # a bare `nohup ... &` with no supervisor) — a disk-full crash on 2026-08-25 killed
  # it silently and nothing restarted it for 33+ hours. Same image as dashboard
  # (built once, shared — compose recognizes the identical build+image and does not
  # rebuild twice), same entrypoint (deploy/entrypoint.sh execs whatever command
  # it's given), different command and a trimmed volume set: no ramfs/keycache
  # binds, because the dispatcher never decrypts a secret itself — it only shells
  # out to agents/launch.sh, which provisions each launched session's own secrets
  # independently, the same way whether the launch was dispatcher- or
  # dashboard-triggered.
  dispatcher:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${AUTONOMY_BASE_IMAGE:-python:3.12-slim}
        TAILWIND_URL: ${AUTONOMY_TAILWIND_URL:-}
    image: ${AUTONOMY_IMAGE:-autonomy-node:local}
    restart: unless-stopped
    command: sh /app/deploy/dispatch.sh
    # The shared image's HEALTHCHECK curls https://127.0.0.1:8080/api/ping, which
    # is the DASHBOARD's liveness probe. The dispatcher serves no HTTP at all, so
    # it inherits a check it can never pass and reports `unhealthy` forever while
    # working correctly. Disable it here rather than weaken the dashboard's.
    # (A real dispatcher probe — last poll time, say — would be better than none,
    # but a permanently-red light is worse than no light: it trains the operator
    # to ignore the column.)
    healthcheck:
      disable: true
    environment:
      DISPATCH_INTERVAL: ${DISPATCH_INTERVAL:-5}
      DISPATCH_MAX_CONCURRENT: ${DISPATCH_MAX_CONCURRENT:-2}
      DOLT_SQL_HOST: dolt
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      - autonomy-code:/app
      - autonomy-data:/app/data
      - autonomy-orgs:/app/orgs
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional: streaming transcription for dashboard dictation (/ws/voice).
  #   docker compose --profile voice up -d
  #
  # Its own image and its own dependency set (deploy/Dockerfile.whisper): the
  # node image is ~57 packages, this one carries CTranslate2 and the CUDA
  # runtime. Co-residence would put that weight, and a GPU device claim, into
  # every install including the ones that never dictate.
  #
  # Reachable only on the project network as ws://whisper:9090 — nothing is
  # published to the host. The dashboard finds it via WHISPERLIVE_URL; left
  # unset it defaults to loopback, which is correct when both run natively.
  whisper:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.whisper
      args:
        BASE_IMAGE: ${AUTONOMY_WHISPER_BASE_IMAGE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}
    image: ${AUTONOMY_WHISPER_IMAGE:-autonomy-whisper:local}
    restart: unless-stopped
    environment:
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/app/data/models/distil-large-v3}
    volumes:
      # Read-only: the model is operator data, this service only consumes it.
      - autonomy-data:/app/data:ro
    # Uses the GPU when the host has one. Without the nvidia container runtime
    # this reservation is unsatisfiable and the service will not start — drop
    # the block to run on CPU, which faster-whisper supports (slower).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Optional: dolt SQL server backing the beads issue tracker. Image
  # source is operator-chosen via DOLT_IMAGE; the beads schema itself is
  # created by the `bd` CLI (github.com/steveyegge/beads), which operators
  # install separately if they want work tracking.
  dolt:
    profiles: ["beads"]
    image: ${DOLT_IMAGE:-docker.io/dolthub/dolt-sql-server:latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      - dolt-data:/var/lib/dolt

volumes:
  # Explicit `name:` pins the DAEMON volume name. Without it Compose scopes the
  # volume to the project (`<project>_autonomy-code`, e.g. `autonomy_autonomy-orgs`
  # from a checkout named `autonomy`). The hybrid resolver (auto-fteke) looks these
  # up by BARE name — `docker volume inspect autonomy-orgs` — so the daemon names
  # must be exactly these regardless of the checkout's directory name.
  autonomy-code:
    name: autonomy-code
  autonomy-data:
    name: autonomy-data
  autonomy-orgs:
    name: autonomy-orgs
  dolt-data:
