# Autonomy home base — sovereign Compose distribution (H5, DEPLOY.md).
#
#   git clone <source you chose> autonomy && cd autonomy
#   AUTONOMY_FIRST_ORG=myorg docker compose up -d
#   → https://localhost:8080  (self-signed cert; accept once)
#
# Everything builds from this checkout. No registry login, no license
# check, no phone-home. The only external fetches are anonymous
# (base image, PyPI, tailwind binary) and each is overridable via build
# args to point at mirrors you control.
#
# Optional beads issue-tracker backend (dolt SQL server):
#   docker compose --profile beads up -d
# Without it the dashboard runs fine — beads surfaces are simply empty.

# Pin the project name so it never derives from the checkout directory's
# basename. Compose otherwise names the project after the cwd — which flips
# between "autonomy" and "code" depending on whether you stand in the
# symlinked old path or the real /opt/autonomy/code, spawning a SECOND
# project whose network collides with the running one's subnet (hit live
# during the 2026-08-31 cutover). Same reason the volumes carry explicit
# name: below — daemon identity must not depend on the directory name.
name: autonomy

services:
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Point at mirrors you control, e.g.:
        #   AUTONOMY_BASE_IMAGE=registry.example.internal/python:3.12-slim
        #   AUTONOMY_TAILWIND_URL=https://mirror.example.internal/tailwindcss-linux-x64
        BASE_IMAGE: ${AUTONOMY_BASE_IMAGE:-python:3.12-slim}
        TAILWIND_URL: ${AUTONOMY_TAILWIND_URL:-}
        # No version build arg: the build reads the commit hash + date from the
        # checkout's .git itself and stamps /app/VERSION, then strips only the git
        # REMOTE (see deploy/Dockerfile — the image keeps a working local repo so
        # the launcher can clone /workspace/repo from it). Plain `docker compose up`
        # self-stamps; nobody passes a version.
    # Published path: set AUTONOMY_IMAGE to the verified immutable reference
    # from image-lock.env (repo/image@sha256:...), then use
    # `docker compose pull && docker compose up -d --no-build`.
    # Unset remains the sovereign checkout build above; no registry required.
    image: ${AUTONOMY_IMAGE:-autonomy-node:local}
    restart: unless-stopped
    # Explicit, matching the Dockerfile CMD default — spelled out here because
    # the entrypoint is now shared with the dispatcher service below (it execs
    # whatever command it's given), so this is no longer implicit.
    # PID 1 in a container must reap adopted orphans. This process
    # shells out (bd, git, docker, the MCP gateway) and those children
    # can outlive their spawn, reparenting to PID 1 — plain python/sh
    # doesn't wait() on them, so zombies accrue (dispatcher hit 22k bd
    # zombies 2026-08-31, only in-container: natively they reparented to
    # the host init which reaps). init: true runs tini as PID 1 to reap.
    init: true
    # Per-session CPU/RAM telemetry (resource_monitor) reads sibling session
    # containers' cgroup files directly. In its own PRIVATE cgroup namespace the
    # dashboard sees only itself, so every session card lost CPU/RAM after the
    # node was containerized. Join the HOST cgroup namespace and mount the host
    # cgroup tree read-only (below) so the systemd-scope path
    # /sys/fs/cgroup/system.slice/docker-<cid>.scope is readable.
    cgroup: host
    command: sh /app/deploy/serve.sh
    # Every session the node launches joins THIS network (the launcher discovers
    # it via `docker inspect` self — agents/mount_plan.discover_topology) and
    # reaches the dashboard by the `dashboard` alias. That is the only path a
    # sibling session has to a CONTAINERIZED dashboard: host.docker.internal
    # resolves to the host gateway, where a container-published, tailscale-bound
    # port does not answer. The compose service name already aliases here; this
    # block pins it so the contract survives a service rename. External exposure
    # is unchanged — this is the internal control-plane name only.
    networks:
      default:
        aliases:
          - dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      AUTONOMY_FIRST_ORG: ${AUTONOMY_FIRST_ORG:-}
      AUTONOMY_FIRST_ORG_NAME: ${AUTONOMY_FIRST_ORG_NAME:-}
      AUTONOMY_FLEET_INVITE: ${AUTONOMY_FLEET_INVITE:-}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      DASHBOARD_TLS: ${DASHBOARD_TLS:-}
      # Path identity for session records (tools/graph/ingest.py rewrites).
      # Only the raw facts are passed; the entrypoint DERIVES the working
      # values (AUTONOMY_HOST_ROOT = <data root>/code, container root = /app)
      # — outputs of startup, not operator inputs.
      AUTONOMY_HOST_DATA_ROOT: ${AUTONOMY_HOST_DATA_ROOT:-}
      AUTONOMY_HOST_HOME: ${AUTONOMY_HOST_HOME}
      # The container's OWN data root, pinned. Without it the code defaults to
      # the repo-relative <repo>/data; on this node /app/data is the real
      # autonomy-data mount, so pinning it keeps every resolved data path as
      # /app/data — which the node->host mount translator maps cleanly to the
      # host. (A stray code/data symlink previously collapsed it to /data and
      # broke session-mount translation; 2026-08-31.)
      AUTONOMY_DATA_ROOT: /app/data
      # A container has no timezone and defaults to UTC, so naive
      # datetime.fromtimestamp() (the session table, crosstalk log, card
      # times) would render UTC where the native dashboard rendered the
      # operator's local zone — a silent regression on cutover. Inherit
      # the host's zone; the .env sets it from `timedatectl`/​/etc/timezone.
      # Unset falls back to UTC, which is the honest default for an install
      # that never told us its zone.
      TZ: ${TZ:-UTC}
      # Points at the optional `beads` profile service; unreachable is a
      # supported state (beads surfaces degrade to empty, one warning).
      DOLT_SQL_HOST: dolt
      # Reach the optional `voice` profile service on the project network.
      # Unset would default to loopback, which inside this container is the
      # container itself — dictation would fail with nothing obviously wrong.
      WHISPERLIVE_URL: ${WHISPERLIVE_URL:-ws://whisper:9090}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      # The three-volume node model (graph b20f2468-b12 "FINAL ARCHITECTURE").
      #
      # autonomy-code -> /app : the platform code, as files. Seeded from the
      # image on first boot, then hot-reloaded in place (the entrypoint runs
      # uvicorn --reload). Keeps a working local repo, remote removed: the node
      # never phones home, but the launcher can clone /workspace/repo from it. Code
      # updates are a deliberate operator action into this volume, on the
      # operator's schedule — not an image rebuild and not an origin pull. (An
      # operator who prefers to edit a host checkout directly can bind-mount it
      # here instead: `- /path/to/checkout:/app`.)
      - autonomy-code:/app
      # THE persistent state: per-org DBs (identity + credential Settings
      # — the secret store), graph.db, auth.db, TLS keypair, traces.
      # Back this volume up and you have backed up the deployment.
      - autonomy-data:/app/data
      # Org-partitioned workspace inputs the node provisions and resolves:
      # /app/orgs/<org>/<subpath>. Held by the NODE (never handed to a session
      # wholesale — a session receives only the resolved concrete dir, via the
      # hybrid resolver, auto-fteke). Nothing else lives here.
      - autonomy-orgs:/app/orgs
      # The Docker socket. REQUIRED, not optional: the node launches each
      # session as a HOST-LEVEL sibling container through this socket, never as
      # a child of a node-owned daemon — because session images can run their
      # own nested docker daemon (agents/Dockerfile.dind, for project stacks
      # such as the Anchore Enterprise compose), and nesting the node too would
      # make that DOUBLE docker-in-docker, which is unsupported. The launcher
      # (`docker run`), topology discovery (`docker inspect`) and secret-ramfs
      # provisioning all shell out to `docker` against this socket. It is
      # effective host-root: a node that deliberately will not launch sessions
      # or hold secrets may drop it, but then it is a viewer, not a working node.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host cgroup tree, read-only: lets resource_monitor read each sibling
      # session container's cpu.stat/memory.current for the CPU/RAM telemetry
      # on the session cards (paired with `cgroup: host` above).
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # The dashboard's memory-class key cache (auto-a1pub): opened key material
      # lives on ramfs, never disk, never swap. This is only the mountpoint +
      # rslave propagation; the entrypoint mounts the ramfs on the host at boot
      # (agents.secret_ramfs) and rslave carries that host mount into this
      # running container. Propagation, not a plain bind, so no restart is
      # needed to see the mount and no CAP_SYS_ADMIN is added here. Provisioning
      # needs the Docker socket (see the compose override that grants it, the
      # same one session-launching needs); without it the mount stays an empty
      # dir and the vault's per-write ramfs check fails closed.
      #
      # There is deliberately NO shared secret-delivery bind here: session
      # delivery is a PRIVATE ramfs inside each session container's own mount
      # namespace, written via the Docker socket at release time
      # (agents.secret_ramfs.deliver_secret_file). A shared delivery root gave
      # every dashboard on the daemon the power to destroy every session's
      # secrets — the 2026-08-30 four-incident class — and must not return.
      - type: bind
        source: /run/autonomy-keycache
        target: /run/autonomy-keycache
        bind:
          propagation: rslave
          create_host_path: true
      # The host's /tmp, so tmux calls from this container reach the HOST
      # tmux server (whose socket dir lives under /tmp, per tmux default).
      # Host terminals are a required node capability: sessions the operator
      # opens against the machine itself run as host processes, forked by the
      # host tmux server — this mount is the entire transport. The entrypoint
      # detects it and exports TMUX_TMPDIR; nothing is configured. /tmp always
      # exists, so Docker never has to create the source (no boot race, no
      # ownership repair). Proven live 2026-08-31: a containerized tmux client
      # listed and captured every session of the host server through it.
      - /tmp:/host-tmp
      # Host-session transcripts. Host terminals write their JSONL under the
      # OPERATOR's home (~/.claude/projects), not under the data volume, and
      # the session viewer reads transcripts from the file named by the DB's
      # jsonl_path. Mounted read-only at the IDENTICAL path so stored host
      # paths resolve verbatim in here. AUTONOMY_HOST_HOME is required (see
      # .env): a node without it cannot serve host terminals, which are not
      # optional (operator ruling 2026-08-31).
      - type: bind
        source: ${AUTONOMY_HOST_HOME:?set AUTONOMY_HOST_HOME to the operator home dir (host terminals require it)}/.claude/projects
        target: ${AUTONOMY_HOST_HOME}/.claude/projects
        read_only: true
        bind:
          create_host_path: true
      # Permissioned control plane for the optional local Service gateway.
      # Only dashboard + Caddy receive this volume; session containers never do.
      - service-gateway-control:/run/autonomy-service-gateway

  # Optional local TLS terminator for sovereign Service publications.
  # It is deliberately profile-gated: Phase 1D's dashboard supervisor owns
  # start/stop. With the profile inactive it consumes zero CPU/RSS.
  service-gateway:
    profiles: ["service-gateway"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.service-gateway
    image: ${AUTONOMY_SERVICE_GATEWAY_IMAGE:-autonomy-service-gateway:local}
    restart: unless-stopped
    user: "1000:1000"
    # This pinned image has no ENTRYPOINT; replacing its default CMD must keep
    # the binary as argv[0].
    command: ["caddy", "run", "--config", "/etc/caddy/bootstrap.json"]
    networks: ["default"]
    # Internal listener only. The public raw-stream adapter will dial this on
    # the Compose network; the test-only acceptance override publishes 8443.
    expose: ["9443"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /data:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /config:rw,noexec,nosuid,nodev,size=4m,uid=1000,gid=1000,mode=0700
    volumes:
      # Host Compose resolves `.` from the checkout. The in-Dashboard
      # supervisor exports AUTONOMY_HOST_ROOT so the host Docker daemon sees
      # the same file even though the Compose client itself runs from /app.
      - type: bind
        source: ${AUTONOMY_HOST_ROOT:-.}/deploy/service-gateway/bootstrap.json
        target: /etc/caddy/bootstrap.json
        read_only: true
        bind:
          create_host_path: false
      - service-gateway-control:/run/autonomy-service-gateway
      # The dashboard creates this exact child inside its verified ramfs mount
      # before Caddy can start. Refuse a missing source; never fabricate a
      # disk-backed directory for certificate/key material.
      - type: bind
        source: /run/autonomy-keycache/service-gateway
        target: /run/autonomy-service-gateway-certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/autonomy-service-gateway/admin.sock && kill -0 1"]
      # Caddy creates the admin socket almost immediately. Probe promptly so
      # the supervisor's 10-second activation budget is not spent waiting for
      # Docker's previous 10-second first-probe cadence.
      interval: 1s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # On-demand ACME client for the persona apex + wildcard certificate. The
  # Dashboard starts this job only while issuing/renewing. Its entire Certbot
  # state and private key live below the node's verified ramfs; the only hook
  # surface is an order-bound Unix socket in that same mount.
  service-certbot:
    profiles: ["service-certbot"]
    image: docker.io/certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    restart: "no"
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    networks: ["default"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    volumes:
      - type: bind
        source: /run/autonomy-keycache/service-acme
        target: /run/autonomy-acme
        bind:
          create_host_path: false
      - type: bind
        source: ${AUTONOMY_HOST_ROOT:-.}/deploy/service-certbot/dns01-hook.py
        target: /usr/local/bin/autonomy-dns01-hook
        read_only: true
        bind:
          create_host_path: false

  # Polls for approved beads and launches session containers for them
  # (agents/dispatcher.py). Was host-only prior to this (agents/start-dispatcher.sh,
  # a bare `nohup ... &` with no supervisor) — a disk-full crash on 2026-08-25 killed
  # it silently and nothing restarted it for 33+ hours. Same image as dashboard
  # (built once, shared — compose recognizes the identical build+image and does not
  # rebuild twice), same entrypoint (deploy/entrypoint.sh execs whatever command
  # it's given), different command and a trimmed volume set: no ramfs/keycache
  # binds, because the dispatcher never decrypts a secret itself — it only shells
  # out to agents/launch.sh, which provisions each launched session's own secrets
  # independently, the same way whether the launch was dispatcher- or
  # dashboard-triggered.
  dispatcher:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${AUTONOMY_BASE_IMAGE:-python:3.12-slim}
        TAILWIND_URL: ${AUTONOMY_TAILWIND_URL:-}
    image: ${AUTONOMY_IMAGE:-autonomy-node:local}
    restart: unless-stopped
    # PID 1 in a container must reap adopted orphans. This process
    # shells out (bd, git, docker, the MCP gateway) and those children
    # can outlive their spawn, reparenting to PID 1 — plain python/sh
    # doesn't wait() on them, so zombies accrue (dispatcher hit 22k bd
    # zombies 2026-08-31, only in-container: natively they reparented to
    # the host init which reaps). init: true runs tini as PID 1 to reap.
    init: true
    command: sh /app/deploy/dispatch.sh
    # The shared image's HEALTHCHECK curls https://127.0.0.1:8080/api/ping, which
    # is the DASHBOARD's liveness probe. The dispatcher serves no HTTP at all, so
    # it inherits a check it can never pass and reports `unhealthy` forever while
    # working correctly. Disable it here rather than weaken the dashboard's.
    # (A real dispatcher probe — last poll time, say — would be better than none,
    # but a permanently-red light is worse than no light: it trains the operator
    # to ignore the column.)
    healthcheck:
      disable: true
    environment:
      DISPATCH_INTERVAL: ${DISPATCH_INTERVAL:-5}
      DISPATCH_MAX_CONCURRENT: ${DISPATCH_MAX_CONCURRENT:-2}
      DOLT_SQL_HOST: dolt
      AUTONOMY_DATA_ROOT: /app/data   # real mount, never repo-relative (see dashboard note)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      - autonomy-code:/app
      - autonomy-data:/app/data
      - autonomy-orgs:/app/orgs
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional: streaming transcription for dashboard dictation (/ws/voice).
  #   docker compose --profile voice up -d
  #
  # Its own image and its own dependency set (deploy/Dockerfile.whisper): the
  # node image is ~57 packages, this one carries CTranslate2 and the CUDA
  # runtime. Co-residence would put that weight, and a GPU device claim, into
  # every install including the ones that never dictate.
  #
  # Reachable only on the project network as ws://whisper:9090 — nothing is
  # published to the host. The dashboard finds it via WHISPERLIVE_URL; left
  # unset it defaults to loopback, which is correct when both run natively.
  whisper:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.whisper
      args:
        BASE_IMAGE: ${AUTONOMY_WHISPER_BASE_IMAGE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}
    image: ${AUTONOMY_WHISPER_IMAGE:-autonomy-whisper:local}
    restart: unless-stopped
    environment:
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/app/data/models/distil-large-v3}
    volumes:
      # Read-only: the model is operator data, this service only consumes it.
      - autonomy-data:/app/data:ro
    # Uses the GPU when the host has one. Without the nvidia container runtime
    # this reservation is unsatisfiable and the service will not start — drop
    # the block to run on CPU, which faster-whisper supports (slower).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Optional: MCP relay — exposes this node's graph to an external AI peer
  # (e.g. ChatGPT via OpenAI's Secure MCP Tunnel). Same pattern as `voice`
  # and `beads`: the SERVICE ships here behind a profile, off by default,
  # while the heavy foreign artifact lives in the operator's DATA — for
  # voice that's the whisper model, for the relay it's the tunnel-client
  # binary + credentials under data/services/mcp-relay/ (see DEPLOY.md).
  # An install that never connected an external peer has neither and simply
  # never enables `--profile relay`. Same node image: the gateway the
  # tunnel-client spawns is stdlib-only Python from this repo
  # (tools/mcp_relay/gateway.py) translating MCP calls into graph reads.
  mcp-relay:
    profiles: ["relay"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${AUTONOMY_BASE_IMAGE:-python:3.12-slim}
        TAILWIND_URL: ${AUTONOMY_TAILWIND_URL:-}
    image: ${AUTONOMY_IMAGE:-autonomy-node:local}
    restart: unless-stopped
    # PID 1 in a container must reap adopted orphans. This process
    # shells out (bd, git, docker, the MCP gateway) and those children
    # can outlive their spawn, reparenting to PID 1 — plain python/sh
    # doesn't wait() on them, so zombies accrue (dispatcher hit 22k bd
    # zombies 2026-08-31, only in-container: natively they reparented to
    # the host init which reaps). init: true runs tini as PID 1 to reap.
    init: true
    command: sh /app/deploy/relay.sh
    environment:
      AUTONOMY_DATA_ROOT: /app/data   # real mount, never repo-relative (see dashboard note)
    # Shared image's HEALTHCHECK probes the dashboard's HTTP port; the relay
    # serves no HTTP. Same reasoning as the dispatcher's disable above.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    # Code (gateway + graph CLI) and data (binary, profiles, org DBs the
    # graph reads). No docker socket, no keycache: the relay launches
    # nothing and decrypts nothing.
    volumes:
      - autonomy-code:/app
      - autonomy-data:/app/data

  # Optional: dolt SQL server backing the beads issue tracker. Image
  # source is operator-chosen via DOLT_IMAGE; the beads schema itself is
  # created by the `bd` CLI (github.com/steveyegge/beads), which operators
  # install separately if they want work tracking.
  dolt:
    profiles: ["beads"]
    image: ${DOLT_IMAGE:-docker.io/dolthub/dolt-sql-server:latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      - dolt-data:/var/lib/dolt

volumes:
  # Explicit `name:` pins the DAEMON volume name. Without it Compose scopes the
  # volume to the project (`<project>_autonomy-code`, e.g. `autonomy_autonomy-orgs`
  # from a checkout named `autonomy`). The hybrid resolver (auto-fteke) looks these
  # up by BARE name — `docker volume inspect autonomy-orgs` — so the daemon names
  # must be exactly these regardless of the checkout's directory name.
  autonomy-code:
    name: autonomy-code
  autonomy-data:
    name: autonomy-data
  autonomy-orgs:
    name: autonomy-orgs
  service-gateway-control:
    name: autonomy-service-gateway-control
  dolt-data:

# Pin the project network — never let the daemon choose. Left undeclared, the
# daemon allocates from its built-in pools (172.17.0.0/12 in /16s, then
# 192.168.0.0/16 in /20s) and, on a host where the first pool is used up, takes
# the second pool's first /20 — 192.168.0.0/20, which swallows 192.168.1.0/24,
# the most common home LAN there is, and blackholes the operator's own network.
# It happened on this machine 2026-08-30 and cost hours.
#
# AUTONOMY_SUBNET has NO default on purpose. The `:?` makes `docker compose
# config`/`up` FAIL immediately when it is unset, rather than fall back to the
# daemon's silent allocation. Run the read-only preflight to choose a subnet
# that overlaps nothing the host already routes, and record it in .env:
#
#     python3 -m tools.network.network_preflight --env >> .env
#
# There are no existing installations, so failing closed costs nothing.
networks:
  default:
    ipam:
      config:
        - subnet: ${AUTONOMY_SUBNET:?run `python3 -m tools.network.network_preflight --env >> .env` to choose a free subnet first (bead auto-oj3bc)}
