# Autonomy home base — sovereign Compose distribution (H5, DEPLOY.md).
#
#   git clone <source you chose> autonomy && cd autonomy
#   AUTONOMY_FIRST_ORG=myorg docker compose up -d
#   → https://localhost:8080  (self-signed cert; accept once)
#
# Everything builds from this checkout. No registry login, no license
# check, no phone-home. The only external fetches are anonymous
# (base image, PyPI, tailwind binary) and each is overridable via build
# args to point at mirrors you control.
#
# Optional beads issue-tracker backend (dolt SQL server):
#   docker compose --profile beads up -d
# Without it the dashboard runs fine — beads surfaces are simply empty.

services:
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Point at mirrors you control, e.g.:
        #   AUTONOMY_BASE_IMAGE=registry.example.internal/python:3.12-slim
        #   AUTONOMY_TAILWIND_URL=https://mirror.example.internal/tailwindcss-linux-x64
        BASE_IMAGE: ${AUTONOMY_BASE_IMAGE:-python:3.12-slim}
        TAILWIND_URL: ${AUTONOMY_TAILWIND_URL:-}
        # No version build arg: the build reads the commit hash + date from the
        # checkout's .git itself and stamps /app/VERSION, then drops .git (see
        # deploy/Dockerfile). Plain `docker compose up` self-stamps; nobody passes
        # a version, and the image ships no .git.
    # Published path: set AUTONOMY_IMAGE to the verified immutable reference
    # from image-lock.env (repo/image@sha256:...), then use
    # `docker compose pull && docker compose up -d --no-build`.
    # Unset remains the sovereign checkout build above; no registry required.
    image: ${AUTONOMY_IMAGE:-autonomy-dashboard:local}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      AUTONOMY_FIRST_ORG: ${AUTONOMY_FIRST_ORG:-}
      AUTONOMY_FIRST_ORG_NAME: ${AUTONOMY_FIRST_ORG_NAME:-}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      DASHBOARD_TLS: ${DASHBOARD_TLS:-}
      # Points at the optional `beads` profile service; unreachable is a
      # supported state (beads surfaces degrade to empty, one warning).
      DOLT_SQL_HOST: dolt
    volumes:
      # The three-volume node model (graph b20f2468-b12 "FINAL ARCHITECTURE").
      #
      # autonomy-code -> /app : the platform code, as files. Seeded from the
      # image on first boot, then hot-reloaded in place (the entrypoint runs
      # uvicorn --reload). No .git, no remote: the node never phones home. Code
      # updates are a deliberate operator action into this volume, on the
      # operator's schedule — not an image rebuild and not an origin pull. (An
      # operator who prefers to edit a host checkout directly can bind-mount it
      # here instead: `- /path/to/checkout:/app`.)
      - autonomy-code:/app
      # THE persistent state: per-org DBs (identity + credential Settings
      # — the secret store), graph.db, auth.db, TLS keypair, traces.
      # Back this volume up and you have backed up the deployment.
      - autonomy-data:/app/data
      # Org-partitioned workspace inputs the node provisions and resolves:
      # /app/orgs/<org>/<subpath>. Held by the NODE (never handed to a session
      # wholesale — a session receives only the resolved concrete dir, via the
      # hybrid resolver, auto-fteke). Nothing else lives here.
      - autonomy-orgs:/app/orgs
      # The dashboard's memory-class key cache (auto-a1pub): opened key material
      # lives on ramfs, never disk, never swap. This is only the mountpoint +
      # rslave propagation; the entrypoint mounts the ramfs on the host at boot
      # (agents.secret_ramfs) and rslave carries that host mount into this
      # running container. Propagation, not a plain bind, so no restart is
      # needed to see the mount and no CAP_SYS_ADMIN is added here. Provisioning
      # needs the Docker socket (see the compose override that grants it, the
      # same one session-launching needs); without it the mount stays an empty
      # dir and the vault's per-write ramfs check fails closed. The per-session
      # delivery ramfs (/run/autonomy-secrets) needs no bind here — sessions
      # mount their own subdir at launch; the dashboard never touches it.
      - type: bind
        source: /run/autonomy-keycache
        target: /run/autonomy-keycache
        bind:
          propagation: rslave
          create_host_path: true

  # Optional: dolt SQL server backing the beads issue tracker. Image
  # source is operator-chosen via DOLT_IMAGE; the beads schema itself is
  # created by the `bd` CLI (github.com/steveyegge/beads), which operators
  # install separately if they want work tracking.
  dolt:
    profiles: ["beads"]
    image: ${DOLT_IMAGE:-docker.io/dolthub/dolt-sql-server:latest}
    restart: unless-stopped
    volumes:
      - dolt-data:/var/lib/dolt

volumes:
  # Explicit `name:` pins the DAEMON volume name. Without it Compose scopes the
  # volume to the project (`<project>_autonomy-code`, e.g. `autonomy_autonomy-orgs`
  # from a checkout named `autonomy`). The hybrid resolver (auto-fteke) looks these
  # up by BARE name — `docker volume inspect autonomy-orgs` — so the daemon names
  # must be exactly these regardless of the checkout's directory name.
  autonomy-code:
    name: autonomy-code
  autonomy-data:
    name: autonomy-data
  autonomy-orgs:
    name: autonomy-orgs
  dolt-data:
