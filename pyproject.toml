[tool.pytest.ini_options]
pythonpath = ["."]
# Every suite runs by default; a new test directory belongs here the day it
# lands. tools/graph/tests and agents/tests were outside the default sweep for months and silently accumulated drift
# (typegen artifacts, schema synopses, launcher call-capture assumptions,
# primer template changes) that ambushed whichever session ran them next.
testpaths = ["tools/dashboard/tests", "tools/dashboard/plugins", "tools/dashboard/dao", "tools/dashboard/test_mcp_relay_routes.py", "tools/dashboard/static/js/ceremony/tests/test_node_signon.py", "tools/graph/tests", "tools/agent_test/tests", "agents/tests", "agents/capabilities/github/tests", "tools/network", "tools/init/tests", "tools/browser_broker/tests", "tools/vault/tests", "tools/mcp_relay", "tools/shortcuts/tests", "tools/tests", "deploy/tests", "tests/gates"]
addopts = "-n 8 --dist loadfile"
