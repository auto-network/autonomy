\* Shipped singular replacement behavior retained as a calibration. Both
\* same-org tunnels retry, replace each other, and can never coexist.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    RELAYS = {"r1", "r2"}
    TUNNELS = {"old", "new"}
    VIEWERS = {}
    TunnelOrg <- ScenTunnelOrg
    TunnelRelay <- ScenTunnelRelay
    ViewerOrg <- ScenViewerOrg
    ViewerIngress <- ScenViewerIngress
    Capacity <- ScenCapacity
    MinBackoff = 1
    MaxBackoff = 2
    Jitter = 0
    MaxDelay = 2
    PoolRegistration = FALSE
    LeastLoadedAdmission = TRUE
    RestartBudget = 0
    DisconnectBudget = 0
    RefuseBudget = 0
    FailoverMaxCandidates = 3
INVARIANT TypeOK
INVARIANT PoolCoherent
PROPERTY EventuallyAllTunnelsRegistered
