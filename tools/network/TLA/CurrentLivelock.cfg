\* Production behavior: every close, including 4409, retries. TLC must
\* violate EventuallyStable with the alternating A-replaces-B lasso.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    CONNECTORS = {"old", "new"}
    ConnectorOrg <- ScenConnectorOrg
    Version <- ScenVersion
    MinBackoff = 1
    MaxRetryBackoff = 2
    HardBackoff = 3
    Jitter = 0
    MaxDelay = 4
    EvictionPolicy = "redial"
    RestartBudget = 0
INVARIANT TypeOK
INVARIANT HolderHasOpenSocket
INVARIANT NoUncausedVacuum
PROPERTY EventuallyStable
