\* Pool membership is correct, but arbitrary admission may choose a loaded
\* tunnel while an idle peer exists. TLC must violate the selection ledger.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    RELAYS = {"r1", "r2"}
    TUNNELS = {"t1", "t2"}
    VIEWERS = {"v1", "v2", "v3"}
    TunnelOrg <- ScenTunnelOrg
    TunnelRelay <- ScenTunnelRelay
    ViewerOrg <- ScenViewerOrg
    ViewerIngress <- ScenViewerIngress
    Capacity <- ScenCapacity
    MinBackoff = 1
    MaxBackoff = 2
    Jitter = 0
    MaxDelay = 2
    PoolRegistration = TRUE
    LeastLoadedAdmission = FALSE
    RestartBudget = 0
    DisconnectBudget = 0
INVARIANT TypeOK
INVARIANT PoolCoherent
INVARIANT CapacityRespected
INVARIANT AdmissionUsesLeastLoad
