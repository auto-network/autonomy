\* Prune keyed by authored timestamp instead of transaction ref: a remote
\* import interleaves a low stamp behind a high ref, the floor retires the
\* unconsumed frame, and without the relay's checkpoint rescue (the direct
\* path today) the peer's suffix is unservable.
SPECIFICATION Spec
CONSTANTS
    Peers = {p1, p2}
    Enrollee = q
    MaxRef = 3
    PruneByTimestamp = TRUE
    RequireFullRosterAck = TRUE
    AckResetOnInstall = TRUE
    GapRescue = FALSE
INVARIANTS
    DeltaAlwaysServable
