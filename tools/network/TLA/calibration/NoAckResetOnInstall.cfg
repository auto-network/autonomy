\* Keep recorded acknowledgements across a checkpoint install: the id space
\* renumbers, stale acks collide with fresh refs, and pruning retires
\* brand-new frames AND their rows -- no gap signal survives, so not even
\* the checkpoint rescue can see the loss. The silent variant.
SPECIFICATION Spec
CONSTANTS
    Peers = {p1, p2}
    Enrollee = q
    MaxRef = 3
    PruneByTimestamp = FALSE
    RequireFullRosterAck = TRUE
    AckResetOnInstall = FALSE
    GapRescue = TRUE
INVARIANTS
    AckSoundness
    Recoverable
