\* Jitter is probabilistic mitigation, not a guarantee. A relay restart
\* can close multiple in-flight sockets, and nondeterministic jitter permits
\* equal delays. TLC must violate NoHerd with three same-org connectors.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    CONNECTORS = {"old", "mid", "new"}
    ConnectorOrg <- ScenConnectorOrg
    Version <- ScenVersion
    MinBackoff = 1
    MaxRetryBackoff = 2
    HardBackoff = 3
    Jitter = 2
    MaxDelay = 5
    EvictionPolicy = "redial"
    RestartBudget = 1
INVARIANT TypeOK
INVARIANT HolderHasOpenSocket
INVARIANT NoHerd
