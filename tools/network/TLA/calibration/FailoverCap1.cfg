\* Calibration (auto-d8if0): with one candidate per dial a refused viewer cannot fail over,
\* so a viewer with a serving candidate left is never seated: the property must fail here.
\* PoolGreen otherwise unchanged.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    RELAYS = {"r1", "r2"}
    TUNNELS = {"t1", "t2", "t3"}
    VIEWERS = {"v1", "v2", "v3", "v4"}
    TunnelOrg <- ScenTunnelOrg
    TunnelRelay <- ScenTunnelRelay
    ViewerOrg <- ScenViewerOrg
    ViewerIngress <- ScenViewerIngress
    Capacity <- ScenCapacity
    MinBackoff = 1
    MaxBackoff = 2
    Jitter = 1
    MaxDelay = 3
    PoolRegistration = TRUE
    LeastLoadedAdmission = TRUE
    RestartBudget = 1
    DisconnectBudget = 1
    RefuseBudget = 1
    FailoverMaxCandidates = 1
INVARIANT TypeOK
INVARIANT PoolCoherent
INVARIANT AssignmentsUseLiveTunnel
INVARIANT CapacityRespected
INVARIANT NoHealthyEviction
INVARIANT RefusalsRespected
INVARIANT AdmissionUsesLeastLoad
PROPERTY EventuallyAllTunnelsRegistered
PROPERTY EventuallyEveryServableViewerAssigned
