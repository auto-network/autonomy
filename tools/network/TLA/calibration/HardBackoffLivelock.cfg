\* A finite "hard" 4409 backoff changes only the period of the cycle.
\* Every evicted connector still eventually retries, so stability must fail.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    CONNECTORS = {"old", "new"}
    ConnectorOrg <- ScenConnectorOrg
    Version <- ScenVersion
    MinBackoff = 1
    MaxRetryBackoff = 2
    HardBackoff = 3
    Jitter = 1
    MaxDelay = 4
    EvictionPolicy = "hardBackoff"
    RestartBudget = 0
INVARIANT TypeOK
INVARIANT HolderHasOpenSocket
INVARIANT NoUncausedVacuum
PROPERTY EventuallyStable
