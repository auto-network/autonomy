\* 4409 stand-down stabilizes, but last-writer-wins is not newest-wins.
\* TLC must find the older connector registering last and holding forever.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    CONNECTORS = {"old", "new"}
    ConnectorOrg <- ScenConnectorOrg
    Version <- ScenVersion
    MinBackoff = 1
    MaxRetryBackoff = 2
    HardBackoff = 3
    Jitter = 0
    MaxDelay = 4
    EvictionPolicy = "standDown"
    RestartBudget = 0
INVARIANT TypeOK
INVARIANT HolderHasOpenSocket
PROPERTY EventuallyNewest
