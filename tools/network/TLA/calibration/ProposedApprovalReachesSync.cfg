\* EXECUTABILITY for P1 + P2 + P3, approval role: every joiner admitted
\* and in sync is reachable. Expected: NotAllJoinedInSync violated.
SPECIFICATION Spec
CONSTANTS
    Joiners = {j1, j2}
    F = F
    X = X
    AdoptByVerification = TRUE
    CheckpointAtAdmission = TRUE
    AdmitOnApproval = TRUE
    Approval = TRUE
    FounderSignsOn = FALSE
    RegistryForges = FALSE
    PathRule = "granted"
    AllowRemoval = FALSE
    WindowTicks = 0
    MaxTime = 0
    DeltaKey = "prev"
    RootCheck = TRUE
    MonotoneAdopt = TRUE
    Adversarial = FALSE
    GrantInBundle = FALSE
    JoinAdopt = "none"
    Downgrade = FALSE
    VerifySigner = TRUE
INVARIANTS
    NotAllJoinedInSync
