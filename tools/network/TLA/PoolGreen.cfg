\* Intended algorithm: all three same-org tunnels coexist. New viewers choose
\* a least-loaded member, stay within capacity, and recover through one exact
\* tunnel disconnect plus one relay restart.
SPECIFICATION FairSpec
CONSTANTS
    ORGS = {"org1"}
    RELAYS = {"r1", "r2"}
    TUNNELS = {"t1", "t2", "t3"}
    VIEWERS = {"v1", "v2", "v3", "v4"}
    TunnelOrg <- ScenTunnelOrg
    TunnelRelay <- ScenTunnelRelay
    ViewerOrg <- ScenViewerOrg
    ViewerIngress <- ScenViewerIngress
    Capacity <- ScenCapacity
    MinBackoff = 1
    MaxBackoff = 2
    Jitter = 1
    MaxDelay = 3
    PoolRegistration = TRUE
    LeastLoadedAdmission = TRUE
    RestartBudget = 1
    DisconnectBudget = 1
INVARIANT TypeOK
INVARIANT PoolCoherent
INVARIANT AssignmentsUseLiveTunnel
INVARIANT CapacityRespected
INVARIANT NoHealthyEviction
INVARIANT AdmissionUsesLeastLoad
PROPERTY EventuallyAllTunnelsRegistered
PROPERTY EventuallyEveryViewerAssigned
