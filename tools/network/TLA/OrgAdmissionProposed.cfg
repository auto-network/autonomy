    Joiners = {j1, j2}
    F = F
    X = X
    AdoptByVerification = TRUE
    CheckpointAtAdmission = TRUE
    AdmitOnApproval = FALSE
    Approval = FALSE
    FounderSignsOn = FALSE
    RegistryForges = FALSE
    PathRule = "granted"
    AllowRemoval = FALSE
    WindowTicks = 0
    MaxTime = 0
    DeltaKey = "prev"
    RootCheck = TRUE
    MonotoneAdopt = TRUE
    Adversarial = FALSE
    GrantInBundle = FALSE
    VerifySigner = TRUE
INVARIANTS
    TypeOK
    NoPullWithoutInclusion
    OutsiderNeverPulls
    AdoptedIsAuthentic
    AdmittedWereApproved
PROPERTIES
