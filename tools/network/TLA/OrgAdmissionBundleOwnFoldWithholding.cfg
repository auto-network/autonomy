\* ROOT MATCH + own-fold proof + bound: adversarial sponsor that withholds. Clean in this model because J is admitted first, so every snapshot holds its admission head.
SPECIFICATION Spec
CONSTANTS
    AdversarialSponsor = TRUE
    Withhold = TRUE
    AutoAdopt = TRUE
    Bound = TRUE
    AdoptableOnly = FALSE
    Exact = FALSE
    Rebundle = FALSE
    RootMatch = TRUE
    RekeyCheckpointed = TRUE
    ProveOwnFold = TRUE
INVARIANTS
    NotAboveRegistry
PROPERTIES
    NoRegression
    EventuallyHealed
