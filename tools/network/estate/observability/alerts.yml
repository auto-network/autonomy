# Alert rules for the relay estate baseline (auto-k9jxd). Alert STATE is
# read from the ALERTS series by the dashboard Operations plugin; notification
# delivery to the operator's device is the follow-on auto-xap1u.
groups:
  - name: relay-estate-baseline
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          runbook: "graph://6b998890-3ce"

      - alert: ServeEdgeDown
        expr: probe_success{job="blackbox_serve"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The public serve URL is not returning 2xx"
          runbook: "tools/network/estate/serve/README.md"

      - alert: ServeCertExpiringSoon
        # The served cert's notAfter, from the blackbox TLS probe. LE certs
        # are 90 days; renewal is due at 30d (auto-rvq3j). Alert well inside
        # that so a stalled renewal is caught with weeks of slack.
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 21
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Serve cert for {{ $labels.instance }} expires in <21 days"

      - alert: ReconnectStorm
        expr: increase(relay_stream_refusals_total[5m]) > 500
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "High stream-refusal rate — possible reconnect storm or abuse"

      - alert: NoLiveTunnels
        expr: sum(relay_tunnels) == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "No live relay tunnels — every tenant is disconnected"

      - alert: DiskFillingUp
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Relay host root filesystem under 10% free"

      - alert: InodePressure
        expr: node_filesystem_files_free{mountpoint="/"} / node_filesystem_files{mountpoint="/"} < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Relay host root inodes under 10% free"
