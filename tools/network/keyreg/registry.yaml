# The key registry — machine-readable inventory of every key and mutation in
# the vault + storage system. Design: decision note graph://879ccc1e-b49.
# The prose design of record is the crib sheet (graph note 1e005d5c-c11);
# `crib` fields below name its sections. Validate with:
#   python3 tools/network/keyreg/keyreg.py validate
version: 1

keys:

  personal_root_seed:
    group: identity-armor
    kind: seed
    custody:
      class: cold
      forced_by: >-
        Every act needing it expresses human intent (crib Q0), and its
        snapshot is total; no execution-class question is reached.
    derivation: null
    descriptor:
      reaches: >-
        Every purpose key ever derivable from it, and every vault policy
        class through each class's root-anchor wrap. Root authority
        reconstitutes the whole identity.
      snapshot: Total and unbounded, across every organization.
      live: "No."
      revoke: >-
        None. The remedy is personal-root rotation, which requires the old
        root, the new root, and the enrolled recovery key
        (make_rotation in tools/network/idkit/root_rotation.py).
      bound: None.
    seals_to:
      - recipient: factor_recipient
        purpose: autonomy/root-factor-recipient/v1
        record: root factor policy envelope share
      - recipient: recovery_slot_recipient
        purpose: autonomy/recovery-armor/v1
        record: armor recovery slot
    code:
      - tools/network/idkit/armor.py
      - tools/network/idkit/root_factor_policy.py
      - tools/network/idkit/root_rotation.py:make_rotation
    crib: ["§2", "§9"]
    proofs:
      - {framework: tamarin, theory: VaultOpenStore, lemma: root_secret_open_store}
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: root_secret}
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: password_and_passkey1_release_root}
      - {framework: tamarin, theory: VaultRootRotation, lemma: owner_rotates_away_from_stolen_root}

  org_root_signing_key:
    group: org-authority
    kind: signing
    custody:
      class: cold
      forced_by: Constitutional acts are intent acts (crib Q0).
    derivation: null
    descriptor:
      reaches: >-
        Genesis, key rotation, serve-certificate minting, registration, and
        rebind. It is not a domain principal: it holds no KEM credential and
        receives no capability grants.
      snapshot: No content.
      live: "Yes — it must reach the ledger or registry to be used."
      revoke: Org-vouch or dual-signed org-root rotation; both are ceremonies.
      bound: The ceremony.
    code:
      - tools/network/ledger/fold.py:_h_key_rotate
    crib: ["§8", "§9"]

  recovery_code:
    group: recovery
    kind: seed
    custody:
      class: cold
      forced_by: >-
        Its whole security property is being disjoint from the hot path; it
        is printed once and never touches a machine except in a recovery
        ceremony.
    derivation: null
    descriptor:
      reaches: >-
        Three domain-separated derivations, none reaching another: the armor
        recovery slot recipient, the recovery signing key, and the
        per-organization member recovery keys. The armor recipient opens
        the matching recovery slot, restoring personal-root authority.
      snapshot: >-
        With the matching encrypted recovery record, restores the personal
        root and its downstream authority. This is the intentional master
        recovery capability, independent of the normal factor policy.
      live: "No."
      revoke: >-
        Replacement with the code in hand runs replace_recovery_slot
        (tools/network/idkit/root_factor_policy.py). Regeneration with the
        code lost is the witnessed succession window: declaration, blocking
        alert, cancellation or veto, completion after the window.
      bound: None.
    code:
      - tools/network/idkit/recovery.py
      - tools/network/idkit/root_factor_policy.py:open_root_with_recovery
    crib: ["§9"]
    notes: >-
      One cold code supplies decryption and signing functions. The separate
      recovery signature prevents a hot-root thief without the cold code
      from rotating the identity. It does not prevent the code holder from
      recovering. Ordinary complete-authority rotation and the designed
      lost-code witnessed succession path are distinct workflows.

  recovery_signing_key:
    group: recovery
    kind: signing
    custody:
      class: cold
      forced_by: Derived only from the cold recovery code.
    derivation:
      parent: recovery_code
      fn: HKDF
      purpose: autonomy.recovery.signing.v1
    descriptor:
      reaches: >-
        The recovery co-signature on personal-root rotation and on
        recovery-code succession declarations.
      snapshot: Nothing; it signs and never decrypts.
      live: "Yes — its signatures must reach a verifier."
      revoke: Recovery-code succession (the witnessed window).
      bound: The acts it co-signs.
    code:
      - tools/network/idkit/recovery.py:recovery_signing_key
      - tools/network/idkit/root_rotation.py:rotation_recovery_input
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRootRotation, lemma: thief_cannot_rotate}
      - {framework: tamarin, theory: VaultRootRotation, lemma: code_finder_cannot_rotate}

  member_recovery_key:
    group: recovery
    kind: signing
    custody:
      class: cold
      forced_by: Derived only from the cold recovery code.
    derivation:
      parent: recovery_code
      fn: HKDF
      inputs: [genesis_id]
      purpose: autonomy.recovery.member-sign.v1
    descriptor:
      reaches: >-
        Exactly one act: the recovery-authorized door of member.rekey. The
        genesis_id in the derivation keeps an identical printed code from
        linking personas across organizations.
      snapshot: Nothing — no plaintext, no content, no authority beyond the one door.
      live: "Yes — the rekey event must reach the ledger fold."
      revoke: >-
        Enrolled at member.claim; changing it requires the current member
        recovery key or the org root. No event adds one after member.claim.
      bound: The one act; the fold rejects everything else.
    code:
      - tools/network/idkit/recovery.py:member_recovery_key
      - tools/network/ledger/fold.py:_h_member_rekey
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_key_secret}
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_beats_thief}
      - {framework: tamarin, theory: RecoveryUnlink, lemma: Observational_equivalence}

  recovery_slot_recipient:
    group: recovery
    kind: kem
    custody:
      class: cold
      forced_by: Derived only from the cold recovery code.
    derivation:
      parent: recovery_code
      fn: HKDF
      purpose: autonomy/recovery-armor/v1
    descriptor:
      reaches: The root seed sealed into the armor's recovery slot.
      snapshot: The sealed root seed, and nothing else.
      live: "No."
      revoke: replace_recovery_slot re-seals the slot to a new code's recipient.
      bound: None — it opens the root.
    code:
      - tools/network/idkit/recovery.py
      - tools/network/idkit/root_factor_policy.py:replace_recovery_slot
    crib: ["§2", "§9"]

  factor_seed:
    group: identity-armor
    kind: seed
    custody:
      class: cold
      forced_by: >-
        Producing it requires the human gesture — typing the password or a
        passkey PRF assertion (crib Q0).
    derivation: null
    descriptor:
      reaches: >-
        The factor's derived recipient (its share of the root factor policy)
        and its derived dashboard access key. Only a factor set satisfying
        the policy expression reaches the root; unlock-only factors never do.
      snapshot: >-
        That factor's policy shares. Whether the root follows depends on the
        policy expression, not on this key alone.
      live: "No."
      revoke: Factor revocation re-signs the armor envelope without it.
      bound: The policy expression.
    code:
      - tools/network/idkit/root_factor_policy.py
    crib: ["§2"]
    proofs:
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: password_alone_no_root}
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: passkeys_both_no_root}
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: unlock_only_no_root}

  factor_recipient:
    group: identity-armor
    kind: kem
    custody:
      class: cold
      forced_by: Re-derivable only from the cold factor seed.
    derivation:
      parent: factor_seed
      fn: derive_encapsulation_keypair
      purpose: autonomy/root-factor-recipient/v1
    descriptor:
      reaches: The policy shares sealed to it inside the armor envelope.
      snapshot: Those shares; the policy expression decides what they combine to.
      live: "No."
      revoke: Factor revocation; the envelope is re-signed without the share.
      bound: The policy expression.
    code:
      - tools/network/idkit/sealing.py:derive_encapsulation_keypair
      - tools/network/idkit/root_factor_policy.py
    crib: ["§2"]

  vault_factor_recipient:
    group: vault-classes
    kind: kem
    custody:
      class: cold
      forced_by: Re-derivable only from the cold factor seed.
    derivation:
      parent: factor_seed
      fn: derive_encapsulation_keypair
      purpose: autonomy/vault-policy-recipient/v1
    descriptor:
      reaches: The vault class-key wraps sealed to it.
      snapshot: Those wraps; each class generation it belongs to opens.
      live: "No."
      revoke: Vault class-factor revocation reseals the next generation without it.
      bound: The classes it is enrolled in.
    code:
      - tools/vault/recipients.py
    crib: ["§18"]

  per_credential_wrapping_key:
    group: identity-armor
    kind: kem
    custody:
      class: cold
      forced_by: >-
        The private half derives from the credential's PRF output on-device;
        using it requires a user-verified assertion at that machine.
    derivation:
      parent: factor_seed
      fn: PRF-derived X25519
    descriptor:
      reaches: >-
        Payloads sealed to the credential's device. The public key is
        valid only when carried in a root-signed enrollment statement,
        verified before any seal is addressed to it.
      snapshot: Nothing without the device's PRF assertion.
      live: "Yes — opening a seal needs the assertion at that machine."
      revoke: Passkey revocation (root-signed RevocationRecord).
      bound: The credential.
    code:
      - tools/network/idkit/enrollment.py:PasskeyEnrollmentStatement
    crib: ["§2"]
    proofs:
      - {framework: tamarin, theory: VaultOpenStore, lemma: no_key_to_forged_pk}

  browser_session_key:
    group: browser
    kind: signing
    custody:
      class: disk
      forced_by: >-
        Persisted in the browser's IndexedDB and usable with no further
        human interaction until its certificate expires; theft through the
        page is prevented by WebCrypto non-extractability, and the bound is
        the certificate validity window plus revocation.
    derivation: null
    descriptor:
      reaches: >-
        The scopes its persona-signed delegation certificate carries
        (SESSION_SCOPES in network-signon.mjs): delegate:agent,
        link:publish, link:revoke, tunnel:serve, turn:allocate, and
        viewer:identify — one certificate per organization persona, all
        over the single session key.
      snapshot: >-
        Nothing through the page: the key is created extractable:false and
        _installSession refuses any key claiming otherwise, so no script
        can export it; it appears in no replicated store.
      live: "Yes — its signatures must reach the dashboard or registry."
      revoke: >-
        The certificate validity window (default twenty-four hours,
        maximum thirty days), enforced at load and by an expiry watchdog
        that signs the browser out; a root-signed revocation record is the
        explicit path. Not a ceremony.
      bound: The certificate's validity window and scope list.
    signs:
      - registry request envelopes only (REQUEST_DOMAIN + canonical JSON of
        v, method, path, ts, signer, payload) — the single crypto.subtle.sign
        call site for this key in network-signon.mjs
    code:
      - tools/dashboard/static/js/network-signon.mjs:signRegistryRequest
      - tools/dashboard/static/js/network-signon.mjs:_installSession
      - tools/network/registry/signing.py
    crib: ["§2", "§9"]
    notes: >-
      Minted per browser during the sign-on ceremony, after the user proves
      root authority by satisfying the armor's factor policy; routine
      operations then sign with crypto.subtle.sign and never see a factor
      again during the certificate's validity. Distinct from the
      per-operation vault authorize ceremony, which costs one user-verified
      assertion per class open and involves no session key.

  factor_access_signing_key:
    group: identity-armor
    kind: signing
    custody:
      class: cold
      forced_by: Derived from an opened factor seed during access-only authentication; not retained for unattended operation.
    derivation:
      parent: factor_seed
      fn: importFactorAccessSigningKey
      purpose: autonomy.identity.factor-access.v1
    descriptor:
      reaches: Proves an enrolled factor's dashboard access authority without opening the root.
      snapshot: Access proof authority for that factor, not the root or organization content keys.
      live: "Yes — a fresh server challenge and enrolled access policy are required."
      revoke: Removing the factor's access authority prevents further accepted proofs.
      bound: Factor identity, single-use challenge and origin.
    code:
      - tools/dashboard/static/js/ceremony/root-factor-policy.js:importFactorAccessSigningKey
      - tools/dashboard/unlock_routes.py:_complete_challenge_unlock
    crib: ["§2"]
    notes: Ed25519; HKDF purpose includes a terminal newline. Proof domain is autonomy.identity.factor-access-unlock.v1 followed by a newline and canonical challenge fields. Distinct from the X25519 factor recipient.
  persona_signing_key:
    group: org-authority
    kind: signing
    custody:
      class: cold
      forced_by: Deriving it requires the personal root seed.
    derivation:
      parent: personal_root_seed
      fn: derive_persona
      inputs: [genesis_id]
    descriptor:
      reaches: >-
        Authorship of the persona's ledger events and key-control records in
        one organization. The genesis_id input keeps personas unlinkable
        across organizations.
      snapshot: Authority to sign as the persona until rekeyed away.
      live: "Yes — records must reach honest nodes."
      revoke: member.rekey moves the persona to a new key.
      bound: The persona's membership.
    code:
      - tools/network/idkit/persona.py:derive_persona
    crib: ["§2"]

  persona_kem_private:
    group: domain-storage
    kind: kem
    custody:
      class: memory
      forced_by: >-
        Snapshot is total: this key plus a copy of the replicated store is
        the whole domain history, offline. Not disk-eligible at any price.
    derivation:
      parent: personal_root_seed
      fn: derive_kem_seed
      inputs: [counter]
    descriptor:
      reaches: >-
        Every capability grant addressed to this persona, hence any head
        secret, hence all domain content including full history through the
        bridges.
      snapshot: Total for the domain — key plus store copy is the whole history.
      live: "No."
      revoke: >-
        Publish a superseding PersonaKemCredential. Stops future grants
        only; undoes nothing already opened.
      bound: None — damage is complete at the instant of theft.
    code:
      - tools/network/storagekit/credentials.py:derive_kem_seed
      - tools/dashboard/static/js/ceremony/founding.js:deriveKemSeed
      - tools/dashboard/static/js/join/ceremony.js
      - tools/vault/unlock.py:open_generation_keys
      - tools/dashboard/static/js/ceremony/vault-unlock.js:prepareVault
      - tools/dashboard/unlock_routes.py:_accept_organization_kem_key
      - tools/dashboard/unlock_routes.py:restore_vault_across_hot_reload
      - tools/vault/key_holder.py:build_key_holder
    notes: >-
      Initial founding and admission derive counter zero, then bind the pair
      with kem_purpose(genesis_id). PersonaKemCredential has no counter field.
      Personal and organization sign-in handoffs open existing grants and keep
      KEM keys in process memory. Organization reads open late grants, and
      graceful reload uses the existing RAM-backed carrier to retain KEM keys,
      not generation secrets (graph://35308bf7-584, auto-a1pub).
      This key is not stored in audited Settings; cold restart needs sign-in.
    crib: ["§9", "§13", "§14"]
    seals_to:
      - recipient: per_machine_key
        record: KEM-distribution record (designed; bead auto-pw9bs.6)
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: persona_kem_snapshot_total}
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}
      - {framework: tamarin, theory: VaultRekeyMarkerChain, lemma: exclusion_through_chain}
      - {framework: tamarin, theory: VaultD006Window, lemma: post_rekey_excluded}

  generation_secret:
    group: domain-storage
    kind: symmetric
    custody:
      class: memory
      forced_by: Snapshot is total for its branch, offline.
    derivation: null
    descriptor:
      reaches: Every object under the generation and every ancestor via bridges.
      snapshot: Total for that branch, offline.
      live: "No."
      revoke: None — a generation secret is never retired.
      bound: None.
    code:
      - tools/network/storagekit/state.py:generate
    crib: ["§6", "§9"]
    seals_to:
      - recipient: persona_kem_private
        purpose: autonomy/capability-grant/v1
        record: CapabilityGrant
    proofs:
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}
      - {framework: tamarin, theory: VaultConcurrentRekey, lemma: concurrent_grant_secret}

  object_wrap_key:
    group: domain-storage
    kind: derived-secret
    custody:
      class: memory
      forced_by: Re-derivable from the generation secret during the warm period.
    derivation:
      parent: generation_secret
      fn: HKDF
      inputs: [genesis_id, domain_id, state_id, object_id, revision, content_hash]
      purpose: object-wrap
    descriptor:
      reaches: One object revision's wrapped content key.
      snapshot: That revision, given the ciphertext.
      live: "No."
      revoke: Follows the generation secret; never individually retired.
      bound: The one revision.
    code:
      - tools/network/storagekit/objects.py
    crib: ["§6"]

  object_cek:
    group: vault-classes
    kind: symmetric
    custody:
      class: memory
      forced_by: >-
        Unique per immutable revision and encrypts nothing else, so
        releasing it equals releasing that one plaintext — it is the unit
        allowed across the release boundary.
    derivation: null
    descriptor:
      reaches: One object revision's plaintext.
      snapshot: That one revision.
      live: "No."
      revoke: Never — the revision is immutable; withdrawal is a new key for new writes.
      bound: The one revision.
    code:
      - tools/vault/policy_class.py:_cek_public_seal_purpose
    crib: ["§4", "§18", "§23"]
    seals_to:
      - recipient: class_key
        purpose: autonomy/vault-policy-class/cek/v1
        record: sealed content key

  agent_delegate_signing_key:
    group: org-authority
    kind: signing
    custody:
      class: disk
      forced_by: >-
        Operator-approved encrypted retention in personal-homed audited
        Settings, replicated across the member's fleet. Opened on demand,
        with no separate signing-key cache. Authority stays scope-attenuated,
        TTL-bounded and fold-enforced.
    derivation: null
    descriptor:
      reaches: >-
        Exactly two execution scopes, storage:state:advance and
        storage:capability:grant, and nothing else. It signs; it opens
        nothing. It authorizes only by resolving its delegation chain to a
        member persona: a chain terminating outside the member roster is
        void, and generic scope-holding is never consulted for these two
        scopes.
      snapshot: Nothing.
      live: "Yes — records must reach honest nodes, which verify them against the fold."
      revoke: >-
        Delegation revocation and ninety-day expiry. Sign-in reuses with at
        least thirty days remaining; otherwise mints a new keypair and grant.
      bound: The delegating persona's own membership; the fold rejects any overreach.
    code:
      - tools/network/storagekit/acceptance.py
      - tools/dashboard/org_storage_delegate.py:prepare
      - tools/dashboard/org_storage_delegate.py:accept
      - tools/dashboard/org_storage_delegate.py:signing_key
      - tools/dashboard/static/js/ceremony/org-storage-delegate.js:prepareStorageDelegate
    seals_to:
      - recipient: delegate_audited_recipient
        record: personal autonomy.vault.audited storage-delegate.<genesis>.<grant-event-id>
    notes: >-
      graph://b437ecfb-e23 governs retention. Public metadata is keyed by
      genesis in autonomy.network.storage-delegate. A reuse sign-in writes
      no delegation event; no scheduled renewal runs. This is storage-ledger
      authority, not generic Settings row-signing authority.
    crib: ["§7", "§9", "§11"]
    proofs:
      - {framework: tamarin, theory: VaultDelegateChain, lemma: write_resolves_to_current_member}
      - {framework: tamarin, theory: VaultDelegateChain, lemma: delegate_scopes_only}
      - {framework: tamarin, theory: VaultDelegateChain, lemma: write_requires_live_delegate}

  per_machine_key:
    group: fleet
    status: designed
    kind: kem
    custody:
      class: memory
      forced_by: >-
        Derived from the personal root at unlock and never persisted — the
        machine stores only its public machine_id; the key exists for the
        warm period and a reboot always waits on a human unlock.
    derivation:
      parent: personal_root_seed
      fn: derive_machine_key
      inputs: [machine_id]
    descriptor:
      reaches: Distributions sealed to it after the theft — future persona KEM keys.
      snapshot: Zero. It decrypts no existing record.
      live: "Yes — the thief must still be in the fleet and reachable."
      revoke: Remove the machine from the fleet. Root-signed, not a ceremony.
      bound: The removal.
    code: []
    crib: ["§9", "§10"]
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: machine_key_yields_nothing_undistributed}
      - {framework: tamarin, theory: VaultFleetDist, lemma: kicked_machine_excluded}

    notes: >-
      Designed KEM recipient only; concrete recipient derivation remains
      part of fleet.distribute_kem. The implemented Ed25519 key is
      fleet_operating_signing_key. Authentication and roster replication
      do not implement KEM distribution.

  fleet_operating_signing_key:
    group: fleet
    kind: signing
    custody:
      class: memory
      forced_by: Root-derived at sign-in; private runtime retention uses RAM-backed carriers, not durable Settings.
    derivation:
      parent: personal_root_seed
      fn: derive_machine_key
      inputs: [machine_id]
    descriptor:
      reaches: Signs fleet process delegations and registered personal-org reachability requests.
      snapshot: No content decryption; possession supplies machine signing authority.
      live: "Yes — roster and certificate acceptance are authority boundaries."
      revoke: Accepted roster removal and reachability certificate expiry.
      bound: Machine identity; reachability scopes node:announce and node:lookup.
    code:
      - tools/network/idkit/persona.py:derive_machine_key
      - tools/dashboard/static/js/ceremony/fleet-enrollment.js:mintFleetRuntimeCredential
      - tools/network/fleet_runtime.py:FleetRuntimeCredential
    crib: ["§10"]
    notes: >-
      Sync-only handoff omits this private seed. Registered personal-org
      handoff includes machine_private_seed and a root-direct reachability
      certificate (seven-day default). The browser checks the derived public
      half against roster machine_pub. This is not a KEM recipient.

  fleet_process_signing_key:
    group: fleet
    kind: signing
    custody:
      class: memory
      forced_by: Fresh runtime seed retained in process and RAM-backed warm carriers.
    derivation: null
    descriptor:
      reaches: Fleet synchronization under a machine-signed fleet:sync delegation.
      snapshot: No content decryption; permits synchronization within accepted scope.
      live: "Yes — runtime validates the live roster and delegation."
      revoke: Roster removal or delegation expiry; maximum thirty-day lifetime.
      bound: personal:<root-public-key> scope and named machine subject.
    code:
      - tools/dashboard/static/js/ceremony/fleet-enrollment.js:mintRuntimeCredential
      - tools/network/fleet_runtime.py:FleetRuntimeCredential
    crib: ["§10"]
    notes: Random Ed25519 process_private_seed, distinct from the operating key that signs its delegation.

  serving_delegate_key:
    group: org-authority
    kind: signing
    custody:
      class: memory
      forced_by: >-
        Vault-held since 2026-09-20 (graph://67d0aa5f-885 D4): a row of the
        machine-homed audited set autonomy.machine.vault.audited, sealed cold to
        the operator's audited delegate recipient, opened unattended once the
        vault is warm and released into ramfs for the connector at launch;
        never a disk file, never replicated. No content decryption; the
        serving child has bounded certificate scopes enforced by its relying
        parties.
    derivation: null
    descriptor:
      reaches: Authentication through tunnel:serve and serve:dns-01 certificates over the same serving child.
      snapshot: No content decryption; possession permits use of accepted certificate scopes.
      live: "Yes."
      revoke: Re-mint; thirty-day TTL, renewal below twenty days remaining.
      bound: The TTL.
    code:
      - tools/network/idkit/certs.py
      - tools/dashboard/static/js/network-signon.mjs:_mintServeCredentialPersona
      - tools/dashboard/network_routes.py:_store_serving_credential
      - tools/dashboard/link_serving_supervisor.py:_release_serving_key
      - tools/graph/schemas/machine_serve_cert.py
    notes: >-
      Organization registry and DNS01 certificates are persona-signed, not
      org-root-signed. No content viewer certificate is minted. Personal-org
      bootstrap remains a separate root-signed branch. The certificates live
      in the machine-homed autonomy.machine.serve-cert row keyed by org_uuid;
      the organization-homed autonomy.network.serve-cert set is deprecated.
    crib: ["§8", "§9"]

  link_channel_signing_key:
    group: share-links
    kind: signing
    custody:
      class: disk
      forced_by: Encrypted organization-homed audited Setting replicated with organization content.
    derivation: null
    descriptor:
      reaches: Signs the serving handshake for one content share link.
      snapshot: Proves possession for that link; cannot decrypt the organization vault or confer membership.
      live: "Yes — viewer verifies against the public key in its URL fragment."
      revoke: Active-grant checks stop future release; vaulted seed deletion does not erase delivered copies.
      bound: One link keypair and fragment trust anchor.
    code:
      - tools/dashboard/link_channel_key.py:mint_channel_key
      - tools/dashboard/link_channel_key.py:channel_key_for
      - tools/dashboard/connector_key_resolution.py
    crib: ["§8"]
    notes: >-
      graph://807b4e11-3e9. Random Ed25519 minted at publication, not sign-in.
      Seed lives in autonomy.network.link-channel-key; channel_pub is on the
      grant and projected into copied URL fragments. Dashboard opens it per
      viewer OPEN and gives only this key to the connector, never the org KEM.
      Content failures close the channel. Organization invitations use this
      same endpoint-authentication key alongside a separate claim bearer.

  serving_machine_signing_key:
    group: fleet
    kind: signing
    custody:
      class: memory
      forced_by: Derived at root unlock for unattended serving; not stored separately.
    derivation:
      parent: personal_root_seed
      fn: derive_serving_machine_key
      inputs: [genesis_id, machine_id]
      purpose: autonomy.identity.serving-machine.v1
    descriptor:
      reaches: Authentication of a serving machine in one organization.
      snapshot: No content decryption; this is an Ed25519 signing key.
      live: "Yes — authentication signatures must reach a verifier."
      revoke: Follows the accepted serving credentials and fleet authorization.
      bound: The organization and machine identifiers bound into the derivation.
    code:
      - tools/network/idkit/persona.py:derive_serving_machine_key
      - tools/network/fleet_runtime.py:serving_machine_key
    crib: ["§10"]
    notes: >-
      Distinct from the personal fleet operating key and the serving delegate.
      Binding both organization and machine avoids presenting the same
      machine public key across organizations.

  delegate_audited_recipient:
    group: vault-classes
    kind: kem
    custody:
      class: memory
      forced_by: Private recipient warms at root unlock for unattended audited reads.
    derivation:
      parent: personal_root_seed
      fn: derive_encapsulation_keypair
      purpose: autonomy/vault/delegate-audited-recipient/v1
    descriptor:
      reaches: Audited personal-vault object content keys sealed to this recipient.
      snapshot: Opens retained audited envelopes sealed to this recipient.
      live: "No — possession of the private key and an envelope permits opening."
      revoke: Replacement protects newly sealed material; follows personal-root lifecycle.
      bound: Audited envelopes addressed to this recipient, not secured policy classes.
    code:
      - tools/vault/personal_object.py:derive_delegate_audited_recipient
    crib: ["§3", "§9"]
    notes: >-
      X25519 encapsulation key, never a signing key. The public half supports
      cold writes. Organization isolation of personal-homed audited rows is
      enforced separately at the API namespace boundary; this derivation
      itself has no organization input.

  root_anchor_seed:
    group: vault-classes
    kind: seed
    custody:
      class: cold
      forced_by: Sealed to a root-derived recipient; opening it requires root authority.
    derivation: null
    descriptor:
      reaches: >-
        Every vault policy class, through each class generation's mandatory
        anchor wrap — the indirection that lets root-factor churn touch only
        the armor.
      snapshot: Nothing while sealed; every class once the root is open.
      live: "No."
      revoke: >-
        Irrevocable by design: revoke_factor refuses to drop it and the
        store refuses to persist a class generation without it.
      bound: None — it is the root's guaranteed floor under every class.
    code:
      - tools/vault/root_anchor.py
      - tools/vault/store.py:put_root_class_once
    crib: ["§18"]
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: root_reaches_every_generation}

  class_key:
    group: vault-classes
    kind: symmetric
    custody:
      class: cold
      forced_by: >-
        Released only inside a factor ceremony and never across the release
        boundary — exporting it would release the whole class.
    derivation: null
    descriptor:
      reaches: Every content key sealed under that class generation.
      snapshot: The class's secrets for generations this key belongs to.
      live: "No."
      revoke: >-
        Factor revocation appends the next generation sealed to the
        survivors and the anchor; it applies at the next write and touches
        no existing sealed material.
      bound: The class's membership at each generation.
    code:
      - tools/vault/policy_class.py:Generation
      - tools/vault/store.py:put_class
    crib: ["§3", "§18"]
    seals_to:
      - recipient: vault_factor_recipient
        purpose: autonomy/vault-policy-class/v1
        record: PolicyClassRecord generation wrap
      - recipient: root_anchor_seed
        purpose: autonomy/vault-root-anchor-wrap/v1
        record: mandatory anchor wrap
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_excluded_forward}
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_keeps_old}

  sealed_index:
    group: sealed-stores
    kind: seed
    status: built
    custody:
      class: cold
      forced_by: Exists only in sealed form; released by a factor ceremony.
    derivation: null
    descriptor:
      reaches: A sealed store's entire index — its address key and value key derive from it.
      snapshot: Nothing while sealed; the store's item map once released.
      live: "No."
      revoke: Re-mint the store under a new index.
      bound: The one store.
    code:
      - tools/graph/sealed_settings.py:SealedSettings
      - tools/graph/sealed_settings.py:_get_or_create_sealed_index
    crib: ["§23"]
    proofs:
      - {framework: tamarin, theory: VaultDeniability, lemma: Observational_equivalence}

  k_index_k_meta:
    group: sealed-stores
    kind: derived-secret
    status: built
    custody:
      class: cold
      forced_by: Subkeys of the sealed index; neither exists outside a release.
    derivation:
      parent: sealed_index
      fn: HKDF
      inputs: [index, metadata]
    descriptor:
      reaches: >-
        K_index computes blind row addresses; K_meta seals row values. The
        blind index is the item-to-row mapping; nothing stores it.
      snapshot: Nothing — they are never at rest.
      live: "No."
      revoke: Follows the sealed index.
      bound: The one store.
    code:
      - tools/graph/sealed_settings.py:_keys
      - tools/graph/sealed_settings.py:blind_index
    crib: ["§23"]

  pepper:
    group: sealed-stores
    kind: symmetric
    status: built
    custody:
      class: memory
      forced_by: >-
        An audited vault setting: released unattended once the vault is
        open; encrypted at rest so a cold dump cannot run the offline
        location oracle.
    derivation: null
    descriptor:
      reaches: >-
        Store row addresses within one scope (location, not content).
        Operator-personal and each organization scope have separate peppers.
      snapshot: >-
        Encrypted at rest, nothing. Held warm, the ability to test password
        guesses against vault locations offline.
      live: "No."
      revoke: Requires re-addressing the affected scope's stores; normal get-or-create preserves the pepper.
      bound: One scope's location secrecy only; contents keep their own seals.
    code:
      - tools/graph/sealed_settings.py:read_pepper
      - tools/graph/sealed_settings.py:ensure_pepper_minted
      - tools/graph/sealed_settings.py:hidden_address
    crib: ["§24"]
    proofs:
      - {framework: tamarin, theory: VaultDeniability, lemma: Observational_equivalence}

# A mutation is any operation that mints, seals, revokes, or rewraps a key,
# or changes who future material is sealed to. Entries with
# status: designed describe flows that exist only in the design of record;
# their source anchors point at the Tamarin theory that serves as the spec.
mutations:

  fold.genesis:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_genesis}
    authority: [org_root_signing_key]
    effects:
      writes: [genesis record, org recovery_pub declaration]
    refusals: [recovery-equals-root]
    crib: ["§7", "§8"]

  fold.delegate:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_delegate}
    authority: [persona_signing_key, browser_session_key]
    preconditions:
      - The delegated scope set never exceeds the delegator's (no scope escalation).
      - A non-redelegable certificate cannot mint children.
    effects:
      mints: [agent_delegate_signing_key]
      writes: [delegation certificate]
    refusals: [scope-escalation, not-redelegable, delegate-unproven, delegate-nonce-reused]
    crib: ["§8", "§11"]
    proofs:
      - {framework: tamarin, theory: VaultDelegateChain, lemma: delegate_scopes_only}

  fold.revoke:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_revoke}
    authority: [persona_signing_key, org_root_signing_key]
    effects:
      revokes: [agent_delegate_signing_key, persona_signing_key]
      writes: [revocation record]
    refusals: [revoke-unauthorized, revoke-bad-target, revoke-target-not-in-ancestry]
    crib: ["§8"]
    proofs:
      - {framework: tamarin, theory: VaultDelegateChain, lemma: write_requires_live_delegate}

  fold.role_define:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_role_define}
    authority: ["holders of role:define"]
    effects:
      writes: [role definition]
    refusals: [role-define-unauthorized, role-define-overreach]
    crib: ["§8"]

  fold.role_grant:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_role_grant}
    authority: ["holders of role:grant:<role>"]
    effects:
      writes: [role grant]
    refusals: [role-grant-unauthorized, role-undefined, approval-missing, bad-approval]
    crib: ["§8"]

  fold.role_revoke:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_role_revoke}
    authority: ["holders of role:grant:<role>"]
    effects:
      writes: [role revocation]
    refusals: [role-revoke-unauthorized]
    crib: ["§8"]

  fold.invite:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_invite}
    authority: ["holders of invite:<role>"]
    effects:
      writes: [invite record]
    refusals: [invite-overreach, invite-sponsor-mismatch, invite-not-in-ancestry, invite-expired, invite-dead]
    crib: ["§8"]

  fold.member_claim:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_member_claim}
    authority: [invited persona key]
    preconditions:
      - The claim's recovery enrollment is validated here; recovery_pub equal to the org root is refused.
    effects:
      writes: [member claim, member recovery_pub enrollment]
    refusals: [claim-wrong-key, claim-bad-token, claim-bad-credential, invite-already-claimed, persona-exists]
    crib: ["§8", "§9"]

  fold.member_rekey:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_member_rekey}
    authority: [persona_signing_key, org_root_signing_key, member_recovery_key]
    preconditions:
      - The cited old key must be the persona's current key.
      - A revoked key cannot self-authorize its own rekey.
      - The new key proves control through the continuity signature.
      - Under recovery policy none, a recovery-authorized rekey is refused, never ignored.
    effects:
      mints: [persona_signing_key]
      revokes: [persona_signing_key]
      writes: [rekey record, implicit revoke of the departed key on the recovery door]
    refusals: [rekey-wrong-key, rekey-unauthorized, rekey-revoked-key, recovery-not-enrolled, recovery-sig-bad, bad-continuity, persona-exists, unknown-persona, bad-approval]
    crib: ["§8", "§9"]
    proofs:
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_beats_thief}
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_key_secret}

  fold.key_rotate:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_key_rotate}
    authority: [org_root_signing_key, recovery_signing_key]
    preconditions:
      - Under recovery policy recovery-key, the declared recovery key co-signs the exact transition.
      - The new key proves control through the continuity signature.
    effects:
      mints: [org_root_signing_key]
      revokes: [org_root_signing_key]
      writes: [rotation record]
    refusals: [not-root, rotate-wrong-old, bad-continuity, recovery-not-enrolled, recovery-sig-bad, recovery-continuity-missing, bad-recovery-continuity, recovery-continuity-not-declared]
    crib: ["§8", "§9"]

  fold.key_epoch:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_key_epoch}
    authority: [org_root_signing_key]
    effects:
      writes: [key epoch marker]
    refusals: [key-epoch-unauthorized]
    crib: ["§8"]

  fold.checkpoint:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_checkpoint}
    authority: ["holders of checkpoint"]
    effects:
      writes: [checkpoint record]
    refusals: [checkpoint-unauthorized]
    crib: ["§8"]
    notes: >-
      Checkpoint is decided-removed from the design vocabulary; the handler
      remains in code, so it remains in this inventory.

  armor.enroll_factor:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py}
    authority: [personal_root_seed]
    effects:
      mints: [factor_recipient]
      seals: [personal_root_seed shares to factor_recipient]
      writes: [next armor generation, root-signed]
    crib: ["§2"]

  armor.revoke_factor:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py}
    authority: [personal_root_seed]
    effects:
      writes: [next armor generation without the revoked factor, root-signed]
    crib: ["§2"]

  armor.set_recovery:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py, symbol: set_recovery}
    authority: [personal_root_seed]
    preconditions:
      - Enroll-only; it refuses to overwrite or clear an existing recovery slot.
    effects:
      seals: [personal_root_seed to recovery_slot_recipient]
      writes: [armor recovery slot]
    crib: ["§9"]

  armor.replace_recovery_slot:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py, symbol: replace_recovery_slot}
    authority: [recovery_code, personal_root_seed]
    effects:
      seals: [personal_root_seed to the successor code's recovery_slot_recipient]
      writes: [replaced armor recovery slot, root re-signed]
    crib: ["§9"]
    notes: Built at the armor layer; exposed by no route or UI yet.

  root.rotation:
    source: {kind: module-op, file: tools/network/idkit/root_rotation.py, symbol: make_rotation}
    authority: [personal_root_seed, recovery_signing_key]
    preconditions:
      - Three signatures — old root, enrolled recovery key, and new root. The succession convinces its relying parties, not the local machine - the fleet accepts a successor only against root-signed RosterEntry material, and the auto.network registry rebinds only for a request signed by the recovery key it pinned at enrollment.
    effects:
      mints: [personal_root_seed]
      revokes: [personal_root_seed]
      writes: [succession record]
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRootRotation, lemma: thief_cannot_rotate}
      - {framework: tamarin, theory: VaultRootRotation, lemma: owner_rotates_away_from_stolen_root}
    notes: >-
      A local verification has no relying party (crib section 0: the owner
      rewriting their own store is a feature); the load-bearing checks are
      the registry rebind gate (tools/network/registry/app.py, which
      resolves the pinned recovery key server-side) and the fleet's
      root-signed RosterEntry acceptance (tools/network/fleet_roster.py).

  passkey.enroll:
    source: {kind: ceremony, file: tools/network/idkit/enrollment.py, symbol: mint}
    authority: [personal_root_seed]
    effects:
      writes: [root-signed enrollment statement binding the per_credential_wrapping_key public half]
    crib: ["§2", "§8"]
    proofs:
      - {framework: tamarin, theory: VaultOpenStore, lemma: no_key_to_forged_pk}

  passkey.revoke:
    source: {kind: ceremony, file: tools/network/idkit/revocation.py, symbol: RevocationRecord}
    authority: [personal_root_seed]
    effects:
      revokes: [per_credential_wrapping_key, browser_session_key]
      writes: [root-signed revocation record]
    crib: ["§2", "§8"]

  ceremony.serve_cert_mint:
    source: {kind: ceremony, file: tools/dashboard/static/js/network-signon.mjs, symbol: _mintServeCredentialPersona}
    authority: [persona_signing_key]
    effects:
      mints: [serving_delegate_key]
      writes:
        - registry tunnel certificate and DNS01 certificate over the same child
        - the serving key as autonomy.machine.vault.audited row serving-key.<org_uuid>; the certificates as the autonomy.machine.serve-cert row keyed by org_uuid (graph://67d0aa5f-885 D4, D5)
    actors: [founder, joiner]
    opens: persona
    requires: [persona_signing_key, registry_binding, checkpoint_seed]
    produces: [serve_cert]
    crib: ["§8"]
    notes: Organization branch; no content viewer certificate.

  ceremony.personal_serve_cert_mint:
    source: {kind: ceremony, file: tools/dashboard/static/js/network-signon.mjs, symbol: _mintServeCredential}
    authority: [personal_root_seed]
    effects:
      mints: [serving_delegate_key]
      writes:
        - personal-org bootstrap cert, legacy viewer_cert, dns01_cert over one child
        - the serving key as autonomy.machine.vault.audited row serving-key.<org_uuid>; the certificates as the autonomy.machine.serve-cert row keyed by org_uuid (graph://67d0aa5f-885 D4, D5)
    crib: ["§8"]
    notes: Existing personal branch still emits viewer_cert; do not infer organization content-viewer certificate use from this bootstrap field.

  ceremony.fleet_runtime_mint:
    source: {kind: ceremony, file: tools/dashboard/static/js/ceremony/fleet-enrollment.js, symbol: mintFleetRuntimeCredential}
    authority: [personal_root_seed, fleet_operating_signing_key, persona_signing_key]
    preconditions:
      - The machine is an active roster member; the server re-checks machine_pub against the current roster (fleet_runtime.FleetRuntimeCredential.from_browser_payload).
      - The operating seed and the reachability certificate are minted only when the personal organization holds a registry org_uuid.
      - One serving seed and one org sync certificate per organization the machine is provisioned to serve and holds a persona in (serving_orgs, sync_orgs from /api/fleet/runtime).
    effects:
      mints: [fleet_process_signing_key, serving_machine_signing_key]
      writes:
        - fleet process delegation certificate (fleet_operating_signing_key -> fleet_process_signing_key, scope fleet:sync, machine-direct, thirty-day maximum)
        - reachability certificate (personal_root_seed -> fleet_operating_signing_key, scopes node:announce and node:lookup, org = registry org_uuid, seven-day default)
        - org sync certificate per organization (persona_signing_key -> serving_machine_signing_key, scope fleet:sync, org = genesis id)
        - the complete credential sealed into autonomy.machine.vault.audited row fleet-runtime (machine store, audited tier, opened unattended by the warm delegate; graph://67d0aa5f-885 D3)
    refusals: [not-active-roster-machine, delegation-chain-invalid, machine-id-mismatch, reachability-pair-incomplete]
    actors: [founder, joiner]
    opens: root
    requires: [personal_root_seed, fleet_roster, ledger_heads]
    produces: [persona_cert_fleet_sync]
    crib: ["§10", "§12"]
    notes: >-
      Helpers: mintRuntimeCredential, mintReachabilityCert, mintOrgSyncCerts.
      One mint, two call sites (sign-on and first publication) through
      fleetRuntimePost since b3e67994. The payload is POSTed to
      /api/fleet/runtime (fleet_enrollment_routes._activate_runtime), which
      verifies it, peels the serving seeds and org sync certificates,
      installs the org channels, arms every connector cache, and caches the
      whole payload in ramfs for replay after a restart; a reboot clears
      ramfs and fails closed to a sign-on. Recorded 2026-09-20 after the
      three certificates were found absent from this registry
      (keyreg-forensics.md, session auto-0919-212441).

  ceremony.organization_storage_delegate:
    source: {kind: ceremony, file: tools/dashboard/static/js/ceremony/org-storage-delegate.js, symbol: prepareStorageDelegate}
    authority: [persona_signing_key]
    effects:
      mints: [agent_delegate_signing_key when absent or below thirty days remaining]
      writes: [ninety-day signed delegate event and personal audited seed on re-mint only]
    actors: [founder, joiner]
    opens: persona
    requires: [persona_signing_key, ledger_heads]
    produces: [delegate_grant]
    crib: ["§7", "§11"]
    notes: A reuse sign-in adds no ledger event. Workflow graph://b437ecfb-e23.

  ceremony.organization_grant_recovery:
    source: {kind: ceremony, file: tools/dashboard/unlock_routes.py, symbol: _accept_organization_kem_key}
    authority: [persona_kem_private, persona_signing_key]
    effects:
      writes: [memory-held generation secrets; optional initial signed public KEM credential; no grants or storage states]
    crib: ["§1c", "§12", "§14"]
    notes: >-
      graph://35308bf7-584. Organization sign-in validates scoped KEM keys
      against current credentials and consumes the existing grant opener.
      The same opener recovers addressed, unheld states at read time and after
      RAM-only reload retention (auto-a1pub). Root stays in browser; networking
      resumes only after cleanup. Live receiver proof is tracked by auto-hwlcy.
      Initial setup (graph://dc405ba4-eef) may publish a missing current member
      credential using the founding signer and existing KeyControlStore. It
      never replaces an existing credential or persists a KEM private key.

  link.mint_channel_key:
    source: {kind: module-op, file: tools/dashboard/link_channel_key.py, symbol: mint_channel_key}
    authority: [agent_delegate_signing_key]
    effects:
      mints: [link_channel_signing_key]
      writes: [org audited channel-key Setting; public half returned for grant and fragment]
    crib: ["§8"]

  ceremony.registration:
    source: {kind: route, file: tools/network/registry/app.py}
    authority: [personal_root_seed]
    effects:
      writes: [registry binding, including the recovery policy declaration when pinned]
    crib: ["§8", "§9"]

  ceremony.vault_master_read:
    source: {kind: ceremony, file: tools/vault/unlock.py, symbol: open_generation_keys}
    authority: [persona_kem_private]
    effects:
      writes: [memory-held generation secrets recovered from CapabilityGrants]
    crib: ["§8", "§18"]
    notes: Grant opening primitive, not a human-factor authorization or an audited-object release. Org integration remains pending.

  ceremony.recovery_policy_change:
    status: designed
    source: {kind: ceremony, file: tools/network/registry/app.py}
    authority: [personal_root_seed, recovery_signing_key]
    effects:
      writes: [recovery policy transition]
    crib: ["§8", "§9"]

  vault.create_class:
    source: {kind: module-op, file: tools/vault/policy_class.py, symbol: create_class}
    authority: [personal_root_seed]
    preconditions:
      - A member class without the root-anchor wrap is refused at creation and again at the store (put_class, put_root_class_once).
    effects:
      mints: [class_key]
      seals: [class_key to factor recipients and to root_anchor_seed]
      writes: [PolicyClassRecord generation]
    crib: ["§18"]
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: root_reaches_every_generation}

  vault.revoke_class_factor:
    source: {kind: module-op, file: tools/vault/policy_class.py, symbol: revoke_factor}
    authority: [personal_root_seed]
    preconditions:
      - The root-anchor wrap cannot be dropped.
    effects:
      mints: [class_key]
      seals: [class_key to surviving factors and to root_anchor_seed]
      writes: [next PolicyClassRecord generation; applies at next write, existing sealed material untouched]
    crib: ["§3", "§18"]
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_excluded_forward}
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_keeps_old}

  storage.advance_state:
    source: {kind: module-op, file: tools/network/storagekit/lifecycle.py, symbol: advance_state}
    authority: [agent_delegate_signing_key, persona_signing_key]
    effects:
      mints: [generation_secret]
      writes: [StorageStateDescriptor, ParentBridge]
    refusals: [StateAdvanceRequired on a stale write]
    crib: ["§1d", "§6", "§7"]

  storage.issue_grant:
    source: {kind: module-op, file: tools/network/storagekit/capability.py, symbol: issue}
    authority: [agent_delegate_signing_key, persona_signing_key]
    effects:
      seals: [generation_secret to persona_kem_private]
      writes: [CapabilityGrant]
    crib: ["§6", "§7"]
    proofs:
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}

  storage.issue_receipt:
    source: {kind: module-op, file: tools/network/storagekit/capability.py, symbol: issue_receipt}
    authority: [persona_kem_private]
    effects:
      writes: [CapabilityReceipt — proof of knowledge, not an assertion]
    crib: ["§6", "§16"]

  storage.mint_credential:
    source: {kind: module-op, file: tools/network/storagekit/credentials.py, symbol: build}
    authority: [persona_signing_key]
    effects:
      mints: [persona_kem_private]
      writes: [PersonaKemCredential citing the current authority frontier]
    crib: ["§1d", "§6", "§13"]
    proofs:
      - {framework: tamarin, theory: VaultConcurrentRekey, lemma: concurrent_grant_secret}

  storage.provision_missing:
    source: {kind: module-op, file: tools/network/storagekit/distribution.py, symbol: provision_missing}
    authority: [persona_kem_private]
    effects:
      seals: [generation_secret to an unprovisioned member's current PersonaKemCredential]
      writes: [repair CapabilityGrant]
    crib: ["§15"]

  fleet.enroll:
    source: {kind: module-op, file: tools/network/fleet_roster.py, symbol: enroll}
    authority: [personal_root_seed]
    effects:
      writes: [root-signed RosterEntry addressing one machine]
    crib: ["§1b", "§10"]
    notes: Renewal is a new entry with a higher sequence number superseding the old.

  fleet.kick:
    source: {kind: module-op, file: tools/network/fleet_roster.py, symbol: kick}
    authority: [personal_root_seed]
    effects:
      revokes: [per_machine_key]
      writes: [root-signed kick tombstone; stops future distribution to that machine]
    crib: ["§1b", "§1d", "§10"]
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: kicked_machine_excluded}
      - {framework: tamarin, theory: VaultD006Window, lemma: halt_window_confidential}

  fleet.distribute_kem:
    status: designed
    source: {kind: module-op, file: tools/network/storagekit/tamarin/VaultFleetDist.spthy}
    authority: [personal_root_seed]
    effects:
      seals: [persona_kem_private to per_machine_key, one seal per fleet machine not removed]
    crib: ["§1d", "§1e"]
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: machine_key_yields_nothing_undistributed}
    notes: >-
      The KEM-distribution record is the unbuilt half of the fleet layer
      (bead auto-pw9bs.6); the cited theory is its formal spec.

  rekey.frontier_marker:
    status: designed
    source: {kind: module-op, file: tools/network/storagekit/tamarin/VaultRekeyMarker.spthy}
    authority: [persona_signing_key]
    effects:
      writes: [fold-inert frontier marker citing all locally current authority heads]
    crib: ["§1d"]
    proofs:
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}
      - {framework: tamarin, theory: VaultRekeyMarkerChain, lemma: exclusion_through_chain}
    notes: >-
      Without the marker the re-key achieves nothing (the F-001 defect);
      the calibration theory VaultRekeyF001 demonstrates exactly that.

  recovery.succession:
    status: designed
    source: {kind: module-op, file: tools/network/storagekit/tamarin/VaultRecoverySuccession.spthy}
    authority: [personal_root_seed, recovery_signing_key]
    preconditions:
      - Completion requires the elapsed witness window over a chain containing the declaration and no cancellation and no veto.
    effects:
      mints: [recovery_signing_key]
      revokes: [recovery_signing_key]
      writes: [witnessed declaration, then completion attestation]
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRecoverySuccession, lemma: window_cannot_be_fast_forwarded}
      - {framework: tamarin, theory: VaultRecoverySuccession, lemma: cancellation_blocks_completion}
      - {framework: tamarin, theory: VaultRecoverySuccession, lemma: veto_blocks_completion}
      - {framework: tamarin, theory: VaultWitnessAccountability, lemma: poll_yields_alert_or_fraud_proof}



  ceremony.checkpoint_seed:
    source: {kind: ceremony, file: tools/dashboard/static/js/network-signon.mjs, symbol: _publishMembershipCheckpoint}
    authority: [org_root_signing_key]
    preconditions:
      - No adopted checkpoint is cached locally (membership_checkpoint.py:119-132).
    effects:
      writes:
        - "checkpoint seq 0 {v, org, seq 0, prev genesis_id, ledger_head, members_root, checkpointers_root, ts}, signed by the org root opened from its sealed armor (network-signon.mjs:812-826), at the registry; cached adopted"
    crib: ["§8"]
    notes: Step F0 (founder sign-on). The advancing form is ceremony.checkpoint_publish.
  # ── Invite -> join -> admission -> sync (graph://cde6c8c6-041) ────────────
  # Every entry below carries the machine-evaluable workflow fields (actors,
  # opens, requires, produces) the planner reads: keyreg.py plan / explain-current.
  # Step labels F0..J7 are the ceremony record's section 1.

  ceremony.org_invite_mint:
    source: {kind: ceremony, file: tools/dashboard/static/js/ceremony/org-invite.js, symbol: mintOrgInvite}
    authority: [persona_signing_key]
    preconditions:
      - Parents are the founder's current heads (GET /api/network/ledger/heads).
    effects:
      writes:
        - "invite event {granted_role, expiry, sponsor, token_hash|invite_pub, max_uses?} appended through POST /api/network/ledger/invite"
    actors: [founder]
    opens: persona
    requires: [persona_signing_key, ledger_heads]
    produces: [invite_event]
    crib: ["§8"]
    notes: >-
      Step F1. Root opened at tools/dashboard/static/js/org-membership.js:861;
      the seed is zeroed at :886 after the publish chain settles, and is not
      passed to publishMint (:1008), so F2 opens the root again.

  approval.link_publish:
    source: {kind: ceremony, file: tools/dashboard/static/js/pages/worktrees.js, symbol: signOnWithRootSeed}
    authority: [personal_root_seed]
    preconditions:
      - A pending link_publish approval row {org, target_uuid, target_type org:join, invite_ref, expires_at, meta} (org-membership.js:1008-1030).
    effects:
      writes: [approved link_publish decision; Gate 2 org-scoped sign-on]
    actors: [founder]
    opens: root
    requires: [personal_root_seed, invite_event]
    produces: [link_publish_approval]
    crib: ["§8"]
    notes: >-
      Step F2 (Gate 2, worktrees.js:173-203, :267). The root is opened for the
      approval, not reused from F1.

  route.link_publish:
    source: {kind: route, file: tools/dashboard/link_approvals.py, symbol: _execute_link_publish}
    authority: [agent_delegate_signing_key]
    preconditions:
      - Serving must be startable for the org (link_approvals.py:_require_startable_serving).
    effects:
      writes:
        - "grant row {grant_id, target_uuid, target_type, meta, subject, issued_at, channel_pub, invite_ref}, relay create-link, invite bearer (POST ledger/invite/bearer)"
    actors: [founder]
    opens: delegate
    requires: [agent_delegate_signing_key, link_publish_approval, serve_cert]
    produces: [join_link_grant]
    crib: ["§8"]
    notes: Step F2, executor half. The channel key is minted by link.mint_channel_key.

  route.invite_resolve:
    source: {kind: route, file: tools/dashboard/network_routes.py, symbol: post_invite_resolve}
    authority: [bearer of the org:join link]
    effects:
      writes:
        - "nothing durable; returns {org, invite_ref} from the registry envelope"
    actors: [joiner]
    opens: none
    requires: [join_link_grant]
    produces: [invite_ref_resolved]
    crib: ["§8"]
    notes: Step J1.

  route.join_context:
    source: {kind: route, file: tools/dashboard/claim_service.py, symbol: context}
    authority: [bearer of the org:join link]
    preconditions:
      - Served by the founder's connector over the link channel; the founder machine must be online (link_serving.py:1007-1033).
    effects:
      writes:
        - "nothing durable; returns {genesis_id, heads, max_hlc, granted_role, binding, invite_expiry, sponsor_pub, brand, sponsor profile}"
    actors: [founder]
    opens: none
    requires: [invite_ref_resolved, invite_event]
    produces: [join_context]
    crib: ["§8"]
    notes: Step J2. Executes on the founder's machine.

  ceremony.member_claim_mint:
    source: {kind: ceremony, file: tools/dashboard/static/js/ceremony/claim.js, symbol: mintMemberClaim}
    authority: [persona_signing_key]
    preconditions:
      - Parents are the context heads (claim.js:234-247); a submit whose parents are not the founder's current heads is refused stale-heads (claim_service.py:170-171).
    effects:
      writes:
        - "member.claim {invite_ref, persona_pub, profile, approvals, kem_credential, token?}"
    actors: [joiner]
    opens: persona
    requires: [persona_signing_key, join_context]
    produces: [member_claim]
    crib: ["§8"]
    notes: Step J3.

  route.claim_submit_admit:
    source: {kind: route, file: tools/dashboard/claim_service.py, symbol: submit}
    authority: [invited persona key]
    effects:
      writes: [member.claim appended to the founder's ledger (claim_service.py:172-175)]
    actors: [founder]
    opens: none
    requires:
      - any:
          - all: [member_claim, policy_self_admit]
          - member_claim_final
    produces: [member_admitted]
    crib: ["§8"]
    notes: >-
      Steps J3 and J4, submit half, on the founder's machine. No checkpoint
      code runs here (claim_service.py, link_serving.py).

  route.claim_submit_stage:
    source: {kind: route, file: tools/dashboard/claim_service.py, symbol: submit}
    authority: [invited persona key]
    effects:
      writes:
        - "pending claim staged (claim_service.py:189-193); returns pending {have, need}"
    actors: [founder]
    opens: none
    requires:
      - all: [member_claim, policy_approval]
    produces: [claim_staged]
    crib: ["§8"]
    notes: Step J3 under a role whose policy requires approvals.

  ceremony.claim_approval:
    source: {kind: ceremony, file: tools/dashboard/static/js/ceremony/claim.js, symbol: signClaimApproval}
    authority: [persona_signing_key]
    effects:
      writes:
        - "approval stored against the staged claim (POST /api/network/ledger/claim/{key}/approval, network_routes.py:post_ledger_claim_approval); the claim becomes ready, not admitted"
    actors: [founder]
    opens: persona
    requires: [persona_signing_key, claim_staged]
    produces: [claim_approval]
    crib: ["§8"]
    notes: Step F3. Root opened at org-membership.js:1082.

  ceremony.claim_finalize:
    source: {kind: ceremony, file: tools/dashboard/static/js/join/accept-controller.js, symbol: finalize}
    authority: [persona_signing_key]
    effects:
      writes: [member.claim re-minted at the pinned position carrying the approvals (accept-controller.js:270-319)]
    actors: [joiner]
    opens: persona
    requires: [persona_signing_key, claim_approval]
    produces: [member_claim_final]
    crib: ["§8"]
    notes: Step J4.

  route.admit_on_approval:
    status: designed
    rule: admit_on_approval
    source: {kind: route, file: tools/network/TLA/OrgAdmission.tla, symbol: Approve}
    authority: [persona_signing_key]
    effects:
      writes: [the staged claim appended with the approval, in the approver's window]
    actors: [founder]
    opens: persona
    requires: [persona_signing_key, claim_staged]
    produces: [claim_approval, member_admitted]
    crib: ["§8"]
    proofs:
      - {framework: tla, theory: OrgAdmission, lemma: ApprovedIsAdmitted}
      - {framework: tla, theory: OrgAdmission, lemma: AdmittedWereApproved}
    notes: >-
      Proposed consolidation F3+F4 (graph://cde6c8c6-041 §5): admission at
      countersign, so the checkpoint can run in the same window. Not built.

  route.join_bootstrap:
    source: {kind: route, file: tools/dashboard/claim_service.py, symbol: bootstrap}
    authority: [admitted persona]
    preconditions:
      - The fold must show the persona as a valid member; otherwise pending (claim_service.py:228-231).
    effects:
      writes:
        - "nothing durable; returns {events, more, binding, member_profiles, reachability_rows, brand} as of this moment (claim_service.py:233-235)"
    actors: [founder]
    opens: none
    requires: [member_admitted]
    produces: [bootstrap_snapshot]
    crib: ["§8"]
    notes: Step J5, served half, on the founder's machine.

  route.join_install:
    source: {kind: route, file: tools/dashboard/network_routes.py, symbol: post_join_outcome}
    authority: [admitted persona]
    effects:
      writes: [org DB, ledger re-folded from genesis, binding, persona row, directory row, install seed (profiles only)]
    actors: [joiner]
    opens: none
    requires: [bootstrap_snapshot]
    produces: [ledger_heads, registry_binding]
    crib: ["§8"]
    notes: >-
      Step J5. Does not produce install_seed_addresses: network-join.js
      (installAdmitted, :313-327) does not forward reachability_rows although
      the route reads them (network_routes.py:938-943). Deferred here
      (:804-805): storage delegate, serve cert, fleet runtime, sync cert.

  ceremony.checkpoint_publish:
    source: {kind: ceremony, file: tools/dashboard/membership_checkpoint.py, symbol: checkpoint_due}
    authority: [persona_signing_key]
    preconditions:
      - The signer is in the checkpointers set of the previously adopted checkpoint (membership_checkpoint.py:139-149).
      - ledger_head is the signer's first sorted head at assembly (membership_checkpoint.py:106, _first_head).
    effects:
      writes:
        - "checkpoint {v, org, seq, prev, ledger_head, members_root, checkpointers_root, ts, signer, proof, proof_index} at the registry (network_routes.py:post_membership_checkpoint); the signer caches it adopted"
    actors: [founder]
    opens: persona
    requires: [persona_signing_key, member_admitted, ledger_heads, checkpoint_seed]
    produces: [checkpoint_including_joiner, adopted_checkpoint]
    crib: ["§8"]
    proofs:
      - {framework: tla, theory: OrgAdmission, lemma: EveryAdmittedMemberPulls}
    notes: >-
      Step F4. Only callers: full sign-in (signon_preparation.py:125-133) and
      the scoped sign-on (network-signon.mjs:1560-1577). Nothing publishes at
      admission.

  ceremony.checkpoint_delegate_grant:
    status: designed
    rule: delegate_checkpoint
    source: {kind: ceremony, file: tools/network/storagekit/tamarin/DelegateCheckpoint.spthy, symbol: Grant_Checkpoint_Delegate}
    authority: [persona_signing_key]
    effects:
      writes: [a hot delegate grant carrying a checkpoint scope]
    actors: [founder]
    opens: persona
    requires: [persona_signing_key, ledger_heads]
    produces: [checkpoint_delegate_grant]
    crib: ["§8", "§11"]
    proofs:
      - {framework: tamarin, theory: DelegateCheckpoint, lemma: checkpoint_attributable}
      - {framework: tamarin, theory: DelegateCheckpoint, lemma: no_attribution_without_grant}
    notes: >-
      Not built: the storage delegate's scopes exclude checkpoint today
      (storagekit/delegate.py:storage_delegate_scopes). Operator ruling 1
      (2026-09-25) accepts a checkpoint scope on the hot delegate; the
      grant keeps the built proof-of-possession form (fold.py:_h_delegate),
      which DelegateCheckpointNoPoP shows is load-bearing for attribution.

  delegate.checkpoint_publish:
    status: designed
    rule: delegate_checkpoint
    source: {kind: module-op, file: tools/network/TLA/OrgAdmission.tla, symbol: AdmitStep}
    authority: [agent_delegate_signing_key]
    effects:
      writes: [advancing checkpoint signed by the checkpoint-scoped delegate at admission, no ceremony]
    actors: [founder]
    opens: delegate
    requires: [agent_delegate_signing_key, checkpoint_delegate_grant, member_admitted, ledger_heads, checkpoint_seed]
    produces: [checkpoint_including_joiner, adopted_checkpoint]
    crib: ["§8", "§11"]
    proofs:
      - {framework: tla, theory: OrgAdmission, lemma: EveryAdmittedMemberPulls}
      - {framework: tamarin, theory: DelegateCheckpoint, lemma: checkpoint_unforgeable}
      - {framework: tamarin, theory: DelegateCheckpoint, lemma: checkpoint_attributable}
      - {framework: tamarin, theory: DelegateCheckpoint, lemma: signer_in_previous_checkpointers}
    notes: Proposed rule Checkpoint-at-admission with a hot signer (operator ruling 1, 2026-09-25). Not built.

  route.checkpoint_adopt:
    source: {kind: route, file: tools/dashboard/network_routes.py, symbol: _adopt_registry_checkpoint}
    authority: [registry membership state; this node's own ledger]
    preconditions:
      - Skip when the cached seq >= the registry seq (network_routes.py:756-758).
      - Fold the local ledger at the registry's ledger_head and require members_root equality; an id the local ledger lacks raises in ancestry/get and nothing is adopted (network_routes.py:759-768, fold.py:499-500, ledger.py:36-42, 66-77).
    effects:
      writes: [adopted checkpoint cache row (membership_checkpoint.py:record_adopted)]
    refusals: [no registry binding, registry unreachable, head absent from the local ledger, members_root mismatch]
    actors: [joiner]
    opens: none
    requires: [checkpoint_including_joiner, ledger_heads]
    produces: [adopted_checkpoint]
    crib: ["§8"]
    proofs:
      - {framework: tla, theory: OrgAdmission, lemma: EveryAdmittedMemberPulls}
      - {framework: tla, theory: OrgAdmission, lemma: NoPullWithoutInclusion}
      - {framework: tla, theory: OrgAdmission, lemma: AdoptedIsAuthentic}
    notes: >-
      Never signs (docstring, network_routes.py:724-733). Callers: join
      install (:945), sign-on preparation (signon_preparation.py:140), and the
      route POST /api/network/membership-checkpoint/adopt; no background
      caller. The head-presence precondition is not monotone and is not
      expressed in requires; OrgAdmission.tla models it: under these rules
      a member bootstrapped before a later admission that the next
      checkpoint covers can never adopt it, and no pull is admitted
      (OrgAdmissionCurrent.cfg, EveryAdmittedMemberPulls violated). The
      proposed adopt-by-verification rule (signer in the previous
      checkpointers root, prev chain, no local head) with
      checkpoint-at-admission removes the deadlock
      (OrgAdmissionProposed.cfg). Under that rule the prover's own
      inclusion path cannot come from a local fold at the head
      (org_sync_channels.py:173-179, 197-205); it must arrive with the
      checkpoint.

  route.relay_connect:
    source: {kind: module-op, file: tools/network/relaykit/connector.py, symbol: TunnelConnector}
    authority: [serving_delegate_key]
    effects:
      writes: [a live serving slot at the org's relay]
    actors: [founder, joiner]
    opens: none
    requires: [serve_cert]
    produces: [relay_slot]
    crib: ["§8"]
    notes: >-
      Slots are read for peer selection through
      org_sync_channels.relay_slots_provider. Whether the relay's per-org
      serve_machine_keys allow-set admits a new member's machine is an open
      question (relay.py:973-1000, store.py:1576-1583); unproven.

  module.org_reachability_publish:
    source: {kind: module-op, file: tools/network/fleet_sync_scheduler.py, symbol: _publish_org_reachability}
    authority: [serving_machine_signing_key]
    effects:
      writes: [the machine's reachability row in the org scope, replicated by org sync]
    actors: [founder, joiner]
    opens: none
    requires: [persona_cert_fleet_sync]
    produces: [reachability_row]
    crib: ["§10"]
    notes: A co-member reads the row only after a pull, so it cannot seed a first contact.

purposes:
  autonomy/capability-grant/v1:
    description: Seals a generation secret to a PersonaKemCredential in a CapabilityGrant.
    used_by: [tools/network/storagekit/capability.py]
  autonomy/receipt-pok/v1:
    description: Derives a CapabilityReceipt's proof-of-knowledge value from the state secret.
    used_by: [tools/network/storagekit/capability.py]
  autonomy/object-wrap/v1:
    description: Derives an object revision's wrap key from its generation secret.
    used_by: [tools/network/storagekit/object_header.py]
  autonomy/storage-parent-edge/v1:
    description: Keys a ParentBridge's child-to-parent generation recovery.
    used_by: [tools/network/storagekit/bridge.py]
  autonomy/storage-state-secret/v1:
    description: Domain label for generation-secret material in a StorageStateDescriptor.
    used_by: [tools/network/storagekit/state.py]
  autonomy/storage-domain/v1:
    description: Domain label for storage-domain identifiers in ledger projections.
    used_by: [tools/network/ledger/projections.py]
  autonomy/root-policy-wrap/v1:
    description: Wraps root-factor-policy node secrets inside the armor envelope.
    used_by: [tools/network/idkit/root_factor_policy.py]
  autonomy/root-factor-recipient/v1:
    description: Derives a factor's armor recipient from its factor seed.
    used_by: [tools/network/idkit/root_factor_policy.py]
  autonomy/vault-factor/v1:
    description: Derives a factor's vault recipient inside the armor (distinct from the root-factor purpose).
    used_by: [tools/network/idkit/armor.py]
  autonomy/recovery-armor/v1:
    description: Derives the recovery code's armor-slot recipient.
    used_by: [tools/network/idkit/root_factor_policy.py]
  autonomy.recovery.signing.v1:
    description: Derives the recovery signing key from the recovery code.
    used_by: [tools/network/idkit/recovery.py]
  autonomy.recovery.member-sign.v1:
    description: Derives a per-organization member recovery key from the recovery code and genesis_id.
    used_by: [tools/network/idkit/recovery.py]
  autonomy.recovery.kek.v1:
    description: Derives the recovery share of the master key-encryption key from the recovery code.
    used_by: [tools/network/idkit/recovery.py]
  autonomy.identity.persona.v1:
    description: Derives a persona keypair from the personal root seed and genesis_id.
    used_by: [tools/network/idkit/persona.py]
  autonomy.identity.machine.v1:
    description: Derives the per-machine operating key from the personal root seed and machine_id.
    used_by: [tools/network/idkit/persona.py]
  autonomy.identity.serving-machine.v1:
    description: Derives the organization-and-machine-specific Ed25519 serving key.
    used_by: [tools/network/idkit/persona.py]
  autonomy/vault/delegate-audited-recipient/v1:
    description: Derives the dedicated X25519 recipient for unattended audited reads.
    used_by: [tools/vault/personal_object.py]
  autonomy/vault/delegate-audited-cek/v1:
    description: Seals an audited content key to the delegate recipient, bound to object and revision.
    used_by: [tools/vault/personal_object.py]
  autonomy.network.ledger.sync-key.v1:
    description: Derives the ledger bundle sync key.
    used_by: [tools/network/ledger/bundles.py]
  autonomy.network.channel.keys.v1:
    description: Derives relay channel keys.
    used_by: [tools/network/relaykit/channel.py]
  autonomy.network.channel.stream.v1:
    description: Derives relay channel stream nonces.
    used_by: [tools/network/relaykit/channel.py]
  autonomy.attachment.cursor.v1:
    description: Derives attachment download cursor authentication.
    used_by: [tools/network/relaykit/attachment_download.py]
  autonomy/vault-policy-class/v1:
    description: Domain label for a vault policy class record.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-class/sealing-key/v1:
    description: Derives a class generation's public sealing keypair from its class key.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-class/cek/v1:
    description: Wraps an object content key under a class generation.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-class/cek-hpke/v1:
    description: Seals an object content key to a class generation's public sealing key.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-recipient/v1:
    description: Derives a factor's vault policy-class recipient from its factor seed.
    used_by: [tools/vault/recipients.py]
  autonomy/vault-root-anchor-wrap/v1:
    description: Wraps a class key to the root anchor's derived recipient.
    used_by: [tools/vault/root_anchor.py]
  autonomy/vault/object-id/v1:
    description: Derives a vault storage object's identifier.
    used_by: [tools/vault/storage_object.py]
  autonomy/vault/revision-id/v1:
    description: Derives a vault storage object's revision identifier.
    used_by: [tools/vault/storage_object.py]
  autonomy/personal-vault-content/v1:
    description: Encrypts personal vault object content.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-owner-at-rest/v1:
    description: Seals the personal owner key at rest.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-vault/no-storage-generation/v1:
    description: Domain label for personal vault objects outside any storage generation.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-vault/object-id/v1:
    description: Derives a personal vault object's identifier.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-vault/revision-id/v1:
    description: Derives a personal vault object's revision identifier.
    used_by: [tools/vault/personal_object.py]

# ── Workflow planning: actors, artifacts, goals ─────────────────────────────
# The org invite -> join -> admission -> sync workflow of graph://cde6c8c6-041,
# as an AND/OR graph over artifacts. keyreg.py plan / explain-current read it;
# lint.py checks the recorded current order against it. A per-actor artifact
# referenced bare in a mutation binds to the executing actor; elsewhere it is
# written <artifact>@<actor>. An artifact's origin says where a copy comes
# from: workflow (default; a workflow mutation produces it), given (held by a
# starting state, established before the workflow by the given_by mutations;
# the planner never re-produces it), defect (no producer, for the recorded
# reason; lint names it), open (not required by any goal; an open question).
actors:
  founder:
    description: The org's founding member; sponsor of the invite and the only checkpointer in this workflow.
  joiner:
    description: The invited member, on a machine with its own personal fleet.

artifacts:
  ledger_heads:
    per_actor: true
    description: The actor's copy of the org ledger and its current heads (founder_heads, joiner_heads).
    store: autonomy.org.ledger-event#1 rows in the org DB
    home: the actor's machine
    origin: given
    given_by: [fold.genesis@founder]
    code: [tools/network/ledger/settings_bridge.py, tools/network/ledger/ledger.py:heads]
  registry_binding:
    per_actor: true
    description: The org's registry binding {org_uuid, root key, registry_url}.
    store: NETWORK_BINDING_SET_ID Setting
    home: the actor's machine
    origin: given
    given_by: [ceremony.registration@founder]
    code: [tools/graph/schemas/network_identity.py:NETWORK_BINDING_SET_ID]
  checkpoint_seed:
    description: Registry membership checkpoint seq 0, signed by the org root.
    store: registry /v1/orgs/{uuid}/membership-checkpoints
    home: registry
    origin: given
    given_by: [ceremony.checkpoint_seed]
    code: [tools/dashboard/membership_checkpoint.py:checkpoint_due]
  serve_cert:
    per_actor: true
    description: The actor's persona-signed serving certificate and key.
    store: autonomy.machine.serve-cert row; serving key in autonomy.machine.vault.audited
    home: the actor's machine
    origin: given
    given_by: [ceremony.serve_cert_mint@founder]
    code: [tools/dashboard/network_routes.py:_post_serve_cert_v3]
  relay_slot:
    per_actor: true
    description: A live serving slot of the actor's connector at the org's relay.
    store: relay memory
    home: relay
    origin: given
    given_by: [route.relay_connect@founder]
    code: [tools/dashboard/org_sync_channels.py:relay_slots_provider]
  fleet_roster:
    per_actor: true
    description: A personal fleet roster entry for the actor's machine; required by the runtime mint (fleet_enrollment_routes.py:_runtime_context).
    store: personal fleet roster
    home: the actor's machine
    origin: given
    given_by: [fleet.enroll]
    code: [tools/dashboard/fleet_enrollment_routes.py:_runtime_context]
    notes: For a fresh joiner with no personal fleet, unverified (graph://cde6c8c6-041 §1 J6).
  persona_cert_fleet_sync:
    per_actor: true
    description: The org sync certificate (persona -> serving machine key, scope fleet:sync) with its serving seed, installed as an OrgFleetAuthenticator.
    store: memory and the machine vault
    home: the actor's machine
    origin: given
    given_by: [ceremony.fleet_runtime_mint@founder]
    code: [tools/dashboard/fleet_enrollment_routes.py:_activate_runtime, tools/network/fleet_org_channel.py:OrgFleetAuthenticator]
  delegate_grant:
    per_actor: true
    description: The actor's storage delegate event, persona-signed, parents = local heads.
    store: the actor's org ledger and audited vault
    home: the actor's machine
    code: [tools/dashboard/org_storage_delegate.py:accept]
    notes: Not read by _sync_org_peers; whether a pull needs it is unproven.
  invite_event:
    description: The persona-signed invite event.
    store: founder's org ledger
    home: founder machine
    code: [tools/network/ledger/events.py:_v_invite, tools/dashboard/static/js/ceremony/org-invite.js:mintOrgInvite]
  link_publish_approval:
    description: The approved link_publish decision with its Gate 2 org-scoped sign-on.
    store: approvals table
    home: founder machine
    code: [tools/dashboard/link_approvals.py:_org_join_request]
  join_link_grant:
    description: The org:join grant row, the relay link and the stored invite bearer.
    store: founder org Settings; relay
    home: founder machine and relay
    code: [tools/dashboard/link_approvals.py:_execute_link_publish]
  invite_ref_resolved:
    description: "{org, invite_ref} resolved from the registry envelope of the link."
    store: joiner browser memory
    home: joiner machine
    code: [tools/dashboard/network_routes.py:post_invite_resolve]
  join_context:
    description: The claim context served by the founder's connector (genesis_id, heads, granted_role, binding, sponsor).
    store: joiner browser memory
    home: joiner machine
    code: [tools/dashboard/claim_service.py:context]
  member_claim:
    description: The persona-signed member.claim event.
    store: joiner browser memory until submitted
    home: joiner machine
    code: [tools/dashboard/static/js/ceremony/claim.js:mintMemberClaim, tools/network/ledger/events.py:_v_member_claim]
  claim_staged:
    description: A claim staged pending approvals.
    store: founder's pending-claim store
    home: founder machine
    code: [tools/dashboard/claim_service.py:submit]
  claim_approval:
    description: The founder's countersignature on a staged claim.
    store: founder's pending-claim store
    home: founder machine
    code: [tools/dashboard/static/js/ceremony/claim.js:signClaimApproval, tools/dashboard/claim_service.py:countersign]
  member_claim_final:
    description: The claim re-minted at the pinned position carrying the approvals.
    store: joiner browser memory until submitted
    home: joiner machine
    code: [tools/dashboard/static/js/join/accept-controller.js:finalize]
  member_admitted:
    description: The claim appended to the founder's ledger.
    store: founder's org ledger
    home: founder machine
    code: [tools/dashboard/claim_service.py:submit]
  bootstrap_snapshot:
    description: The founder's ledger events, binding and profiles as of the bootstrap moment.
    store: joiner browser memory
    home: joiner machine
    code: [tools/dashboard/claim_service.py:bootstrap]
  install_seed_addresses:
    description: Co-member addresses in the joiner's install seed.
    store: joiner install seed
    home: joiner machine
    origin: defect
    defect: "graph://cde6c8c6-041 §5 J5 reachability seed: network-join.js:313-327 does not forward reachability_rows"
    code: [tools/dashboard/org_install_seed.py:seed_reachability]
    notes: No built producer; the join page does not forward reachability_rows (network-join.js:313-327).
  checkpoint_including_joiner:
    description: A registry checkpoint seq n+1 whose members_root includes the joiner (checkpoint_seq_n).
    store: registry /v1/orgs/{uuid}/membership-checkpoints
    home: registry
    code: [tools/dashboard/network_routes.py:post_membership_checkpoint]
  adopted_checkpoint:
    per_actor: true
    description: The actor's adopted-checkpoint cache holds a checkpoint including the joiner (adopted_checkpoint_founder, adopted_checkpoint_joiner).
    store: NETWORK_CHECKPOINT_CACHE_SET_ID row
    home: the actor's machine
    code: [tools/dashboard/membership_checkpoint.py:record_adopted]
  reachability_row:
    per_actor: true
    description: The actor machine's signed reachability row in the org scope.
    store: org scope Settings, replicated by org sync
    home: the actor's machine; co-members after a pull
    code: [tools/network/fleet_sync_scheduler.py:_publish_org_reachability]
  registered_serving_key:
    per_actor: true
    description: The actor's serving machine key in the registry's per-org serve_machine_keys allow-set.
    store: registry store
    home: registry
    origin: open
    code: [tools/network/registry/backfill_serving_keys.py]
    notes: >-
      Enforced only when the set is non-empty (relay.py:973-1000,
      store.py:1576-1583); the only writer in the tree is this backfill.
      Whether any live org's set is non-empty is an open question; the goal
      does not require it.
  policy_self_admit:
    description: The invite's role admits a claim without approvals.
    store: founder's org ledger (role definition)
    home: founder machine
    origin: given
    given_by: [fold.role_define]
    code: [tools/dashboard/claim_service.py:R_APPROVAL_MISSING]
  policy_approval:
    description: The invite's role requires approvals before admission.
    store: founder's org ledger (role definition)
    home: founder machine
    origin: given
    given_by: [fold.role_define]
    code: [tools/dashboard/claim_service.py:R_APPROVAL_MISSING]
  checkpoint_delegate_grant:
    status: designed
    description: A hot delegate grant whose scope includes signing advancing checkpoints.
    store: founder's org ledger and audited vault
    home: founder machine
    code: [tools/network/storagekit/delegate.py:storage_delegate_scopes, tools/network/storagekit/tamarin/DelegateCheckpoint.spthy:Grant_Checkpoint_Delegate]

goals:
  org_sync_pull:
    description: >-
      Founder and joiner can each pull the other over org sync: both hold an
      org channel (sync certificate + serving seed), both have adopted a
      checkpoint whose members_root includes the joiner (the verifier admits
      a pull only under an adopted seq with inclusion, fleet_org_channel.py:
      286-309), the joiner holds the org ledger, and the joiner has a route to
      the founder (the founder reaches the joiner through its dial-in).
    requires:
      - persona_cert_fleet_sync@founder
      - persona_cert_fleet_sync@joiner
      - adopted_checkpoint@founder
      - adopted_checkpoint@joiner
      - ledger_heads@joiner
      - any:
          - install_seed_addresses
          - all: [relay_slot@joiner, relay_slot@founder]
    notes: >-
      Peer selection sources (fleet_sync_scheduler.py:_org_peer_candidates):
      reachability rows (need a prior pull), install seed, relay slots through
      the dialer's own connector, dialed-in peers. The founder-pulls-joiner
      direction riding the joiner's dial-in is taken from the record, not
      re-traced. The single-joiner AND/OR graph cannot express head presence
      at adoption; OrgAdmission.tla carries that.
    states:
      self_admit:
        description: Founded org (F0 done), invite role self-admits.
        holds:
          - ledger_heads@founder
          - registry_binding@founder
          - checkpoint_seed
          - serve_cert@founder
          - relay_slot@founder
          - persona_cert_fleet_sync@founder
          - fleet_roster@founder
          - fleet_roster@joiner
          - policy_self_admit
      approval:
        description: Founded org (F0 done), invite role requires the founder's approval.
        holds:
          - ledger_heads@founder
          - registry_binding@founder
          - checkpoint_seed
          - serve_cert@founder
          - relay_slot@founder
          - persona_cert_fleet_sync@founder
          - fleet_roster@founder
          - fleet_roster@joiner
          - policy_approval
    current_order:
      - {step: F1, actor: founder, ceremony: true, runs: [ceremony.org_invite_mint]}
      - {step: F2, actor: founder, ceremony: true, runs: [approval.link_publish, route.link_publish]}
      - {step: J1, actor: joiner, ceremony: false, runs: [route.invite_resolve]}
      - {step: J2, actor: founder, ceremony: false, runs: [route.join_context]}
      - {step: J3, actor: joiner, ceremony: true, runs: [ceremony.member_claim_mint]}
      - {step: J3.submit, actor: founder, ceremony: false, runs: [route.claim_submit_admit], only_from: [self_admit]}
      - {step: J3.stage, actor: founder, ceremony: false, runs: [route.claim_submit_stage], only_from: [approval]}
      - {step: F3, actor: founder, ceremony: true, runs: [ceremony.claim_approval], only_from: [approval]}
      - {step: J4, actor: joiner, ceremony: true, runs: [ceremony.claim_finalize], only_from: [approval]}
      - {step: J4.submit, actor: founder, ceremony: false, runs: [route.claim_submit_admit], only_from: [approval]}
      - {step: J5.serve, actor: founder, ceremony: false, runs: [route.join_bootstrap]}
      - {step: J5, actor: joiner, ceremony: false, runs: [route.join_install, route.checkpoint_adopt]}
      - {step: J6, actor: joiner, ceremony: true, runs: [route.checkpoint_adopt, ceremony.organization_storage_delegate, ceremony.serve_cert_mint, ceremony.fleet_runtime_mint]}
      - {step: J6.connect, actor: joiner, ceremony: false, runs: [route.relay_connect]}
      - {step: F4, actor: founder, ceremony: true, runs: [ceremony.checkpoint_publish]}
      - {step: J6.repeat, actor: joiner, ceremony: true, runs: [route.checkpoint_adopt, ceremony.organization_storage_delegate, ceremony.serve_cert_mint, ceremony.fleet_runtime_mint]}
    known_defects:
      - {step: J5, mutation: route.checkpoint_adopt, missing: checkpoint_including_joiner, ref: "graph://cde6c8c6-041 §1 J5 (network_routes.py:945)"}
      - {step: J6, mutation: route.checkpoint_adopt, missing: checkpoint_including_joiner, ref: "graph://cde6c8c6-041 §3 (J6 repeat)"}
    proofs:
      - {framework: tla, theory: OrgAdmission, lemma: EveryAdmittedMemberPulls}
      - {framework: tla, theory: OrgAdmission, lemma: NoPullWithoutInclusion}
      - {framework: tla, theory: OrgAdmission, lemma: ApprovedIsAdmitted}
    scenarios:
      - {from: self_admit, rules: [], current: {founder: 3, joiner: 3}, minimal: {founder: 2, joiner: 1}}
      - {from: approval, rules: [], current: {founder: 4, joiner: 4}, minimal: {founder: 3, joiner: 2}}
      - {from: approval, rules: [admit_on_approval], current: {founder: 4, joiner: 4}, minimal: {founder: 2, joiner: 2}}
      - {from: self_admit, rules: [delegate_checkpoint], current: {founder: 3, joiner: 3}, minimal: {founder: 1, joiner: 1}}
      - {from: approval, rules: [admit_on_approval, delegate_checkpoint], current: {founder: 4, joiner: 4}, minimal: {founder: 2, joiner: 2}}
