# The key registry — machine-readable inventory of every key and mutation in
# the vault + storage system. Design: decision note graph://879ccc1e-b49.
# The prose design of record is the crib sheet (graph note 1e005d5c-c11);
# `crib` fields below name its sections. Validate with:
#   python3 tools/network/keyreg/keyreg.py validate
version: 1

keys:

  personal_root_seed:
    group: identity-armor
    kind: seed
    custody:
      class: cold
      forced_by: >-
        Every act needing it expresses human intent (crib Q0), and its
        snapshot is total; no execution-class question is reached.
    derivation: null
    descriptor:
      reaches: >-
        Every purpose key ever derivable from it, and every vault policy
        class through each class's root-anchor wrap. Root authority
        reconstitutes the whole identity.
      snapshot: Total and unbounded, across every organization.
      live: "No."
      revoke: >-
        None. The remedy is personal-root rotation, which requires the old
        root, the new root, and the enrolled recovery key
        (make_rotation in tools/network/idkit/root_rotation.py).
      bound: None.
    seals_to:
      - recipient: factor_recipient
        purpose: autonomy/root-factor-recipient/v1
        record: root factor policy envelope share
      - recipient: recovery_slot_recipient
        purpose: autonomy/recovery-armor/v1
        record: armor recovery slot
    code:
      - tools/network/idkit/armor.py
      - tools/network/idkit/root_factor_policy.py
      - tools/network/idkit/root_rotation.py:make_rotation
    crib: ["§2", "§9"]
    proofs:
      - {framework: tamarin, theory: VaultOpenStore, lemma: root_secret_open_store}
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: root_secret}
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: password_and_passkey1_release_root}
      - {framework: tamarin, theory: VaultRootRotation, lemma: owner_rotates_away_from_stolen_root}

  org_root_signing_key:
    group: org-authority
    kind: signing
    custody:
      class: cold
      forced_by: Constitutional acts are intent acts (crib Q0).
    derivation: null
    descriptor:
      reaches: >-
        Genesis, key rotation, serve-certificate minting, registration, and
        rebind. It is not a domain principal: it holds no KEM credential and
        receives no capability grants.
      snapshot: No content.
      live: "Yes — it must reach the ledger or registry to be used."
      revoke: Org-vouch or dual-signed org-root rotation; both are ceremonies.
      bound: The ceremony.
    code:
      - tools/network/ledger/fold.py:_h_key_rotate
    crib: ["§8", "§9"]

  recovery_code:
    group: recovery
    kind: seed
    custody:
      class: cold
      forced_by: >-
        Its whole security property is being disjoint from the hot path; it
        is printed once and never touches a machine except in a recovery
        ceremony.
    derivation: null
    descriptor:
      reaches: >-
        Three domain-separated derivations, none reaching another: the armor
        recovery slot recipient, the recovery signing key, and the
        per-organization member recovery keys.
      snapshot: The sealed root seed, opened only by the code. No org content.
      live: "No."
      revoke: >-
        Replacement with the code in hand runs replace_recovery_slot
        (tools/network/idkit/root_factor_policy.py). Regeneration with the
        code lost is the witnessed succession window: declaration, blocking
        alert, cancellation or veto, completion after the window.
      bound: None.
    code:
      - tools/network/idkit/recovery.py
    crib: ["§9"]

  recovery_signing_key:
    group: recovery
    kind: signing
    custody:
      class: cold
      forced_by: Derived only from the cold recovery code.
    derivation:
      parent: recovery_code
      fn: HKDF
      purpose: autonomy.recovery.signing.v1
    descriptor:
      reaches: >-
        The recovery co-signature on personal-root rotation and on
        recovery-code succession declarations.
      snapshot: Nothing; it signs and never decrypts.
      live: "Yes — its signatures must reach a verifier."
      revoke: Recovery-code succession (the witnessed window).
      bound: The acts it co-signs.
    code:
      - tools/network/idkit/recovery.py:recovery_signing_key
      - tools/network/idkit/root_rotation.py:rotation_recovery_input
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRootRotation, lemma: thief_cannot_rotate}
      - {framework: tamarin, theory: VaultRootRotation, lemma: code_finder_cannot_rotate}

  member_recovery_key:
    group: recovery
    kind: signing
    custody:
      class: cold
      forced_by: Derived only from the cold recovery code.
    derivation:
      parent: recovery_code
      fn: HKDF
      inputs: [genesis_id]
      purpose: autonomy.recovery.member-sign.v1
    descriptor:
      reaches: >-
        Exactly one act: the recovery-authorized door of member.rekey. The
        genesis_id in the derivation keeps an identical printed code from
        linking personas across organizations.
      snapshot: Nothing — no plaintext, no content, no authority beyond the one door.
      live: "Yes — the rekey event must reach the ledger fold."
      revoke: >-
        Enrolled at member.claim; changing it requires the current member
        recovery key or the org root. No event adds one after member.claim.
      bound: The one act; the fold rejects everything else.
    code:
      - tools/network/idkit/recovery.py:member_recovery_key
      - tools/network/ledger/fold.py:_h_member_rekey
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_key_secret}
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_beats_thief}
      - {framework: tamarin, theory: RecoveryUnlink, lemma: Observational_equivalence}

  recovery_slot_recipient:
    group: recovery
    kind: kem
    custody:
      class: cold
      forced_by: Derived only from the cold recovery code.
    derivation:
      parent: recovery_code
      fn: HKDF
      purpose: autonomy/recovery-armor/v1
    descriptor:
      reaches: The root seed sealed into the armor's recovery slot.
      snapshot: The sealed root seed, and nothing else.
      live: "No."
      revoke: replace_recovery_slot re-seals the slot to a new code's recipient.
      bound: None — it opens the root.
    code:
      - tools/network/idkit/recovery.py
      - tools/network/idkit/root_factor_policy.py:replace_recovery_slot
    crib: ["§2", "§9"]

  factor_seed:
    group: identity-armor
    kind: seed
    custody:
      class: cold
      forced_by: >-
        Producing it requires the human gesture — typing the password or a
        passkey PRF assertion (crib Q0).
    derivation: null
    descriptor:
      reaches: >-
        The factor's derived recipient (its share of the root factor policy)
        and its derived dashboard access key. Only a factor set satisfying
        the policy expression reaches the root; unlock-only factors never do.
      snapshot: >-
        That factor's policy shares. Whether the root follows depends on the
        policy expression, not on this key alone.
      live: "No."
      revoke: Factor revocation re-signs the armor envelope without it.
      bound: The policy expression.
    code:
      - tools/network/idkit/root_factor_policy.py
    crib: ["§2"]
    proofs:
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: password_alone_no_root}
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: passkeys_both_no_root}
      - {framework: tamarin, theory: VaultFactorPolicy, lemma: unlock_only_no_root}

  factor_recipient:
    group: identity-armor
    kind: kem
    custody:
      class: cold
      forced_by: Re-derivable only from the cold factor seed.
    derivation:
      parent: factor_seed
      fn: derive_encapsulation_keypair
      purpose: autonomy/root-factor-recipient/v1
    descriptor:
      reaches: The policy shares sealed to it inside the armor envelope.
      snapshot: Those shares; the policy expression decides what they combine to.
      live: "No."
      revoke: Factor revocation; the envelope is re-signed without the share.
      bound: The policy expression.
    code:
      - tools/network/idkit/sealing.py:derive_encapsulation_keypair
      - tools/network/idkit/root_factor_policy.py
    crib: ["§2"]

  vault_factor_recipient:
    group: vault-classes
    kind: kem
    custody:
      class: cold
      forced_by: Re-derivable only from the cold factor seed.
    derivation:
      parent: factor_seed
      fn: derive_encapsulation_keypair
      purpose: autonomy/vault-policy-recipient/v1
    descriptor:
      reaches: The vault class-key wraps sealed to it.
      snapshot: Those wraps; each class generation it belongs to opens.
      live: "No."
      revoke: Vault class-factor revocation reseals the next generation without it.
      bound: The classes it is enrolled in.
    code:
      - tools/vault/recipients.py
    crib: ["§18"]

  per_credential_wrapping_key:
    group: identity-armor
    kind: kem
    custody:
      class: cold
      forced_by: >-
        The private half derives from the credential's PRF output on-device;
        using it requires a user-verified assertion at that machine.
    derivation:
      parent: factor_seed
      fn: PRF-derived X25519
    descriptor:
      reaches: >-
        Payloads sealed to the credential's device. The public key is
        valid only when carried in a root-signed enrollment statement,
        verified before any seal is addressed to it.
      snapshot: Nothing without the device's PRF assertion.
      live: "Yes — opening a seal needs the assertion at that machine."
      revoke: Passkey revocation (root-signed RevocationRecord).
      bound: The credential.
    code:
      - tools/network/idkit/enrollment.py:PasskeyEnrollmentStatement
    crib: ["§2"]
    proofs:
      - {framework: tamarin, theory: VaultOpenStore, lemma: no_key_to_forged_pk}

  browser_session_key:
    group: browser
    kind: signing
    custody:
      class: disk
      forced_by: >-
        Persisted in the browser's IndexedDB and usable with no further
        human interaction until its certificate expires; theft through the
        page is prevented by WebCrypto non-extractability, and the bound is
        the certificate validity window plus revocation.
    derivation: null
    descriptor:
      reaches: >-
        The scopes its persona-signed delegation certificate carries
        (SESSION_SCOPES in network-signon.mjs): delegate:agent,
        link:publish, link:revoke, tunnel:serve, turn:allocate, and
        viewer:identify — one certificate per organization persona, all
        over the single session key.
      snapshot: >-
        Nothing through the page: the key is created extractable:false and
        _installSession refuses any key claiming otherwise, so no script
        can export it; it appears in no replicated store.
      live: "Yes — its signatures must reach the dashboard or registry."
      revoke: >-
        The certificate validity window (default twenty-four hours,
        maximum thirty days), enforced at load and by an expiry watchdog
        that signs the browser out; a root-signed revocation record is the
        explicit path. Not a ceremony.
      bound: The certificate's validity window and scope list.
    signs:
      - registry request envelopes only (REQUEST_DOMAIN + canonical JSON of
        v, method, path, ts, signer, payload) — the single crypto.subtle.sign
        call site for this key in network-signon.mjs
    code:
      - tools/dashboard/static/js/network-signon.mjs:signRegistryRequest
      - tools/dashboard/static/js/network-signon.mjs:_installSession
      - tools/network/registry/signing.py
    crib: ["§2", "§9"]
    notes: >-
      Minted per browser during the sign-on ceremony, after the user proves
      root authority by satisfying the armor's factor policy; routine
      operations then sign with crypto.subtle.sign and never see a factor
      again during the certificate's validity. Distinct from the
      per-operation vault authorize ceremony, which costs one user-verified
      assertion per class open and involves no session key.
  persona_signing_key:
    group: org-authority
    kind: signing
    custody:
      class: cold
      forced_by: Deriving it requires the personal root seed.
    derivation:
      parent: personal_root_seed
      fn: derive_persona
      inputs: [genesis_id]
    descriptor:
      reaches: >-
        Authorship of the persona's ledger events and key-control records in
        one organization. The genesis_id input keeps personas unlinkable
        across organizations.
      snapshot: Authority to sign as the persona until rekeyed away.
      live: "Yes — records must reach honest nodes."
      revoke: member.rekey moves the persona to a new key.
      bound: The persona's membership.
    code:
      - tools/network/idkit/persona.py:derive_persona
    crib: ["§2"]

  persona_kem_private:
    group: domain-storage
    kind: kem
    custody:
      class: memory
      forced_by: >-
        Snapshot is total: this key plus a copy of the replicated store is
        the whole domain history, offline. Not disk-eligible at any price.
    derivation:
      parent: personal_root_seed
      fn: derive_kem_seed
      inputs: [counter]
    descriptor:
      reaches: >-
        Every capability grant addressed to this persona, hence any head
        secret, hence all domain content including full history through the
        bridges.
      snapshot: Total for the domain — key plus store copy is the whole history.
      live: "No."
      revoke: >-
        Publish a superseding PersonaKemCredential. Stops future grants
        only; undoes nothing already opened.
      bound: None — damage is complete at the instant of theft.
    code:
      - tools/network/storagekit/credentials.py:derive_kem_seed
    crib: ["§9", "§13", "§14"]
    seals_to:
      - recipient: per_machine_key
        record: KEM-distribution record (designed; bead auto-pw9bs.6)
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: persona_kem_snapshot_total}
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}
      - {framework: tamarin, theory: VaultRekeyMarkerChain, lemma: exclusion_through_chain}
      - {framework: tamarin, theory: VaultD006Window, lemma: post_rekey_excluded}

  generation_secret:
    group: domain-storage
    kind: symmetric
    custody:
      class: memory
      forced_by: Snapshot is total for its branch, offline.
    derivation: null
    descriptor:
      reaches: Every object under the generation and every ancestor via bridges.
      snapshot: Total for that branch, offline.
      live: "No."
      revoke: None — a generation secret is never retired.
      bound: None.
    code:
      - tools/network/storagekit/state.py:generate
    crib: ["§6", "§9"]
    seals_to:
      - recipient: persona_kem_private
        purpose: autonomy/capability-grant/v1
        record: CapabilityGrant
    proofs:
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}
      - {framework: tamarin, theory: VaultConcurrentRekey, lemma: concurrent_grant_secret}

  object_wrap_key:
    group: domain-storage
    kind: derived-secret
    custody:
      class: memory
      forced_by: Re-derivable from the generation secret during the warm period.
    derivation:
      parent: generation_secret
      fn: HKDF
      inputs: [genesis_id, domain_id, state_id, object_id, revision, content_hash]
      purpose: object-wrap
    descriptor:
      reaches: One object revision's wrapped content key.
      snapshot: That revision, given the ciphertext.
      live: "No."
      revoke: Follows the generation secret; never individually retired.
      bound: The one revision.
    code:
      - tools/network/storagekit/objects.py
    crib: ["§6"]

  object_cek:
    group: vault-classes
    kind: symmetric
    custody:
      class: memory
      forced_by: >-
        Unique per immutable revision and encrypts nothing else, so
        releasing it equals releasing that one plaintext — it is the unit
        allowed across the release boundary.
    derivation: null
    descriptor:
      reaches: One object revision's plaintext.
      snapshot: That one revision.
      live: "No."
      revoke: Never — the revision is immutable; withdrawal is a new key for new writes.
      bound: The one revision.
    code:
      - tools/vault/policy_class.py:_cek_public_seal_purpose
    crib: ["§4", "§18", "§23"]
    seals_to:
      - recipient: class_key
        purpose: autonomy/vault-policy-class/cek/v1
        record: sealed content key

  agent_delegate_signing_key:
    group: org-authority
    kind: signing
    custody:
      class: memory
      forced_by: >-
        Passes the crib's Q2: scope-attenuated, TTL-bounded, fold-enforced
        at acceptance, revocable, and required for unattended operation.
    derivation: null
    descriptor:
      reaches: >-
        Exactly two execution scopes, storage:state:advance and
        storage:capability:grant, and nothing else. It signs; it opens
        nothing. It authorizes only by resolving its delegation chain to a
        member persona: a chain terminating outside the member roster is
        void, and generic scope-holding is never consulted for these two
        scopes.
      snapshot: Nothing.
      live: "Yes — records must reach honest nodes, which verify them against the fold."
      revoke: RevocationRecord plus TTL. Not a ceremony.
      bound: The delegating persona's own membership; the fold rejects any overreach.
    code:
      - tools/network/storagekit/acceptance.py
    crib: ["§7", "§9", "§11"]
    proofs:
      - {framework: tamarin, theory: VaultDelegateChain, lemma: write_resolves_to_current_member}
      - {framework: tamarin, theory: VaultDelegateChain, lemma: delegate_scopes_only}
      - {framework: tamarin, theory: VaultDelegateChain, lemma: write_requires_live_delegate}

  per_machine_key:
    group: fleet
    kind: kem
    custody:
      class: memory
      forced_by: >-
        Derived from the personal root at unlock and never persisted — the
        machine stores only its public machine_id; the key exists for the
        warm period and a reboot always waits on a human unlock.
    derivation:
      parent: personal_root_seed
      fn: derive_machine_key
      inputs: [machine_id]
    descriptor:
      reaches: Distributions sealed to it after the theft — future persona KEM keys.
      snapshot: Zero. It decrypts no existing record.
      live: "Yes — the thief must still be in the fleet and reachable."
      revoke: Remove the machine from the fleet. Root-signed, not a ceremony.
      bound: The removal.
    code:
      - tools/network/idkit/persona.py:derive_machine_key
      - tools/network/machine_boot.py:operating_key
      - tools/network/fleet_roster.py:RosterEntry
    crib: ["§9", "§10"]
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: machine_key_yields_nothing_undistributed}
      - {framework: tamarin, theory: VaultFleetDist, lemma: kicked_machine_excluded}

  serving_delegate_key:
    group: org-authority
    kind: signing
    custody:
      class: disk
      forced_by: Snapshot is none — it reaches no plaintext and authorizes nothing.
    derivation: null
    descriptor:
      reaches: Authentication of one outbound serving tunnel (tunnel:serve only).
      snapshot: None.
      live: "Yes."
      revoke: Re-mint; thirty-day TTL, renewal below twenty days remaining.
      bound: The TTL.
    code:
      - tools/network/idkit/certs.py
    crib: ["§8", "§9"]

  root_anchor_seed:
    group: vault-classes
    kind: seed
    custody:
      class: cold
      forced_by: Sealed to a root-derived recipient; opening it requires root authority.
    derivation: null
    descriptor:
      reaches: >-
        Every vault policy class, through each class generation's mandatory
        anchor wrap — the indirection that lets root-factor churn touch only
        the armor.
      snapshot: Nothing while sealed; every class once the root is open.
      live: "No."
      revoke: >-
        Irrevocable by design: revoke_factor refuses to drop it and the
        store refuses to persist a class generation without it.
      bound: None — it is the root's guaranteed floor under every class.
    code:
      - tools/vault/root_anchor.py
      - tools/vault/store.py:put_root_class_once
    crib: ["§18"]
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: root_reaches_every_generation}

  class_key:
    group: vault-classes
    kind: symmetric
    custody:
      class: cold
      forced_by: >-
        Released only inside a factor ceremony and never across the release
        boundary — exporting it would release the whole class.
    derivation: null
    descriptor:
      reaches: Every content key sealed under that class generation.
      snapshot: The class's secrets for generations this key belongs to.
      live: "No."
      revoke: >-
        Factor revocation appends the next generation sealed to the
        survivors and the anchor; it applies at the next write and touches
        no existing sealed material.
      bound: The class's membership at each generation.
    code:
      - tools/vault/policy_class.py:Generation
      - tools/vault/store.py:put_class
    crib: ["§3", "§18"]
    seals_to:
      - recipient: vault_factor_recipient
        purpose: autonomy/vault-policy-class/v1
        record: PolicyClassRecord generation wrap
      - recipient: root_anchor_seed
        purpose: autonomy/vault-root-anchor-wrap/v1
        record: mandatory anchor wrap
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_excluded_forward}
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_keeps_old}

  sealed_index:
    group: sealed-stores
    kind: seed
    status: designed
    custody:
      class: cold
      forced_by: Exists only in sealed form; released by a factor ceremony.
    derivation: null
    descriptor:
      reaches: A sealed store's entire index — its address key and value key derive from it.
      snapshot: Nothing while sealed; the store's item map once released.
      live: "No."
      revoke: Re-mint the store under a new index.
      bound: The one store.
    code: []
    crib: ["§23"]
    proofs:
      - {framework: tamarin, theory: VaultDeniability, lemma: Observational_equivalence}

  k_index_k_meta:
    group: sealed-stores
    kind: derived-secret
    status: designed
    custody:
      class: cold
      forced_by: Subkeys of the sealed index; neither exists outside a release.
    derivation:
      parent: sealed_index
      fn: HKDF
    descriptor:
      reaches: >-
        K_index computes blind row addresses; K_meta seals row values. The
        blind index is the item-to-row mapping; nothing stores it.
      snapshot: Nothing — they are never at rest.
      live: "No."
      revoke: Follows the sealed index.
      bound: The one store.
    code: []
    crib: ["§23"]

  pepper:
    group: sealed-stores
    kind: symmetric
    status: designed
    custody:
      class: memory
      forced_by: >-
        An audited vault setting: released unattended once the vault is
        open; encrypted at rest so a cold dump cannot run the offline
        location oracle.
    derivation: null
    descriptor:
      reaches: The row addresses of every secret vault (location, not content).
      snapshot: >-
        Encrypted at rest, nothing. Held warm, the ability to test password
        guesses against vault locations offline.
      live: "No."
      revoke: Re-mint and re-address every secret vault.
      bound: Location secrecy only; contents keep their own seals.
    code: []
    crib: ["§24"]
    proofs:
      - {framework: tamarin, theory: VaultDeniability, lemma: Observational_equivalence}

# A mutation is any operation that mints, seals, revokes, or rewraps a key,
# or changes who future material is sealed to. Entries with
# status: designed describe flows that exist only in the design of record;
# their source anchors point at the Tamarin theory that serves as the spec.
mutations:

  fold.genesis:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_genesis}
    authority: [org_root_signing_key]
    effects:
      writes: [genesis record, org recovery_pub declaration]
    refusals: [recovery-equals-root]
    crib: ["§7", "§8"]

  fold.delegate:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_delegate}
    authority: [persona_signing_key, browser_session_key]
    preconditions:
      - The delegated scope set never exceeds the delegator's (no scope escalation).
      - A non-redelegable certificate cannot mint children.
    effects:
      mints: [agent_delegate_signing_key]
      writes: [delegation certificate]
    refusals: [scope-escalation, not-redelegable, delegate-unproven, delegate-nonce-reused]
    crib: ["§8", "§11"]
    proofs:
      - {framework: tamarin, theory: VaultDelegateChain, lemma: delegate_scopes_only}

  fold.revoke:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_revoke}
    authority: [persona_signing_key, org_root_signing_key]
    effects:
      revokes: [agent_delegate_signing_key, persona_signing_key]
      writes: [revocation record]
    refusals: [revoke-unauthorized, revoke-bad-target, revoke-target-not-in-ancestry]
    crib: ["§8"]
    proofs:
      - {framework: tamarin, theory: VaultDelegateChain, lemma: write_requires_live_delegate}

  fold.role_define:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_role_define}
    authority: ["holders of role:define"]
    effects:
      writes: [role definition]
    refusals: [role-define-unauthorized, role-define-overreach]
    crib: ["§8"]

  fold.role_grant:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_role_grant}
    authority: ["holders of role:grant:<role>"]
    effects:
      writes: [role grant]
    refusals: [role-grant-unauthorized, role-undefined, approval-missing, bad-approval]
    crib: ["§8"]

  fold.role_revoke:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_role_revoke}
    authority: ["holders of role:grant:<role>"]
    effects:
      writes: [role revocation]
    refusals: [role-revoke-unauthorized]
    crib: ["§8"]

  fold.invite:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_invite}
    authority: ["holders of invite:<role>"]
    effects:
      writes: [invite record]
    refusals: [invite-overreach, invite-sponsor-mismatch, invite-not-in-ancestry, invite-expired, invite-dead]
    crib: ["§8"]

  fold.member_claim:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_member_claim}
    authority: [invited persona key]
    preconditions:
      - The claim's recovery enrollment is validated here; recovery_pub equal to the org root is refused.
    effects:
      writes: [member claim, member recovery_pub enrollment]
    refusals: [claim-wrong-key, claim-bad-token, claim-bad-credential, invite-already-claimed, persona-exists]
    crib: ["§8", "§9"]

  fold.member_rekey:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_member_rekey}
    authority: [persona_signing_key, org_root_signing_key, member_recovery_key]
    preconditions:
      - The cited old key must be the persona's current key.
      - A revoked key cannot self-authorize its own rekey.
      - The new key proves control through the continuity signature.
      - Under recovery policy none, a recovery-authorized rekey is refused, never ignored.
    effects:
      mints: [persona_signing_key]
      revokes: [persona_signing_key]
      writes: [rekey record, implicit revoke of the departed key on the recovery door]
    refusals: [rekey-wrong-key, rekey-unauthorized, rekey-revoked-key, recovery-not-enrolled, recovery-sig-bad, bad-continuity, persona-exists, unknown-persona, bad-approval]
    crib: ["§8", "§9"]
    proofs:
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_beats_thief}
      - {framework: tamarin, theory: VaultRecoveryRace, lemma: recovery_key_secret}

  fold.key_rotate:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_key_rotate}
    authority: [org_root_signing_key, recovery_signing_key]
    preconditions:
      - Under recovery policy recovery-key, the declared recovery key co-signs the exact transition.
      - The new key proves control through the continuity signature.
    effects:
      mints: [org_root_signing_key]
      revokes: [org_root_signing_key]
      writes: [rotation record]
    refusals: [not-root, rotate-wrong-old, bad-continuity, recovery-not-enrolled, recovery-sig-bad, recovery-continuity-missing, bad-recovery-continuity, recovery-continuity-not-declared]
    crib: ["§8", "§9"]

  fold.key_epoch:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_key_epoch}
    authority: [org_root_signing_key]
    effects:
      writes: [key epoch marker]
    refusals: [key-epoch-unauthorized]
    crib: ["§8"]

  fold.checkpoint:
    source: {kind: fold, file: tools/network/ledger/fold.py, symbol: _h_checkpoint}
    authority: ["holders of checkpoint"]
    effects:
      writes: [checkpoint record]
    refusals: [checkpoint-unauthorized]
    crib: ["§8"]
    notes: >-
      Checkpoint is decided-removed from the design vocabulary; the handler
      remains in code, so it remains in this inventory.

  armor.enroll_factor:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py}
    authority: [personal_root_seed]
    effects:
      mints: [factor_recipient]
      seals: [personal_root_seed shares to factor_recipient]
      writes: [next armor generation, root-signed]
    crib: ["§2"]

  armor.revoke_factor:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py}
    authority: [personal_root_seed]
    effects:
      writes: [next armor generation without the revoked factor, root-signed]
    crib: ["§2"]

  armor.set_recovery:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py, symbol: set_recovery}
    authority: [personal_root_seed]
    preconditions:
      - Enroll-only; it refuses to overwrite or clear an existing recovery slot.
    effects:
      seals: [personal_root_seed to recovery_slot_recipient]
      writes: [armor recovery slot]
    crib: ["§9"]

  armor.replace_recovery_slot:
    source: {kind: module-op, file: tools/network/idkit/root_factor_policy.py, symbol: replace_recovery_slot}
    authority: [recovery_code, personal_root_seed]
    effects:
      seals: [personal_root_seed to the successor code's recovery_slot_recipient]
      writes: [replaced armor recovery slot, root re-signed]
    crib: ["§9"]
    notes: Built at the armor layer; exposed by no route or UI yet.

  root.rotation:
    source: {kind: module-op, file: tools/network/idkit/root_rotation.py, symbol: make_rotation}
    authority: [personal_root_seed, recovery_signing_key]
    preconditions:
      - Three signatures — old root, enrolled recovery key, and new root. The succession convinces its relying parties, not the local machine - the fleet accepts a successor only against root-signed RosterEntry material, and the auto.network registry rebinds only for a request signed by the recovery key it pinned at enrollment.
    effects:
      mints: [personal_root_seed]
      revokes: [personal_root_seed]
      writes: [succession record]
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRootRotation, lemma: thief_cannot_rotate}
      - {framework: tamarin, theory: VaultRootRotation, lemma: owner_rotates_away_from_stolen_root}
    notes: >-
      A local verification has no relying party (crib section 0: the owner
      rewriting their own store is a feature); the load-bearing checks are
      the registry rebind gate (tools/network/registry/app.py, which
      resolves the pinned recovery key server-side) and the fleet's
      root-signed RosterEntry acceptance (tools/network/fleet_roster.py).

  passkey.enroll:
    source: {kind: ceremony, file: tools/network/idkit/enrollment.py, symbol: mint}
    authority: [personal_root_seed]
    effects:
      writes: [root-signed enrollment statement binding the per_credential_wrapping_key public half]
    crib: ["§2", "§8"]
    proofs:
      - {framework: tamarin, theory: VaultOpenStore, lemma: no_key_to_forged_pk}

  passkey.revoke:
    source: {kind: ceremony, file: tools/network/idkit/revocation.py, symbol: RevocationRecord}
    authority: [personal_root_seed]
    effects:
      revokes: [per_credential_wrapping_key, browser_session_key]
      writes: [root-signed revocation record]
    crib: ["§2", "§8"]

  ceremony.serve_cert_mint:
    source: {kind: ceremony, file: tools/network/idkit/certs.py}
    authority: [org_root_signing_key]
    effects:
      mints: [serving_delegate_key]
      writes: [registry certificate and identity-neutral viewer certificate over the same child]
    crib: ["§8"]

  ceremony.registration:
    source: {kind: route, file: tools/network/registry/app.py}
    authority: [personal_root_seed]
    effects:
      writes: [registry binding, including the recovery policy declaration when pinned]
    crib: ["§8", "§9"]

  ceremony.vault_master_read:
    source: {kind: ceremony, file: tools/vault/unlock.py, symbol: open_generation_keys}
    authority: [factor_seed]
    effects:
      writes: [audited release log entry]
    crib: ["§8", "§18"]

  ceremony.recovery_policy_change:
    status: designed
    source: {kind: ceremony, file: tools/network/registry/app.py}
    authority: [personal_root_seed, recovery_signing_key]
    effects:
      writes: [recovery policy transition]
    crib: ["§8", "§9"]

  vault.create_class:
    source: {kind: module-op, file: tools/vault/policy_class.py, symbol: create_class}
    authority: [personal_root_seed]
    preconditions:
      - A member class without the root-anchor wrap is refused at creation and again at the store (put_class, put_root_class_once).
    effects:
      mints: [class_key]
      seals: [class_key to factor recipients and to root_anchor_seed]
      writes: [PolicyClassRecord generation]
    crib: ["§18"]
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: root_reaches_every_generation}

  vault.revoke_class_factor:
    source: {kind: module-op, file: tools/vault/policy_class.py, symbol: revoke_factor}
    authority: [personal_root_seed]
    preconditions:
      - The root-anchor wrap cannot be dropped.
    effects:
      mints: [class_key]
      seals: [class_key to surviving factors and to root_anchor_seed]
      writes: [next PolicyClassRecord generation; applies at next write, existing sealed material untouched]
    crib: ["§3", "§18"]
    proofs:
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_excluded_forward}
      - {framework: tamarin, theory: VaultPolicyClass, lemma: revoked_factor_keeps_old}

  storage.advance_state:
    source: {kind: module-op, file: tools/network/storagekit/lifecycle.py, symbol: advance_state}
    authority: [agent_delegate_signing_key, persona_signing_key]
    effects:
      mints: [generation_secret]
      writes: [StorageStateDescriptor, ParentBridge]
    refusals: [StateAdvanceRequired on a stale write]
    crib: ["§1d", "§6", "§7"]

  storage.issue_grant:
    source: {kind: module-op, file: tools/network/storagekit/capability.py, symbol: issue}
    authority: [agent_delegate_signing_key, persona_signing_key]
    effects:
      seals: [generation_secret to persona_kem_private]
      writes: [CapabilityGrant]
    crib: ["§6", "§7"]
    proofs:
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}

  storage.issue_receipt:
    source: {kind: module-op, file: tools/network/storagekit/capability.py, symbol: issue_receipt}
    authority: [persona_kem_private]
    effects:
      writes: [CapabilityReceipt — proof of knowledge, not an assertion]
    crib: ["§6", "§16"]

  storage.mint_credential:
    source: {kind: module-op, file: tools/network/storagekit/credentials.py, symbol: build}
    authority: [persona_signing_key]
    effects:
      mints: [persona_kem_private]
      writes: [PersonaKemCredential citing the current authority frontier]
    crib: ["§1d", "§6", "§13"]
    proofs:
      - {framework: tamarin, theory: VaultConcurrentRekey, lemma: concurrent_grant_secret}

  storage.provision_missing:
    source: {kind: module-op, file: tools/network/storagekit/distribution.py, symbol: provision_missing}
    authority: [persona_kem_private]
    effects:
      seals: [generation_secret to an unprovisioned member's current PersonaKemCredential]
      writes: [repair CapabilityGrant]
    crib: ["§15"]

  fleet.enroll:
    source: {kind: module-op, file: tools/network/fleet_roster.py, symbol: enroll}
    authority: [personal_root_seed]
    effects:
      writes: [root-signed RosterEntry addressing one machine]
    crib: ["§1b", "§10"]
    notes: Renewal is a new entry with a higher sequence number superseding the old.

  fleet.kick:
    source: {kind: module-op, file: tools/network/fleet_roster.py, symbol: kick}
    authority: [personal_root_seed]
    effects:
      revokes: [per_machine_key]
      writes: [root-signed kick tombstone; stops future distribution to that machine]
    crib: ["§1b", "§1d", "§10"]
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: kicked_machine_excluded}
      - {framework: tamarin, theory: VaultD006Window, lemma: halt_window_confidential}

  fleet.distribute_kem:
    status: designed
    source: {kind: module-op, file: tools/network/storagekit/tamarin/VaultFleetDist.spthy}
    authority: [personal_root_seed]
    effects:
      seals: [persona_kem_private to per_machine_key, one seal per fleet machine not removed]
    crib: ["§1d", "§1e"]
    proofs:
      - {framework: tamarin, theory: VaultFleetDist, lemma: machine_key_yields_nothing_undistributed}
    notes: >-
      The KEM-distribution record is the unbuilt half of the fleet layer
      (bead auto-pw9bs.6); the cited theory is its formal spec.

  rekey.frontier_marker:
    status: designed
    source: {kind: module-op, file: tools/network/storagekit/tamarin/VaultRekeyMarker.spthy}
    authority: [persona_signing_key]
    effects:
      writes: [fold-inert frontier marker citing all locally current authority heads]
    crib: ["§1d"]
    proofs:
      - {framework: tamarin, theory: VaultRekeyMarker, lemma: exclusion_forward}
      - {framework: tamarin, theory: VaultRekeyMarkerChain, lemma: exclusion_through_chain}
    notes: >-
      Without the marker the re-key achieves nothing (the F-001 defect);
      the calibration theory VaultRekeyF001 demonstrates exactly that.

  recovery.succession:
    status: designed
    source: {kind: module-op, file: tools/network/storagekit/tamarin/VaultRecoverySuccession.spthy}
    authority: [personal_root_seed, recovery_signing_key]
    preconditions:
      - Completion requires the elapsed witness window over a chain containing the declaration and no cancellation and no veto.
    effects:
      mints: [recovery_signing_key]
      revokes: [recovery_signing_key]
      writes: [witnessed declaration, then completion attestation]
    crib: ["§9"]
    proofs:
      - {framework: tamarin, theory: VaultRecoverySuccession, lemma: window_cannot_be_fast_forwarded}
      - {framework: tamarin, theory: VaultRecoverySuccession, lemma: cancellation_blocks_completion}
      - {framework: tamarin, theory: VaultRecoverySuccession, lemma: veto_blocks_completion}
      - {framework: tamarin, theory: VaultWitnessAccountability, lemma: poll_yields_alert_or_fraud_proof}

purposes:
  autonomy/capability-grant/v1:
    description: Seals a generation secret to a PersonaKemCredential in a CapabilityGrant.
    used_by: [tools/network/storagekit/capability.py]
  autonomy/receipt-pok/v1:
    description: Derives a CapabilityReceipt's proof-of-knowledge value from the state secret.
    used_by: [tools/network/storagekit/capability.py]
  autonomy/object-wrap/v1:
    description: Derives an object revision's wrap key from its generation secret.
    used_by: [tools/network/storagekit/object_header.py]
  autonomy/storage-parent-edge/v1:
    description: Keys a ParentBridge's child-to-parent generation recovery.
    used_by: [tools/network/storagekit/bridge.py]
  autonomy/storage-state-secret/v1:
    description: Domain label for generation-secret material in a StorageStateDescriptor.
    used_by: [tools/network/storagekit/state.py]
  autonomy/storage-domain/v1:
    description: Domain label for storage-domain identifiers in ledger projections.
    used_by: [tools/network/ledger/projections.py]
  autonomy/root-policy-wrap/v1:
    description: Wraps root-factor-policy node secrets inside the armor envelope.
    used_by: [tools/network/idkit/root_factor_policy.py]
  autonomy/root-factor-recipient/v1:
    description: Derives a factor's armor recipient from its factor seed.
    used_by: [tools/network/idkit/root_factor_policy.py]
  autonomy/vault-factor/v1:
    description: Derives a factor's vault recipient inside the armor (distinct from the root-factor purpose).
    used_by: [tools/network/idkit/armor.py]
  autonomy/recovery-armor/v1:
    description: Derives the recovery code's armor-slot recipient.
    used_by: [tools/network/idkit/root_factor_policy.py]
  autonomy.recovery.signing.v1:
    description: Derives the recovery signing key from the recovery code.
    used_by: [tools/network/idkit/recovery.py]
  autonomy.recovery.member-sign.v1:
    description: Derives a per-organization member recovery key from the recovery code and genesis_id.
    used_by: [tools/network/idkit/recovery.py]
  autonomy.recovery.kek.v1:
    description: Derives the recovery share of the master key-encryption key from the recovery code.
    used_by: [tools/network/idkit/recovery.py]
  autonomy.identity.persona.v1:
    description: Derives a persona keypair from the personal root seed and genesis_id.
    used_by: [tools/network/idkit/persona.py]
  autonomy.identity.machine.v1:
    description: Derives the per-machine operating key from the personal root seed and machine_id.
    used_by: [tools/network/idkit/persona.py]
  autonomy.network.ledger.sync-key.v1:
    description: Derives the ledger bundle sync key.
    used_by: [tools/network/ledger/bundles.py]
  autonomy.network.channel.keys.v1:
    description: Derives relay channel keys.
    used_by: [tools/network/relaykit/channel.py]
  autonomy.network.channel.stream.v1:
    description: Derives relay channel stream nonces.
    used_by: [tools/network/relaykit/channel.py]
  autonomy.attachment.cursor.v1:
    description: Derives attachment download cursor authentication.
    used_by: [tools/network/relaykit/attachment_download.py]
  autonomy/vault-policy-class/v1:
    description: Domain label for a vault policy class record.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-class/sealing-key/v1:
    description: Derives a class generation's public sealing keypair from its class key.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-class/cek/v1:
    description: Wraps an object content key under a class generation.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-class/cek-hpke/v1:
    description: Seals an object content key to a class generation's public sealing key.
    used_by: [tools/vault/policy_class.py]
  autonomy/vault-policy-recipient/v1:
    description: Derives a factor's vault policy-class recipient from its factor seed.
    used_by: [tools/vault/recipients.py]
  autonomy/vault-root-anchor-wrap/v1:
    description: Wraps a class key to the root anchor's derived recipient.
    used_by: [tools/vault/root_anchor.py]
  autonomy/vault/object-id/v1:
    description: Derives a vault storage object's identifier.
    used_by: [tools/vault/storage_object.py]
  autonomy/vault/revision-id/v1:
    description: Derives a vault storage object's revision identifier.
    used_by: [tools/vault/storage_object.py]
  autonomy/personal-vault-content/v1:
    description: Encrypts personal vault object content.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-owner-at-rest/v1:
    description: Seals the personal owner key at rest.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-vault/no-storage-generation/v1:
    description: Domain label for personal vault objects outside any storage generation.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-vault/object-id/v1:
    description: Derives a personal vault object's identifier.
    used_by: [tools/vault/personal_object.py]
  autonomy/personal-vault/revision-id/v1:
    description: Derives a personal vault object's revision identifier.
    used_by: [tools/vault/personal_object.py]
