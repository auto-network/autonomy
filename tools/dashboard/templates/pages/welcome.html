<!-- Onboarding empty state (design graph://9a4219b3, fresh / mid / ready),
     rendered inside the dashboard shell as a page fragment (SPA route
     /welcome, served by /pages/welcome). The quest rail is hand-styled and
     scoped under .welcome; Tailwind dresses the composed overlays. The
     identity ceremony (AutonomyOnboarding), the create-org screen
     (AutonomyCreateOrg) and the stepped /network/join accept flow are the ONE
     delivered path for each action; this rail only sequences them. No
     ceremony, crypto, or org/session creation lives here (bead auto-inpkd).
     Server first-render facts travel as data attributes; welcome.js reads
     them in init(). -->
<style>
  .welcome { max-width:560px; margin:0 auto; padding:1.5rem 0 3rem;
             --panel:#1f2937; --line:#374151; --ink:#f3f4f6; --dim:#9ca3af;
             --accent:#4f46e5; --accent-hover:#6366f1; --ok:#34d399; }
  .welcome h1 { font-size:1.5rem; font-weight:600; margin:0 0 .35rem; }
  .welcome .sub { color:var(--dim); margin-bottom:1.8rem; }
  .welcome .step { display:flex; align-items:center; gap:1rem; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.2rem 1.4rem; margin-bottom:.8rem; }
  .welcome .step.current { border-color:var(--accent-hover); }
  .welcome .step.locked { opacity:.45; }
  .welcome .n { flex:0 0 auto; width:2rem; height:2rem; border-radius:50%; background:#374151; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; }
  .welcome .step.done .n { background:rgba(52,211,153,.15); color:var(--ok); }
  .welcome .step h2 { margin:0; font-size:1.05rem; } .welcome .step p { margin:.15rem 0 0; color:var(--dim); font-size:.88rem; }
  .welcome .step .body { flex:1; min-width:0; }
  .welcome button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.6rem 1.3rem; font-size:.95rem; font-weight:600; cursor:pointer; }
  .welcome button.secondary { background:#374151; }
  .welcome .fleet-success { min-height:calc(100svh - 7.5rem); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .welcome .fleet-success-mark { width:5rem; height:5rem; border-radius:50%; display:grid; place-items:center; margin-bottom:1.35rem; color:#07150f; background:var(--ok); box-shadow:0 0 0 .65rem rgba(52,211,153,.10); font-size:2.8rem; font-weight:800; }
  .welcome .fleet-success h1 { margin:0 0 1.6rem; font-size:clamp(1.9rem,7vw,2.6rem); }
  .welcome .fleet-success button { min-width:12rem; min-height:3rem; }
  .welcome .fleet-sync-row { height:3rem; display:flex; align-items:center; gap:.65rem; color:var(--dim); font-size:.95rem; font-weight:650; }
  .welcome .fleet-sync-row.complete { color:#6ee7b7; }
  .welcome .fleet-sync-indicator { width:.72rem; height:.72rem; border:2px solid #4b5563; border-top-color:#a5b4fc; border-radius:50%; animation:fleet-spin .85s linear infinite; }
  .welcome .fleet-sync-row.complete .fleet-sync-indicator { border:0; border-radius:0; width:auto; height:auto; animation:none; color:var(--ok); }
  @keyframes fleet-spin { to { transform:rotate(360deg); } }
  .welcome .actions { display:flex; flex-direction:column; gap:.5rem; }
  .welcome .invite-org { display:flex; align-items:center; gap:.6rem; margin:.15rem 0 .1rem; }
  .welcome .invite-org .mark { width:1.6rem; height:1.6rem; border-radius:6px; background:#374151; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; }
  .welcome .reach-options { display:flex; flex-direction:column; gap:.45rem; margin:.6rem 0 .4rem; }
  .welcome .reach-option { display:flex; gap:.6rem; align-items:flex-start; padding:.6rem .75rem; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .welcome .reach-option.selected { border-color:var(--accent-hover); }
  .welcome .reach-option input { margin-top:.2rem; }
  .welcome .reach-option b { display:block; font-size:.95rem; }
  .welcome .reach-option span { color:var(--dim); font-size:.85rem; }
  .welcome .reach-field { margin:.5rem 0; }
  .welcome .reach-field label { display:block; color:var(--dim); font-size:.82rem; margin-bottom:.25rem; }
  .welcome .reach-field input { width:100%; box-sizing:border-box; background:#111827; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:.5rem .65rem; font-size:.95rem; }
  .welcome .reach-check { font-size:.82rem; margin-top:.3rem; min-height:1.1em; }
  .welcome .reach-check.ok { color:var(--ok); } .welcome .reach-check.bad { color:#fca5a5; }
  .welcome .reach-progress { list-style:none; padding:0; margin:.6rem 0 0; font-size:.88rem; }
  .welcome .reach-progress li { display:flex; gap:.5rem; align-items:center; padding:.15rem 0; color:var(--dim); }
  .welcome .reach-progress li.ok { color:var(--ok); } .welcome .reach-progress li.bad { color:#fca5a5; }
  .welcome .reach-error { color:#fca5a5; font-size:.88rem; margin-top:.4rem; }
  .welcome button:hover { background:var(--accent-hover); }
  .welcome button.secondary:hover { background:#4b5563; }
</style>
<div class="welcome" x-data="welcomeApp()" x-init="init()" x-cloak data-testid="welcome"
     data-fleet-enrollment='{{ fleet_enrollment|default(none)|tojson }}'
     data-fleet-sync='{{ fleet_sync|default(false)|tojson }}'
     data-local-store-slugs='{{ local_store_slugs|tojson }}'>

  <template x-if="!ready">
    <p class="sub" style="margin-top:4rem">One moment&hellip;</p>
  </template>

  <!-- Fleet-linked install · the request exists, authority does not. -->
  <template x-if="ready && fleetEnrollment">
    <div data-testid="welcome-fleet-pending">
      <div x-show="fleetEnrollment.status === 'approved'" class="fleet-success" data-testid="welcome-fleet-approved">
        <div class="fleet-success-mark" aria-hidden="true">&#10003;</div>
        <h1>Machine approved</h1>
        <button @click="location.assign('/unlock?fleet=1&amp;next=%2Fwelcome%3Ffleet_sync%3D1')">Unlock to continue</button>
      </div>
      <div x-show="fleetEnrollment.status !== 'approved'">
      <div style="display:flex;align-items:center;gap:.65rem;margin-bottom:.45rem">
        <span class="n" style="background:rgba(99,102,241,.16);color:#a5b4fc">&#8644;</span>
        <span style="font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#a5b4fc;font-weight:700">Fleet enrollment</span>
      </div>
      <h1 x-text="fleetEnrollment.status === 'declined' ? 'Request declined' : fleetEnrollment.status === 'expired' ? 'Invitation expired' : 'Confirm this machine'"></h1>
      <p class="sub" x-text="fleetEnrollment.status === 'declined' ? 'The other Dashboard declined this enrollment request.' : fleetEnrollment.status === 'expired' ? 'Ask for a new Fleet invitation on your other Dashboard.' : 'Compare this code with the approval on your other Dashboard.'"></p>
      <div class="step current" style="display:block;padding:1.45rem">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem">
          <h2 style="margin:0">Comparison code</h2>
          <span style="display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.25rem .65rem;font-size:.72rem;font-weight:700;white-space:nowrap"
                :style="(fleetEnrollment.status === 'declined' || fleetEnrollment.status === 'expired') ? 'color:#fca5a5;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.25)' : 'color:#fbbf24;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.25)'">
            <span style="width:.45rem;height:.45rem;border-radius:50%"
                  :style="(fleetEnrollment.status === 'declined' || fleetEnrollment.status === 'expired') ? 'background:#f87171' : 'background:#fbbf24;box-shadow:0 0 0 .22rem rgba(251,191,36,.12)'"></span>
            <span x-text="fleetEnrollment.status === 'declined' ? 'Declined' : fleetEnrollment.status === 'expired' ? 'Expired' : 'Waiting for approval'"></span>
          </span>
        </div>
        <div data-testid="fleet-comparison-code" x-text="fleetEnrollment.code"
             style="font:700 clamp(1.18rem,4.6vw,1.65rem)/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.075em;color:#f3f4f6;background:#0f1117;border:1px solid #343a4b;border-radius:10px;padding:1rem;text-align:center;overflow-wrap:anywhere"></div>
        <p style="margin:1rem 0 0;color:var(--dim);font-size:.86rem">The codes must match exactly. Approving the request authorizes this machine; this temporary code is discarded afterward.</p>
      </div>
      <div class="step" style="align-items:flex-start">
        <div class="n" style="color:#9ca3af">1</div>
        <div class="body"><h2>Request sent</h2><p>This machine has no Fleet identity or access yet.</p></div>
      </div>
      <div class="step locked" style="opacity:.72">
        <div class="n">2</div>
        <div class="body"><h2>Continue after approval</h2><p>You can leave this screen open. Setup will continue here when the other Dashboard approves the request.</p></div>
      </div>
      <p x-show="fleetEnrollment.error" style="color:#fca5a5;font-size:.78rem" x-text="fleetEnrollment.error"></p>
      <p style="text-align:center;color:#6b7280;font-size:.72rem;margin-top:1.1rem">Request <span x-text="fleetEnrollment.request_id_prefix"></span>&hellip;</p>
      </div>
    </div>
  </template>

  <template x-if="ready && !fleetEnrollment && fleetSync">
    <div class="fleet-success" data-testid="welcome-fleet-sync">
      <div class="fleet-success-mark" aria-hidden="true">&#10003;</div>
      <h1>Machine approved</h1>
      <div class="fleet-sync-row" :class="fleetSyncStatus === 'complete' ? 'complete' : ''">
        <span class="fleet-sync-indicator" aria-hidden="true" x-text="fleetSyncStatus === 'complete' ? '✓' : ''"></span>
        <span x-text="fleetSyncStatus === 'complete' ? 'Synchronization complete' : 'Synchronizing with fleet'"></span>
      </div>
    </div>
  </template>

  <!-- ── FRESH · no identity (design variant 0) ─────────────────── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 1">
    <div>
      <h1>Welcome</h1>
      <p class="sub">Four steps and this machine is yours.</p>
      <div class="step current"><div class="n">1</div><div class="body">
        <h2>Create your identity</h2>
        <p>Your name and your keys &mdash; made here, kept here.</p></div>
        <button data-testid="welcome-begin" @click="beginIdentity()">Begin</button></div>
      <div class="step locked"><div class="n">2</div><div class="body">
        <h2>Reach this dashboard from anywhere</h2>
        <p>A real address for your phone and other machines, behind your passkey.</p></div></div>
      <div class="step locked"><div class="n">3</div><div class="body">
        <h2>Create or join an organization</h2>
        <p>Your work lives in organizations &mdash; start one, or accept an invitation.</p></div></div>
      <div class="step locked"><div class="n">4</div><div class="body">
        <h2>Open your first workspace</h2>
        <p>Where you and your assistant build together.</p></div></div>
    </div>
  </template>

  <!-- ── REACH · identity done, remote access current ────────────── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 2">
    <div data-testid="welcome-step-reach">
      <h1 x-text="userName ? ('Welcome, ' + userName) : 'Welcome'"></h1>
      <p class="sub">Three to go.</p>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2>Create your identity</h2>
        <p x-text="userName ? ('You’re ' + userName + ' on this machine.') : 'Your identity is set on this machine.'"></p></div></div>
      <div class="step current" style="align-items:flex-start"><div class="n">2</div><div class="body">
        <h2>Reach this dashboard from anywhere</h2>
        <p>Choose how you will open this dashboard from your phone and your other machines. Every link the dashboard gives you will use this address.</p>
        <div class="reach-options">
          <label class="reach-option" :class="reachChoice === 'autonomy' ? 'selected' : ''">
            <input type="radio" name="reach" value="autonomy" x-model="reachChoice" data-testid="welcome-reach-autonomy">
            <div><b>Autonomy Network</b><span>A real https address on the Autonomy relay, protected by a passkey before anything reaches this dashboard. No account, no installs on your other devices.</span></div>
          </label>
          <label class="reach-option" :class="reachChoice === 'tailscale' ? 'selected' : ''">
            <input type="radio" name="reach" value="tailscale" x-model="reachChoice" data-testid="welcome-reach-tailscale">
            <div><b>Tailscale</b><span>Use your own Tailnet. You install Tailscale on each device and open this dashboard by its Tailnet name.</span></div>
          </label>
          <label class="reach-option" :class="reachChoice === 'local' ? 'selected' : ''">
            <input type="radio" name="reach" value="local" x-model="reachChoice" data-testid="welcome-reach-local">
            <div><b>Local only</b><span>This machine only, at the address you are using now. You can publish it later from Settings.</span></div>
          </label>
        </div>
        <template x-if="reachChoice === 'autonomy' && !reachLabelBound">
          <div class="reach-field">
            <label for="welcome-reach-label">Your name in the address (optional)</label>
            <input id="welcome-reach-label" data-testid="welcome-reach-label" x-model="reachLabel" @input="checkReachLabel()" placeholder="leave empty for a private, random name" autocomplete="off" spellcheck="false">
            <div class="reach-check" :class="reachLabelCheck ? (reachLabelCheck.ok ? 'ok' : 'bad') : ''" data-testid="welcome-reach-label-check" x-text="reachLabelText()"></div>
            <p>The name becomes part of the address and is permanent: it cannot be changed later.</p>
          </div>
        </template>
        <template x-if="reachChoice === 'autonomy' && reachLabelBound">
          <p data-testid="welcome-reach-label-bound">Your address name is already <b x-text="reachLabelBound"></b>.</p>
        </template>
        <template x-if="reachChoice === 'tailscale'">
          <div class="reach-field">
            <label for="welcome-reach-origin">This dashboard's Tailnet address</label>
            <input id="welcome-reach-origin" data-testid="welcome-reach-origin" x-model="reachOrigin" placeholder="https://this-machine.tailNNNN.ts.net:8080" autocomplete="off" spellcheck="false">
            <p x-show="reach && reach.tailnet_origin">Filled in from this node's certificate.</p>
            <p x-show="!(reach && reach.tailnet_origin)">This node's certificate names no Tailnet address, so the name you type cannot be confirmed here; it comes from <code>tailscale status</code> on this machine. Renew its certificate monthly with <code>tools/dashboard/renew-tls-cert.sh</code>.</p>
          </div>
        </template>
        <template x-if="reachBusy && reachChoice === 'autonomy'">
          <ul class="reach-progress" data-testid="welcome-reach-progress">
            <template x-for="row in reachProgress()" :key="row.name">
              <li :class="row.tone"><span x-text="row.mark"></span><span x-text="row.label"></span></li>
            </template>
          </ul>
        </template>
        <p class="reach-error" x-show="reachError" x-text="reachError" data-testid="welcome-reach-error"></p>
        <div class="actions" style="margin-top:.7rem">
          <button data-testid="welcome-reach-submit" :disabled="reachBusy || !reachCanSubmit()" @click="submitReach()" x-text="reachSubmitText()"></button>
        </div></div></div>
      <div class="step locked"><div class="n">3</div><div class="body">
        <h2>Create or join an organization</h2>
        <p>Your work lives in organizations &mdash; start one, or accept an invitation.</p></div></div>
      <div class="step locked"><div class="n">4</div><div class="body">
        <h2>Open your first workspace</h2>
        <p>Where you and your assistant build together.</p></div></div>
    </div>
  </template>

  <!-- ── MID · identity done, organization current (variant 1) ──── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 3">
    <div>
      <h1 x-text="userName ? ('Welcome, ' + userName) : 'Welcome'"></h1>
      <p class="sub">Two to go.</p>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2>Create your identity</h2>
        <p x-text="userName ? ('You’re ' + userName + ' on this machine.') : 'Your identity is set on this machine.'"></p></div></div>
      <div class="step done" data-testid="welcome-reach-done"><div class="n">&check;</div><div class="body">
        <h2 x-text="reachTitle()"></h2>
        <p x-text="reachSummary()" data-testid="welcome-reach-summary"></p></div>
        <button class="secondary" x-show="reachPollingStopped && !reachLive()" data-testid="welcome-reach-check" @click="checkReachAgain()">Check again</button></div>
      <div class="step current"><div class="n">3</div><div class="body">
        <h2>Create or join an organization</h2>
        <template x-if="invited">
          <div class="invite-org" data-testid="welcome-invite-org">
            <span class="mark" x-text="inviteInitial"></span>
            <p x-text="inviteName ? ('You’re invited to ' + inviteName + '.') : 'You were invited &mdash; accept to join.'"></p>
          </div>
        </template>
        <p x-show="!invited">Start one, or paste an invitation link if you were invited.</p></div>
        <!-- Invited: Join is pre-selected (primary). Otherwise Create leads. -->
        <div class="actions">
          <template x-if="invited">
            <div class="actions">
              <button data-testid="welcome-join" @click="joinOrg()">Join</button>
              <button class="secondary" data-testid="welcome-create" @click="createOrg()">Create</button>
            </div>
          </template>
          <template x-if="!invited">
            <div class="actions">
              <button data-testid="welcome-create" @click="createOrg()">Create</button>
              <button class="secondary" data-testid="welcome-join" @click="joinOrg()">Join</button>
            </div>
          </template>
        </div></div>
      <div class="step locked"><div class="n">4</div><div class="body">
        <h2>Open your first workspace</h2>
        <p>Where you and your assistant build together.</p></div></div>
    </div>
  </template>

  <!-- ── READY · identity + reach + organization done (design variant 2) ── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 4">
    <div>
      <h1 x-text="userName ? ('Welcome, ' + userName) : 'Welcome'"></h1>
      <p class="sub">One to go.</p>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2 x-text="userName || 'Your identity'"></h2><p>Your identity on this machine.</p></div></div>
      <div class="step done" data-testid="welcome-reach-done"><div class="n">&check;</div><div class="body">
        <h2 x-text="reachTitle()"></h2><p x-text="reachSummary()" data-testid="welcome-reach-summary"></p></div></div>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2 x-text="orgName || 'Your organization'"></h2><p>Your organization.</p></div></div>
      <div class="step current" data-testid="welcome-step-workspace"><div class="n">4</div><div class="body">
        <h2>Open your first workspace</h2>
        <p>Your assistant starts in Getting Started.</p></div></div>
      <button style="margin-top:.6rem" data-testid="welcome-open-workspace" :disabled="startBusy" @click="goToWorkspace()" x-text="startBusy ? 'Starting your first session…' : 'Go to your workspace'"></button>
      <p class="sub" x-show="startError" x-text="startError" data-testid="welcome-start-error" style="color:#fca5a5"></p>
      <ul class="sub" x-show="startDetails.length" data-testid="welcome-start-details" style="margin:.3rem 0 0 1.1rem;font-size:.85em;opacity:.85">
        <template x-for="line in startDetails" :key="line"><li x-text="line"></li></template>
      </ul>
    </div>
  </template>

</div>
