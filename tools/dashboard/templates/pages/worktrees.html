<div data-testid="worktrees-fragment-root">
<style>
  @keyframes worktreePoof {
    0% {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }
    65% {
      opacity: 0.72;
      transform: scale(0.985) translateY(-2px);
      filter: blur(0.4px);
    }
    100% {
      opacity: 0;
      transform: scale(0.94) translateY(-12px);
      filter: blur(10px);
    }
  }

  .poofing-card {
    animation: worktreePoof 420ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    transform-origin: 50% 24%;
  }

  @keyframes mergeConfettiBurst {
    0% {
      opacity: 0;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(0.65);
    }
    12% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)) scale(1.05);
    }
  }

  @keyframes mergeConfettiGlow {
    0% {
      opacity: 0;
      transform: translate(-50%, 0) scale(0.5);
    }
    18% {
      opacity: 0.9;
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -8px) scale(1.8);
    }
  }

  .merge-confetti-piece {
    animation: mergeConfettiBurst 820ms cubic-bezier(0.18, 0.82, 0.24, 1) forwards;
  }

  .merge-confetti-glow {
    animation: mergeConfettiGlow 760ms ease-out forwards;
  }

  .worktree-review-overlay {
    overflow-x: hidden;
    overscroll-behavior-x: none;
  }

  .worktree-review-shell {
    max-width: 100%;
  }

  .worktree-diff-scroller {
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }

  .worktree-diff-code.hljs {
    display: block;
    min-width: 100%;
    background: transparent;
    color: inherit;
  }

  @supports (padding-top: env(safe-area-inset-top)) {
    .worktree-review-overlay {
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }
  }
</style>

<div x-data="worktreesPage()"
     class="pb-safe text-gray-100"
     data-testid="worktrees-page"
     @click.window="hideCheckTooltip()"
     @keydown.escape.window="hideCheckTooltip()">
  <section class="px-4 py-4 md:px-6 md:py-6">
    <div class="mx-auto max-w-7xl">
      <div x-show="!hasOverlayOpen()">
      <div class="mb-5 flex flex-wrap items-start gap-3 border-b border-white/10 pb-5">
        <div class="min-w-0 flex-1 pr-1 md:pr-6">
          <h2 class="text-3xl font-semibold tracking-tight text-white md:text-5xl">Worktrees</h2>
        </div>
        <div class="ml-auto shrink-0 rounded-2xl border border-white/10 bg-slate-950/70 p-1.5 shadow-2xl shadow-black/20">
          <div class="flex items-center gap-2">
            <div class="text-right text-[10px] leading-4 text-slate-500">
              <div class="uppercase tracking-[0.16em]">Updated</div>
              <div class="font-mono text-slate-300" x-text="lastUpdated || 'pending'">pending</div>
            </div>
            <a href="/worktrees"
               role="button"
               data-hard-reload
               @click.prevent="refresh(true)"
               :aria-disabled="refreshing ? 'true' : 'false'"
               class="inline-flex h-9 items-center rounded-xl border border-gray-700 bg-gray-800 px-3 text-xs font-semibold text-gray-200 transition hover:bg-gray-700"
               :class="refreshing ? 'cursor-wait opacity-50 pointer-events-none' : ''"
               data-testid="worktrees-refresh-button">
              <span x-text="refreshing ? 'Refreshing...' : 'Refresh'">Refresh</span>
            </a>
          </div>
        </div>
      </div>

      <div class="mb-5 grid grid-cols-3 gap-2 md:gap-4" data-testid="worktrees-summary">
        <div class="rounded-2xl border border-white/10 bg-slate-950/70 p-3 md:p-5">
          <div class="min-h-[2.25rem] text-[9px] font-semibold leading-4 tracking-[0.08em] text-slate-500 sm:min-h-0 sm:text-[10px] sm:tracking-[0.18em]">
            <div>Commits</div>
            <div class="whitespace-nowrap">(All Repos)</div>
          </div>
          <div class="mt-1 text-3xl font-semibold text-white" x-text="commitItems.length">--</div>
        </div>
        <div class="rounded-2xl border border-indigo-500/20 bg-indigo-500/[0.08] p-3 md:p-5">
          <div class="min-h-[2.25rem] text-[9px] font-semibold leading-4 tracking-[0.08em] text-slate-500 sm:min-h-0 sm:text-[10px] sm:tracking-[0.18em]">
            <div>Commits</div>
            <div class="whitespace-nowrap">(Autonomy)</div>
          </div>
          <div class="mt-1 text-3xl font-semibold text-indigo-300" x-text="autonomyCommitCount">--</div>
        </div>
        <div class="rounded-2xl border border-white/10 bg-slate-950/45 p-3 md:p-5">
          <div class="min-h-[2.25rem] text-[9px] font-semibold leading-4 tracking-[0.06em] text-slate-500 sm:min-h-0 sm:text-[10px] sm:tracking-[0.18em]">
            <div>Uncommitted</div>
            <div class="whitespace-nowrap">Changes</div>
          </div>
          <div class="mt-1 text-3xl font-semibold text-slate-300" x-text="uncommittedChangesCount">--</div>
        </div>
      </div>

      <div class="mb-5 flex flex-col gap-3 rounded-3xl border border-white/10 bg-slate-950/70 p-3 md:flex-row md:items-center md:justify-between">
        <div class="grid grid-cols-2 gap-1 rounded-2xl bg-black/30 p-1 text-sm font-semibold" data-testid="worktree-view-toggle">
          <button type="button"
                  class="rounded-xl px-3 py-2 transition"
                  :class="viewMode === 'commits' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'"
                  @click="viewMode = 'commits'; queueBranchLayouts()">Commits</button>
          <button type="button"
                  class="rounded-xl px-3 py-2 transition"
                  :class="viewMode === 'changes' ? 'bg-amber-300 text-slate-950' : 'text-slate-400 hover:text-slate-200'"
                  @click="viewMode = 'changes'">Changes</button>
        </div>
      </div>

      <template x-if="error">
        <div class="mb-4 rounded-2xl border border-red-900 bg-red-950/40 px-4 py-3 text-sm text-red-200"
             x-text="error"
             data-testid="worktrees-error"></div>
      </template>

      <div x-show="viewMode === 'commits'" class="space-y-3" data-testid="worktrees-table">
        <template x-if="loading && commitStacks.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center text-sm text-slate-500"
               data-testid="worktrees-loading">
            Loading worktrees...
          </div>
        </template>

        <template x-if="!loading && commitStacks.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center"
               data-testid="worktrees-empty">
            <div class="text-lg font-semibold text-slate-200">No committed work waiting</div>
          </div>
        </template>

        <template x-for="item in commitStacks" :key="rowKey(item.row)">
          <div class="relative">
            <article class="group relative z-10 rounded-3xl border bg-[#0b1017] p-4 shadow-2xl shadow-black/20 transition hover:-translate-y-0.5 md:p-5"
                     :class="[(supportsDashboardMerge(item.row) ? 'border-indigo-500/20 hover:border-indigo-400/50' : 'border-white/10 hover:border-white/20'), isPoofingRow(item.row) ? 'poofing-card pointer-events-none' : ''].join(' ')"
                     data-testid="worktree-commit-card">
              <div class="mb-2 flex items-start justify-between gap-3">
                <div class="flex min-w-0 flex-wrap items-center gap-2">
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold text-slate-200">
                    <span class="grid h-4 w-4 place-items-center rounded-full text-[9px] font-bold leading-none text-white"
                          :style="'background:' + rowOrg(item.row).color">
                      <span x-text="rowOrg(item.row).initial"></span>
                    </span>
                    <span x-text="rowOrg(item.row).name"></span>
                  </span>
                  <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                        x-text="item.row.session_name"></span>
                  <!-- Harness badge — auto-ngis4 / icon-rail. -->
                  <span x-data="{ harness: item.row.session_harness }">
                    {% include 'partials/session-harness-badge.html' %}
                  </span>
                  <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                        :class="statusClass(item.row)"
                        x-text="statusLabel(item.row)"></span>
                  <template x-if="rowPr(item.row)">
                    <a :href="rowPr(item.row).url"
                       target="_blank"
                       rel="noreferrer"
                       class="rounded-full border px-2 py-0.5 text-[10px] font-semibold transition"
                       :class="prBadgeClass(rowPr(item.row))"
                       @click.stop
                       data-testid="pr-badge">
                      <span class="inline-flex items-center gap-1.5">
                        <span class="h-1.5 w-1.5 rounded-full"
                              :class="prDotClass(rowPr(item.row))"></span>
                        <span x-text="'PR #' + rowPr(item.row).number"></span>
                      </span>
                    </a>
                  </template>
                  <span class="rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400"
                        x-text="'commit 1 of ' + item.total"></span>
                </div>
                <button type="button"
                        class="h-10 shrink-0 rounded-2xl bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-500"
                        @click="selectCommit(item)"
                        data-testid="review-commit-button">Review</button>
              </div>

              <div class="min-w-0">
                <button type="button" class="block w-full min-w-0 text-left" @click="selectCommit(item)">
                  <div class="mt-1 flex flex-col items-start gap-1.5"
                       data-branch-row>
                    <span class="inline-flex min-w-0 items-center gap-2"
                          data-branch-part="src">
                      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">src</span>
                      <span class="inline-flex max-w-full overflow-hidden rounded-full border border-white/10 font-mono text-[10px] font-semibold">
                        <span class="bg-slate-800 px-2 py-0.5 text-slate-400"
                              x-text="repoName(item.row)"></span>
                        <span class="border-l border-white/10 bg-slate-900 px-2 py-0.5 text-slate-200"
                              x-text="sourceBranch(item.row)"></span>
                      </span>
                    </span>
                    <span class="text-xs text-slate-600"
                          data-branch-part="arrow"
                          aria-hidden="true">→</span>
                    <span class="inline-flex min-w-0 items-center gap-2"
                          data-branch-part="dst">
                      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">dst</span>
                      <span class="inline-flex max-w-full overflow-hidden rounded-full border border-white/10 font-mono text-[10px] font-semibold">
                        <span class="bg-slate-800 px-2 py-0.5 text-slate-400"
                              x-text="repoName(item.row)"></span>
                        <span class="border-l border-white/10 bg-slate-900 px-2 py-0.5 text-slate-200"
                              x-text="targetBranch(item.row)"></span>
                      </span>
                    </span>
                  </div>
                  <h3 class="mt-3 min-w-0 overflow-hidden break-words text-xl font-semibold leading-7 text-white md:text-2xl"
                      x-text="item.commit.subject"></h3>
                  <p class="mt-3 line-clamp-3 min-w-0 overflow-hidden whitespace-pre-wrap break-words text-sm leading-6 text-slate-400"
                     x-text="item.commit.body || 'No commit body.'"></p>
                </button>
              </div>

              <template x-if="rowPr(item.row)">
                <div class="mt-4 min-w-0" data-testid="pr-navigator">
                  <div class="mb-2 flex justify-end">
                    <div class="grid grid-cols-3 gap-1 rounded-2xl border border-white/10 bg-slate-950/75 p-1 text-[11px] font-semibold shadow-[0_10px_24px_rgba(0,0,0,0.22)]"
                         data-testid="pr-nag-controls">
                      <button type="button"
                              class="rounded-xl border border-transparent px-2.5 py-1 transition"
                              :class="nagButtonClass(item.row, 'silent')"
                              @click="setNagMode(item.row, 'silent')"
                              data-testid="pr-nag-silent">Silent</button>
                      <button type="button"
                              class="rounded-xl border border-transparent px-2.5 py-1 transition"
                              :class="nagButtonClass(item.row, 'nag_all')"
                              @click="setNagMode(item.row, 'nag_all')"
                              data-testid="pr-nag-all">Nag All Changes</button>
                      <button type="button"
                              class="rounded-xl border border-transparent px-2.5 py-1 transition"
                              :class="nagButtonClass(item.row, 'nag_done')"
                              @click="setNagMode(item.row, 'nag_done')"
                              data-testid="pr-nag-done">Nag When Done</button>
                    </div>
                  </div>
                  <div class="divide-y divide-white/10 border-y border-white/10">
                    <button type="button"
                            class="grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 px-2 py-2 text-left transition hover:bg-white/[0.03]"
                            @click="openReviewPr(item.row)"
                            data-testid="pr-navigator-pr-row">
                      <span class="rounded-full border border-white/10 bg-slate-900 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-300">PR</span>
                      <span class="min-w-0 truncate text-sm text-slate-200"
                            x-text="rowPr(item.row).title"></span>
                      <span class="flex shrink-0 items-center gap-1.5">
                        <template x-for="check in rowPrChecks(item.row)" :key="'card-pr-' + check.id">
                          <span class="inline-flex h-7 w-7 cursor-help items-center justify-center rounded-full border text-[10px] font-bold tracking-wide"
                                :class="checkIconClass(check.status)"
                                tabindex="0"
                                @mouseenter="showCheckTooltip($event, check)"
                                @mousemove="showCheckTooltip($event, check)"
                                @mouseleave="hideCheckTooltip()"
                                @focus="showCheckTooltip($event, check)"
                                @blur="hideCheckTooltip()"
                                @click.stop.prevent="toggleCheckTooltip($event, check)">
                            <span x-text="check.icon"></span>
                          </span>
                        </template>
                      </span>
                    </button>
                    <template x-for="(commit, idx) in commitList(item.row)" :key="'card-' + rowKey(item.row) + '/' + commit.sha">
                      <button type="button"
                              class="grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 px-2 py-2 text-left transition hover:bg-white/[0.03]"
                              @click="openReviewCommit(item.row, idx)"
                              data-testid="pr-navigator-commit-row">
                        <span class="rounded-full border border-white/10 bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-300"
                              x-text="commit.short_sha || shortSha(commit.sha)"></span>
                        <span class="min-w-0 truncate text-sm text-slate-200"
                              x-text="commit.subject"></span>
                        <span class="flex shrink-0 items-center gap-1.5">
                          <template x-for="check in reviewCommitChecks(commit)" :key="'card-' + commit.sha + '-' + check.id">
                              <span class="inline-flex h-7 w-7 cursor-help items-center justify-center rounded-full border text-[10px] font-bold tracking-wide"
                                  :class="checkIconClass(check.status)"
                                  tabindex="0"
                                  @mouseenter="showCheckTooltip($event, check)"
                                  @mousemove="showCheckTooltip($event, check)"
                                  @mouseleave="hideCheckTooltip()"
                                  @focus="showCheckTooltip($event, check)"
                                  @blur="hideCheckTooltip()"
                                  @click.stop.prevent="toggleCheckTooltip($event, check)">
                              <span x-text="check.icon"></span>
                            </span>
                          </template>
                        </span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>

              <div class="mt-4 min-w-0">
                <div class="mb-2 flex items-center justify-between gap-3">
                  <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Changed in this commit</div>
                  <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                    <span x-text="item.commit.stats.files + ' files'"></span>
                    <span class="text-emerald-300" x-text="'+' + item.commit.stats.additions"></span>
                    <span class="text-rose-300" x-text="'-' + item.commit.stats.deletions"></span>
                  </div>
                </div>
                <div class="divide-y divide-white/10 border-y border-white/10">
                  <template x-for="file in item.commit.files.slice(0, 3)" :key="commitKey(item) + file.status + file.path">
                    <div class="grid grid-cols-[0.85rem_minmax(0,1fr)_auto] items-center gap-1.5 py-1.5">
                      <span class="text-center font-mono text-[10px] font-bold text-indigo-200" x-text="file.status"></span>
                      <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                            :title="file.path"
                            x-text="fitPath(file.path, $el)"></span>
                      <span class="inline-flex shrink-0 items-center gap-1 font-mono text-[10px]">
                        <span class="text-emerald-300" x-text="'+' + file.additions"></span>
                        <span class="text-rose-300" x-text="'-' + file.deletions"></span>
                      </span>
                    </div>
                  </template>
                </div>
                <template x-if="item.total > 1">
                  <div class="mt-2 text-[11px] text-slate-500" x-text="'+' + (item.total - 1) + ' later commits in this stack'"></div>
                </template>
                <template x-if="item.commit.files.length > 3">
                  <div class="mt-2 text-[11px] text-slate-500" x-text="'+' + (item.commit.files.length - 3) + ' more paths in full view'"></div>
                </template>
              </div>
            </article>
          </div>
        </template>
      </div>

      <div x-show="viewMode === 'changes'" class="mt-5 space-y-3" data-testid="worktrees-changes">
        <template x-if="loading && dirtyRows.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center text-sm text-slate-500"
               data-testid="worktrees-loading">
            Loading worktrees...
          </div>
        </template>

        <template x-if="!loading && dirtyRows.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center">
            <div class="text-lg font-semibold text-slate-200">No uncommitted changes</div>
          </div>
        </template>

        <template x-for="row in dirtyRows" :key="'dirty/' + rowKey(row)">
          <article class="group relative rounded-3xl border bg-slate-950/75 p-4 shadow-2xl shadow-black/20 transition hover:-translate-y-0.5 md:p-5"
                   :class="row.session_live ? 'border-white/10 hover:border-white/20' : 'border-amber-300/15 hover:border-amber-200/30'"
                   data-testid="worktree-dirty-card">
            <div class="mb-3 flex items-start justify-between gap-3">
              <div class="flex min-w-0 flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold text-slate-200">
                  <span class="grid h-4 w-4 place-items-center rounded-full text-[9px] font-bold leading-none text-white"
                        :style="'background:' + rowOrg(row).color">
                    <span x-text="rowOrg(row).initial"></span>
                  </span>
                  <span x-text="rowOrg(row).name"></span>
                </span>
                <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                      x-text="row.session_name"></span>
                <!-- Harness badge — auto-ngis4 / icon-rail. -->
                <span x-data="{ harness: row.session_harness }">
                  {% include 'partials/session-harness-badge.html' %}
                </span>
                <span class="inline-flex overflow-hidden rounded-full border border-white/10 text-[10px] font-semibold">
                  <span class="bg-slate-800 px-2 py-0.5 uppercase tracking-wider text-slate-500">repo</span>
                  <span class="bg-slate-900 px-2 py-0.5 font-mono text-slate-200"
                        x-text="repoName(row)"></span>
                </span>
                <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                      :class="statusClass(row)"
                      x-text="statusLabel(row)"></span>
                <span class="hidden rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400 sm:inline-flex"
                      x-text="changesCompanionCommitLabel(row)"></span>
              </div>
              <div class="flex shrink-0 items-center gap-2">
                <button x-show="cloneStale(row)"
                        type="button"
                        class="h-10 rounded-2xl border border-amber-400/40 px-4 text-sm font-semibold text-amber-200 transition hover:bg-amber-400/10 disabled:cursor-wait disabled:opacity-50"
                        :disabled="isSyncingBase(row)"
                        :title="'Pull host master into the managed clone (' + targetBranch(row) + ')'"
                        @click="syncBase(row)"
                        data-testid="row-sync-base-button">
                  <span x-show="!isSyncingBase(row)" x-text="'Sync ' + targetBranch(row)"></span>
                  <span x-show="isSyncingBase(row)">Syncing...</span>
                </button>
                <button type="button"
                        class="h-10 rounded-2xl bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-500"
                        @click="selectDirtyRow(row)"
                        data-testid="review-dirty-button">View Diffs</button>
                <button x-show="canDiscardDirtyRow(row)"
                        type="button"
                        class="h-10 rounded-2xl border border-rose-500/40 px-4 text-sm font-semibold text-rose-300 transition hover:bg-rose-500/10 disabled:cursor-wait disabled:opacity-50"
                        :disabled="isCleaningRow(row)"
                        @click="openDiscardConfirm(row)"
                        data-testid="discard-dirty-button">
                  <span x-show="!isCleaningRow(row)">Discard</span>
                  <span x-show="isCleaningRow(row)">Discarding...</span>
                </button>
              </div>
            </div>

            <template x-if="row.session_title">
              <h3 class="min-w-0 overflow-hidden break-words text-lg font-semibold leading-7 text-white md:text-xl"
                  x-text="row.session_title"></h3>
            </template>

            <div class="mt-4 min-w-0">
              <div class="mb-2 flex items-center justify-between gap-3">
                <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Changed in working tree</div>
                <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                  <span x-text="dirtyFiles(row).length + ' files'"></span>
                </div>
              </div>
              <div class="divide-y divide-white/10 border-y border-white/10">

                <div class="mx-auto max-w-6xl">
                  <h3 class="max-w-4xl font-semibold text-white transition-all duration-200 ease-out"
                      :class="reviewTitlePinned ? 'text-base leading-5 sm:text-3xl sm:leading-9' : 'text-2xl leading-8 sm:text-3xl sm:leading-9'">Working tree changes</h3>
                </div>
              </div>

              <div>
                <div class="mb-6">
                  <div x-ref="dirtyFilesHeader"
                       class="sticky z-[8] -mx-2 mb-2 flex items-center justify-between gap-3 border-y border-white/10 bg-gray-950/95 px-2 py-2 backdrop-blur"
                       :style="'top:' + commitStickyTop + 'px'">
                    <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Files in working tree</div>
                    <div class="flex items-center gap-3">
                      <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                        <span x-text="selectedDirtyRow.files.length + ' files'"></span>
                      </div>
                      <button type="button"
                              class="rounded-xl border border-white/10 px-3 py-1 text-xs font-semibold text-slate-300"
                              @click="showDiff = !showDiff"
                              x-text="showDiff ? 'Hide Diffs' : 'Show Diffs'"></button>
                    </div>
                  </div>
                  <div class="divide-y divide-white/10 border-y border-white/10">
                    <template x-for="file in selectedDirtyRow.files" :key="rowKey(selectedDirtyRow) + file.status + file.path">
                      <div :class="showDiff ? 'py-3' : 'py-1.5'">
                        <div class="grid grid-cols-[0.85rem_minmax(0,1fr)] items-center gap-1.5"
                             :class="showDiff ? 'sticky z-[7] -mx-2 border-b border-white/10 bg-gray-950/95 px-2 py-1.5 backdrop-blur' : ''"
                             :style="showDiff ? 'top:' + commitFileRowStickyTop + 'px' : ''">
                          <span class="text-center font-mono text-[10px] font-bold text-amber-200"
                                :title="statusTitle(file.status)"
                                x-text="displayStatus(file.status)"></span>
                          <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                                :title="file.path"
                                x-text="fitPath(file.path, $el)"></span>
                        </div>
                        <template x-if="showDiff && patchLinesForFile(selectedDirtyRow, file).length">
                          <div class="worktree-diff-scroller mt-2">
                            <div class="min-w-full w-max">
                              <template x-for="(line, idx) in patchLinesForFile(selectedDirtyRow, file)" :key="file.path + '-' + idx">
                                <div class="grid min-w-full w-max grid-cols-[2rem_2rem_0.75rem_max-content] items-start gap-0 font-mono text-[11px] leading-5"
                                     :class="line.kind === 'add' ? 'bg-emerald-300/[0.08]' : (line.kind === 'del' ? 'bg-rose-300/[0.08]' : 'bg-transparent')">
                                  <span class="border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.oldNo"></span>
                                  <span class="border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.newNo"></span>
                                  <span class="border-r border-white/10 text-center"
                                        :class="line.kind === 'add' ? 'text-emerald-300' : (line.kind === 'del' ? 'text-rose-300' : 'text-slate-600')"
                                        x-text="diffMarker(line.kind)"></span>
                                  <span class="worktree-diff-code hljs whitespace-pre px-2 pr-3"
                                        :class="line.kind === 'add' ? 'text-emerald-100' : (line.kind === 'del' ? 'text-rose-100' : 'text-slate-300')"
                                        x-html="line.html || '&nbsp;'"></span>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                  <template x-if="dirtyDetailLoading">
                    <div class="mt-3 text-xs text-slate-500">Loading dirty diff...</div>
                  </template>
                </div>
              </div>

              <div class="mt-6">
                <div class="mx-auto flex max-w-6xl justify-end">
                  <button type="button"
                          class="h-11 rounded-2xl border border-white/10 px-4 text-sm font-semibold text-slate-300"
                          @click="selectedDirtyRow = null">Close</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </template>
    </div>
  </section>

  <!-- Floating check-tooltip popover (auto-r098a). Anchored to the
       hovered/focused disc via :style left/top from showCheckTooltip;
       hidden on click-outside / Escape via the root @click.window /
       @keydown.escape.window listeners. Lifted from settled design
       3435e03f, lines 779-788. -->
  <div x-show="checkTooltip.visible"
       x-transition.opacity.duration.75ms
       class="pointer-events-none fixed z-[90] w-[min(22rem,calc(100vw-1.5rem))] -translate-x-1/2 -translate-y-[calc(100%+10px)] rounded-lg border border-white/10 bg-slate-900/96 px-2.5 py-2 text-xs text-slate-100 shadow-[0_16px_40px_rgba(0,0,0,0.45)]"
       :style="'left:' + checkTooltip.x + 'px; top:' + checkTooltip.y + 'px;'"
       data-testid="check-tooltip">
    <div class="font-medium" x-text="checkTooltip.text"></div>
    <template x-if="checkTooltip.detail">
      <div class="mt-1 whitespace-normal text-[11px] leading-4 text-slate-300"
           x-text="checkTooltip.detail"></div>
    </template>
  </div>
</div>
</div>
