<style>
  @keyframes worktreePoof {
    0% {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }
    65% {
      opacity: 0.72;
      transform: scale(0.985) translateY(-2px);
      filter: blur(0.4px);
    }
    100% {
      opacity: 0;
      transform: scale(0.94) translateY(-12px);
      filter: blur(10px);
    }
  }

  .poofing-card {
    animation: worktreePoof 420ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    transform-origin: 50% 24%;
  }

  @keyframes mergeConfettiBurst {
    0% {
      opacity: 0;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(0.65);
    }
    12% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)) scale(1.05);
    }
  }

  @keyframes mergeConfettiGlow {
    0% {
      opacity: 0;
      transform: translate(-50%, 0) scale(0.5);
    }
    18% {
      opacity: 0.9;
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -8px) scale(1.8);
    }
  }

  .merge-confetti-piece {
    animation: mergeConfettiBurst 820ms cubic-bezier(0.18, 0.82, 0.24, 1) forwards;
  }

  .merge-confetti-glow {
    animation: mergeConfettiGlow 760ms ease-out forwards;
  }
</style>

<div x-data="worktreesPage()" class="pb-safe text-gray-100" data-testid="worktrees-page">
  <section class="px-4 py-4 md:px-6 md:py-6">
    <div class="mx-auto max-w-7xl">
      <div class="mb-5 grid grid-cols-[minmax(0,1fr)_auto] items-start gap-3 border-b border-white/10 pb-5">
        <div class="min-w-0 pr-1 md:pr-6">
          <h2 class="text-3xl font-semibold tracking-tight text-white md:text-5xl">Worktrees</h2>
        </div>
        <div class="justify-self-end rounded-2xl border border-white/10 bg-slate-950/70 p-1.5 shadow-2xl shadow-black/20">
          <div class="flex items-center gap-2">
            <div class="text-right text-[10px] leading-4 text-slate-500">
              <div class="uppercase tracking-[0.16em]">Updated</div>
              <div class="font-mono text-slate-300" x-text="lastUpdated || 'pending'"></div>
            </div>
            <button type="button"
                    @click="refresh(true)"
                    :disabled="refreshing"
                    class="h-9 rounded-xl border border-gray-700 bg-gray-800 px-3 text-xs font-semibold text-gray-200 transition hover:bg-gray-700 disabled:cursor-wait disabled:opacity-50"
                    data-testid="worktrees-refresh-button">
              <span x-show="!refreshing">Refresh</span>
              <span x-show="refreshing">Refreshing...</span>
            </button>
          </div>
        </div>
      </div>

      <div class="mb-5 grid grid-cols-3 gap-2 md:gap-4" data-testid="worktrees-summary">
        <div class="rounded-2xl border border-white/10 bg-slate-950/70 p-3 md:p-5">
          <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Commits (All Repos)</div>
          <div class="mt-1 text-3xl font-semibold text-white" x-text="commitItems.length"></div>
        </div>
        <div class="rounded-2xl border border-indigo-500/20 bg-indigo-500/[0.08] p-3 md:p-5">
          <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Commits (Autonomy)</div>
          <div class="mt-1 text-3xl font-semibold text-indigo-300" x-text="autonomyCommitCount"></div>
        </div>
        <div class="rounded-2xl border border-white/10 bg-slate-950/45 p-3 md:p-5">
          <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Uncommitted Changes</div>
          <div class="mt-1 text-3xl font-semibold text-slate-300" x-text="uncommittedOnlyCount"></div>
        </div>
      </div>

      <div class="mb-5 flex flex-col gap-3 rounded-3xl border border-white/10 bg-slate-950/70 p-3 md:flex-row md:items-center md:justify-between">
        <div class="grid grid-cols-2 gap-1 rounded-2xl bg-black/30 p-1 text-sm font-semibold" data-testid="worktree-view-toggle">
          <button type="button"
                  class="rounded-xl px-3 py-2 transition"
                  :class="viewMode === 'commits' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'"
                  @click="viewMode = 'commits'">Commits</button>
          <button type="button"
                  class="rounded-xl px-3 py-2 transition"
                  :class="viewMode === 'changes' ? 'bg-amber-300 text-slate-950' : 'text-slate-400 hover:text-slate-200'"
                  @click="viewMode = 'changes'">Changes</button>
        </div>
      </div>

      <template x-if="error">
        <div class="mb-4 rounded-2xl border border-red-900 bg-red-950/40 px-4 py-3 text-sm text-red-200"
             x-text="error"
             data-testid="worktrees-error"></div>
      </template>

      <div x-show="viewMode === 'commits'" class="space-y-3" data-testid="worktrees-table">
        <template x-if="loading && commitStacks.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center text-sm text-slate-500"
               data-testid="worktrees-loading">
            Loading worktrees...
          </div>
        </template>

        <template x-if="!loading && commitStacks.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center"
               data-testid="worktrees-empty">
            <div class="text-lg font-semibold text-slate-200">No committed work waiting</div>
          </div>
        </template>

        <template x-for="item in commitStacks" :key="rowKey(item.row)">
          <div class="relative">
            <article class="group relative z-10 rounded-3xl border bg-[#0b1017] p-4 shadow-2xl shadow-black/20 transition hover:-translate-y-0.5 md:p-5"
                     :class="[(supportsDashboardMerge(item.row) ? 'border-indigo-500/20 hover:border-indigo-400/50' : 'border-white/10 hover:border-white/20'), isPoofingRow(item.row) ? 'poofing-card pointer-events-none' : ''].join(' ')"
                     data-testid="worktree-commit-card">
              <div class="mb-2 flex items-start justify-between gap-3">
                <div class="flex min-w-0 flex-wrap items-center gap-2">
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold text-slate-200">
                    <span class="grid h-4 w-4 place-items-center rounded-full text-[9px] font-bold leading-none text-white"
                          :style="'background:' + rowOrg(item.row).color">
                      <span x-text="rowOrg(item.row).initial"></span>
                    </span>
                    <span x-text="rowOrg(item.row).name"></span>
                  </span>
                  <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                        x-text="item.row.session_name"></span>
                  <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                        :class="statusClass(item.row)"
                        x-text="statusLabel(item.row)"></span>
                  <span class="rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400"
                        x-text="'commit 1 of ' + item.total"></span>
                </div>
                <button type="button"
                        class="h-10 shrink-0 rounded-2xl bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-500"
                        @click="selectCommit(item)"
                        data-testid="review-commit-button">Review commit</button>
              </div>

              <div class="min-w-0">
                <button type="button" class="block max-w-4xl text-left" @click="selectCommit(item)">
                  <div class="mt-1 flex flex-wrap items-center gap-2">
                    <span class="rounded-full bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-300">
                      <span class="mr-1 uppercase tracking-wider text-slate-500">src</span>
                      <span x-text="sourceBranch(item.row)"></span>
                    </span>
                    <span class="text-xs text-slate-600">→</span>
                    <span class="rounded-full bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-200">
                      <span class="mr-1 uppercase tracking-wider text-slate-500">dst</span>
                      <span x-text="targetBranch(item.row)"></span>
                    </span>
                  </div>
                  <h3 class="mt-3 text-xl font-semibold leading-7 text-white md:text-2xl" x-text="item.commit.subject"></h3>
                  <p class="mt-3 line-clamp-3 text-sm leading-6 text-slate-400" x-text="item.commit.body || 'No commit body.'"></p>
                </button>
              </div>

              <div class="mt-4 min-w-0">
                <div class="mb-2 flex items-center justify-between gap-3">
                  <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Changed in this commit</div>
                  <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                    <span x-text="item.commit.stats.files + ' files'"></span>
                    <span class="text-emerald-300" x-text="'+' + item.commit.stats.additions"></span>
                    <span class="text-rose-300" x-text="'-' + item.commit.stats.deletions"></span>
                  </div>
                </div>
                <div class="divide-y divide-white/10 border-y border-white/10">
                  <template x-for="file in item.commit.files.slice(0, 3)" :key="commitKey(item) + file.status + file.path">
                    <div class="grid grid-cols-[0.85rem_minmax(0,1fr)_auto] items-center gap-1.5 py-1.5">
                      <span class="text-center font-mono text-[10px] font-bold text-indigo-200" x-text="file.status"></span>
                      <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                            :title="file.path"
                            x-text="displayPath(file.path)"></span>
                      <span class="inline-flex shrink-0 items-center gap-1 font-mono text-[10px]">
                        <span class="text-emerald-300" x-text="'+' + file.additions"></span>
                        <span class="text-rose-300" x-text="'-' + file.deletions"></span>
                      </span>
                    </div>
                  </template>
                </div>
                <template x-if="item.total > 1">
                  <div class="mt-2 text-[11px] text-slate-500" x-text="'+' + (item.total - 1) + ' later commits in this stack'"></div>
                </template>
                <template x-if="item.commit.files.length > 3">
                  <div class="mt-2 text-[11px] text-slate-500" x-text="'+' + (item.commit.files.length - 3) + ' more paths in full view'"></div>
                </template>
              </div>
            </article>
          </div>
        </template>
      </div>

      <div x-show="viewMode === 'changes'" class="mt-5 space-y-3" data-testid="worktrees-changes">
        <template x-if="loading && dirtyRows.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center text-sm text-slate-500"
               data-testid="worktrees-loading">
            Loading worktrees...
          </div>
        </template>

        <template x-if="!loading && dirtyRows.length === 0">
          <div class="rounded-3xl border border-dashed border-slate-700 bg-slate-950/70 p-10 text-center">
            <div class="text-lg font-semibold text-slate-200">No uncommitted changes</div>
          </div>
        </template>

        <template x-for="row in dirtyRows" :key="'dirty/' + rowKey(row)">
          <article class="group relative rounded-3xl border bg-slate-950/75 p-4 shadow-2xl shadow-black/20 transition hover:-translate-y-0.5 md:p-5"
                   :class="row.session_live ? 'border-white/10 hover:border-white/20' : 'border-amber-300/15 hover:border-amber-200/30'"
                   data-testid="worktree-dirty-card">
            <div class="mb-3 flex items-start justify-between gap-3">
              <div class="flex min-w-0 flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold text-slate-200">
                  <span class="grid h-4 w-4 place-items-center rounded-full text-[9px] font-bold leading-none text-white"
                        :style="'background:' + rowOrg(row).color">
                    <span x-text="rowOrg(row).initial"></span>
                  </span>
                  <span x-text="rowOrg(row).name"></span>
                </span>
                <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                      x-text="row.session_name"></span>
                <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                      :class="statusClass(row)"
                      x-text="statusLabel(row)"></span>
                <span class="rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400"
                      x-text="commitList(row).length ? commitList(row).length + ' commits also present' : 'changes only'"></span>
              </div>
              <div class="flex shrink-0 items-center gap-2">
                <button type="button"
                        class="h-10 rounded-2xl bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-500"
                        @click="selectDirtyRow(row)"
                        data-testid="review-dirty-button">View Diffs</button>
                <button type="button"
                        class="h-10 rounded-2xl border border-rose-500/40 px-4 text-sm font-semibold text-rose-300 transition hover:bg-rose-500/10 disabled:cursor-wait disabled:opacity-50"
                        :disabled="isCleaningRow(row)"
                        @click="openDiscardConfirm(row)"
                        data-testid="discard-dirty-button">
                  <span x-show="!isCleaningRow(row)">Discard</span>
                  <span x-show="isCleaningRow(row)">Discarding...</span>
                </button>
              </div>
            </div>

            <div class="mt-4 min-w-0">
              <div class="mb-2 flex items-center justify-between gap-3">
                <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Changed in working tree</div>
                <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                  <span x-text="dirtyFiles(row).length + ' files'"></span>
                </div>
              </div>
              <div class="divide-y divide-white/10 border-y border-white/10">
                <template x-for="file in dirtyFiles(row).slice(0, 3)" :key="rowKey(row) + file.status + file.path">
                  <div class="grid grid-cols-[0.85rem_minmax(0,1fr)] items-center gap-1.5 py-1.5">
                    <span class="text-center font-mono text-[10px] font-bold text-amber-200"
                          :title="statusTitle(file.status)"
                          x-text="displayStatus(file.status)"></span>
                    <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                          :title="file.path"
                          x-text="displayPath(file.path)"></span>
                  </div>
                </template>
              </div>
              <template x-if="dirtyFiles(row).length > 3">
                <div class="mt-2 text-[11px] text-slate-500" x-text="'+' + (dirtyFiles(row).length - 3) + ' more paths in full view'"></div>
              </template>
            </div>
          </article>
        </template>
      </div>

      <template x-if="confirmDiscardRow">
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4"
             data-testid="discard-confirm">
          <section class="w-full max-w-md rounded-3xl border border-rose-500/20 bg-gray-950 p-5 shadow-2xl shadow-black/50">
            <div class="mb-2 text-sm font-semibold text-rose-300" x-text="discardPromptTitle(confirmDiscardRow)"></div>
            <h3 class="text-xl font-semibold text-white">Are you sure you want to delete this Worktree?</h3>
            <div class="mt-3 text-sm leading-6 text-slate-400">
              This removes the session worktree from the queue. Uncommitted changes in that worktree will be discarded.
            </div>
            <div class="mt-5 grid grid-cols-1 gap-2 sm:grid-cols-[1fr_auto]">
              <button type="button"
                      class="h-11 rounded-2xl bg-rose-600 px-4 text-sm font-semibold text-white transition hover:bg-rose-500 disabled:cursor-wait disabled:opacity-50"
                      :disabled="isCleaningRow(confirmDiscardRow)"
                      @click="confirmDiscard()">
                <span x-show="!isCleaningRow(confirmDiscardRow)">Discard worktree</span>
                <span x-show="isCleaningRow(confirmDiscardRow)">Discarding...</span>
              </button>
              <button type="button"
                      class="h-11 rounded-2xl border border-white/10 px-4 text-sm font-semibold text-slate-300"
                      @click="confirmDiscardRow = null">Cancel</button>
            </div>
          </section>
        </div>
      </template>

      <template x-if="selectedCommit">
        <div class="fixed inset-0 z-50 overflow-y-auto bg-gray-950"
             data-testid="worktree-commit-detail">
          <section class="min-h-screen bg-gray-950">
            <div class="mx-auto max-w-6xl px-4 pb-8 pt-4 sm:px-6 lg:px-8">
              <div class="sticky top-0 z-10 -mx-4 mb-6 border-b border-white/10 bg-gray-950/95 px-4 pb-4 pt-1 backdrop-blur sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
                <div class="mx-auto max-w-6xl">
                  <div class="mb-2 grid items-start gap-2 sm:grid-cols-[minmax(0,1fr)_auto_auto] sm:gap-3">
                    <div class="flex min-w-0 flex-wrap items-center gap-2">
                      <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                            x-text="selectedCommit.commit.short_sha || shortSha(selectedCommit.commit.sha)"></span>
                      <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                            x-text="selectedCommit.row.session_name"></span>
                      <span class="rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-300"
                            x-text="selectedCommit.row.repo_name"></span>
                      <span class="rounded-full bg-slate-800 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-400"
                            x-text="selectedCommit.commit.date"></span>
                    </div>
                    <template x-if="selectedCommit.total > 1">
                      <div class="flex items-center justify-start gap-1 sm:justify-center">
                        <button type="button"
                                class="grid h-8 w-8 place-items-center rounded-full border border-white/10 bg-white/[0.03] text-sm font-semibold text-slate-300 disabled:cursor-not-allowed disabled:opacity-40"
                                :disabled="!hasEarlierCommit()"
                                @click="viewEarlierCommit()">&lt;</button>
                        <span class="rounded-full bg-slate-800 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wider text-slate-300"
                              x-text="'commit ' + selectedCommit.position + ' of ' + selectedCommit.total"></span>
                        <button type="button"
                                class="grid h-8 w-8 place-items-center rounded-full border border-white/10 bg-white/[0.03] text-sm font-semibold text-slate-300 disabled:cursor-not-allowed disabled:opacity-40"
                                :disabled="!hasLaterCommit()"
                                @click="viewLaterCommit()">&gt;</button>
                      </div>
                    </template>
                    <button type="button"
                            class="h-10 w-10 shrink-0 justify-self-end rounded-full border border-white/10 bg-white/[0.03] text-slate-300"
                            @click="selectedCommit = null">×</button>
                  </div>
                  <div class="mt-1 flex max-w-4xl flex-wrap items-center gap-2">
                    <span class="rounded-full bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-300">
                      <span class="mr-1 uppercase tracking-wider text-slate-500">Source</span>
                      <span x-text="sourceBranch(selectedCommit.row)"></span>
                    </span>
                    <span class="text-sm text-slate-600">→</span>
                    <span class="rounded-full bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-200">
                      <span class="mr-1 uppercase tracking-wider text-slate-500">Target</span>
                      <span x-text="targetBranch(selectedCommit.row)"></span>
                    </span>
                  </div>
                  <h3 class="mt-3 max-w-4xl text-2xl font-semibold leading-8 text-white sm:text-3xl" x-text="selectedCommit.commit.subject"></h3>
                </div>
              </div>

              <div>
                <div class="mb-6 max-w-4xl text-sm leading-6 text-slate-300" x-text="selectedCommit.commit.body || 'No commit body.'"></div>

                <div class="mb-6">
                  <div class="mb-2 flex items-center justify-between gap-3">
                    <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Files in this commit</div>
                    <div class="flex items-center gap-3">
                      <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                        <span x-text="selectedCommit.commit.stats.files + ' files'"></span>
                        <span class="text-emerald-300" x-text="'+' + selectedCommit.commit.stats.additions"></span>
                        <span class="text-rose-300" x-text="'-' + selectedCommit.commit.stats.deletions"></span>
                      </div>
                      <button type="button"
                              class="rounded-xl border border-white/10 px-3 py-1 text-xs font-semibold text-slate-300"
                              @click="showDiff = !showDiff"
                              x-text="showDiff ? 'Hide Diffs' : 'Show Diffs'"></button>
                    </div>
                  </div>
                  <div class="divide-y divide-white/10 border-y border-white/10">
                    <template x-for="file in selectedCommit.commit.files" :key="selectedCommit.commit.sha + file.status + file.path">
                      <div :class="showDiff ? 'py-3' : 'py-1.5'">
                        <div class="grid grid-cols-[0.85rem_minmax(0,1fr)_auto] items-center gap-1.5">
                          <span class="text-center font-mono text-[10px] font-bold text-indigo-200" x-text="file.status"></span>
                          <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                                :title="file.path"
                                x-text="displayPath(file.path)"></span>
                          <span class="inline-flex shrink-0 items-center gap-1 font-mono text-[11px]">
                            <span class="text-emerald-300" x-text="'+' + file.additions"></span>
                            <span class="text-rose-300" x-text="'-' + file.deletions"></span>
                          </span>
                        </div>
                        <template x-if="showDiff && patchLinesForFile(selectedCommit, file).length">
                          <div class="mt-2 overflow-x-auto">
                            <div class="min-w-full w-max">
                              <template x-for="(line, idx) in patchLinesForFile(selectedCommit, file)" :key="file.path + '-' + idx">
                                <div class="grid min-w-full w-max grid-cols-[2rem_2rem_0.75rem_max-content] items-start gap-0 font-mono text-[11px] leading-5"
                                     :class="line.kind === 'add' ? 'bg-emerald-300/[0.08]' : (line.kind === 'del' ? 'bg-rose-300/[0.08]' : 'bg-transparent')">
                                  <span class="border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.oldNo"></span>
                                  <span class="border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.newNo"></span>
                                  <span class="border-r border-white/10 px-1 text-center"
                                        :class="line.kind === 'add' ? 'text-emerald-300' : (line.kind === 'del' ? 'text-rose-300' : 'text-slate-600')"
                                        x-text="diffMarker(line.kind)"></span>
                                  <span class="whitespace-pre px-2 pr-3"
                                        :class="line.kind === 'add' ? 'text-emerald-100' : (line.kind === 'del' ? 'text-rose-100' : 'text-slate-300')"
                                        x-text="line.text"></span>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                  <template x-if="detailLoading">
                    <div class="mt-3 text-xs text-slate-500">Loading commit diff...</div>
                  </template>
                </div>
              </div>

              <div class="relative mt-6">
                <template x-if="supportsDashboardMerge(selectedCommit.row)">
                  <div class="mx-auto grid max-w-6xl grid-cols-1 gap-2 md:grid-cols-[1fr_auto]">
                    <template x-if="mergeBurstActive">
                      <div class="pointer-events-none absolute inset-x-0 -top-16 z-10 flex justify-center overflow-visible">
                        <div class="relative h-24 w-72 max-w-full">
                          <div class="merge-confetti-glow absolute left-1/2 top-8 h-16 w-16 rounded-full bg-emerald-300/20 blur-2xl"></div>
                          <template x-for="piece in confettiPieces" :key="mergeBurstSeed + '-' + piece.id">
                            <span class="merge-confetti-piece absolute left-1/2 top-10 h-3 w-1.5 rounded-full shadow-[0_0_12px_rgba(255,255,255,0.18)]"
                                  :style="'--dx:' + piece.dx + 'px; --dy:' + piece.dy + 'px; --rot:' + piece.rot + 'deg; background:' + piece.color + '; animation-delay:' + piece.delay + 'ms'"></span>
                          </template>
                        </div>
                      </div>
                    </template>
                    <button type="button"
                            class="h-11 rounded-2xl px-4 text-sm font-semibold text-white transition disabled:cursor-not-allowed disabled:bg-gray-800 disabled:text-gray-500"
                            :class="mergeState === 'success' ? 'bg-emerald-500 hover:bg-emerald-500' : 'bg-indigo-600 hover:bg-indigo-500'"
                            :disabled="!canMergeCommit(selectedCommit) || mergeState === 'working' || mergeState === 'success'"
                            @click="startMergeCommit()"
                            data-testid="worktree-commit-merge-button">
                      <span class="inline-flex items-center justify-center gap-2">
                        <template x-if="mergeState === 'working'">
                          <span class="inline-flex items-center gap-2">
                            <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                            <span x-text="mergeCommitLabel(selectedCommit)"></span>
                          </span>
                        </template>
                        <template x-if="mergeState === 'success'">
                          <span class="inline-flex items-center gap-2">
                            <span class="text-base leading-none">✓</span>
                            <span>Merged</span>
                          </span>
                        </template>
                        <template x-if="mergeState !== 'working' && mergeState !== 'success'">
                          <span x-text="mergeCommitLabel(selectedCommit)"></span>
                        </template>
                      </span>
                    </button>
                    <button type="button"
                            class="h-11 rounded-2xl border border-white/10 px-4 text-sm font-semibold text-slate-300"
                            @click="selectedCommit = null">Close</button>
                  </div>
                </template>

                <template x-if="!supportsDashboardMerge(selectedCommit.row)">
                  <div class="mx-auto flex max-w-6xl justify-end">
                    <button type="button"
                            class="h-11 rounded-2xl border border-white/10 px-4 text-sm font-semibold text-slate-300"
                            @click="selectedCommit = null">Close</button>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </div>
      </template>

      <template x-if="selectedDirtyRow">
        <div class="fixed inset-0 z-50 overflow-y-auto bg-gray-950"
             data-testid="worktree-dirty-detail">
          <section class="min-h-screen bg-gray-950">
            <div class="mx-auto max-w-6xl px-4 pb-8 pt-4 sm:px-6 lg:px-8">
              <div class="sticky top-0 z-10 -mx-4 mb-6 border-b border-white/10 bg-gray-950/95 px-4 pb-4 pt-1 backdrop-blur sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
                <div class="mx-auto max-w-6xl">
                  <div class="mb-2 flex items-start justify-between gap-4">
                    <div class="min-w-0">
                      <div class="mb-2 flex flex-wrap items-center gap-2">
                        <span class="rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200"
                              x-text="selectedDirtyRow.session_name"></span>
                        <span class="rounded-full bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-300"
                              x-text="selectedDirtyRow.repo_name"></span>
                        <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                              :class="statusClass(selectedDirtyRow)"
                              x-text="statusLabel(selectedDirtyRow)"></span>
                      </div>
                      <h3 class="mt-1 max-w-4xl text-2xl font-semibold leading-8 text-white sm:text-3xl">Working tree changes</h3>
                    </div>
                    <button type="button"
                            class="h-10 w-10 shrink-0 rounded-full border border-white/10 bg-white/[0.03] text-slate-300"
                            @click="selectedDirtyRow = null">×</button>
                  </div>
                </div>
              </div>

              <div>
                <div class="mb-6">
                  <div class="mb-2 flex items-center justify-between gap-3">
                    <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Files in working tree</div>
                    <div class="flex items-center gap-3">
                      <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                        <span x-text="selectedDirtyRow.files.length + ' files'"></span>
                      </div>
                      <button type="button"
                              class="rounded-xl border border-white/10 px-3 py-1 text-xs font-semibold text-slate-300"
                              @click="showDiff = !showDiff"
                              x-text="showDiff ? 'Hide Diffs' : 'Show Diffs'"></button>
                    </div>
                  </div>
                  <div class="divide-y divide-white/10 border-y border-white/10">
                    <template x-for="file in selectedDirtyRow.files" :key="rowKey(selectedDirtyRow) + file.status + file.path">
                      <div :class="showDiff ? 'py-3' : 'py-1.5'">
                        <div class="grid grid-cols-[0.85rem_minmax(0,1fr)] items-center gap-1.5">
                          <span class="text-center font-mono text-[10px] font-bold text-amber-200"
                                :title="statusTitle(file.status)"
                                x-text="displayStatus(file.status)"></span>
                          <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                                :title="file.path"
                                x-text="displayPath(file.path)"></span>
                        </div>
                        <template x-if="showDiff && patchLinesForFile(selectedDirtyRow, file).length">
                          <div class="mt-2 overflow-x-auto">
                            <div class="min-w-full w-max">
                              <template x-for="(line, idx) in patchLinesForFile(selectedDirtyRow, file)" :key="file.path + '-' + idx">
                                <div class="grid min-w-full w-max grid-cols-[2rem_2rem_0.75rem_max-content] items-start gap-0 font-mono text-[11px] leading-5"
                                     :class="line.kind === 'add' ? 'bg-emerald-300/[0.08]' : (line.kind === 'del' ? 'bg-rose-300/[0.08]' : 'bg-transparent')">
                                  <span class="border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.oldNo"></span>
                                  <span class="border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.newNo"></span>
                                  <span class="border-r border-white/10 px-1 text-center"
                                        :class="line.kind === 'add' ? 'text-emerald-300' : (line.kind === 'del' ? 'text-rose-300' : 'text-slate-600')"
                                        x-text="diffMarker(line.kind)"></span>
                                  <span class="whitespace-pre px-2 pr-3"
                                        :class="line.kind === 'add' ? 'text-emerald-100' : (line.kind === 'del' ? 'text-rose-100' : 'text-slate-300')"
                                        x-text="line.text"></span>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                  <template x-if="dirtyDetailLoading">
                    <div class="mt-3 text-xs text-slate-500">Loading dirty diff...</div>
                  </template>
                </div>
              </div>

              <div class="mt-6">
                <div class="mx-auto flex max-w-6xl justify-end">
                  <button type="button"
                          class="h-11 rounded-2xl border border-white/10 px-4 text-sm font-semibold text-slate-300"
                          @click="selectedDirtyRow = null">Close</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </template>
    </div>
  </section>
</div>
