<div x-data="sessionViewerPage()" class="session-viewer" data-mode="page"
     x-effect="$el.setAttribute('data-mode', _mode)">

  <!-- Loading. auto-7v712 PART 1: the pre-ready slot renders the same
       phase chip + label as the list card (window.Autonomy.lifecycle.*
       derivation, design rev 63542418). When the registry SSE hasn't
       populated the store yet, fall back to the legacy "Connecting..."
       text. The byte-progress branch (loadProgress > 0) is a separate
       signal about JSONL download progress and stays unchanged. -->
  <template x-if="state === 'loading'">
    <div class="sv-loading">
      <template x-if="loadProgress > 0">
        <span>
          Loading session...
          <span x-text="loadedMB + ' / ' + totalMB + ' MB'"></span>
          <span x-text="'(' + loadProgress + '%)'"></span>
        </span>
      </template>
      <template x-if="loadProgress === 0">
        <template x-if="window.Autonomy && window.Autonomy.lifecycle && loadingPhaseRow && window.Autonomy.lifecycle.phaseChip(loadingPhaseRow)">
          <span class="sc-phase-chip"
                :class="window.Autonomy.lifecycle.phaseTone(loadingPhaseRow)"
                data-testid="sv-loading-phase-chip">
            <span class="sc-phase-dot"></span>
            <span x-text="window.Autonomy.lifecycle.phaseChip(loadingPhaseRow)"></span>
          </span>
        </template>
        <template x-if="!(window.Autonomy && window.Autonomy.lifecycle && loadingPhaseRow && window.Autonomy.lifecycle.phaseChip(loadingPhaseRow))">
          <span>Connecting to session...</span>
        </template>
      </template>
    </div>
  </template>

  <!-- Error -->
  <template x-if="state === 'error'">
    <div class="sv-error" x-text="errorMsg"></div>
  </template>

  <!-- Main viewer -->
  <template x-if="state === 'ready'">
    <div class="sv-ready">

      <!-- Row 1: Header — 2 rows, translucent, collapsible -->
      <div class="sv-header" data-testid="session-header"
           :class="{ 'open': headerOpen }"
           @click="headerOpen = !headerOpen">
        <div class="sv-header-inner sv-header-inner--with-back">
          <button type="button"
                  class="sv-back-button"
                  @click.stop="backToSessionsList()"
                  aria-label="Back to sessions"
                  title="Back to sessions">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.6"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="sv-header-content">
          <!-- Header row 1: status dot, role badge, indicator rail, terminal toggle, chevron -->
          <div class="sv-header-row1" style="display:flex;align-items:center;gap:12px;margin-top:3px;">
            <button type="button"
                    class="indicator-dot voice-dot-button"
                    :class="window.Autonomy.voice.ui.viewerDotClasses(sessionKey, { isLive: isLive, isWorking: isWorking })"
                    :title="window.Autonomy.voice.ui.dotTitle(sessionKey, { isLive: isLive })"
                    :aria-label="window.Autonomy.voice.ui.dotAriaLabel(sessionKey, { isLive: isLive })"
                    :disabled="window.Autonomy.voice.ui.dotDisabled(sessionKey, { isLive: isLive })"
                    @pointerdown.stop="window.Autonomy.voice.ui.onPointerDown($event, sessionKey, { isLive: isLive })"
                    @pointerup.stop="window.Autonomy.voice.ui.onPointerUp($event)"
                    @pointercancel.stop="window.Autonomy.voice.ui.onPointerCancel($event)"
                    @click.stop="window.Autonomy.voice.ui.onClick($event, sessionKey, { isLive: isLive })"
                    data-testid="voice-session-dot">
              <!-- Transparent tap-target extender: enlarges the long-press hit
                   area beyond the small visual dot WITHOUT resizing it. Scoped
                   to the viewer corner toggle only (the card dot has no such
                   child). aria-hidden + transparent → no visual, no a11y noise. -->
              <span class="voice-dot-hit" aria-hidden="true"></span>
              <!-- Pending-message ring overlay (auto-xkdoi) — mirrors the card dot. -->
              <span class="sc-pending-ring"
                    x-show="!!window.outboxPendingState(sessionKey)"
                    :class="window.outboxPendingState(sessionKey) === 'unconfirmed' ? 'sc-pending-ring--unconfirmed' : 'sc-pending-ring--sending'"
                    data-testid="session-pending-ring"
                    aria-hidden="true"></span>
              <svg x-show="window.Autonomy.voice.ui.showMicGlyph(sessionKey, { isLive: isLive })"
                   class="voice-dot-glyph"
                   viewBox="0 0 16 16"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="1.7"
                   stroke-linecap="round"
                   stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M8 2.6a2 2 0 0 1 2 2v3.4a2 2 0 1 1-4 0V4.6a2 2 0 0 1 2-2Z"></path>
                <path d="M4.8 7.8a3.2 3.2 0 0 0 6.4 0"></path>
                <path d="M8 11v2.1"></path>
                <path d="M6.2 13.1h3.6"></path>
                <path x-show="window.Autonomy.voice.ui.showMuteSlash(sessionKey, { isLive: isLive })"
                      class="voice-dot-glyph__slash"
                      d="M3.4 12.6 12.6 3.4"></path>
              </svg>
            </button>
            <span class="sc-role sc-type-host"
                  x-show="sessionType === 'host'"
                  x-text="'HOST'"
                  data-testid="session-type"></span>
            <span class="sc-role"
                  x-show="role"
                  x-text="role ? role.charAt(0).toUpperCase() + role.slice(1) : ''"
                  data-testid="session-role"></span>
            <!-- A live session has a short interval before the agent knows
                 enough to name its work and choose a role. Keep that state
                 composed like the finished header instead of leaving an
                 orphaned status dot beside a blank row. This is presentation
                 only; it disappears as soon as a real role arrives. Host
                 sessions already have the HOST type badge in this slot. -->
            <span class="sc-role sv-identity-placeholder"
                  x-show="isLive && sessionType !== 'host' && !role"
                  data-testid="session-role-placeholder">New Session</span>
            <template x-for="item in sessionContributionBadges" :key="item.id">
              <a class="sc-session-contribution sc-session-contribution--badge sv-session-contribution-badge"
                 :href="item.href"
                 :title="item.title"
                 :aria-label="item.title || item.label"
                 :style="window.Autonomy.sessionContributions.style(item)"
                 @click.prevent.stop="openSessionContribution(item)"
                 data-testid="session-viewer-contribution-badge">
                <span class="sc-session-contribution__icon" x-html="item.icon_svg"></span>
                <span class="sc-session-contribution__label" x-text="item.label"></span>
              </a>
            </template>
            <div style="flex:1"></div>
            <!-- Right cluster: entries count + ⌥ / ESC / >_ / chevron.
                 Wrapped in its own flex with a wider gap so the icons
                 breathe; the parent row's 12px stays for the left
                 badges. -->
            <div class="sv-header-actions">
              <template x-if="!isLive && !resumeStarting">
                <span class="text-xs text-gray-500" x-text="entries.length + ' entries'"></span>
              </template>
              <!-- Boot indicator while a resume started from inside the
                   viewer is in flight. Feeds the SAME lifecycle derivation
                   the list card uses, via _resumePhaseRow (resolved pinned
                   false) so the historical JSONL doesn't short-circuit the
                   phase chip straight to "ready". -->
              <template x-if="resumeStarting && window.Autonomy && window.Autonomy.lifecycle && _resumePhaseRow">
                <span class="sc-phase-chip"
                      :class="window.Autonomy.lifecycle.phaseTone(_resumePhaseRow)"
                      data-testid="sv-resume-phase-chip">
                  <span class="sc-phase-dot"></span>
                  <span x-text="window.Autonomy.lifecycle.phaseChip(_resumePhaseRow) || 'Resuming…'"></span>
                </span>
              </template>
              <!-- Workspace-changes indicator. Same shape as the overlay
                   control in base.html; both bind to the same component
                   getter and open the persistent worktree review overlay,
                   falling back to /worktrees?session=... only if needed. -->
              <button type="button"
                      class="sv-term-toggle"
                      :class="{ 'workspace-lit': hasCommitsAhead, 'workspace-review-loading': workspaceReviewLoading }"
                      @click.stop="openWorkspaceReview()"
                      x-show="hasWorkspaceChanges"
                      :title="workspaceStatusTooltip"
                      data-testid="session-worktree-review-button"
                      aria-label="Open worktree review"
                      style="display:none;"><span class="sv-term-glyph">⌥</span></button>
              <template x-for="item in sessionContributionActions" :key="item.id">
                <button type="button"
                        class="sv-term-toggle sv-session-contribution-action"
                        @click.stop="openSessionContribution(item)"
                        :title="item.title"
                        :aria-label="item.title || item.label"
                        :style="window.Autonomy.sessionContributions.style(item)"
                        :data-plugin-id="item.plugin_id"
                        data-testid="session-viewer-contribution-action">
                  <span class="sv-session-contribution-action__icon" x-html="item.icon_svg"></span>
                </button>
              </template>
              <template x-if="_tmuxSession && isLive">
                <button class="sv-term-toggle sv-term-escape"
                        @click.stop="interrupt()"
                        aria-label="Send Escape"
                        title="Send Escape">
                  <span class="sv-term-escape-label">ESC</span>
                </button>
              </template>
              <template x-if="_tmuxSession && isLive && isClaudeHarness">
                <button class="sv-term-toggle sv-term-background"
                        @click.stop="background()"
                        aria-label="Send Ctrl-B"
                        title="Send Ctrl-B to background">
                  <span class="sv-term-background-label">^B</span>
                </button>
              </template>
              <template x-if="_tmuxSession && isLive">
                <button class="sv-term-toggle"
                        :class="{ 'active': showTerminal }"
                        @click.stop="toggleTerminal()"
                        aria-label="Toggle terminal view"
                        title="Toggle terminal">
                  <span class="sv-term-glyph">&gt;_</span>
                </button>
              </template>
              <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                   style="transition:transform 0.25s ease;color:#6b7280;flex-shrink:0;"
                   :style="headerOpen ? 'transform:rotate(180deg);color:#6b7280' : 'color:#6b7280'">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
          <!-- Header row 2: title, tokens.
               Title is intentionally static (non-contenteditable): a second
               focusable element on the page causes iOS to show its form-nav
               accessory bar when the composer is focused. Label editing lives
               in the expanded panel below (src 634a761d-063 turns 115-117). -->
          <div class="sv-header-row2" style="display:flex;align-items:center;gap:6px;padding-top:2px;">
            <template x-if="_tmuxSession && isLive">
              <span class="session-title"
                    style="font-size:14px;font-weight:500;color:#e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;"
                    x-text="_label || _tmuxSession"></span>
            </template>
            <template x-if="_tmuxSession && !isLive">
              <span class="session-title"
                    style="font-size:14px;font-weight:500;color:#e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;"
                    x-text="_label || _tmuxSession"></span>
            </template>
            <template x-if="!_tmuxSession">
              <span class="session-title"
                    style="font-size:14px;font-weight:500;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;"
                    x-text="sessionId.slice(0, 12)"></span>
            </template>
            <span class="tokens" x-show="contextTokens > 0"
                  style="font-size:11px;font-variant-numeric:tabular-nums;color:#6b7280;"
                  x-text="Math.round(contextTokens / 1000) + 'k'"></span>
            <span x-show="agentTestProgress && ['collecting', 'running', 'suspect'].includes(agentTestProgress.status)"
                  x-cloak
                  class="agent-test-progress"
                  :title="agentTestProgress.completed + ' of ' + (agentTestProgress.total || '?') + ' tests completed'"
                  x-text="agentTestProgress.status === 'collecting' ? '—%' : (agentTestProgress.percent + '%')"
                  :style="'font-size:11px;font-variant-numeric:tabular-nums;color:' + (agentTestProgress.status === 'suspect' ? '#fbbf24' : '#67e8f9') + ';white-space:nowrap;'" ></span>
          </div>
          </div>

        </div>

        <!-- Expanded header: topics section + stats grid.
             Sibling of .sv-header-inner so safe-area padding is not doubled.
             Visibility driven by CSS (.sv-header.open max-height animation). -->
        <div class="sv-header-expanded" @click.stop>

          <!-- Tab strip — only renders when the session has a todo list.
               When hidden, the Topics section reverts to its static heading.
               `selectedDrawerTab` auto-resets to 'topics' on empty transition
               via x-effect below, so there is no stuck-tab state. -->
          <template x-if="hasTodos">
            <div class="sv-drawer-tabs" data-testid="drawer-tabs">
              <button class="sv-drawer-tab"
                      :class="{ 'sv-drawer-tab--active': selectedDrawerTab === 'topics' }"
                      @click.stop="selectedDrawerTab = 'topics'"
                      data-testid="drawer-tab-topics">Topics</button>
              <button class="sv-drawer-tab"
                      :class="{ 'sv-drawer-tab--active': selectedDrawerTab === 'todos' }"
                      @click.stop="selectedDrawerTab = 'todos'"
                      data-testid="drawer-tab-todos">Todos</button>
            </div>
          </template>

          <!-- Identity-refresh nudge: agents sometimes forget to set their
               label/topics/role after the operator briefs them. When the
               drawer expands and any of those is missing, surface a button
               that pings the session via CrossTalk to update them. -->
          <template x-if="isLive && _tmuxSession && (!_label || !topics || topics.length === 0)">
            <div class="sv-exp-section">
              <button type="button"
                      class="sv-identity-refresh-btn"
                      :disabled="identityRefreshState !== 'idle'"
                      @click.stop="requestIdentityRefresh()"
                      data-testid="drawer-identity-refresh-button">
                <template x-if="identityRefreshState === 'idle'">
                  <span>Ask agent to set title &amp; topics</span>
                </template>
                <template x-if="identityRefreshState === 'sending'">
                  <span>Sending&hellip;</span>
                </template>
                <template x-if="identityRefreshState === 'sent'">
                  <span>&check; Asked — awaiting update</span>
                </template>
              </button>
            </div>
          </template>

          <!-- Resume affordance for a terminated, still-resumable session.
               Same /api/session/resume action as the list card's Resume
               button; the difference is the operator is already in the
               viewer, so resumeFromViewer() drives the terminated→starting
               →ready transition in place (boot chip in header row 1). -->
          <template x-if="canResume || resumeStarting">
            <div class="sv-exp-section">
              <button type="button"
                      class="sv-identity-refresh-btn"
                      :disabled="resumeStarting"
                      @click.stop="resumeFromViewer()"
                      data-testid="drawer-resume-button">
                <template x-if="!resumeStarting"><span>&#9656; Resume session</span></template>
                <template x-if="resumeStarting"><span>Resuming&hellip;</span></template>
              </button>
              <template x-if="resumeStartErr">
                <div x-text="resumeStartErr"
                     data-testid="drawer-resume-error"
                     style="color:#f87171;font-size:11px;margin-top:4px;"></div>
              </template>
            </div>
          </template>

          <template x-if="(topics && topics.length > 0) || hasTodos">
            <div class="sv-exp-section">
              <template x-if="!hasTodos">
                <div class="sv-exp-heading">TOPICS</div>
              </template>
              <template x-if="selectedDrawerTab === 'topics'">
                <div class="sv-exp-topics" data-testid="drawer-panel-topics">
                  <template x-for="(topic, idx) in topics" :key="idx">
                    <span class="sv-exp-topic-item" x-text="topic"></span>
                  </template>
                </div>
              </template>
              <template x-if="hasTodos && selectedDrawerTab === 'todos'">
                <ul class="sv-todo-list" data-testid="drawer-panel-todos">
                  <template x-for="todo in todos" :key="todo.task_id">
                    <li class="sv-todo-item"
                        :class="'sv-todo-item--' + (todo.status || 'pending')">
                      <span class="todo-status"
                            :class="'todo-status--' + (todo.status || 'pending')"
                            x-text="todo.status === 'completed' ? '\u2713' : ''"></span>
                      <span class="sv-todo-label" x-text="todo.subject"></span>
                    </li>
                  </template>
                </ul>
              </template>
            </div>
          </template>

          <div class="sv-exp-section">
            <div class="sv-exp-stats-grid">
              <div class="sv-exp-stat-cell">
                <div class="sv-exp-stat-key">TURNS</div>
                <div class="sv-exp-stat-val" x-text="window.SessionStats.turnsStr({entryCount: entryCount}) || '—'"></div>
              </div>
              <div class="sv-exp-stat-cell">
                <div class="sv-exp-stat-key">CTX</div>
                <div class="sv-exp-stat-val"
                     :class="window.SessionStats.ctxWarn({contextTokens: contextTokens}) ? 'warn' : ''"
                     x-text="window.SessionStats.ctxStr({contextTokens: contextTokens}) || '—'"></div>
              </div>
              <div class="sv-exp-stat-cell">
                <div class="sv-exp-stat-key">IDLE</div>
                <div class="sv-exp-stat-val"
                     :class="'recent-' + window.SessionStats.recencyColor({lastActivity: lastActivity})"
                     x-text="window.SessionStats.idleStr({lastActivity: lastActivity}) || '—'"></div>
              </div>
              <template x-if="_tmuxSession">
                <div class="sv-exp-stat-cell sv-exp-stat-copy">
                  <div class="sv-exp-stat-key">TMUX</div>
                  <button class="sv-exp-stat-val sv-exp-stat-copyable"
                          :class="{ 'is-copied': copiedField === 'tmux' }"
                          @click.stop="copyTmuxSession()"
                          :title="'Copy teamwork session: ' + _tmuxSession"
                          x-text="_tmuxSession"></button>
                </div>
              </template>
              <template x-if="org">
                <div class="sv-exp-stat-cell">
                  <div class="sv-exp-stat-key">WORKSPACE</div>
                  <div class="sv-exp-stat-val sv-exp-stat-with-icon"
                       :title="org.resolved ? ((workspaceName || '?') + ' · ' + org.name) : (workspaceName || '?')">
                    <span class="sc-org"
                          :class="org.favicon ? 'sc-org-favicon' : ''"
                          :style="org.favicon ? '' : `background:${org.color}`"
                          :title="org.resolved ? org.name : ('legacy: ' + (project || 'unknown'))">
                      <template x-if="!org.favicon">
                        <svg class="sc-org-initial" width="16" height="16" viewBox="0 0 16 16" preserveAspectRatio="xMidYMid meet">
                          <text x="8" y="8" text-anchor="middle" dominant-baseline="central"
                                font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
                                font-size="11" font-weight="700" fill="#ffffff"
                                x-text="org.initial"></text>
                        </svg>
                      </template>
                      <img class="sc-org-img" :src="org.favicon" x-show="org.favicon" :alt="org.name">
                    </span>
                    <span x-text="workspaceName || '?'"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>

        </div>

      </div>

      <!-- Row 2: Scrollable entries (tap to dismiss keyboard) -->
      <div class="sv-transcript" x-show="!showTerminal">
      <div class="sv-entries" x-show="!showTerminal" x-ref="entriesContainer"
           @scroll="onScroll()"
           onclick="var el = document.querySelector('.sv-editable'); if (el) el.blur()">

        <div class="sv-history-load" x-show="hasMoreHistory || loadingOlder" style="display:none;">
          <button type="button"
                  class="sv-history-load-btn"
                  :disabled="loadingOlder"
                  @click="loadOlder()"
                  x-text="loadingOlder ? 'Loading older…' : 'Load older'"></button>
        </div>

        <!-- Empty state for new sessions with no entries yet -->
        <template x-if="entries.length === 0">
          <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
            <div class="text-center text-gray-500">
              <div class="text-sm">Session started</div>
              <div class="text-xs mt-1 text-gray-600">Send a message to begin</div>
            </div>
          </div>
        </template>

        {% include "partials/session-entries.html" %}
      </div>

      <button type="button"
              class="sv-jump-to-bottom"
              x-show="showJumpToBottom && !showTerminal"
              x-transition.opacity
              @click="jumpToBottom()"
              data-testid="session-jump-to-bottom"
              aria-label="Jump to latest"
              title="Jump to latest"
              style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>
      </div>

      <!-- Terminal region — full-screen xterm.js view; swaps the chat body when showTerminal is true -->
      <div class="sv-terminal" x-show="showTerminal" x-ref="termContainer"></div>

      {# Pending / dictation tiles — shared with the design chat panel. #}
      {% include "partials/session-pending-tiles.html" %}

      <!-- Row 3: Input bar (contenteditable, shown when linked to tmux) -->
      <template x-if="!showTerminal && isLive && _tmuxSession && (sessionType !== 'host' || _linked)">
        <div class="sv-input"
             x-show="showInlineComposer && !window.Autonomy.voice.shell.hideInlineComposer()"
             @dragenter.prevent="$el.classList.add('drop-highlight')"
             @dragover.prevent="$el.classList.add('drop-highlight')"
             @dragleave.prevent="$el.classList.remove('drop-highlight')"
             @drop.prevent="$el.classList.remove('drop-highlight'); addFiles($event.dataTransfer.files)">

          <div class="sv-voice-import" x-show="showDesktopVoiceImport">
            <div class="sv-voice-import__preview"
                 x-text="desktopVoicePreview"></div>
            <button type="button"
                    class="sv-voice-import__button"
                    @click="importVoiceBufferToComposer()">Load Into Draft</button>
          </div>

          <!-- Attachment preview strip -->
          <div class="sv-attach-strip" x-show="attachments.length > 0">
            <template x-for="att in attachments" :key="att.id">
              <div class="thumb-wrap">
                <template x-if="att.isImage && att.dataUrl">
                  <img :src="att.dataUrl">
                </template>
                <template x-if="!att.isImage || !att.dataUrl">
                  <div class="thumb-file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                      <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span x-text="att.name"></span>
                  </div>
                </template>
                <button class="thumb-x" @click="removeAttachment(att.id)">&times;</button>
              </div>
            </template>
          </div>

          <div class="sv-input-row">
            <!-- Hidden file input -->
            <input type="file"
                   x-ref="fileInput"
                   accept="image/*,*/*"
                   multiple
                   style="display:none"
                   @change="addFiles($event.target.files); $event.target.value=''">

            <!-- Attach button (plus, matches input-prototype) -->
            <button class="sv-attach"
                    @click="$refs.fileInput.click()"
                    :disabled="uploading"
                    title="Attach file">
              <template x-if="!uploading">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </template>
              <template x-if="uploading">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="animate-spin"><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
              </template>
            </button>

            <!-- Contenteditable message input + send button (iMessage-style bubble) -->
            <div class="sv-input-bubble">
              <div class="sv-editable"
                   x-ref="messageInput"
                   contenteditable="true"
                   data-placeholder="Message..."
                   role="textbox"
                   aria-multiline="true"
                   oninput="Alpine.$data(this.closest('[x-data]')).onInput(this)"
                   onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();Alpine.$data(this.closest('[x-data]')).sendMessage()}"
                   onpaste="var e=event; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text/plain'));"></div>
              <button type="button"
                      class="sv-send"
                      id="sendBtn"
                      @click="sendMessage()"
                      onmousedown="event.preventDefault()"
                      aria-label="Send message"
                      :disabled="!canSendComposer || sending || uploading">
                <template x-if="!sending">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94l18.04-8.5a.75.75 0 000-1.38l-18.04-8.5z"/></svg>
                </template>
                <template x-if="sending">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="animate-spin"><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
                </template>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- Row 3 alt: Link Terminal (when host session not yet linked) -->
      <template x-if="!showTerminal && isLive && !_linked && sessionType === 'host'">
        <div class="sv-input">
          <div class="sv-input-row" style="padding:10px 0.5rem;">

            <!-- Idle: show Link Terminal button -->
            <template x-if="linkState === 'idle'">
              <button @click="showLinkPicker()"
                      class="w-full min-h-[44px] bg-amber-700 hover:bg-amber-600 text-white rounded-lg text-sm font-medium">
                Link Terminal
              </button>
            </template>

            <!-- Picking: show candidate list -->
            <template x-if="linkState === 'picking'">
              <div class="space-y-2" style="width:100%;">
                <div class="text-xs text-gray-400 font-medium">Select a tmux session to link:</div>

                <template x-if="linkCandidates.length === 0">
                  <div class="text-xs text-gray-500 py-2">No unclaimed terminals available</div>
                </template>

                <template x-for="(c, ci) in linkCandidates" :key="c.tmux_session">
                  <label class="flex items-center gap-2 p-2 rounded cursor-pointer hover:bg-gray-700"
                         :class="selectedTmux === c.tmux_session ? 'bg-gray-700 ring-1 ring-amber-500' : ''">
                    <input type="radio" name="link-tmux" :value="c.tmux_session"
                           x-model="selectedTmux" class="accent-amber-500">
                    <span class="text-sm text-gray-200 font-mono" x-text="c.tmux_session"></span>
                    <span class="text-xs text-gray-500" x-text="Math.floor(c.elapsed_seconds / 60) + 'm ago'"></span>
                    <span class="text-xs text-gray-600 truncate max-w-[200px]" x-text="c.cmd"></span>
                  </label>
                </template>

                <div class="flex gap-2">
                  <button @click="resetLink()"
                          class="flex-1 min-h-[44px] bg-gray-700 hover:bg-gray-600 text-gray-300 rounded-lg text-sm">
                    Cancel
                  </button>
                  <button @click="confirmLink()"
                          :disabled="!selectedTmux"
                          class="flex-1 min-h-[44px] bg-amber-700 hover:bg-amber-600 text-white rounded-lg text-sm font-medium
                                 disabled:opacity-50 disabled:cursor-not-allowed">
                    Confirm Link
                  </button>
                </div>
              </div>
            </template>

            <!-- Handshaking: spinner -->
            <template x-if="linkState === 'handshaking'">
              <div class="flex items-center justify-center gap-2 py-3" style="width:100%;">
                <span class="animate-spin text-amber-400">&#x21BB;</span>
                <span class="text-sm text-gray-400">Sending handshake&hellip;</span>
              </div>
            </template>

            <!-- Failed: error + retry -->
            <template x-if="linkState === 'failed'">
              <div class="space-y-2" style="width:100%;">
                <div class="text-sm text-red-400" x-text="linkError"></div>
                <button @click="resetLink()"
                        class="w-full min-h-[44px] bg-amber-700 hover:bg-amber-600 text-white rounded-lg text-sm font-medium">
                  Try Again
                </button>
              </div>
            </template>

          </div>
        </div>
      </template>


    </div>
  </template>

</div>
