<!-- Search results — filter-strip chrome (auto-zvu3z).
     Translated from Design Studio 09baf3a5-9ec ("Search chrome v4 — filter
     strip only"). Cards still come from cb23bd8b-1a7 (auto-bcxdr).

     Chrome rules:
       - NO back button, NO page-level search input.
       - Row 1: Org + publication-state + sort + ranking-lens chips.
       - Row 2: horizontal-scrolling type pills.
       - Row 3: summary row.

     The global "Search graph…" input in the top bar is the canonical query
     input. While on /search it is two-way bound to this page's ``query``
     ref via the ``global-search:input`` and ``global-search:enter`` custom
     events emitted by static/app.js.

     Pinning the org chip sets the ``X-Graph-Org`` header (caller_org) on
     subsequent /api/search calls — NOT ``?only_org=`` — so search treats
     the picked org as the caller (full surface), not as a peer. -->
<style>
  .sp-root {
    --sp-bg: #111827; --sp-surface: #1f2937; --sp-border: #374151;
    --sp-text-1: #e5e7eb; --sp-text-2: #9ca3af; --sp-text-3: #6b7280; --sp-text-4: #4b5563;
    --sp-accent: #818cf8; --sp-accent-bg: #4f46e540;
    --note: #eab308; --session: #4ade80; --agent-run: #fb923c;
    --conversation: #60a5fa; --docs: #2dd4bf; --status: #94a3b8; --musing: #c084fc;
    --note-bg: #eab30815; --session-bg: #4ade8015; --agent-run-bg: #fb923c15;
    --conversation-bg: #60a5fa15; --docs-bg: #2dd4bf15; --status-bg: #94a3b815;
    --musing-bg: #c084fc15;
    --chip-off: #374151; --chip-on: #4f46e5;
  }

  /* ── Sticky filter strip ──────────────────────── */
  /* The base.html ``body.route-search .sp-header`` rule overrides
     ``margin-top`` and ``padding-top`` to wire up the route-specific
     spacing (Round 7m: 8px breathing room above the chip row). This
     in-component rule covers the non-route case (mock fixtures, design
     studio previews) where the route class isn't applied. */
  .sp-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--sp-bg);
    padding: 8px 16px 0;
    border-bottom: 1px solid var(--sp-border);
    margin: 0 -16px;
  }
  .sp-filter-row-1 {
    display: flex; gap: 8px; padding-bottom: 6px;
    align-items: center; flex-wrap: wrap;
  }
  /* Round 7l: each chip + its dropdown sit inside a position:relative
     wrapper so the dropdown anchors under its OWN button. Previously the
     row itself was the positioned ancestor and every dropdown rendered
     at the row's left:0 regardless of which chip was clicked. */
  .sp-filter-anchor {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  /* ── Filter chips (org + publication state + sort) ───
     Round 7m: padding tightened from 0 10px → 0 8px and the
     "Org:"/"State:"/"Sort:" labels + trailing caret were dropped so all
     three chips fit in one row at iPhone width (390px). The glyph alone
     communicates each chip's purpose. */
  .sp-filter-chip {
    flex-shrink: 0; height: 30px;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--sp-surface); border: 1px solid var(--sp-border);
    border-radius: 8px; padding: 0 8px;
    font-size: 12px; color: var(--sp-accent); font-weight: 500;
    cursor: pointer; user-select: none; line-height: 1;
  }
  .sp-filter-chip:hover { background: #283548; }
  .sp-filter-chip-glyph {
    width: 16px; height: 16px; flex-shrink: 0;
    border-radius: 3px; background: #6c63ff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    overflow: hidden;
  }
  .sp-filter-chip-glyph img { width: 100%; height: 100%; object-fit: cover; }
  /* "All orgs" glyph — muted dark, NOT a rainbow gradient. This is a
     "no filter applied" state, not a colorful highlight. */
  .sp-filter-chip-glyph.sp-filter-chip-all {
    background: #2a3441;
    color: #6b7280;
    border: 1px solid var(--sp-border);
    font-size: 11px;
    font-weight: 600;
  }
  /* State chip glyph — bar graph showing current restrictiveness.
     Raw = 1 filled bar (floor); Canonical = 4 filled bars (ceiling). */
  .sp-state-glyph {
    width: 16px; height: 12px; flex-shrink: 0;
    background: transparent; border: none;
    display: inline-flex; align-items: center; gap: 1px;
  }
  .sp-state-glyph-bar {
    width: 3px; height: 8px;
    background: #2a3441; border-radius: 1px;
  }
  .sp-state-glyph-bar.sp-state-glyph-bar-filled {
    background: var(--sp-accent);
  }
  /* Sort chip glyph — three descending lines (sort/list metaphor),
     same lightweight aesthetic as the State chip's bar graph: no
     background, just inline shapes that scale with the chip. Round
     7m introduced this so the Sort chip carries a glyph like Org and
     State, keeping the row visually consistent after the labels were
     dropped. */
  .sp-order-glyph {
    width: 14px; height: 12px; flex-shrink: 0;
    display: inline-flex; flex-direction: column;
    justify-content: center; align-items: flex-start; gap: 2px;
  }
  .sp-order-glyph-line {
    height: 2px; background: var(--sp-accent); border-radius: 1px;
  }
  .sp-order-glyph-line-1 { width: 12px; }
  .sp-order-glyph-line-2 { width: 9px; }
  .sp-order-glyph-line-3 { width: 6px; }

  /* Ranking lens — an A/B instrument, not a generic settings toggle.
     The fork glyph converges three query formulations into one ranked list;
     Smart illuminates the junction while Legacy stays neutral. */
  .sp-ranker-glyph {
    position: relative; width: 16px; height: 14px; flex-shrink: 0;
    display: inline-block;
  }
  .sp-ranker-glyph-path,
  .sp-ranker-glyph-out {
    position: absolute; display: block; height: 2px;
    border-radius: 2px; background: var(--sp-accent);
    transform-origin: right center;
  }
  .sp-ranker-glyph-path { left: 0; width: 10px; }
  .sp-ranker-glyph-path-1 { top: 2px; transform: rotate(26deg); }
  .sp-ranker-glyph-path-2 { top: 6px; }
  .sp-ranker-glyph-path-3 { top: 10px; transform: rotate(-26deg); }
  .sp-ranker-glyph-out { right: 0; top: 6px; width: 6px; }
  .sp-ranker-glyph::after {
    content: ''; position: absolute; width: 4px; height: 4px;
    right: 4px; top: 5px; border-radius: 50%;
    background: var(--sp-text-3); box-shadow: 0 0 0 2px var(--sp-surface);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .sp-ranker-glyph-smart::after {
    background: #a5b4fc;
    box-shadow: 0 0 0 2px var(--sp-surface), 0 0 8px #818cf899;
  }
  .sp-ranker-dropdown { min-width: 286px; padding: 6px; }
  .sp-ranker-option {
    align-items: flex-start; padding: 9px 10px; gap: 9px;
  }
  .sp-ranker-option-mark {
    width: 16px; height: 16px; margin-top: 1px; flex-shrink: 0;
    border: 1px solid #4b5563; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sp-ranker-option-mark::after {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: transparent;
  }
  .sp-org-option-selected .sp-ranker-option-mark {
    border-color: var(--sp-accent);
  }
  .sp-org-option-selected .sp-ranker-option-mark::after {
    background: var(--sp-accent);
  }
  .sp-ranker-option-copy { min-width: 0; flex: 1; }
  .sp-ranker-option-title {
    display: flex; align-items: center; gap: 7px;
    color: var(--sp-text-1); font-size: 13px; font-weight: 600;
  }
  .sp-ranker-option-description {
    display: block; margin-top: 3px; color: var(--sp-text-3);
    font-size: 11px; line-height: 1.35;
  }
  .sp-ranker-option-badge {
    padding: 1px 5px; border-radius: 999px;
    border: 1px solid #6366f166; background: #4f46e522;
    color: #a5b4fc; font-size: 8px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .sp-ranker-chip-mobile { display: none; }
  @media (max-width: 430px) {
    .sp-filter-row-1 { gap: 6px; }
    .sp-ranker-chip-full { display: none; }
    .sp-ranker-chip-mobile { display: inline; }
    .sp-state-dropdown.sp-ranker-dropdown { left: auto; right: 0; }
  }

  .sp-filter-chip-value { color: #c4b5fd; font-weight: 600; }

  .sp-org-dropdown {
    position: absolute; top: 36px; left: 0; z-index: 20;
    background: #1a2332; border: 1px solid var(--sp-border);
    border-radius: 8px; padding: 4px; min-width: 220px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .sp-state-dropdown {
    position: absolute; top: 36px; left: 0; z-index: 20;
    background: #1a2332; border: 1px solid var(--sp-border);
    border-radius: 8px; padding: 4px; min-width: 180px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .sp-org-option {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    font-size: 13px; color: var(--sp-text-1); cursor: pointer;
    width: 100%; border: none; background: none; text-align: left;
  }
  .sp-org-option:hover { background: #1e293b; }
  .sp-org-option.sp-org-option-selected {
    background: #1e1b4b; color: var(--sp-accent);
  }
  .sp-org-option-glyph {
    width: 18px; height: 18px; border-radius: 4px;
    background: #6c63ff; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
    overflow: hidden;
  }
  .sp-org-option-glyph img { width: 100%; height: 100%; object-fit: cover; }
  /* Muted "All orgs" option in the dropdown — same neutral treatment as
     the chip glyph, not a rainbow gradient. */
  .sp-org-option-glyph.sp-org-option-glyph-all {
    background: #2a3441;
    color: #6b7280;
    border: 1px solid var(--sp-border);
    font-size: 11px;
    font-weight: 600;
  }
  .sp-org-option-meta {
    margin-left: auto; font-size: 10px; color: #64748b;
  }

  /* State dropdown — restrictiveness ladder.
     Each option carries a 4-bar glyph. Bars increase in height
     left-to-right (state-h1 .. state-h4) and fill in as the option
     becomes more restrictive (Raw = 1 filled, Canonical = 4 filled). */
  .sp-state-option-bars {
    display: inline-flex; align-items: center; gap: 1px;
    width: 18px; flex-shrink: 0;
  }
  .sp-state-option-bar {
    width: 3px; background: #2a3441; border-radius: 1px;
  }
  .sp-state-option-bar.sp-state-option-bar-filled {
    background: var(--sp-accent);
  }
  .sp-state-h1 { height: 4px; }
  .sp-state-h2 { height: 7px; }
  .sp-state-h3 { height: 10px; }
  .sp-state-h4 { height: 13px; }
  .sp-state-option-hint {
    font-size: 10px; color: var(--sp-text-3); font-style: italic;
    margin-left: auto;
  }

  /* Empty / loading / no-query branch — clears the sticky filter strip
     so the message lands below it on a fast load. */
  .sp-empty-state {
    padding-top: 16px; margin-top: 4px;
    color: var(--sp-text-3); font-size: 13px;
  }
  .sp-no-query-hint {
    padding: 32px 16px;
    text-align: center;
    color: var(--sp-text-3); font-size: 13px;
  }

  /* Peer pill — painted on cross-org result rows */
  .sp-peer-pill {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 1px 6px; border-radius: 3px;
    color: #94a3b8; background: #1e293b;
    border: 1px dashed #475569;
    cursor: help;
  }

  /* ── Chip rail (type pills, row 2) ────────────── */
  .sp-chip-rail {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sp-chip-rail::-webkit-scrollbar { display: none; }
  .sp-chip {
    flex-shrink: 0; padding: 5px 11px; border-radius: 16px;
    font-size: 12px; font-weight: 500; border: none; cursor: pointer;
    white-space: nowrap; min-height: 28px;
    transition: background 0.15s, color 0.15s;
  }
  .sp-chip-off { background: var(--chip-off); color: var(--sp-text-2); }
  .sp-chip-off:active { background: #4b5563; }
  .sp-chip-on { background: var(--chip-on); color: #fff; }
  .sp-chip-count { opacity: 0.7; margin-left: 3px; }

  /* ── Summary row ──────────────────────────────── */
  .sp-summary-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
    font-size: 13px; color: var(--sp-text-3);
  }
  .sp-summary-query { color: var(--sp-accent); font-weight: 500; }

  /* ── Source cards ─────────────────────────────── */
  .sp-results { padding-bottom: 80px; }
  .sp-source-card {
    display: flex; margin-bottom: 8px;
    border-radius: 10px; overflow: hidden;
    background: var(--sp-surface);
    border: 1px solid var(--sp-border);
    text-decoration: none; color: inherit;
  }
  .sp-source-card:active { background: #283548; }

  /* 3px accent rail */
  .sp-accent-rail {
    width: 3px; flex-shrink: 0; border-radius: 3px 0 0 3px;
  }
  .sp-rail-note { background: var(--note); }
  .sp-rail-session { background: var(--session); }
  .sp-rail-agent-run { background: var(--agent-run); }
  .sp-rail-conversation { background: var(--conversation); }
  .sp-rail-docs { background: var(--docs); }
  .sp-rail-status { background: var(--status); }
  .sp-rail-musing { background: var(--musing); }
  .sp-rail-default { background: var(--sp-text-4); }

  .sp-card-body {
    flex: 1; min-width: 0; padding: 10px 12px;
  }
  .sp-card-meta {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px; flex-wrap: wrap;
  }
  .sp-type-pill {
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    padding: 1px 7px; border-radius: 4px;
    text-transform: uppercase;
  }
  .sp-pill-note { color: var(--note); background: var(--note-bg); }
  .sp-pill-session { color: var(--session); background: var(--session-bg); }
  .sp-pill-agent-run { color: var(--agent-run); background: var(--agent-run-bg); }
  .sp-pill-conversation { color: var(--conversation); background: var(--conversation-bg); }
  .sp-pill-docs { color: var(--docs); background: var(--docs-bg); }
  .sp-pill-status { color: var(--status); background: var(--status-bg); }
  .sp-pill-musing { color: var(--musing); background: var(--musing-bg); }
  .sp-pill-default { color: var(--sp-text-2); background: #ffffff10; }
  .sp-match-count {
    font-size: 11px; color: var(--sp-text-3); margin-left: auto;
  }
  .sp-card-title {
    font-size: 15px; font-weight: 600; color: var(--sp-text-1);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .sp-card-summary {
    font-size: 12px; color: var(--sp-text-2);
    line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }

  /* Excerpts */
  .sp-excerpt {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 4px 0;
    text-decoration: none; color: inherit;
  }
  .sp-excerpt + .sp-excerpt { border-top: 1px solid #ffffff08; }
  .sp-turn-badge {
    flex-shrink: 0; font-size: 11px; font-weight: 600;
    color: var(--sp-text-3); font-family: "SF Mono", ui-monospace, monospace;
    min-width: 32px; padding-top: 1px;
  }
  .sp-excerpt-text {
    font-size: 13px; color: var(--sp-text-2); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sp-excerpt-text mark {
    background: var(--sp-accent-bg); color: var(--sp-accent);
    padding: 0 2px; border-radius: 2px; font-weight: 500;
  }

  .sp-card-footer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; font-size: 11px; color: var(--sp-text-4);
  }
  /* Per-row disambiguator: 12-char source_id prefix in monospace + the
     second-resolution date. Prevents two cards with identical titles
     (e.g. two rollouts of the same tmux session) from looking
     interchangeable. See bead auto-kvka6 §6. */
  .sp-card-id {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--sp-text-3);
    letter-spacing: 0.02em;
  }

  .sp-card-chevron {
    flex-shrink: 0; width: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--sp-text-4); font-size: 14px;
  }
</style>

<div x-data="searchPage()"
     @global-search:input.window="onGlobalSearchInput($event)"
     @global-search:enter.window="onGlobalSearchEnter($event)"
     class="sp-root pb-safe">
  <!-- Sticky filter strip — NO back button, NO page-level search input.
       The global "Search graph…" input in the top header is canonical.
       Hidden entirely when there's no active query so /search (no q) shows
       only the centered "type a query" hint. -->
  <div class="sp-header" data-testid="sp-filter-strip" x-show="query !== ''">

    <!-- Row 1: org + publication-state + sort + ranking-lens chips.
         Round 7l: each chip + its dropdown live inside a
         ``.sp-filter-anchor`` (position:relative) so the dropdown panel
         anchors under its OWN button instead of the row's left edge. -->
    <div class="sp-filter-row-1">
      <!-- Org pin chip — opens dropdown to pin search caller to one org -->
      <div class="sp-filter-anchor">
        <button class="sp-filter-chip"
                data-testid="sp-org-chip"
                @click.stop="toggleOrgDropdown()"
                :title="orgChip.title">
          <span class="sp-filter-chip-glyph"
                :class="orgChip.allOrgs ? 'sp-filter-chip-all' : ''"
                :style="orgChip.glyphStyle">
            <template x-if="!orgChip.favicon">
              <span x-text="orgChip.initial"></span>
            </template>
            <template x-if="orgChip.favicon">
              <img :src="orgChip.favicon" :alt="orgChip.label">
            </template>
          </span>
          <span class="sp-filter-chip-value" x-text="orgChip.label"></span>
        </button>

        <!-- Org dropdown panel (open state) -->
        <div class="sp-org-dropdown"
             data-testid="sp-org-dropdown"
             x-show="orgDropdownOpen"
             @click.outside="orgDropdownOpen = false"
             x-cloak>
          <button class="sp-org-option"
                  :class="!selectedOrg ? 'sp-org-option-selected' : ''"
                  @click="pickOrg('')">
            <span class="sp-org-option-glyph sp-org-option-glyph-all">∞</span>
            <span>All orgs</span>
            <span class="sp-org-option-meta">default</span>
          </button>
          <template x-for="o in orgList" :key="o.slug">
            <button class="sp-org-option"
                    :class="selectedOrg === o.slug ? 'sp-org-option-selected' : ''"
                    @click="pickOrg(o.slug)">
              <span class="sp-org-option-glyph"
                    :style="o.favicon ? '' : `background:${o.color}`">
                <template x-if="!o.favicon">
                  <span x-text="o.initial"></span>
                </template>
                <template x-if="o.favicon">
                  <img :src="o.favicon" :alt="o.name">
                </template>
              </span>
              <span x-text="o.name"></span>
              <span class="sp-org-option-meta" x-text="o.kind"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- Publication-state chip — minimum-state filter. Picking a state
           clamps results to that state OR more restrictive. Raw is the
           floor (everything qualifies, including raw rows from other
           sessions via include_raw=1); Canonical is the ceiling. The
           glyph mirrors the active selection's restrictiveness. -->
      <div class="sp-filter-anchor">
        <button class="sp-filter-chip"
                data-testid="sp-state-chip"
                @click.stop="toggleStateDropdown()"
                title="Filter by minimum publication state (more bars = more restrictive)">
          <span class="sp-state-glyph" data-testid="sp-state-chip-glyph">
            <template x-for="i in 4" :key="i">
              <span class="sp-state-glyph-bar"
                    :class="i <= stateChipFilledBars ? 'sp-state-glyph-bar-filled' : ''"></span>
            </template>
          </span>
          <span class="sp-filter-chip-value" x-text="stateChipLabel"></span>
        </button>

        <!-- Publication-state dropdown panel (open state).
             Order is Raw → Curated → Published → Canonical — top of list is
             least restrictive (= "Any"); bottom is most restrictive. Each
             option carries a 4-bar ladder where the number of filled bars
             communicates restrictiveness. -->
        <div class="sp-state-dropdown"
             data-testid="sp-state-dropdown"
             x-show="stateDropdownOpen"
             @click.outside="stateDropdownOpen = false"
             x-cloak>
          <template x-for="opt in stateOptions" :key="opt.key">
            <button class="sp-org-option"
                    :data-state-key="opt.key"
                    :class="selectedState === opt.key ? 'sp-org-option-selected' : ''"
                    @click="pickState(opt.key)">
              <span class="sp-state-option-bars" data-testid="sp-state-option-bars">
                <template x-for="i in 4" :key="i">
                  <span class="sp-state-option-bar"
                        :class="(i <= opt.bars ? 'sp-state-option-bar-filled ' : '') + 'sp-state-h' + i"></span>
                </template>
              </span>
              <span x-text="opt.label"></span>
              <span class="sp-state-option-hint" x-text="opt.hint"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- Sort chip (Round 7k) — toggles between Relevance (BM25) and
           Recent (created_at DESC). URL is the source of truth via
           ?order=recent. The chip mirrors the State chip's pattern
           (filter chip + dropdown) so the row reads as a coherent
           filter strip. -->
      <div class="sp-filter-anchor">
        <button class="sp-filter-chip"
                data-testid="sp-order-chip"
                @click.stop="toggleOrderDropdown()"
                title="Sort results by relevance or recency">
          <span class="sp-order-glyph" data-testid="sp-order-chip-glyph">
            <span class="sp-order-glyph-line sp-order-glyph-line-1"></span>
            <span class="sp-order-glyph-line sp-order-glyph-line-2"></span>
            <span class="sp-order-glyph-line sp-order-glyph-line-3"></span>
          </span>
          <span class="sp-filter-chip-value" x-text="orderChipLabel"></span>
        </button>

        <!-- Sort dropdown panel (open state). Mirrors the State dropdown
             pattern; ``data-order-key`` lets the L2.B sweep address each
             option deterministically. -->
        <div class="sp-state-dropdown"
             data-testid="sp-order-dropdown"
             x-show="orderDropdownOpen"
             @click.outside="orderDropdownOpen = false"
             x-cloak>
          <template x-for="opt in orderOptions" :key="opt.key">
            <button class="sp-org-option"
                    :data-order-key="opt.key"
                    :class="selectedOrder === opt.key ? 'sp-org-option-selected' : ''"
                    @click="pickOrder(opt.key)">
              <span x-text="opt.label"></span>
              <span class="sp-state-option-hint" x-text="opt.hint"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- Ranking lens — visible only for relevance ordering. The URL keeps
           ?ranker=smart even while Recent is selected so returning to
           Relevance restores the operator's comparison choice. -->
      <div class="sp-filter-anchor"
           x-show="selectedOrder === 'relevance'">
        <button class="sp-filter-chip"
                data-testid="sp-ranker-chip"
                @click.stop="toggleRankerDropdown()"
                aria-haspopup="listbox"
                :aria-expanded="rankerDropdownOpen"
                :title="selectedRanker === 'smart' ? 'Smart query-fusion ranking (experimental)' : 'Legacy relevance ranking (default)'">
          <span class="sp-ranker-glyph"
                data-testid="sp-ranker-chip-glyph"
                :class="selectedRanker === 'smart' ? 'sp-ranker-glyph-smart' : ''">
            <span class="sp-ranker-glyph-path sp-ranker-glyph-path-1"></span>
            <span class="sp-ranker-glyph-path sp-ranker-glyph-path-2"></span>
            <span class="sp-ranker-glyph-path sp-ranker-glyph-path-3"></span>
            <span class="sp-ranker-glyph-out"></span>
          </span>
          <span class="sp-filter-chip-value sp-ranker-chip-full"
                x-text="rankerChipLabel"></span>
          <span class="sp-filter-chip-value sp-ranker-chip-mobile"
                x-text="selectedRanker === 'smart' ? 'S' : 'L'"></span>
        </button>

        <div class="sp-state-dropdown sp-ranker-dropdown"
             data-testid="sp-ranker-dropdown"
             role="listbox"
             x-show="rankerDropdownOpen"
             @click.outside="rankerDropdownOpen = false"
             x-cloak>
          <template x-for="opt in rankerOptions" :key="opt.key">
            <button class="sp-org-option sp-ranker-option"
                    role="option"
                    :aria-selected="selectedRanker === opt.key"
                    :data-ranker-key="opt.key"
                    :class="selectedRanker === opt.key ? 'sp-org-option-selected' : ''"
                    @click="pickRanker(opt.key)">
              <span class="sp-ranker-option-mark"></span>
              <span class="sp-ranker-option-copy">
                <span class="sp-ranker-option-title">
                  <span x-text="opt.label"></span>
                  <span class="sp-ranker-option-badge"
                        x-show="opt.key === 'smart'">Experimental</span>
                </span>
                <span class="sp-ranker-option-description"
                      x-text="opt.description"></span>
              </span>
            </button>
          </template>
        </div>
      </div>
    </div>

    <!-- Row 2: type pills (horizontal scroll) -->
    <div class="sp-chip-rail" data-testid="sp-chip-rail">
      <button class="sp-chip"
              :class="activeType === 'all' ? 'sp-chip-on' : 'sp-chip-off'"
              @click="setType('all')">
        All <span class="sp-chip-count" x-text="results.length"></span>
      </button>
      <template x-for="t in chipTypes" :key="t.key">
        <button class="sp-chip"
                :class="activeType === t.key ? 'sp-chip-on' : 'sp-chip-off'"
                @click="setType(t.key)">
          <span x-text="t.label"></span>
          <span class="sp-chip-count" x-text="t.count"></span>
        </button>
      </template>
    </div>
  </div>

  <!-- Summary row — only when there's a non-empty query AND results -->
  <div class="sp-summary-row" x-show="query !== '' && loaded && results.length > 0">
    <span>
      <span x-text="filteredResults.length"></span> sources ·
      <span x-text="totalMatches"></span> matches for
      <span class="sp-summary-query" x-text="'“' + query + '”'"></span>
    </span>
  </div>

  <!-- Empty-query no-op state — operator hit /search without ?q=.
       Hide chip rail + summary + empty msg; show a single centered hint. -->
  <template x-if="query === ''">
    <div class="sp-no-query-hint" data-testid="sp-no-query-hint">
      Type a query in the search bar above to begin.
    </div>
  </template>

  <!-- Loading — top padding clears the sticky strip on a fast load. -->
  <template x-if="query !== '' && !loaded">
    <div class="sp-empty-state" data-testid="sp-loading-state">Searching…</div>
  </template>

  <!-- Empty — same top padding so the message isn't tucked under the strip. -->
  <template x-if="query !== '' && loaded && results.length === 0">
    <div class="sp-empty-state" data-testid="sp-empty-state">
      No results for "<span x-text="query"></span>"
    </div>
  </template>

  <!-- Results -->
  <template x-if="loaded && results.length > 0">
    <div class="sp-results" data-testid="sp-results">
      <template x-for="r in filteredResults" :key="r.source_id || r.id">
        <a :href="sourceHref(r)"
           @click.prevent="navigateTo(sourceHref(r))"
           class="sp-source-card"
           :data-source-type="r.source_type || ''"
           :data-session-type="rowSessionType(r) || ''"
           :data-chip-key="rowChipKey(r)">
          <div class="sp-accent-rail" :class="railClass(rowPillKey(r))"></div>
          <div class="sp-card-body">
            <!-- Row 1: type pill + org glyph + match count.
                 Round 7k: the badge reads off the chip key (which folds
                 ``metadata.session_type`` into Sessions vs Dispatch)
                 rather than the raw ``source_type`` — so a bead-driven
                 session shows as orange "Dispatch", an interactive
                 session shows as green "Session", and other source
                 types keep their existing colors. -->
            <div class="sp-card-meta">
              <span class="sp-type-pill" :class="pillClass(rowPillKey(r))"
                    x-text="typeLabel(rowChipKey(r))"></span>
              <template x-if="r.org">
                <span class="sc-org"
                      :class="r.org.favicon ? 'sc-org-favicon' : ''"
                      :style="r.org.favicon ? '' : `background:${r.org.color}`"
                      :title="r.org.resolved ? r.org.name : ('legacy: ' + (r.project || 'unknown'))">
                  <template x-if="!r.org.favicon">
                    <svg class="sc-org-initial" width="16" height="16" viewBox="0 0 16 16" preserveAspectRatio="xMidYMid meet">
                      <text x="8" y="8" text-anchor="middle" dominant-baseline="central"
                            font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
                            font-size="11" font-weight="700" fill="#ffffff"
                            x-text="r.org.initial"></text>
                    </svg>
                  </template>
                  <img class="sc-org-img" :src="r.org.favicon" x-show="r.org.favicon" :alt="r.org.name">
                </span>
              </template>
              <template x-if="r.is_peer">
                <span class="sp-peer-pill"
                      data-testid="sp-peer-pill"
                      :title="peerPillTitle(r)">peer</span>
              </template>
              <span class="sp-match-count"
                    x-text="(r.match_count || 1) + ' match' + ((r.match_count || 1) === 1 ? '' : 'es')"></span>
            </div>

            <!-- Row 2: title -->
            <div class="sp-card-title" x-text="r.source_title || 'Untitled'"></div>

            <!-- Row 2.5: short_description (only when present on the source) -->
            <template x-if="r.short_description">
              <div class="sp-card-summary"
                   data-testid="sp-short-description"
                   x-text="r.short_description"></div>
            </template>

            <!-- Row 3: excerpts -->
            <div class="sp-excerpts">
              <template x-for="(ex, i) in cardExcerpts(r)" :key="i">
                <template x-if="ex.turn_number != null">
                  <a class="sp-excerpt"
                     :href="sourceHref(r, ex.turn_number)"
                     @click.prevent.stop="navigateTo(sourceHref(r, ex.turn_number))">
                    <span class="sp-turn-badge" x-text="'t' + ex.turn_number"></span>
                    <span class="sp-excerpt-text" x-html="highlightTerms(ex.content || '', query)"></span>
                  </a>
                </template>
                <template x-if="ex.turn_number == null">
                  <div class="sp-excerpt">
                    <span class="sp-excerpt-text" x-html="highlightTerms(ex.content || '', query)"></span>
                  </div>
                </template>
              </template>
            </div>

            <!-- Row 4: footer (id + second-resolution date — disambiguates
                 cards that share a title, e.g. two rollouts of the same
                 tmux session). The id renders even when ``r.date`` is
                 empty so every card carries a stable identifier. -->
            <div class="sp-card-footer">
              <span class="sp-card-id"
                    data-testid="sp-card-id"
                    x-text="(r.source_id || r.id || '').slice(0, 12)"></span>
              <template x-if="r.date">
                <span x-text="r.date"></span>
              </template>
            </div>
          </div>
          <div class="sp-card-chevron">›</div>
        </a>
      </template>
    </div>
  </template>
</div>
