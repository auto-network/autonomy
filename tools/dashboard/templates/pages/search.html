<!-- Search results — grouped by source, iPhone-first.
     Translated from Design Studio cb23bd8b-1a7 (revision 3 of 51bd7e8d-3bd).
     Source of truth for visuals: do not edit class/var names without updating
     the design. -->
<style>
  .sp-root {
    --sp-bg: #111827; --sp-surface: #1f2937; --sp-border: #374151;
    --sp-text-1: #e5e7eb; --sp-text-2: #9ca3af; --sp-text-3: #6b7280; --sp-text-4: #4b5563;
    --sp-accent: #818cf8; --sp-accent-bg: #4f46e540;
    --note: #eab308; --session: #4ade80; --agent-run: #fb923c;
    --conversation: #60a5fa; --docs: #2dd4bf; --status: #94a3b8; --musing: #c084fc;
    --note-bg: #eab30815; --session-bg: #4ade8015; --agent-run-bg: #fb923c15;
    --conversation-bg: #60a5fa15; --docs-bg: #2dd4bf15; --status-bg: #94a3b815;
    --musing-bg: #c084fc15;
    --chip-off: #374151; --chip-on: #4f46e5;
  }

  /* ── Sticky search header ─────────────────────── */
  .sp-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--sp-bg);
    padding: 12px 0 0;
    border-bottom: 1px solid var(--sp-border);
    margin: -8px -16px 0;
    padding-left: 16px; padding-right: 16px;
  }
  .sp-search-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
    position: relative;  /* anchors the .sp-org-dropdown */
  }
  .sp-back-btn {
    flex-shrink: 0; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--sp-accent); background: none; border: none;
    font-size: 20px; cursor: pointer; padding: 0;
  }
  .sp-search-field {
    flex: 1; min-width: 0; height: 36px;
    background: var(--sp-surface); border: 1px solid var(--sp-border);
    border-radius: 10px; padding: 0 12px; color: var(--sp-text-1);
    font-size: 15px; outline: none;
  }
  .sp-search-field:focus { border-color: var(--sp-accent); }
  .sp-search-field::placeholder { color: var(--sp-text-3); }

  /* ── Org pin chip + dropdown ──────────────────── */
  .sp-org-chip {
    flex-shrink: 0; height: 36px;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--sp-surface); border: 1px solid var(--sp-border);
    border-radius: 10px; padding: 0 10px;
    font-size: 13px; color: var(--sp-accent); font-weight: 500;
    cursor: pointer; user-select: none; line-height: 1;
  }
  .sp-org-chip:hover { background: #283548; }
  .sp-org-chip-glyph {
    width: 18px; height: 18px; flex-shrink: 0;
    border-radius: 4px; background: #6c63ff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    overflow: hidden;
  }
  .sp-org-chip-glyph img { width: 100%; height: 100%; object-fit: cover; }
  .sp-org-chip-glyph.sp-org-chip-all {
    background: linear-gradient(135deg, #6c63ff, #34d399, #fb923c);
    font-size: 9px;
  }
  .sp-org-chip-caret { color: var(--sp-text-3); font-size: 10px; }

  .sp-org-dropdown {
    position: absolute; top: 42px; left: 40px; z-index: 20;
    background: #1a2332; border: 1px solid var(--sp-border);
    border-radius: 8px; padding: 4px; min-width: 220px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .sp-org-option {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    font-size: 13px; color: var(--sp-text-1); cursor: pointer;
    width: 100%; border: none; background: none; text-align: left;
  }
  .sp-org-option:hover { background: #1e293b; }
  .sp-org-option.sp-org-option-selected {
    background: #1e1b4b; color: var(--sp-accent);
  }
  .sp-org-option-glyph {
    width: 18px; height: 18px; border-radius: 4px;
    background: #6c63ff; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
    overflow: hidden;
  }
  .sp-org-option-glyph img { width: 100%; height: 100%; object-fit: cover; }
  .sp-org-option-glyph.sp-org-option-glyph-all {
    background: linear-gradient(135deg, #6c63ff, #34d399, #fb923c);
    font-size: 9px;
  }
  .sp-org-option-meta {
    margin-left: auto; font-size: 10px; color: #64748b;
  }

  /* Peer pill — painted on cross-org result rows */
  .sp-peer-pill {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 1px 6px; border-radius: 3px;
    color: #94a3b8; background: #1e293b;
    border: 1px dashed #475569;
    cursor: help;
  }

  /* ── Chip rail ────────────────────────────────── */
  .sp-chip-rail {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sp-chip-rail::-webkit-scrollbar { display: none; }
  .sp-chip {
    flex-shrink: 0; padding: 5px 12px; border-radius: 16px;
    font-size: 13px; font-weight: 500; border: none; cursor: pointer;
    white-space: nowrap; min-height: 30px;
    transition: background 0.15s, color 0.15s;
  }
  .sp-chip-off { background: var(--chip-off); color: var(--sp-text-2); }
  .sp-chip-off:active { background: #4b5563; }
  .sp-chip-on { background: var(--chip-on); color: #fff; }
  .sp-chip-count { opacity: 0.7; margin-left: 3px; }

  /* ── Summary row ──────────────────────────────── */
  .sp-summary-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
    font-size: 13px; color: var(--sp-text-3);
  }
  .sp-summary-query { color: var(--sp-accent); font-weight: 500; }

  /* ── Source cards ─────────────────────────────── */
  .sp-results { padding-bottom: 80px; }
  .sp-source-card {
    display: flex; margin-bottom: 8px;
    border-radius: 10px; overflow: hidden;
    background: var(--sp-surface);
    border: 1px solid var(--sp-border);
    text-decoration: none; color: inherit;
  }
  .sp-source-card:active { background: #283548; }

  /* 3px accent rail */
  .sp-accent-rail {
    width: 3px; flex-shrink: 0; border-radius: 3px 0 0 3px;
  }
  .sp-rail-note { background: var(--note); }
  .sp-rail-session { background: var(--session); }
  .sp-rail-agent-run { background: var(--agent-run); }
  .sp-rail-conversation { background: var(--conversation); }
  .sp-rail-docs { background: var(--docs); }
  .sp-rail-status { background: var(--status); }
  .sp-rail-musing { background: var(--musing); }
  .sp-rail-default { background: var(--sp-text-4); }

  .sp-card-body {
    flex: 1; min-width: 0; padding: 10px 12px;
  }
  .sp-card-meta {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px; flex-wrap: wrap;
  }
  .sp-type-pill {
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    padding: 1px 7px; border-radius: 4px;
    text-transform: uppercase;
  }
  .sp-pill-note { color: var(--note); background: var(--note-bg); }
  .sp-pill-session { color: var(--session); background: var(--session-bg); }
  .sp-pill-agent-run { color: var(--agent-run); background: var(--agent-run-bg); }
  .sp-pill-conversation { color: var(--conversation); background: var(--conversation-bg); }
  .sp-pill-docs { color: var(--docs); background: var(--docs-bg); }
  .sp-pill-status { color: var(--status); background: var(--status-bg); }
  .sp-pill-musing { color: var(--musing); background: var(--musing-bg); }
  .sp-pill-default { color: var(--sp-text-2); background: #ffffff10; }
  .sp-match-count {
    font-size: 11px; color: var(--sp-text-3); margin-left: auto;
  }
  .sp-card-title {
    font-size: 15px; font-weight: 600; color: var(--sp-text-1);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }

  /* Excerpts */
  .sp-excerpt {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 4px 0;
    text-decoration: none; color: inherit;
  }
  .sp-excerpt + .sp-excerpt { border-top: 1px solid #ffffff08; }
  .sp-turn-badge {
    flex-shrink: 0; font-size: 11px; font-weight: 600;
    color: var(--sp-text-3); font-family: "SF Mono", ui-monospace, monospace;
    min-width: 32px; padding-top: 1px;
  }
  .sp-excerpt-text {
    font-size: 13px; color: var(--sp-text-2); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sp-excerpt-text mark {
    background: var(--sp-accent-bg); color: var(--sp-accent);
    padding: 0 2px; border-radius: 2px; font-weight: 500;
  }

  .sp-card-footer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; font-size: 11px; color: var(--sp-text-4);
  }

  .sp-card-chevron {
    flex-shrink: 0; width: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--sp-text-4); font-size: 14px;
  }
</style>

<div x-data="searchPage()" class="sp-root pb-safe">
  <!-- Sticky search header with chip rail -->
  <div class="sp-header">
    <div class="sp-search-row">
      <button class="sp-back-btn" @click="goBack()" title="Back">‹</button>

      <!-- Org pin chip — opens dropdown to pin search to one org -->
      <button class="sp-org-chip"
              data-testid="sp-org-chip"
              @click.stop="toggleOrgDropdown()"
              :title="orgChip.title">
        <span class="sp-org-chip-glyph"
              :class="orgChip.allOrgs ? 'sp-org-chip-all' : ''"
              :style="orgChip.glyphStyle">
          <template x-if="!orgChip.favicon">
            <span x-text="orgChip.initial"></span>
          </template>
          <template x-if="orgChip.favicon">
            <img :src="orgChip.favicon" :alt="orgChip.label">
          </template>
        </span>
        <span x-text="orgChip.label"></span>
        <span class="sp-org-chip-caret">▾</span>
      </button>

      <input type="text" class="sp-search-field"
             x-model="query"
             @keydown.enter="submitQuery()"
             placeholder="Search knowledge…">

      <!-- Org dropdown panel (open state) -->
      <div class="sp-org-dropdown"
           data-testid="sp-org-dropdown"
           x-show="orgDropdownOpen"
           @click.outside="orgDropdownOpen = false"
           x-cloak>
        <button class="sp-org-option"
                :class="!selectedOrg ? 'sp-org-option-selected' : ''"
                @click="pickOrg('')">
          <span class="sp-org-option-glyph sp-org-option-glyph-all">∞</span>
          <span>All orgs</span>
          <span class="sp-org-option-meta">default</span>
        </button>
        <template x-for="o in orgList" :key="o.slug">
          <button class="sp-org-option"
                  :class="selectedOrg === o.slug ? 'sp-org-option-selected' : ''"
                  @click="pickOrg(o.slug)">
            <span class="sp-org-option-glyph"
                  :style="o.favicon ? '' : `background:${o.color}`">
              <template x-if="!o.favicon">
                <span x-text="o.initial"></span>
              </template>
              <template x-if="o.favicon">
                <img :src="o.favicon" :alt="o.name">
              </template>
            </span>
            <span x-text="o.name"></span>
            <span class="sp-org-option-meta" x-text="o.kind"></span>
          </button>
        </template>
      </div>
    </div>
    <div class="sp-chip-rail" data-testid="sp-chip-rail">
      <button class="sp-chip"
              :class="activeType === 'all' ? 'sp-chip-on' : 'sp-chip-off'"
              @click="setType('all')">
        All <span class="sp-chip-count" x-text="results.length"></span>
      </button>
      <template x-for="t in chipTypes" :key="t.key">
        <button class="sp-chip"
                :class="activeType === t.key ? 'sp-chip-on' : 'sp-chip-off'"
                @click="setType(t.key)">
          <span x-text="t.label"></span>
          <span class="sp-chip-count" x-text="t.count"></span>
        </button>
      </template>
    </div>
  </div>

  <!-- Summary row -->
  <div class="sp-summary-row" x-show="loaded && results.length > 0">
    <span>
      <span x-text="filteredResults.length"></span> sources ·
      <span x-text="totalMatches"></span> matches for
      <span class="sp-summary-query" x-text="'“' + query + '”'"></span>
    </span>
  </div>

  <!-- Loading -->
  <template x-if="!loaded">
    <div class="text-gray-500 text-sm">Searching...</div>
  </template>

  <!-- Empty -->
  <template x-if="loaded && results.length === 0">
    <div class="text-gray-500 text-sm">No results for "<span x-text="query"></span>"</div>
  </template>

  <!-- Results -->
  <template x-if="loaded && results.length > 0">
    <div class="sp-results" data-testid="sp-results">
      <template x-for="r in filteredResults" :key="r.source_id || r.id">
        <a :href="'/graph/' + (r.source_id || r.id).slice(0, 12)"
           @click.prevent="navigateTo('/graph/' + (r.source_id || r.id).slice(0, 12))"
           class="sp-source-card"
           :data-source-type="r.source_type || ''">
          <div class="sp-accent-rail" :class="railClass(r.source_type)"></div>
          <div class="sp-card-body">
            <!-- Row 1: type pill + org glyph + match count -->
            <div class="sp-card-meta">
              <span class="sp-type-pill" :class="pillClass(r.source_type)"
                    x-text="typeLabel(r.source_type)"></span>
              <template x-if="r.org">
                <span class="sc-org"
                      :style="r.org.favicon ? '' : `background:${r.org.color}`"
                      :title="r.org.resolved ? r.org.name : ('legacy: ' + (r.project || 'unknown'))">
                  <template x-if="!r.org.favicon">
                    <svg class="sc-org-initial" width="16" height="16" viewBox="0 0 16 16" preserveAspectRatio="xMidYMid meet">
                      <text x="8" y="8" text-anchor="middle" dominant-baseline="central"
                            font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
                            font-size="11" font-weight="700" fill="#ffffff"
                            x-text="r.org.initial"></text>
                    </svg>
                  </template>
                  <img class="sc-org-img" :src="r.org.favicon" x-show="r.org.favicon" :alt="r.org.name">
                </span>
              </template>
              <template x-if="r.is_peer">
                <span class="sp-peer-pill"
                      data-testid="sp-peer-pill"
                      :title="peerPillTitle(r)">peer</span>
              </template>
              <span class="sp-match-count"
                    x-text="(r.match_count || 1) + ' match' + ((r.match_count || 1) === 1 ? '' : 'es')"></span>
            </div>

            <!-- Row 2: title -->
            <div class="sp-card-title" x-text="r.source_title || 'Untitled'"></div>

            <!-- Row 3: excerpts -->
            <div class="sp-excerpts">
              <template x-for="(ex, i) in cardExcerpts(r)" :key="i">
                <template x-if="ex.turn_number != null">
                  <a class="sp-excerpt"
                     :href="'/graph/' + (r.source_id || r.id).slice(0, 12) + '?turn=' + ex.turn_number"
                     @click.prevent.stop="navigateTo('/graph/' + (r.source_id || r.id).slice(0, 12) + '?turn=' + ex.turn_number)">
                    <span class="sp-turn-badge" x-text="'t' + ex.turn_number"></span>
                    <span class="sp-excerpt-text" x-html="highlightTerms(ex.content || '', query)"></span>
                  </a>
                </template>
                <template x-if="ex.turn_number == null">
                  <div class="sp-excerpt">
                    <span class="sp-excerpt-text" x-html="highlightTerms(ex.content || '', query)"></span>
                  </div>
                </template>
              </template>
            </div>

            <!-- Row 4: footer (date) -->
            <div class="sp-card-footer" x-show="r.date">
              <span x-text="r.date"></span>
            </div>
          </div>
          <div class="sp-card-chevron">›</div>
        </a>
      </template>
    </div>
  </template>
</div>
