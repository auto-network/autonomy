<section x-data="activityPage()" class="pb-safe" aria-label="Activity" data-testid="activity-page">
  <div class="flex items-center gap-2 mb-4" data-testid="activity-range">
    <div class="inline-flex rounded-lg bg-gray-800 border border-gray-700 p-0.5">
      <template x-for="r in ['6h', '24h', '7d', 'All']" :key="r">
        <button
          @click="setRange(r)"
          :class="range === r ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-700'"
          class="px-3 py-1 text-sm font-medium rounded-md transition-colors"
          x-text="r"
        ></button>
      </template>
    </div>
  </div>

  <template x-if="dispatcherState.paused && dispatcherState.reason">
    <div
      class="mb-3 px-4 py-3 rounded-lg border flex items-center justify-between gap-3 bg-red-900/30 border-red-600 text-red-200"
      data-testid="activity-paused-banner"
    >
      <div class="flex items-center gap-2">
        <span class="text-lg">&#x26D4;</span>
        <span x-show="dispatcherState.reason.reason === 'auth'">
          <strong>Dispatcher paused:</strong> Auth failed &mdash; re-authenticate then resume
        </span>
        <span x-show="dispatcherState.reason.reason !== 'auth'">
          <strong>Dispatcher paused:</strong> <span x-text="dispatcherState.reason.message || dispatcherState.reason.reason"></span>
        </span>
      </div>
      <button
        @click="resumeDispatcher()"
        class="px-3 py-1 rounded-md text-sm font-medium bg-red-600 hover:bg-red-500 text-white transition-colors flex-shrink-0"
        data-testid="activity-resume-dispatcher"
      >
        Resume
      </button>
    </div>
  </template>

  <template x-if="dispatcherState?.merge_health?.status === 'blocked'">
    <div
      class="mb-3 px-4 py-3 rounded-lg border flex items-center gap-3 bg-amber-900/30 border-amber-600 text-amber-200"
      data-testid="activity-merge-banner"
    >
      <span class="text-lg">&#x26A0;</span>
      <div>
        <strong>Merges blocked:</strong>
        <span x-text="dispatcherState.merge_health.reason"></span>
        <template x-if="dispatcherState.merge_health.count > 1">
          <span x-text="'(' + dispatcherState.merge_health.count + ' unmerged files)'"></span>
        </template>
        <span class="text-amber-400 text-xs ml-2">Resolve conflicts manually, then resume</span>
      </div>
    </div>
  </template>

  <div
    class="mb-3 rounded-lg border border-gray-700 bg-gray-900/80 px-3 py-2"
    data-testid="activity-pulse"
  >
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-xs text-gray-300">
      <template x-for="item in pulseItems()" :key="item.label">
        <span class="inline-flex items-center gap-1 font-mono">
          <span :class="item.cls" x-text="item.value"></span>
          <span class="text-gray-500" x-text="item.label"></span>
        </span>
      </template>
      <span class="ml-auto flex flex-wrap items-center gap-2">
        <template x-for="(isPaused, label) in paused" :key="label">
          <button
            @click="togglePause(label)"
            class="inline-flex items-center gap-1 rounded-full border px-2 py-1 text-xs font-medium transition-colors"
            :class="isPaused
              ? 'border-red-600 bg-red-900/40 text-red-300 hover:bg-red-900/60'
              : 'border-green-600 bg-green-900/30 text-green-300 hover:bg-green-900/50'"
            :title="isPaused && reasons[label] ? reasons[label] : (label + ' queue')"
          >
            <span class="inline-block h-2 w-2 rounded-full" :class="isPaused ? 'bg-red-500' : 'bg-green-500'"></span>
            <span x-text="label"></span>
          </button>
        </template>
      </span>
    </div>
  </div>

  <template x-if="waiting.length > 0 || blocked.length > 0">
    <div class="mb-3 flex flex-wrap items-center gap-2 text-xs text-gray-400" data-testid="activity-queue-cues">
      <button
        x-show="waiting.length > 0"
        @click="showWaiting = !showWaiting"
        class="rounded-full border border-gray-700 px-3 py-1 hover:border-blue-500 hover:text-blue-300"
        x-text="showWaiting ? 'Hide queue' : 'Reveal queue'"
      ></button>
      <button
        x-show="blocked.length > 0"
        @click="showBlocked = !showBlocked"
        class="rounded-full border border-gray-700 px-3 py-1 hover:border-amber-500 hover:text-amber-300"
        x-text="showBlocked ? 'Hide blocked' : 'Reveal blocked'"
      ></button>
    </div>
  </template>

  <div class="mb-4 flex items-center gap-1 border-b border-gray-700" data-testid="activity-tabs" role="tablist">
    <template x-for="t in [
      { id: 'feed', label: 'Feed' },
      { id: 'attention', label: 'Attention' },
      { id: 'notifications', label: 'Notifications' },
    ]" :key="t.id">
      <button
        type="button"
        role="tab"
        :data-testid="'activity-tab-' + t.id"
        :aria-selected="tab === t.id ? 'true' : 'false'"
        @click="setTab(t.id)"
        :class="tab === t.id
          ? 'text-indigo-300 border-indigo-500'
          : 'text-gray-400 hover:text-gray-200 border-transparent'"
        class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors"
        x-text="t.label"
      ></button>
    </template>
  </div>

  <!-- Feed tab body -->
  <div x-show="tab === 'feed'" data-testid="activity-feed-body">
  <div class="mb-4" data-testid="activity-live">
    <template x-if="active.length === 0">
      <div class="text-sm text-gray-500" data-testid="activity-live-empty">No live dispatches</div>
    </template>
    <template x-for="b in active" :key="'active-' + (b.run_id || b.id || b.title)">
      {% include 'partials/bead-card.html' %}
    </template>
  </div>

  <template x-if="showWaiting && waiting.length > 0">
    <div class="mb-4" data-testid="activity-waiting-section">
      <div class="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-blue-400">Queued</div>
      <template x-for="b in waiting" :key="'waiting-' + b.id">
        {% include 'partials/bead-card.html' %}
      </template>
    </div>
  </template>

  <template x-if="showBlocked && blocked.length > 0">
    <div class="mb-4" data-testid="activity-blocked-section">
      <div class="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-amber-400">Blocked</div>
      <template x-for="b in blocked" :key="'blocked-' + b.id">
        {% include 'partials/bead-card.html' %}
      </template>
    </div>
  </template>

  <div class="mb-4 flex items-center justify-between" data-testid="activity-feed-header">
    <h2 class="text-lg font-semibold text-indigo-400">Feed</h2>
  </div>

  <template x-if="loading">
    <div class="text-gray-500 text-sm">Loading feed...</div>
  </template>

  <!-- Empty state -->
  <template x-if="!loading && entries.length === 0">
    <div class="text-gray-500 text-sm">No timeline entries for this period</div>
  </template>

  <!-- Feed cards -->
  <div data-testid="activity-feed">
    <template x-for="e in entries" :key="e._key">
      <div
        x-show="!e._hiddenByParent"
        class="tl-card"
        :class="{'tl-card-lib': e._isLibrarian, 'open': e._open}"
        @click="e._open = !e._open"
      >

        <!-- Row 1: dot/icon · (bead-id / action) · time
             Title moved to its own row below so it never has to share
             horizontal space with the right-aligned metadata. Mirrors
             the bead-card.html partial used by /dispatch. -->
        <div class="tl-row1">
          <!-- Librarian: book icon -->
          <span x-show="e._isLibrarian" class="tl-lib-icon" style="display:none">📚</span>
          <!-- Agentic: lightning icon -->
          <span x-show="e._isAgentic" class="tl-lib-icon" style="display:none">⚡</span>
          <!-- Bead dispatch: status dot -->
          <span x-show="!e._isLibrarian && !e._isAgentic" class="tl-dot" :class="e._dotCls"></span>

          <!-- Bead dispatch: show bead id inline -->
          <span x-show="!e._isLibrarian && !e._isAgentic && e.bead_id" class="tl-bead-id" x-text="e.bead_id" style="display:none"></span>
          <!-- Agentic: show action label inline (e.g. "Update Title & Summary") -->
          <span x-show="e._isAgentic && e.action_label" class="tl-bead-id" x-text="e.action_label" style="display:none"></span>
          <!-- auto-wvdhs: 📔 badge — present iff the agent wrote a journal
               entry during wrap-up. Anchors to /activity#journal-<id> on
               the Attention tab so a click jumps straight to the entry. -->
          <template x-if="e.journal_entry && e.journal_entry.source_id">
            <a :href="'/activity#journal-' + e.journal_entry.source_id"
               @click.stop
               :title="'Journal: ' + (e.journal_entry.compact || '')"
               :data-testid="'activity-feed-journal-badge-' + e.run_id"
               class="tl-lib-icon"
               style="margin-left:auto; text-decoration:none; cursor:pointer;">📔</a>
          </template>
          <span class="tl-ts" :class="{'tl-ts-auto': true}" x-text="e._ts"
                :style="(e.journal_entry && e.journal_entry.source_id) ? '' : 'margin-left:auto'"></span>
        </div>
        <!-- Title row: full-width, 2-line clamp on narrow viewports -->
        <div class="tl-title-row">
          <span
            class="tl-title-block"
            x-text="e._isLibrarian ? e._libTitle : (e.title || e.bead_id || '(no title)')"
          ></span>
        </div>

        <!-- Row 2 (dispatch): reason + priority/status badges -->
        <div class="tl-row2" x-show="!e._isLibrarian">
          <div
            class="tl-reason"
            :style="e._open ? 'white-space: normal; overflow: visible; text-overflow: clip;' : ''"
            x-text="e.reason || ''"
          ></div>
          <div class="tl-row2-badges">
            <template x-if="e.priority != null">
              <span class="tl-ft" :class="e._prioCls" x-text="'P' + e.priority"></span>
            </template>
            <span class="tl-ft" :class="e._stCls" x-text="e.status || '?'"></span>
          </div>
        </div>

        <!-- Row 2 (librarian): summary + status badge -->
        <div class="tl-row2" x-show="e._isLibrarian" style="display:none">
          <div class="tl-reason" x-text="e.librarian_review && e.librarian_review.summary ? e.librarian_review.summary : (e.reason || '')"></div>
          <div class="tl-row2-badges">
            <span class="tl-ft" :class="e._stCls" x-text="e.status || '?'"></span>
          </div>
        </div>

        <!-- Agentic card_summary (auto-56o4m): per-action declarative slots
             rendered as a flat definition list. Server attaches resolved
             {label, value, format} entries; we just iterate. -->
        <div class="tl-card-summary"
             x-show="e._isAgentic && e.card_summary && e.card_summary.length"
             style="display:none">
          <template x-for="(slot, i) in (e.card_summary || [])" :key="i">
            <span class="tl-card-slot">
              <span class="tl-card-slot-label" x-text="slot.label + ':'"></span>
              <template x-if="slot.format === 'badge'">
                <span class="tl-card-slot-badge" x-text="slot.value"></span>
              </template>
              <template x-if="slot.format === 'stars'">
                <span class="tl-card-slot-stars">
                  <template x-for="n in [0,1,2,3]" :key="n">
                    <span :class="n < (Number(slot.value) || 0) ? 'tl-star-on' : 'tl-star-off'">&#9733;</span>
                  </template>
                </span>
              </template>
              <template x-if="slot.format === 'code'">
                <code class="tl-card-slot-code" x-text="typeof slot.value === 'string' ? slot.value : JSON.stringify(slot.value)"></code>
              </template>
              <template x-if="!slot.format || slot.format === 'text'">
                <span class="tl-card-slot-text" x-text="typeof slot.value === 'string' ? slot.value : JSON.stringify(slot.value)"></span>
              </template>
            </span>
          </template>
        </div>

        <!-- Expanded detail (dispatch card) -->
        <div class="tl-exp-detail" x-show="e._open && !e._isLibrarian" @click.stop style="display:none">
          <div class="tl-exp-row">
            <div class="tl-exp-links">
              <a class="tl-exp-link" :href="'/dispatch/trace/' + e.run_id">Trace &#8594;</a>
              <!-- Bead dispatch: link to the bead -->
              <template x-if="!e._isAgentic && e.bead_id">
                <a class="tl-exp-link" :href="'/bead/' + e.bead_id">Bead &#8594;</a>
              </template>
              <!-- Agentic: link to the asset the action operated on -->
              <template x-if="e._isAgentic && e.target_source_id">
                <a class="tl-exp-link" :href="'/graph/' + e.target_source_id">Asset &#8594;</a>
              </template>
              <!-- Agentic sender: when the dispatch was triggered by another
                   live session (not the "dashboard" sentinel), link back to
                   that session. Plain text otherwise. -->
              <template x-if="e._isAgentic && e.dispatched_by_session && e.dispatched_by_session !== 'dashboard'">
                <span class="inline-flex items-center gap-1.5">
                  <a class="tl-exp-link" :href="'/session/' + e.dispatched_by_session"
                     x-text="'From: ' + e.dispatched_by_session + ' →'"></a>
                  <!-- Harness badge — auto-ngis4 / icon-rail. -->
                  <span x-data="{ harness: e.sender_harness }">
                    {% include 'partials/session-harness-badge.html' %}
                  </span>
                </span>
              </template>
              <template x-if="e._isAgentic && (!e.dispatched_by_session || e.dispatched_by_session === 'dashboard')">
                <span class="tl-exp-link" style="cursor:default; opacity:0.7"
                      x-text="'From: dashboard'"></span>
              </template>
            </div>
            <template x-if="e.scores">
              <div class="tl-exp-scores" style="margin-left:auto">
                <span>
                  <span class="tl-exp-label">Tooling</span>
                  <template x-for="(on, i) in e._starsTooling" :key="i">
                    <span :class="on ? 'tl-star-on' : 'tl-star-off'">&#9733;</span>
                  </template>
                </span>
                <span>
                  <span class="tl-exp-label">Clarity</span>
                  <template x-for="(on, i) in e._starsClarity" :key="i">
                    <span :class="on ? 'tl-star-on' : 'tl-star-off'">&#9733;</span>
                  </template>
                </span>
                <span>
                  <span class="tl-exp-label">Confidence</span>
                  <template x-for="(on, i) in e._starsConfidence" :key="i">
                    <span :class="on ? 'tl-star-on' : 'tl-star-off'">&#9733;</span>
                  </template>
                </span>
              </div>
            </template>
          </div>
          <template x-if="e.failure_category">
            <div class="text-xs text-red-400 mt-1" x-text="'Failure: ' + e.failure_category"></div>
          </template>
          <template x-if="e.discovered_beads_count">
            <div class="text-xs text-purple-400 mt-1" x-text="e.discovered_beads_count + ' bead(s) discovered'"></div>
          </template>
          <template x-if="e._smokeBadge">
            <div class="mt-1">
              <span :class="['tl-smoke-badge', e._smokeBadge.cls]" x-text="e._smokeBadge.label"></span>
            </div>
          </template>

          <!-- Librarian review section (expanded dispatch card, review in progress) -->
          <template x-if="e.librarian_review && e.librarian_review.status === 'running'">
            <div class="tl-review-detail" @click.stop>
              <div class="tl-review-header">
                <span class="tl-review-running">📖 Reviewing...</span>
                <template x-if="e._integratedLibrarian && (e._integratedLibrarian.duration_secs != null || e._integratedLibrarian._tokenFmt)">
                  <span class="tl-review-meta"><template x-if="e._integratedLibrarian.duration_secs != null"><span><span class="tl-icon-time">⏱</span><span x-text="fmtDuration(e._integratedLibrarian.duration_secs)"></span></span></template><template x-if="e._integratedLibrarian.duration_secs != null && e._integratedLibrarian._tokenFmt"><span> · </span></template><template x-if="e._integratedLibrarian._tokenFmt"><span class="tl-tokens" x-text="'✦ ' + e._integratedLibrarian._tokenFmt"></span></template></span>
                </template>
              </div>
            </div>
          </template>
          <!-- Librarian review section (expanded dispatch card, review complete) -->
          <template x-if="e.librarian_review && e.librarian_review.status !== 'running'">
            <div class="tl-review-detail" @click.stop>
              <div class="tl-review-header">
                <span>📖 Librarian Review</span>
                <template x-if="e._integratedLibrarian && e._integratedLibrarian._countSummary">
                  <span class="tl-review-count" x-text="e._integratedLibrarian._countSummary"></span>
                </template>
                <template x-if="!(e._integratedLibrarian && e._integratedLibrarian._countSummary) && e._reviewCollapsed">
                  <span class="tl-review-count" x-text="e._reviewCollapsed"></span>
                </template>
                <template x-if="e._integratedLibrarian && (e._integratedLibrarian.duration_secs != null || e._integratedLibrarian._tokenFmt)">
                  <span class="tl-review-meta"><template x-if="e._integratedLibrarian.duration_secs != null"><span><span class="tl-icon-time">⏱</span><span x-text="fmtDuration(e._integratedLibrarian.duration_secs)"></span></span></template><template x-if="e._integratedLibrarian.duration_secs != null && e._integratedLibrarian._tokenFmt"><span> · </span></template><template x-if="e._integratedLibrarian._tokenFmt"><span class="tl-tokens" x-text="'✦ ' + e._integratedLibrarian._tokenFmt"></span></template></span>
                </template>
              </div>
              <!-- Structured items: prefer integrated librarian items, fall back to parent review items -->
              <template x-if="e._integratedLibrarian && e._integratedLibrarian._reviewItems">
                <div class="tl-review-items">
                  <template x-for="(item, i) in e._integratedLibrarian._reviewItems" :key="i">
                    <div class="tl-review-item">
                      <span class="tl-lib-dot" :class="'tl-lib-dot-' + (item.type || 'skip')">●</span>
                      <span x-text="item.description || ''"></span>
                      <template x-if="item.source_id">
                        <a class="tl-lib-link" :href="'/graph/' + item.source_id" @click.stop x-text="item.source_id.slice(0,8)"></a>
                      </template>
                      <template x-if="item.bead_id">
                        <a class="tl-lib-link" :href="'/bead/' + item.bead_id" @click.stop x-text="item.bead_id"></a>
                      </template>
                      <template x-if="item.reason">
                        <span class="tl-lib-reason" x-text="'— ' + item.reason"></span>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!(e._integratedLibrarian && e._integratedLibrarian._reviewItems) && e._reviewItems">
                <div class="tl-review-items">
                  <template x-for="(item, i) in e._reviewItems" :key="i">
                    <div class="tl-review-item">
                      <span class="tl-lib-dot" :class="'tl-lib-dot-' + (item.type || 'skip')">●</span>
                      <span x-text="item.description || ''"></span>
                      <template x-if="item.source_id">
                        <a class="tl-lib-link" :href="'/graph/' + item.source_id" @click.stop x-text="item.source_id.slice(0,8)"></a>
                      </template>
                      <template x-if="item.bead_id">
                        <a class="tl-lib-link" :href="'/bead/' + item.bead_id" @click.stop x-text="item.bead_id"></a>
                      </template>
                      <template x-if="item.reason">
                        <span class="tl-lib-reason" x-text="'— ' + item.reason"></span>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
              <!-- Generic fallback: show notes/reason text -->
              <template x-if="!(e._integratedLibrarian && e._integratedLibrarian._reviewItems) && !e._reviewItems && e.librarian_review.notes">
                <div class="tl-review-notes" x-text="e.librarian_review.notes"></div>
              </template>
            </div>
          </template>
        </div>

        <!-- Expanded detail (librarian card: experience_reviewer custom template) -->
        <div class="tl-exp-detail" x-show="e._open && e._isLibrarian && e.librarian_type === 'review_report'" @click.stop style="display:none">
          <template x-if="e._reviewItems">
            <div class="tl-review-items">
              <template x-for="(item, i) in e._reviewItems" :key="i">
                <div class="tl-review-item">
                  <span class="tl-lib-dot" :class="'tl-lib-dot-' + (item.type || 'skip')">●</span>
                  <span x-text="item.description || ''"></span>
                  <template x-if="item.source_id">
                    <a class="tl-lib-link" :href="'/graph/' + item.source_id" @click.stop x-text="item.source_id.slice(0,8)"></a>
                  </template>
                  <template x-if="item.bead_id">
                    <a class="tl-lib-link" :href="'/bead/' + item.bead_id" @click.stop x-text="item.bead_id"></a>
                  </template>
                  <template x-if="item.reason">
                    <span class="tl-lib-reason" x-text="'— ' + item.reason"></span>
                  </template>
                </div>
              </template>
            </div>
          </template>
          <template x-if="!e._reviewItems">
            <div class="tl-exp-row">
              <div class="tl-exp-links">
                <a class="tl-exp-link" :href="'/dispatch/trace/' + e.run_id">Trace &#8594;</a>
              </div>
              <template x-if="e.librarian_review && e.librarian_review.notes">
                <div class="tl-review-notes" style="margin-top:4px" x-text="e.librarian_review.notes"></div>
              </template>
            </div>
          </template>
        </div>

        <!-- Expanded detail (librarian card: generic template) -->
        <div class="tl-exp-detail" x-show="e._open && e._isLibrarian && e.librarian_type !== 'review_report'" @click.stop style="display:none">
          <div class="tl-exp-row">
            <div class="tl-exp-links">
              <a class="tl-exp-link" :href="'/dispatch/trace/' + e.run_id">Trace &#8594;</a>
            </div>
          </div>
          <template x-if="e.librarian_review && e.librarian_review.notes">
            <div class="tl-review-notes" x-text="e.librarian_review.notes"></div>
          </template>
        </div>

        <!-- Bottom: legend + stats row + stacked bar -->
        <template x-if="e._hasBottom">
          <div class="tl-bottom">
            <div class="tl-bottom-row">
              <template x-if="e._hasBreakdown">
                <div class="tl-legend">
                  <template x-if="e._barR"><span class="tl-lr" x-text="'research ' + e._barR + '%'"></span></template>
                  <template x-if="e._barC"><span class="tl-lc" x-text="'coding ' + e._barC + '%'"></span></template>
                  <template x-if="e._barD"><span class="tl-ld" x-text="'debug ' + e._barD + '%'"></span></template>
                  <template x-if="e._barT"><span class="tl-lt" x-text="'tooling ' + e._barT + '%'"></span></template>
                </div>
              </template>
              <div class="tl-stats-right">
                <!-- ⏱ duration (purple icon) -->
                <template x-if="e.duration_secs != null">
                  <span><span class="tl-icon-time">⏱</span><span x-text="fmtDuration(e.duration_secs)"></span></span>
                </template>
                <!-- ✦ token count (sky blue) -->
                <template x-if="e._tokenFmt">
                  <span class="tl-tokens" x-text="'✦ ' + e._tokenFmt"></span>
                </template>
                <!-- +added -removed -->
                <template x-if="e.lines_added != null">
                  <span class="tl-diff-add" x-text="'+' + e.lines_added"></span>
                </template>
                <template x-if="e.lines_removed != null">
                  <span class="tl-diff-del" x-text="'-' + e.lines_removed"></span>
                </template>
                <!-- ⭐ avg rating (collapsed only, dispatch cards) -->
                <template x-if="e.scores && !e._isLibrarian">
                  <span class="tl-avg-wrap" x-show="!e._open">
                    <template x-for="(on, i) in e._starsAvg" :key="i">
                      <span :class="on ? 'tl-star-on' : 'tl-star-off'">&#9733;</span>
                    </template>
                    <span class="tl-avg-num" x-text="' (' + e._avgFormatted + ')'"></span>
                  </span>
                </template>
              </div>
            </div>
            <!-- Stacked time breakdown bar -->
            <template x-if="e._hasBreakdown">
              <div class="tl-stacked-bar">
                <div x-show="e._barR" class="tl-bar-r" :style="'width:' + e._barR + '%'"></div>
                <div x-show="e._barC" class="tl-bar-c" :style="'width:' + e._barC + '%'"></div>
                <div x-show="e._barD" class="tl-bar-d" :style="'width:' + e._barD + '%'"></div>
                <div x-show="e._barT" class="tl-bar-t" :style="'width:' + e._barT + '%'"></div>
              </div>
            </template>

            <!-- Review + smoke summary (collapsed dispatch cards) -->
            <div
              class="tl-review-summary"
              x-show="!e._isLibrarian && (e.librarian_review || e._smokeIcon) && !e._open"
              style="display:none"
            >
              <!-- Smoke icon -->
              <span x-show="e._smokeIcon" :class="e._smokeIcon?.cls"
                    :title="e._smokeIcon?.tip"
                    class="tl-smoke-icon" x-text="e._smokeIcon?.icon"></span>
              <!-- Running state: pulsing indicator -->
              <template x-if="e.librarian_review && e.librarian_review.status === 'running'">
                <span class="tl-review-running">📖 Reviewing...</span>
              </template>
              <!-- Done state: review label + counts -->
              <template x-if="e.librarian_review && e.librarian_review.status !== 'running'">
                <span>📖 Reviewed<template x-if="e._integratedLibrarian && e._integratedLibrarian._countSummary"><span x-text="' · ' + e._integratedLibrarian._countSummary"></span></template><template x-if="!(e._integratedLibrarian && e._integratedLibrarian._countSummary) && e._reviewCollapsed"><span x-text="' · ' + e._reviewCollapsed"></span></template></span>
              </template>
              <!-- Right-aligned meta: duration + tokens (both running and done states) -->
              <template x-if="e.librarian_review && e._integratedLibrarian && (e._integratedLibrarian.duration_secs != null || e._integratedLibrarian._tokenFmt)">
                <span class="tl-review-meta" style="margin-left:auto"><template x-if="e._integratedLibrarian.duration_secs != null"><span><span class="tl-icon-time">⏱</span><span x-text="fmtDuration(e._integratedLibrarian.duration_secs)"></span></span></template><template x-if="e._integratedLibrarian.duration_secs != null && e._integratedLibrarian._tokenFmt"><span> · </span></template><template x-if="e._integratedLibrarian._tokenFmt"><span class="tl-tokens" x-text="'✦ ' + e._integratedLibrarian._tokenFmt"></span></template></span>
              </template>
            </div>
          </div>
        </template>

      </div>
    </template>
  </div>
  </div>
  <!-- /Feed tab body -->

  <!-- Attention tab body -->
  <div x-show="tab === 'attention'" data-testid="activity-attention" style="display:none">
    <div class="mb-4" data-testid="activity-attention-zoom" role="toolbar" aria-label="Journal zoom">
      <div class="inline-flex gap-1 bg-gray-800 border border-gray-700 rounded-lg px-2 py-1">
        <template x-for="m in [
          { id: 'compact',  title: 'Compact',  icon: 'compact'  },
          { id: 'normal',   title: 'Normal',   icon: 'normal'   },
          { id: 'expanded', title: 'Expanded', icon: 'expanded' },
        ]" :key="m.id">
          <button
            type="button"
            :data-testid="'activity-attention-zoom-' + m.id"
            :title="m.title"
            :aria-label="m.title"
            :aria-pressed="attentionZoom === m.id ? 'true' : 'false'"
            @click="setAttentionZoom(m.id)"
            :class="attentionZoom === m.id
              ? 'bg-indigo-600/20 text-indigo-300'
              : 'text-gray-500 hover:text-gray-300'"
            class="w-7 h-7 flex items-center justify-center rounded transition-colors"
          >
            <template x-if="m.icon === 'compact'">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect x="1" y="4" width="12" height="2.5" rx="1" fill="currentColor"/>
                <rect x="1" y="8" width="8" height="2.5" rx="1" fill="currentColor"/>
              </svg>
            </template>
            <template x-if="m.icon === 'normal'">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect x="1" y="1.5" width="12" height="2.5" rx="1" fill="currentColor"/>
                <rect x="1" y="5.5" width="9" height="2.5" rx="1" fill="currentColor"/>
                <rect x="1" y="9.5" width="11" height="2.5" rx="1" fill="currentColor"/>
              </svg>
            </template>
            <template x-if="m.icon === 'expanded'">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect x="1" y="0.5" width="12" height="2" rx="1" fill="currentColor"/>
                <rect x="1" y="3.5" width="9" height="2" rx="1" fill="currentColor"/>
                <rect x="1" y="6.5" width="11" height="2" rx="1" fill="currentColor"/>
                <rect x="1" y="9.5" width="7" height="2" rx="1" fill="currentColor"/>
              </svg>
            </template>
          </button>
        </template>
      </div>
    </div>

    <template x-if="attentionEntries.length === 0">
      <div class="text-sm text-gray-500" data-testid="activity-attention-empty">No journal entries in this time range</div>
    </template>

    <template x-for="(e, idx) in attentionEntries" :key="e.id || idx">
      <div
        class="rounded-lg border border-gray-700 bg-gray-900/60 mb-3 overflow-hidden scroll-mt-20"
        :id="e.id ? ('journal-' + e.id) : null"
        :data-testid="'activity-attention-entry-' + (e.id || idx)"
      >
        <div class="px-4 py-2 border-b border-gray-700 text-xs font-mono text-gray-400 flex items-center gap-2">
          <span class="text-gray-300" x-text="formatAttentionTimeRange(e)"></span>
          <template x-if="e.source_session_id">
            <a
              :href="'/session/' + e.source_session_id"
              class="ml-auto px-2 py-0.5 rounded border border-gray-600 bg-gray-800/80 text-gray-300 hover:text-white hover:border-gray-500"
              :title="'Open source session: ' + e.source_session_id"
              :data-testid="'activity-attention-session-chip-' + (e.id || idx)"
              x-text="formatAttentionSessionChip(e)"
            ></a>
          </template>
        </div>
        <div class="px-4 py-3 text-sm text-gray-200">
          <template x-if="attentionZoom === 'compact'">
            <div class="text-gray-300" data-testid="attention-body-compact" x-text="e.compact || ''"></div>
          </template>
          <template x-if="attentionZoom === 'normal'">
            <div class="leading-relaxed text-gray-200" data-testid="attention-body-normal" x-markdown="e.normal || ''"></div>
          </template>
          <template x-if="attentionZoom === 'expanded'">
            <div class="leading-relaxed text-gray-200" data-testid="attention-body-expanded" x-markdown="e.expanded || ''"></div>
          </template>
        </div>
      </div>
    </template>
  </div>
  <!-- /Attention tab body -->

  <!-- Notifications tab body -->
  <div x-show="tab === 'notifications'" data-testid="activity-notifications" style="display:none">
    <div class="text-sm text-gray-500">Notifications coming soon</div>
  </div>
  <!-- /Notifications tab body -->

</section>
