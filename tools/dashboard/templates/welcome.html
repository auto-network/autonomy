<!DOCTYPE html>
<html lang="en">
<head>
<title>Welcome</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/static/manifest.json?v=__STATIC_VERSION__">
<!-- Tailwind carries the reused Get-started / create-org overlays. The
     onboarding ceremony (AutonomyOnboarding), the create-org screen
     (AutonomyCreateOrg) and the stepped /network/join accept flow are the
     ONE delivered path for each action; this shell only sequences them.
     No ceremony, crypto, or org/session creation lives here (bead
     auto-inpkd). -->
<link rel="stylesheet" href="/static/tailwind.css?v=__STATIC_VERSION__">
<style>
  /* Copied from the committed "Welcome App — onboarding empty state"
     design (graph://9a4219b3 — fresh / mid / ready variants). The quest
     rail is hand-styled; Tailwind above only dresses the composed
     overlays. */
  :root { --bg:#0f1117; --panel:#171a23; --line:#2a2f3d; --ink:#e5e7eb; --dim:#9ca3af; --accent:#6366f1; --ok:#34d399; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:3.5rem 1.25rem 4rem; }
  h1 { font-size:1.5rem; margin:0 0 .35rem; } .sub { color:var(--dim); margin-bottom:1.8rem; }
  .step { display:flex; align-items:center; gap:1rem; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.2rem 1.4rem; margin-bottom:.8rem; }
  .step.current { border-color:var(--accent); }
  .step.locked { opacity:.45; }
  .n { flex:0 0 auto; width:2rem; height:2rem; border-radius:50%; background:#262b38; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; }
  .step.done .n { background:rgba(52,211,153,.15); color:var(--ok); }
  .step h2 { margin:0; font-size:1.05rem; } .step p { margin:.15rem 0 0; color:var(--dim); font-size:.88rem; }
  .step .body { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.6rem 1.3rem; font-size:.95rem; font-weight:600; cursor:pointer; }
  button.secondary { background:#262b38; }
  .fleet-success { min-height:calc(100svh - 7.5rem); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .fleet-success-mark { width:5rem; height:5rem; border-radius:50%; display:grid; place-items:center; margin-bottom:1.35rem; color:#07150f; background:var(--ok); box-shadow:0 0 0 .65rem rgba(52,211,153,.10); font-size:2.8rem; font-weight:800; }
  .fleet-success h1 { margin:0 0 1.6rem; font-size:clamp(1.9rem,7vw,2.6rem); }
  .fleet-success button { min-width:12rem; min-height:3rem; }
  .fleet-sync-row { height:3rem; display:flex; align-items:center; gap:.65rem; color:var(--dim); font-size:.95rem; font-weight:650; }
  .fleet-sync-row.complete { color:#6ee7b7; }
  .fleet-sync-indicator { width:.72rem; height:.72rem; border:2px solid #4b5563; border-top-color:#a5b4fc; border-radius:50%; animation:fleet-spin .85s linear infinite; }
  .fleet-sync-row.complete .fleet-sync-indicator { border:0; border-radius:0; width:auto; height:auto; animation:none; color:var(--ok); }
  @keyframes fleet-spin { to { transform:rotate(360deg); } }
  .actions { display:flex; flex-direction:column; gap:.5rem; }
  .invite-org { display:flex; align-items:center; gap:.6rem; margin:.15rem 0 .1rem; }
  .invite-org .mark { width:1.6rem; height:1.6rem; border-radius:6px; background:#262b38; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; }
  [x-cloak] { display:none !important; }
</style>
<script>
  // The welcome shell owns onboarding sequencing, so the ambient
  // auto-open in network-onboarding.js stays quiet here — step 1's
  // "Begin" opens the ceremony deliberately (design shows the rail
  // first, not an overlay on load).
  window.__AUTONOMY_WELCOME_SHELL__ = true;
  window.__AUTONOMY_FLEET_ENROLLMENT__ = {{ fleet_enrollment|default(none)|tojson }};
  window.__AUTONOMY_FLEET_SYNC__ = {{ fleet_sync|default(false)|tojson }};
</script>
<script type="importmap">{"imports": {"/static/js/ceremony/primitives.js": "/static/js/ceremony/primitives.js?v=__STATIC_VERSION__"}}</script>
<script type="module" src="/static/js/network-signon.mjs?v=__STATIC_VERSION__"></script>
<script src="/static/js/network-identity.js?v=__STATIC_VERSION__" defer></script>
<script src="/static/js/network-onboarding.js?v=__STATIC_VERSION__" defer></script>
<script src="/static/js/create-org.js?v=__STATIC_VERSION__" defer></script>
<script defer src="/static/vendor/alpine-3.15.12.min.js?v=__STATIC_VERSION__"></script>
</head>
<body>
<main x-data="welcomeApp()" x-init="init()" x-cloak>

  <template x-if="!ready">
    <p class="sub" style="margin-top:4rem">One moment&hellip;</p>
  </template>

  <!-- Fleet-linked install · the request exists, authority does not. -->
  <template x-if="ready && fleetEnrollment">
    <div data-testid="welcome-fleet-pending">
      <div x-show="fleetEnrollment.status === 'approved'" class="fleet-success" data-testid="welcome-fleet-approved">
        <div class="fleet-success-mark" aria-hidden="true">&#10003;</div>
        <h1>Machine approved</h1>
        <button @click="location.assign('/unlock?fleet=1&amp;next=%2Fwelcome%3Ffleet_sync%3D1')">Unlock to continue</button>
      </div>
      <div x-show="fleetEnrollment.status !== 'approved'">
      <div style="display:flex;align-items:center;gap:.65rem;margin-bottom:.45rem">
        <span class="n" style="background:rgba(99,102,241,.16);color:#a5b4fc">&#8644;</span>
        <span style="font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#a5b4fc;font-weight:700">Fleet enrollment</span>
      </div>
      <h1 x-text="fleetEnrollment.status === 'declined' ? 'Request declined' : fleetEnrollment.status === 'expired' ? 'Invitation expired' : 'Confirm this machine'"></h1>
      <p class="sub" x-text="fleetEnrollment.status === 'declined' ? 'The other Dashboard declined this enrollment request.' : fleetEnrollment.status === 'expired' ? 'Ask for a new Fleet invitation on your other Dashboard.' : 'Compare this code with the approval on your other Dashboard.'"></p>
      <div class="step current" style="display:block;padding:1.45rem">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem">
          <h2 style="margin:0">Comparison code</h2>
          <span style="display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.25rem .65rem;font-size:.72rem;font-weight:700;white-space:nowrap"
                :style="(fleetEnrollment.status === 'declined' || fleetEnrollment.status === 'expired') ? 'color:#fca5a5;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.25)' : 'color:#fbbf24;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.25)'">
            <span style="width:.45rem;height:.45rem;border-radius:50%"
                  :style="(fleetEnrollment.status === 'declined' || fleetEnrollment.status === 'expired') ? 'background:#f87171' : 'background:#fbbf24;box-shadow:0 0 0 .22rem rgba(251,191,36,.12)'"></span>
            <span x-text="fleetEnrollment.status === 'declined' ? 'Declined' : fleetEnrollment.status === 'expired' ? 'Expired' : 'Waiting for approval'"></span>
          </span>
        </div>
        <div data-testid="fleet-comparison-code" x-text="fleetEnrollment.code"
             style="font:700 clamp(1.18rem,4.6vw,1.65rem)/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.075em;color:#f3f4f6;background:#0f1117;border:1px solid #343a4b;border-radius:10px;padding:1rem;text-align:center;overflow-wrap:anywhere"></div>
        <p style="margin:1rem 0 0;color:var(--dim);font-size:.86rem">The codes must match exactly. Approving the request authorizes this machine; this temporary code is discarded afterward.</p>
      </div>
      <div class="step" style="align-items:flex-start">
        <div class="n" style="color:#9ca3af">1</div>
        <div class="body"><h2>Request sent</h2><p>This machine has no Fleet identity or access yet.</p></div>
      </div>
      <div class="step locked" style="opacity:.72">
        <div class="n">2</div>
        <div class="body"><h2>Continue after approval</h2><p>You can leave this screen open. Setup will continue here when the other Dashboard approves the request.</p></div>
      </div>
      <p x-show="fleetEnrollment.error" style="color:#fca5a5;font-size:.78rem" x-text="fleetEnrollment.error"></p>
      <p style="text-align:center;color:#6b7280;font-size:.72rem;margin-top:1.1rem">Request <span x-text="fleetEnrollment.request_id_prefix"></span>&hellip;</p>
      </div>
    </div>
  </template>

  <template x-if="ready && !fleetEnrollment && fleetSync">
    <div class="fleet-success" data-testid="welcome-fleet-sync">
      <div class="fleet-success-mark" aria-hidden="true">&#10003;</div>
      <h1>Machine approved</h1>
      <div class="fleet-sync-row" :class="fleetSyncStatus === 'complete' ? 'complete' : ''">
        <span class="fleet-sync-indicator" aria-hidden="true" x-text="fleetSyncStatus === 'complete' ? '✓' : ''"></span>
        <span x-text="fleetSyncStatus === 'complete' ? 'Synchronization complete' : 'Synchronizing with fleet'"></span>
      </div>
    </div>
  </template>

  <!-- ── FRESH · no identity (design variant 0) ─────────────────── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 1">
    <div>
      <h1>Welcome</h1>
      <p class="sub">Three steps and this machine is yours.</p>
      <div class="step current"><div class="n">1</div><div class="body">
        <h2>Create your identity</h2>
        <p>Your name and your keys &mdash; made here, kept here.</p></div>
        <button data-testid="welcome-begin" @click="beginIdentity()">Begin</button></div>
      <div class="step locked"><div class="n">2</div><div class="body">
        <h2>Create or join an organization</h2>
        <p>Your work lives in organizations &mdash; start one, or accept an invitation.</p></div></div>
      <div class="step locked"><div class="n">3</div><div class="body">
        <h2>Open your first workspace</h2>
        <p>Where you and your assistant build together.</p></div></div>
    </div>
  </template>

  <!-- ── MID · identity done, organization current (variant 1) ──── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 2">
    <div>
      <h1 x-text="userName ? ('Welcome, ' + userName) : 'Welcome'"></h1>
      <p class="sub">Two to go.</p>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2>Create your identity</h2>
        <p x-text="userName ? ('You’re ' + userName + ' on this machine.') : 'Your identity is set on this machine.'"></p></div></div>
      <div class="step current"><div class="n">2</div><div class="body">
        <h2>Create or join an organization</h2>
        <template x-if="invited">
          <div class="invite-org" data-testid="welcome-invite-org">
            <span class="mark" x-text="inviteInitial"></span>
            <p x-text="inviteName ? ('You’re invited to ' + inviteName + '.') : 'You were invited &mdash; accept to join.'"></p>
          </div>
        </template>
        <p x-show="!invited">Start one, or paste an invitation link if you were invited.</p></div>
        <!-- Invited: Join is pre-selected (primary). Otherwise Create leads. -->
        <div class="actions">
          <template x-if="invited">
            <div class="actions">
              <button data-testid="welcome-join" @click="joinOrg()">Join</button>
              <button class="secondary" data-testid="welcome-create" @click="createOrg()">Create</button>
            </div>
          </template>
          <template x-if="!invited">
            <div class="actions">
              <button data-testid="welcome-create" @click="createOrg()">Create</button>
              <button class="secondary" data-testid="welcome-join" @click="joinOrg()">Join</button>
            </div>
          </template>
        </div></div>
      <div class="step locked"><div class="n">3</div><div class="body">
        <h2>Open your first workspace</h2>
        <p>Where you and your assistant build together.</p></div></div>
    </div>
  </template>

  <!-- ── READY · identity + organization done (design variant 2) ── -->
  <template x-if="ready && !fleetEnrollment && !fleetSync && step === 3">
    <div>
      <h1>You&rsquo;re set</h1>
      <p class="sub">Identity, organization, workspace &mdash; all yours.</p>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2 x-text="userName || 'Your identity'"></h2><p>Your identity on this machine.</p></div></div>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2 x-text="orgName || 'Your organization'"></h2><p>Your organization.</p></div></div>
      <div class="step done"><div class="n">&check;</div><div class="body">
        <h2>First workspace</h2><p>Open and waiting.</p></div></div>
      <button style="margin-top:.6rem" data-testid="welcome-open-workspace" @click="goToWorkspace()">Go to your workspace</button>
    </div>
  </template>

</main>

<script>
function welcomeApp() {
  return {
    ready: false,
    hasIdentity: false,
    userName: '',
    hasOrg: false,
    orgName: '',
    // Arrived-via-invitation: the same shell, org-attached. The context
    // rides the URL exactly as /network/join reads it (auto-yw5gz) — this
    // shell only detects it and hands it on, one source of truth.
    invited: false,
    inviteName: '',
    inviteInitial: '?',
    fleetEnrollment: window.__AUTONOMY_FLEET_ENROLLMENT__ || null,
    fleetSync: !!window.__AUTONOMY_FLEET_SYNC__,
    fleetSyncStatus: 'synchronizing',
    fleetSyncTimer: null,
    fleetResumeTimer: null,
    fleetResumeBusy: false,

    get step() {
      if (!this.hasIdentity) return 1;
      if (!this.hasOrg) return 2;
      return 3;
    },

    async init() {
      var q = new URLSearchParams(location.search);
      this.invited = (location.search.length > 1 || location.hash.length > 1);
      var org = q.get('org') || '';
      this.inviteName = org;
      this.inviteInitial = (org.charAt(0) || '?').toUpperCase();
      await this.refresh();
      if (this.fleetEnrollment) {
        await this.resumeFleetEnrollment();
        this.fleetResumeTimer = setInterval(
          () => this.resumeFleetEnrollment(), 3000);
      } else if (this.fleetSync) {
        await this.refreshFleetSync();
        this.fleetSyncTimer = setInterval(() => this.refreshFleetSync(), 1000);
      }
      // Completing a step elsewhere (the ceremony overlay, the create-org
      // screen) fires these — the rail re-reads and advances live.
      window.addEventListener('autonomy:identity-changed', () => this.refresh());
      window.addEventListener('autonomy:orgs-changed', () => this.refresh());
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') this.refresh();
      });
    },

    async refresh() {
      try {
        var s = await (await fetch('/api/identity/status', { cache: 'no-store' })).json();
        this.hasIdentity = !!s.personal_identity;
        this.userName = (s.personal_identity || {}).display_name || '';
      } catch (e) { /* fresh install: no status yet → step 1 */ }
      try {
        var o = await (await fetch('/api/orgs')).json();
        var orgs = (o.orgs || []).map(function (e) {
          var id = e.identity_resolved || {};
          return { slug: id.slug || (e.org || {}).slug || '',
                   name: id.name || (e.org || {}).slug || '' };
        }).filter(function (x) {
          // The operator's own personal store is not a collaborative org.
          return x.slug && x.slug !== 'personal';
        });
        this.hasOrg = orgs.length > 0;
        this.orgName = orgs.length ? (orgs[0].name || orgs[0].slug) : '';
      } catch (e) { /* org list unreadable → stay on the org step */ }
      this.ready = true;
    },

    async resumeFleetEnrollment() {
      if (!this.fleetEnrollment || this.fleetEnrollment.status !== 'pending' ||
          this.fleetResumeBusy) return;
      this.fleetResumeBusy = true;
      try {
        var response = await fetch('/api/fleet/enrollment/local-resume', {
          method: 'POST', cache: 'no-store',
        });
        var body = await response.json().catch(function () { return {}; });
        if (body.status === 'unavailable') {
          // The home dashboard reached us and named the invitation fault
          // (e.g. the link was deactivated). Show the exact cause + fix, and
          // KEEP waiting — the moment the link is reactivated there, the next
          // check finishes the join automatically. Do not throw a generic
          // "check failed" for this: it is a specific, actionable state.
          this.fleetEnrollment.error = body.message ||
            'This invitation link is not active on the home dashboard — reactivate it there to finish setup.';
          return;
        }
        if (!response.ok || body.ok === false) {
          throw new Error(body.error || ('Enrollment check failed (' + response.status + ').'));
        }
        if (body.status === 'approved' || body.status === 'declined' ||
            body.status === 'expired') {
          this.fleetEnrollment.status = body.status;
          if (this.fleetResumeTimer) clearInterval(this.fleetResumeTimer);
          this.fleetResumeTimer = null;
        }
      } catch (error) {
        // A transient relay outage does not discard the request. Keep the
        // waiting state and expose the last check failure without spinning.
        this.fleetEnrollment.error = (error && error.message) || String(error);
      } finally {
        this.fleetResumeBusy = false;
      }
    },

    async refreshFleetSync() {
      if (!this.fleetSync || this.fleetSyncStatus === 'complete') return;
      try {
        var response = await fetch('/api/fleet/enrollment/local-sync-status', {
          cache: 'no-store', credentials: 'same-origin',
        });
        var body = await response.json().catch(function () { return {}; });
        if (!response.ok || body.ok === false) return;
        if (body.status === 'complete') {
          this.fleetSyncStatus = 'complete';
          if (this.fleetSyncTimer) clearInterval(this.fleetSyncTimer);
          this.fleetSyncTimer = null;
          setTimeout(() => location.replace('/'), 1400);
        }
      } catch (e) { /* the compact row stays synchronizing */ }
    },

    // Step 1 → the delivered identity ceremony (network-onboarding.js).
    beginIdentity() {
      if (window.AutonomyOnboarding) window.AutonomyOnboarding.open({ step: 1 });
    },
    // Step 2 create → the delivered create-org screen (create-org.js).
    createOrg() {
      if (window.AutonomyCreateOrg) window.AutonomyCreateOrg.open({ entry: 'standalone' });
    },
    // Step 2 join → the delivered stepped accept flow, carrying whatever
    // invitation context the URL holds (the bearer in #t= rides along and
    // never touches this shell).
    joinOrg() {
      location.assign('/network/join' + location.search + location.hash);
    },
    // Step 3 → the session UI, where the first workspace is opened.
    goToWorkspace() {
      location.assign('/beads');
    },
  };
}
</script>
</body>
</html>
