<template x-if="mergeBurstActive">
  <div class="pointer-events-none fixed inset-0 z-[140] flex items-center justify-center overflow-visible"
       data-testid="worktree-merge-confetti-layer">
    <div class="relative h-72 w-[28rem] max-w-[86vw]">
      <div class="merge-confetti-glow absolute left-1/2 top-1/2 h-24 w-24 rounded-full bg-emerald-300/20 blur-2xl"></div>
      <template x-for="piece in confettiPieces" :key="mergeBurstSeed + '-' + piece.id">
        <span class="merge-confetti-piece absolute left-1/2 top-1/2 h-4 w-2 rounded-full shadow-[0_0_14px_rgba(255,255,255,0.28)]"
              :style="'--dx:' + piece.dx + 'px; --dy:' + piece.dy + 'px; --rot:' + piece.rot + 'deg; background:' + piece.color + '; animation-delay:' + piece.delay + 'ms'"></span>
      </template>
    </div>
  </div>
</template>

<template x-if="selectedCommit">
  <div class="worktree-review-overlay fixed inset-0 z-50 overflow-y-auto bg-gray-950"
       x-ref="commitDetailScroller"
       @click.self="selectedCommit = null"
       @keydown.escape.window="selectedCommit = null"
       @scroll.passive="syncReviewHeaderState()"
       data-testid="worktree-commit-detail">
    <template x-if="selectedCommit.signMode">
      <div class="fixed inset-x-0 top-0 z-[60] border-b border-white/10 bg-gray-950/95 px-4 py-3 backdrop-blur sm:px-6"
           data-testid="sign-title-bar">
        <div class="mx-auto flex max-w-6xl items-center gap-2">
          <span class="text-base leading-none">🔐</span>
          <span class="shrink-0 text-sm font-semibold text-slate-100">Signature request</span>
          <span class="min-w-0 flex-1 truncate text-xs text-slate-400"
                x-text="(selectedCommit.row.repo_name ? '· ' + selectedCommit.row.repo_name + ' ' : '') + '· ' + (selectedCommit.commit.subject || '')"></span>
        </div>
      </div>
    </template>
    <template x-if="selectedCommit.signMode">
      <div class="fixed inset-x-0 bottom-0 z-[60] border-t border-white/10 bg-gray-950/95 px-4 py-3 backdrop-blur sm:px-6"
           data-testid="sign-footer">
        <div class="mx-auto max-w-6xl">
          <template x-if="!signPrompt">
            <div class="flex items-center gap-3">
              <button type="button"
                      class="h-12 flex-1 rounded-2xl bg-indigo-600 text-base font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-wait disabled:opacity-50"
                      :disabled="signing" @click="onSignTap()" data-testid="sign-commit-button">
                <span x-show="!signing">Sign</span>
                <span x-show="signing" x-cloak>Signing…</span>
              </button>
              <button type="button"
                      class="h-12 rounded-2xl border border-white/10 px-5 text-sm font-semibold text-slate-300 disabled:opacity-50"
                      :disabled="signing" @click="declineApproval()" data-testid="sign-cancel-button">Decline</button>
            </div>
          </template>
          <template x-if="signPrompt">
            <div class="flex flex-col gap-3">
              <input type="password" x-model="signPassphrase" x-ref="signPassphraseInput" placeholder="GPG passphrase"
                     class="h-14 w-full rounded-2xl border border-white/10 bg-black/40 px-4 text-lg tracking-[0.3em] text-slate-100 placeholder:text-base placeholder:tracking-normal placeholder:text-slate-500"
                     data-testid="sign-passphrase" @keydown.enter="confirmSign()">
              <label class="flex items-center gap-2 text-xs text-slate-400">
                <input type="checkbox" x-model="signRemember" class="h-4 w-4 rounded border-white/20 bg-black/40" data-testid="sign-remember">
                Remember for this session — stays in this browser tab, encrypted; never sent anywhere. Cleared when the tab closes.
              </label>
              <div class="flex items-center gap-3">
                <button type="button"
                        class="h-12 flex-1 rounded-2xl bg-indigo-600 text-base font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-wait disabled:opacity-50"
                        :disabled="signing || !signPassphrase" @click="confirmSign()" data-testid="sign-confirm-button">
                  <span x-show="!signing">Sign</span>
                  <span x-show="signing" x-cloak>Signing…</span>
                </button>
                <button type="button"
                        class="h-12 rounded-2xl border border-white/10 px-5 text-sm font-semibold text-slate-300 disabled:opacity-50"
                        :disabled="signing" @click="signPrompt = false; signPassphrase = ''" data-testid="sign-back-button">Back</button>
              </div>
              <template x-if="signError">
                <p class="text-sm text-rose-300" data-testid="sign-error" x-text="signError"></p>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
    <section class="worktree-review-shell min-h-screen bg-gray-950">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8"
           :class="selectedCommit.signMode ? 'pt-16 pb-44' : 'pt-4 pb-8'">
        <div class="-mx-4 mb-4 px-4 pt-1 sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
          <div class="mx-auto max-w-6xl">
            <div class="mb-2 flex min-w-0 flex-wrap items-center gap-2">
              <template x-if="selectedCommit.row.session_live && selectedCommit.row.session_project">
                <a :href="'/session/' + encodeURIComponent(selectedCommit.row.session_project) + '/' + encodeURIComponent(selectedCommit.row.session_name)"
                   class="inline-flex min-w-0 items-center gap-1.5 rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200 hover:bg-indigo-500/20"
                   :title="'Open session viewer: ' + selectedCommit.row.session_name">
                  <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-400"></span>
                  <span x-text="selectedCommit.row.session_name"></span>
                </a>
              </template>
              <template x-if="!(selectedCommit.row.session_live && selectedCommit.row.session_project)">
                <span class="inline-flex min-w-0 items-center gap-1.5 rounded-full border border-indigo-500/20 bg-indigo-500/10 px-2 py-0.5 font-mono text-[10px] font-semibold text-indigo-200">
                  <template x-if="selectedCommit.row.session_live">
                    <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-400"></span>
                  </template>
                  <span x-text="selectedCommit.row.session_name"></span>
                </span>
              </template>
              <template x-if="statusLabel(selectedCommit.row) !== 'LIVE'">
                <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                      :class="statusClass(selectedCommit.row)"
                      x-text="statusLabel(selectedCommit.row)"></span>
              </template>
              <template x-if="isPrReview()">
                <span class="inline-flex items-center gap-1.5 rounded-full border px-2 py-0.5 text-[10px] font-semibold"
                      :class="prBadgeClass(selectedCommit.pr)">
                  <span class="h-1.5 w-1.5 rounded-full"
                        :class="prDotClass(selectedCommit.pr)"></span>
                  <span x-text="'PR #' + selectedCommit.pr.number"></span>
                </span>
              </template>
              <div class="ml-auto flex shrink-0 items-center gap-2">
                <template x-if="canRefreshSelectedRow()">
                  <button type="button"
                          class="h-10 rounded-2xl border border-white/10 bg-white/[0.03] px-3 text-xs font-semibold text-slate-300 transition hover:border-white/20 hover:text-white disabled:cursor-wait disabled:opacity-50"
                          :disabled="rowRefreshing"
                          @click="refreshSelectedRow()"
                          data-testid="review-overlay-refresh-button"
                          x-text="rowRefreshing ? 'Refreshing...' : 'Refresh'">Refresh</button>
                </template>
                <button type="button"
                        class="h-10 w-10 shrink-0 rounded-full border border-white/10 bg-white/[0.03] text-slate-300"
                        @click="selectedCommit = null">×</button>
              </div>
            </div>

            <template x-if="!isPrReview() && selectedCommit.total > 1">
              <div class="mb-2 flex justify-center sm:justify-start">
                <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-slate-950/80 px-2 py-0.5 text-[10px] font-semibold text-slate-300">
                  <button type="button"
                          class="rounded-full border border-white/10 px-1.5 py-0.5 text-slate-300 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40"
                          :disabled="!hasEarlierCommit()"
                          @click="viewEarlierCommit()"
                          aria-label="View earlier commit">←</button>
                  <span class="font-mono text-slate-200"
                        x-text="'commit ' + (selectedCommit.commitIndex + 1) + ' of ' + selectedCommit.total"></span>
                  <button type="button"
                          class="rounded-full border border-white/10 px-1.5 py-0.5 text-slate-300 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40"
                          :disabled="!hasLaterCommit()"
                          @click="viewLaterCommit()"
                          aria-label="View later commit">→</button>
                </div>
              </div>
            </template>

            <div class="mb-5 flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
              <div class="min-w-0 flex-1">
                <div class="mb-3 flex min-w-0 flex-col gap-1.5 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500">
                  <template x-if="selectedCommit.row.repo_name">
                    <span class="inline-flex w-fit shrink-0 items-center gap-1.5 rounded-full border border-white/10 bg-slate-800 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-400 normal-case"
                          data-branch-part="repo">
                      <span class="uppercase tracking-wider text-slate-500">repo</span>
                      <span class="text-slate-200" x-text="repoName(selectedCommit.row)"></span>
                    </span>
                  </template>
                  <div class="flex min-w-0 flex-col gap-1.5 pl-3 normal-case">
                    <span class="inline-flex min-w-0 items-center gap-2">
                      <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wider text-slate-500">src</span>
                      <span class="min-w-0 truncate rounded-full border border-white/10 bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-200"
                            :title="sourceBranch(selectedCommit.row)"
                            x-text="sourceBranch(selectedCommit.row)"></span>
                    </span>
                    <span class="inline-flex min-w-0 items-center gap-2">
                      <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wider text-slate-500">dst</span>
                      <span class="min-w-0 truncate rounded-full border border-white/10 bg-slate-900 px-2 py-0.5 font-mono text-[10px] font-semibold text-slate-200"
                            :title="targetBranch(selectedCommit.row)"
                            x-text="targetBranch(selectedCommit.row)"></span>
                    </span>
                  </div>
                  <div class="min-w-0 normal-case">
                    <template x-if="!isPrReview() && selectedCommit.pr">
                      <button type="button"
                              class="mt-1 inline-flex max-w-full items-center gap-2 rounded-2xl border border-white/10 bg-slate-950/75 px-3 py-2 text-left transition hover:border-white/20 hover:bg-white/[0.04]"
                              @click="openReviewPr(selectedCommit.row, selectedCommit.pr)"
                              data-testid="review-commit-owning-pr-button">
                        <span class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">owning pr</span>
                        <span class="inline-flex items-center gap-1.5 rounded-full border px-2 py-0.5 text-[10px] font-semibold"
                              :class="prBadgeClass(selectedCommit.pr)">
                          <span class="h-1.5 w-1.5 rounded-full"
                                :class="prDotClass(selectedCommit.pr)"></span>
                          <span x-text="'PR #' + (selectedCommit.pr.number != null ? selectedCommit.pr.number : selectedCommit.pr.review_id)"></span>
                        </span>
                        <span class="min-w-0 truncate text-sm text-slate-200"
                              x-text="selectedCommit.pr.title || ('PR #' + (selectedCommit.pr.number != null ? selectedCommit.pr.number : selectedCommit.pr.review_id))"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </div>

              <template x-if="isPrReview()">
                <div class="w-full max-w-sm shrink-0 rounded-3xl border border-white/10 bg-slate-950/75 p-4 shadow-2xl shadow-black/20">
                  <div class="mb-3 flex items-center justify-between gap-3">
                    <div>
                      <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">PR Review</div>
                      <div class="mt-1 text-lg font-semibold text-white"
                           x-text="'PR #' + selectedCommit.pr.number"></div>
                    </div>
                    <a :href="selectedCommit.pr.url"
                       target="_blank"
                       rel="noreferrer"
                       class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs font-semibold transition"
                       :class="prBadgeClass(selectedCommit.pr)">
                      <span class="h-1.5 w-1.5 rounded-full"
                            :class="prDotClass(selectedCommit.pr)"></span>
                      <span>Open PR</span>
                    </a>
                  </div>
                  <div class="space-y-2 text-sm text-slate-300">
                    <p class="font-medium text-white"
                       x-text="selectedCommit.pr.title || 'No PR title'"></p>
                    <template x-if="(selectedCommit.pr.body || '').trim()">
                      <div class="text-sm leading-6 text-slate-400"
                           x-markdown="selectedCommit.pr.body"></div>
                    </template>
                  </div>
                  <template x-if="rowPrChecks(selectedCommit.row, selectedCommit.pr).length">
                    <div class="mt-4 space-y-2">
                      <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Checks</div>
                      <div class="space-y-1.5">
                        <template x-for="check in rowPrChecks(selectedCommit.row, selectedCommit.pr)"
                                  :key="'review-' + (check.id || check.label)">
                          <div class="flex items-center justify-between gap-3 rounded-2xl border border-white/10 bg-black/20 px-3 py-2 text-xs text-slate-300">
                            <div class="flex min-w-0 items-center gap-2">
                              <span class="inline-flex h-6 w-6 items-center justify-center rounded-full border border-white/10 bg-white/[0.03] text-[11px] font-semibold text-slate-100"
                                    x-text="check.icon || '·'"></span>
                              <div class="min-w-0">
                                <div class="truncate font-medium text-white"
                                     x-text="check.label || 'Check'"></div>
                                <div class="truncate text-[11px] text-slate-500"
                                     x-text="check.detail || describeCheckStatus(check.status)"></div>
                              </div>
                            </div>
                            <span class="rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider"
                                  :class="check.status === 'pass'
                                    ? 'bg-emerald-300/10 text-emerald-100'
                                    : (check.status === 'running'
                                      ? 'bg-sky-300/10 text-sky-100'
                                      : (check.status === 'pending'
                                        ? 'bg-slate-300/10 text-slate-200'
                                        : 'bg-amber-300/10 text-amber-100'))"
                                  x-text="describeCheckStatus(check.status)"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div x-ref="commitTitleSentinel" class="h-px"></div>
        <div x-ref="commitTitleBar"
             class="sticky top-0 z-10 -mx-4 border-y border-white/10 bg-gray-950/95 px-4 backdrop-blur transition-all duration-200 ease-out sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8"
             :class="reviewTitlePinned ? 'py-2' : 'py-3'">
          <div class="mx-auto max-w-6xl">
            <h3 class="max-w-4xl font-semibold text-white transition-all duration-200 ease-out"
                :class="reviewTitlePinned ? 'text-base leading-5 sm:text-3xl sm:leading-9' : 'text-2xl leading-8 sm:text-3xl sm:leading-9'"
                x-text="selectedCommit.commit.subject"></h3>
          </div>
        </div>

        <div>
          <template x-if="(selectedCommit.commit.body || '').trim()">
            <div class="mb-6 max-w-4xl text-sm leading-6 text-slate-300"
                 data-testid="worktree-review-commit-body"
                 x-markdown="selectedCommit.commit.body"></div>
          </template>

          <div class="mb-6">
            <div x-ref="commitFilesHeader"
                 class="sticky z-[8] -mx-2 mb-2 flex items-center justify-between gap-3 border-y border-white/10 bg-gray-950/95 px-2 py-2 backdrop-blur"
                 :style="'top:' + commitStickyTop + 'px'">
              <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500"
                   x-text="isPrReview() ? 'Files in this PR' : 'Files in this commit'"></div>
              <div class="flex items-center gap-3">
                <div class="flex shrink-0 items-center gap-2 font-mono text-[10px] text-slate-500">
                  <span x-text="selectedCommit.commit.stats.files + ' files'"></span>
                  <span class="text-emerald-300" x-text="'+' + selectedCommit.commit.stats.additions"></span>
                  <span class="text-rose-300" x-text="'-' + selectedCommit.commit.stats.deletions"></span>
                </div>
                <button type="button"
                        class="rounded-xl border border-white/10 px-3 py-1 text-xs font-semibold text-slate-300"
                        @click="showDiff = !showDiff"
                        x-text="showDiff ? 'Hide Diffs' : 'Show Diffs'"></button>
              </div>
            </div>
            <div class="divide-y divide-white/10 border-y border-white/10">
              <template x-for="file in selectedCommit.commit.files" :key="selectedCommit.commit.sha + file.status + file.path">
                <div :class="showDiff ? 'py-3' : 'py-1.5'">
                  <div class="grid grid-cols-[0.85rem_minmax(0,1fr)_auto] items-center gap-1.5"
                       :class="showDiff ? 'sticky z-[7] -mx-2 border-b border-white/10 bg-gray-950/95 px-2 py-1.5 backdrop-blur' : ''"
                       :style="showDiff ? 'top:' + commitFileRowStickyTop + 'px' : ''">
                    <span class="text-center font-mono text-[10px] font-bold text-indigo-200" x-text="file.status"></span>
                    <span class="min-w-0 overflow-hidden whitespace-nowrap font-mono text-[11px] leading-4 text-slate-300"
                          :title="file.path"
                          x-text="fitPath(file.path, $el)"></span>
                    <span class="inline-flex shrink-0 items-center gap-1 font-mono text-[11px]">
                      <span class="text-emerald-300" x-text="'+' + file.additions"></span>
                      <span class="text-rose-300" x-text="'-' + file.deletions"></span>
                    </span>
                  </div>
                  <template x-if="showDiff && patchLinesForFile(selectedCommit, file).length">
                    <div class="worktree-diff-scroller mt-2">
                      <div class="min-w-full w-max">
                        <template x-for="(line, idx) in patchLinesForFile(selectedCommit, file)" :key="file.path + '-' + idx">
                          <div class="grid min-w-full w-max grid-cols-[2rem_2rem_0.75rem_max-content] items-start gap-0 font-mono text-[11px] leading-5"
                               :class="line.kind === 'add' ? 'bg-emerald-300/[0.08]' : (line.kind === 'del' ? 'bg-rose-300/[0.08]' : 'bg-transparent')">
                            <span class="select-none border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.oldNo"></span>
                            <span class="select-none border-r border-white/10 px-1.5 text-right text-slate-500" x-text="line.newNo"></span>
                            <span class="select-none border-r border-white/10 text-center"
                                  :class="line.kind === 'add' ? 'text-emerald-300' : (line.kind === 'del' ? 'text-rose-300' : 'text-slate-600')"
                                  x-text="diffMarker(line.kind)"></span>
                            <span class="worktree-diff-code hljs whitespace-pre px-2 pr-3"
                                  :class="line.kind === 'add' ? 'text-emerald-100' : (line.kind === 'del' ? 'text-rose-100' : 'text-slate-300')"
                                  x-html="line.html || '&nbsp;'"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
            <template x-if="detailLoading">
              <div class="mt-3 text-xs text-slate-500">Loading commit diff...</div>
            </template>
          </div>
        </div>

        <div class="relative mt-6">
          <!-- Sign mode uses the pinned title bar + footer at the top of this overlay. -->
          <template x-if="!selectedCommit.signMode && !isPrReview() && supportsDashboardMerge(selectedCommit.row)">
            <div class="mx-auto flex max-w-6xl flex-col gap-2 md:flex-row md:items-center">
              <template x-if="cloneStale(selectedCommit.row)">
                <button type="button"
                        class="h-11 rounded-2xl bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-wait disabled:opacity-50 md:flex-1"
                        :disabled="isSyncingBase(selectedCommit.row)"
                        @click="syncBase(selectedCommit.row)"
                        data-testid="worktree-sync-base-button">
                  <span x-show="!isSyncingBase(selectedCommit.row)">Sync Worktree to Latest</span>
                  <span x-show="isSyncingBase(selectedCommit.row)">Syncing...</span>
                </button>
              </template>
              <template x-if="!cloneStale(selectedCommit.row) && canCherryPick(selectedCommit)">
                <button type="button"
                        class="h-11 rounded-2xl bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-wait disabled:opacity-50 md:flex-1"
                        :disabled="cherryPicking"
                        @click="cherryPickCommit(selectedCommit.row)"
                        data-testid="worktree-cherry-pick-button">
                  <span x-show="!cherryPicking" x-text="'Cherry Pick to ' + targetBranch(selectedCommit.row)"></span>
                  <span x-show="cherryPicking">Cherry-picking...</span>
                </button>
              </template>
              <template x-if="!cloneStale(selectedCommit.row) && !canCherryPick(selectedCommit)">
                <div class="md:flex-1">
                  <button type="button"
                          class="h-11 w-full rounded-2xl px-4 text-sm font-semibold transition disabled:cursor-not-allowed"
                          :class="mergeState === 'success'
                            ? 'bg-emerald-500 text-white hover:bg-emerald-500'
                            : (canMergeCommit(selectedCommit)
                              ? 'bg-indigo-600 text-white hover:bg-indigo-500'
                              : 'bg-gray-800 text-gray-500')"
                          :disabled="!canMergeCommit(selectedCommit) || mergeState === 'working' || mergeState === 'success'"
                          :title="mergeDisabledReason(selectedCommit)"
                          @click="startMergeCommit()"
                          data-testid="worktree-commit-merge-button">
                    <span class="inline-flex items-center justify-center gap-2">
                      <template x-if="mergeState === 'working'">
                        <span class="inline-flex items-center gap-2">
                          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                          <span x-text="mergeCommitLabel(selectedCommit)"></span>
                        </span>
                      </template>
                      <template x-if="mergeState === 'success'">
                        <span class="inline-flex items-center gap-2">
                          <span class="text-base leading-none">✓</span>
                          <span>Merged</span>
                        </span>
                      </template>
                      <template x-if="mergeState !== 'working' && mergeState !== 'success'">
                        <span x-text="mergeCommitLabel(selectedCommit)"></span>
                      </template>
                    </span>
                  </button>
                  <template x-if="mergeDisabledReason(selectedCommit)">
                    <p class="mt-2 text-sm leading-5 text-amber-200 md:text-xs md:leading-4"
                       data-testid="worktree-merge-disabled-reason"
                       x-text="mergeDisabledReason(selectedCommit)"></p>
                  </template>
                </div>
              </template>

                x-text="approvalRequest.session"></span>
          <template x-if="approvalRequest.target">
            <span class="inline-flex overflow-hidden rounded-full border border-white/10 text-[10px] font-semibold">
              <span class="bg-slate-800 px-2 py-0.5 uppercase tracking-wider text-slate-500" x-text="approvalRequest.op || 'op'"></span>
              <span class="bg-slate-900 px-2 py-0.5 font-mono text-slate-200" x-text="approvalRequest.target"></span>
            </span>
          </template>
        </div>
        <template x-if="approvalRequest.bodyMarkdown">
          <pre class="mt-4 whitespace-pre-wrap rounded-2xl border border-white/10 bg-slate-900/60 p-4 font-sans text-sm leading-relaxed text-slate-200"
               data-testid="approval-body" x-text="approvalRequest.bodyMarkdown"></pre>
        </template>
        <template x-if="approvalRequest.kind === 'fleet_machine_admission'">
          <div class="mt-4 space-y-4" data-testid="approval-fleet-admission">
            <div class="rounded-2xl border border-indigo-400/25 bg-indigo-500/10 px-5 py-5 text-center">
              <div class="text-[10px] font-semibold uppercase tracking-[0.2em] text-indigo-300">
                Machine comparison code
              </div>
              <div class="mt-3 break-words font-mono text-xl font-semibold tracking-[0.14em] text-white sm:text-2xl"
                   data-testid="approval-fleet-pin"
                   x-text="approvalRequest.fleet.verificationCode"></div>
            </div>
            <div class="grid grid-cols-[7rem_minmax(0,1fr)] gap-3 rounded-2xl border border-white/10 bg-slate-900/60 p-4 text-xs">
              <span class="text-slate-500">Request</span>
              <span class="truncate font-mono text-slate-300"
                    x-text="approvalRequest.fleet.requestId"></span>
              <span class="text-slate-500">Fleet anchor</span>
              <span class="truncate font-mono text-slate-300"
                    x-text="approvalRequest.fleet.personalRootPub"></span>
            </div>
          </div>
        </template>
        <template x-if="approvalRequest.kind === 'mcp_peer_link'">
          <div class="mt-4 space-y-4" data-testid="approval-mcp-link">
            <div>
              <label class="text-sm font-medium text-slate-200">Autonomy org</label>
              <template x-if="approvalRequest.orgs && approvalRequest.orgs.length">
                <select x-model="approvalRequest.autonomyOrg" data-testid="approval-mcp-org"
                        class="mt-2 w-full rounded-2xl border border-slate-600 bg-slate-900/60 px-4 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none">
                  <option value="" disabled>Choose an org…</option>
                  <template x-for="o in approvalRequest.orgs" :key="o">
                    <option :value="o" x-text="o"></option>
                  </template>
                </select>
              </template>
              <template x-if="!approvalRequest.orgs || !approvalRequest.orgs.length">
                <input x-model="approvalRequest.autonomyOrg" type="text" placeholder="org slug"
                       data-testid="approval-mcp-org"
                       class="mt-2 w-full rounded-2xl border border-slate-600 bg-slate-900/60 px-4 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none">
              </template>
            </div>
            <div>
              <label class="text-sm font-medium text-slate-200">Access level</label>
              <select x-model="approvalRequest.level" data-testid="approval-mcp-level"
                      class="mt-2 w-full rounded-2xl border border-slate-600 bg-slate-900/60 px-4 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none">
                <option value="read">Read only</option>
                <option value="readwrite">Read &amp; write</option>
              </select>
            </div>
            <div>
              <label class="text-sm font-medium text-slate-200">Expires</label>
              <select x-model="approvalRequest.ttl" data-testid="approval-mcp-ttl"
                      class="mt-2 w-full rounded-2xl border border-slate-600 bg-slate-900/60 px-4 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none">
                <option value="86400">1 day</option>
                <option value="604800">7 days</option>
                <option value="2592000">30 days</option>
                <option value="7776000">90 days</option>
                <option value="">Never</option>
              </select>
            </div>
          </div>
        </template>
        <template x-if="approvalRequest.kind === 'mcp_crosstalk'">
          <div class="mt-4 space-y-4" data-testid="approval-mcp-crosstalk">
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div class="rounded-2xl border border-white/10 bg-slate-900/60 p-4">
                <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Requester</div>
                <div class="mt-1 flex items-center gap-2 text-sm text-slate-100">
                  <span aria-hidden="true">💬</span><span>ChatGPT</span>
                  <span class="font-mono text-xs text-indigo-200" x-text="approvalRequest.xtalk.handle"></span>
                </div>
                <div class="mt-1 text-xs text-slate-400"
                     x-text="approvalRequest.xtalk.intent || 'no stated intent'"></div>
              </div>
              <div class="rounded-2xl border border-white/10 bg-slate-900/60 p-4">
                <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Target session</div>
                <div class="mt-1 font-mono text-sm text-slate-100" x-text="approvalRequest.xtalk.targetSession"></div>
                <template x-if="approvalRequest.xtalk.targetLabel">
                  <div class="mt-1 text-xs text-slate-300" x-text="approvalRequest.xtalk.targetLabel"></div>
                </template>
              </div>
            </div>
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Message</div>
              <blockquote data-testid="approval-mcp-xtalk-message"
                          class="mt-1 whitespace-pre-wrap rounded-2xl border-l-4 border-indigo-500/60 bg-slate-900/60 p-4 text-sm leading-relaxed text-slate-100"
                          x-text="approvalRequest.xtalk.message"></blockquote>
            </div>
            <div>
              <label class="text-sm font-medium text-slate-200">Keep this channel open for</label>
              <select x-model="approvalRequest.ttl" data-testid="approval-mcp-xtalk-ttl"
                      class="mt-2 w-full rounded-2xl border border-slate-600 bg-slate-900/60 px-4 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none">
                <option value="3600">1 hour</option>
                <option value="43200">12 hours</option>
                <option value="86400">1 day</option>
                <option value="604800">1 week</option>
              </select>
            </div>
          </div>
        </template>
        <template x-if="approvalRequest.kind === 'visitor_token'">
          <div class="mt-4 flex flex-col items-center text-center" data-testid="approval-visitor">
            <img x-show="approvalRequest.staged && approvalRequest.staged.avatar_url" x-cloak
                 :src="approvalRequest.staged && approvalRequest.staged.avatar_url"
                 :alt="approvalRequest.staged && approvalRequest.staged.display_name"
                 data-testid="approval-visitor-photo"
                 class="h-24 w-24 rounded-full object-cover ring-2 ring-slate-600">
            <div x-show="!(approvalRequest.staged && approvalRequest.staged.avatar_url)" x-cloak
                 data-testid="approval-visitor-nophoto"
                 class="flex h-24 w-24 items-center justify-center rounded-full bg-slate-700 text-2xl font-semibold text-slate-300"
                 x-text="(approvalRequest.staged && approvalRequest.staged.display_name || '?').trim().charAt(0).toUpperCase()"></div>
            <div class="mt-3 text-base font-semibold text-slate-100"
                 data-testid="approval-visitor-name"
                 x-text="approvalRequest.staged && approvalRequest.staged.display_name"></div>
            <p x-show="approvalRequest.staged && approvalRequest.staged.reason" x-cloak
               class="mt-1 text-sm leading-5 text-slate-400"
               data-testid="approval-visitor-reason"
               x-text="approvalRequest.staged && approvalRequest.staged.reason"></p>
            <p class="mt-3 text-xs leading-5 text-slate-500">
              Approving gives this person a link that opens your missions.
            </p>
          </div>
        </template>
        <template x-if="approvalRequest.kind === 'secure_setting'">
          <div class="mt-4 space-y-4" data-testid="approval-secure-setting">
            <template x-for="f in approvalRequest.secure.fields" :key="f.key">
              <div>
                <label class="text-sm font-medium text-slate-200" x-text="f.label"></label>
                <div class="mt-2 flex items-center rounded-2xl border border-slate-600 bg-slate-900/60 focus-within:border-indigo-400">
                  <input x-model="f.value"
                         :type="f.secret && !f.show ? 'password' : 'text'"
                         :placeholder="f.placeholder"
                         :data-testid="'approval-secure-field-' + f.key"
                         autocomplete="off" autocapitalize="off" spellcheck="false"
                         class="w-full bg-transparent px-4 py-3 text-sm text-slate-100 focus:outline-none">
                  <button type="button" x-show="f.secret"
                          class="shrink-0 px-3 text-xs font-semibold text-slate-400 hover:text-slate-200"
                          @click="f.show = !f.show"
                          x-text="f.show ? 'Hide' : 'Show'"></button>
                </div>
              </div>
            </template>
            <p class="text-xs leading-5 text-slate-500">
              🔒 Sealed in this browser to the host's recipient key
              — the dashboard stores only the ciphertext.
            </p>
          </div>
        </template>
        <template x-if="approvalRequest.needsPassword">
          <div class="mt-4">
            <label for="approval-revoke-password" data-testid="approval-password-label"
                   class="text-sm font-medium text-slate-200"
                   x-text="approvalRequest.passwordLabel || 'Organization password'"></label>
            <input id="approval-revoke-password" data-testid="approval-revoke-password"
                   x-model="approvalRequest.password" type="password"
                   autocomplete="current-password" placeholder="Enter password"
                   class="mt-2 w-full rounded-2xl border border-slate-600 bg-slate-900/60 px-4 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none">
          </div>
        </template>
        <p x-show="approvalRequest.error" x-cloak data-testid="approval-simple-error"
           class="mt-3 text-xs leading-5 text-red-300" x-text="approvalRequest.error"></p>
        <template x-if="approvalRequest.fields">
          <pre class="mt-4 whitespace-pre-wrap rounded-2xl border border-white/10 bg-slate-900/60 p-4 text-xs leading-relaxed text-slate-200"
               data-testid="approval-fields" x-text="JSON.stringify(approvalRequest.fields, null, 2)"></pre>
        </template>
      </div>
    </section>
  </div>
</template>
