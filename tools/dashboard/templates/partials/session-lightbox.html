      <!-- Viewer-attachment lightbox: shown when openLightbox() sets the src.
           Images close on tap; files render in-overlay (iframe for viewable
           types, Download for binaries) so the page + voice connection stay
           alive — no navigation, unlike the old <a target=_blank> file link. -->
      <template x-if="lightboxSrc">
        <template x-teleport="body">
        <div class="sc-va-lightbox"
             data-testid="viewer-attachment-lightbox"
             @click="closeLightbox()"
             @keydown.escape.window="closeLightbox()"
             tabindex="-1"
             x-init="$el.focus()">
          <template x-if="lightboxKind === 'image'">
            <img :src="lightboxSrc" :alt="lightboxAlt" class="sc-va-lightbox-img">
          </template>
          <template x-if="lightboxKind === 'iframe'">
            <iframe sandbox="allow-scripts" :src="lightboxSrc" :title="lightboxAlt" @click.stop
                    style="width:92vw;height:88vh;border:none;border-radius:8px;background:#fff"></iframe>
          </template>
          <template x-if="lightboxKind === 'markdown'">
            <!-- Panel is a fixed-size flex column; the × button is pinned to its
                 top-right so it stays visible while the prose body scrolls.
                 @click.stop keeps clicks inside the panel from reaching the
                 overlay's backdrop-close handler. -->
            <div @click.stop class="sc-va-lightbox-md-panel">
              <button type="button"
                      class="sc-va-lightbox-md-close"
                      data-testid="lightbox-md-close"
                      @click="closeLightbox()"
                      aria-label="Close">&times;</button>
              <div class="sc-va-lightbox-md" x-markdown="lightboxMarkdown"></div>
            </div>
          </template>
          <template x-if="lightboxKind === 'download'">
            <div @click.stop
                 style="background:#172232;border:1px solid #25364c;border-radius:12px;padding:24px;max-width:80vw;text-align:center;color:#cbd5e1">
              <div style="margin-bottom:14px;word-break:break-all;font-size:14px" x-text="lightboxName || 'file'"></div>
              <a :href="lightboxSrc" :download="lightboxName || ''"
                 style="display:inline-block;padding:10px 18px;background:#5638f3;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">Download</a>
            </div>
          </template>
          <template x-if="lightboxKind === 'shortcut'">
            <div @click.stop class="sc-va-shortcut-sheet" data-testid="shortcut-install-sheet">
              <div class="sc-va-shortcut-mark" aria-hidden="true">
                <span></span><span></span>
              </div>
              <div class="sc-va-shortcut-kicker">APPLE SHORTCUT</div>
              <h2 x-text="(lightboxName || 'Autonomy Capture.shortcut').replace(/\.shortcut$/i, '')"></h2>
              <p class="sc-va-shortcut-copy">
                Hand the signed installer to iOS without replacing this Autonomy window.
              </p>
              <button type="button"
                      class="sc-va-shortcut-open"
                      data-testid="shortcut-install-open"
                      :disabled="lightboxFileState === 'loading'"
                      @click="openShortcutInstaller()">
                <span x-show="lightboxFileState === 'loading'">Preparing signed file&hellip;</span>
                <span x-show="lightboxFileState !== 'loading'">Open in Shortcuts</span>
              </button>
              <p class="sc-va-shortcut-hint"
                 x-text="canShareLightboxFile() ? 'Choose Shortcuts in the iOS share sheet.' : 'The installer opens separately so Autonomy stays here.'"></p>
              <p class="sc-va-shortcut-error" x-show="lightboxFileError" x-text="lightboxFileError"></p>
              <button type="button" class="sc-va-shortcut-cancel" @click="closeLightbox()">Cancel</button>
            </div>
          </template>
        </div>
        </template>
      </template>
