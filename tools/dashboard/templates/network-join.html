<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accept an invitation — Autonomy</title>
<!-- Invitation display (auto-1ihgz). Constraint: no input fields ever
     on this page (I1); controls appear only when their function exists. -->
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#2a2f3d; --ink:#e5e7eb;
          --dim:#9ca3af; --accent:#6366f1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:600px; margin:0 auto; padding:3rem 1.25rem 4rem; }
  h1 { font-size:1.45rem; margin:0 0 .4rem; }
  .sub { color:var(--dim); margin-bottom:1.5rem; }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:1.1rem 1.3rem; margin:1rem 0; }
  .card h2 { font-size:1rem; margin:0 0 .5rem; color:#818cf8; }
  .row { display:flex; justify-content:space-between; gap:1rem;
         padding:.3rem 0; font-size:.92rem; }
  .row .k { color:var(--dim); }
  .row .v { font:.85rem ui-monospace,monospace; word-break:break-all; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:.55rem 1.1rem; font-weight:600; cursor:pointer; }
  .dim { color:var(--dim); font-size:.88rem; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Accept an invitation</h1>
  <p class="sub" id="status-line">Reading your invitation…</p>

  <div id="incomplete" class="card hidden">
    <h2>This invitation link is incomplete</h2>
    <p class="dim">Some apps cut off part of a link when forwarding —
    everything after the <code>#</code> matters. Ask for a fresh link.</p>
  </div>

  <div id="invitation" class="hidden">
    <div class="card">
      <h2>Invitation</h2>
      <div class="row"><span class="k">Organization</span>
        <span class="v" id="org-id"></span></div>
      <div class="row"><span class="k">Invitation reference</span>
        <span class="v" id="invite-ref"></span></div>
    </div>
  </div>
</main>
<script src="/static/js/network-join.js"></script>
</body>
</html>
