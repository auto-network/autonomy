\* Green liveness configuration: under weak fairness on the reliable
\* machinery, every session drains, links, resolves characterization, and
\* the registry becomes truthful.  Restart enabled; crash/cancel enabled
\* (the fixed design must retain responsibility through both).
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA", "wB"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "processFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 1
    CrashBudget = 1
    CancelBudget = 1
    PollerBudget = 1
    RelaunchBudget = 1
    RelaunchOffsetCAS = TRUE
PROPERTY EventuallyDrained
PROPERTY RelaunchBackfills
PROPERTY EventuallyLinked
PROPERTY CharacterizingResolves
PROPERTY NoDurableStartingCard
