\* Green safety configuration: the full fixed design must satisfy every
\* safety invariant with restart, crash, cancel, and poller enabled.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA", "wB"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "processFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 1
    CrashBudget = 1
    CancelBudget = 1
    PollerBudget = 1
INVARIANT Inv
INVARIANT SingleOwner
