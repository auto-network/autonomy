\* A1: drain ownership keyed per (session,file) with no generation
\* CAS at persistence, while the row is keyed per session — during
\* rollover two drains interleave writes to one offset.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "m2", "m3"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA", "wB"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = FALSE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
    RelaunchBudget = 0
    RelaunchOffsetCAS = FALSE
INVARIANT OffsetCoherent
