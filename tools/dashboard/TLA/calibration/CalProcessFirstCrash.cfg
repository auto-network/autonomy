\* Residual pin (operator-accepted 2026-08-10): publish-then-persist under
\* a crash re-delivers the in-flight range; this config DOCUMENTS the
\* accepted window by violating strict NoDuplicates; greens prove
\* BoundedDuplicates (duplicates bounded by crash count) instead.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "processFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 0
    CrashBudget = 1
    CancelBudget = 0
    PollerBudget = 0
    RelaunchBudget = 0
    RelaunchOffsetCAS = FALSE
INVARIANT NoDuplicates
