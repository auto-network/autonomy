\* A4 adjudication: process-before-persist alone is also wrong — a
\* crash between process and persist re-delivers the same lines on
\* the retry.  Only idempotent publication satisfies both sides.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "processFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    RestartBudget = 0
    CrashBudget = 1
    CancelBudget = 0
    PollerBudget = 0
INVARIANT NoDuplicates
