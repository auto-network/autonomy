\* Guard-branch reachability probe (V1 meta-technique): the birth-trust
\* CAS fail branch must be REACHABLE in the green design — this config
\* must fail, proving the first-resolution guard is live, not vacuous.
\* Needs the multi-main scenario: another file links between the CREATE
\* being queued and delivered (the V1 backward-link shape).
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "m2", "m3"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA", "wB"}
    MaxLines = 1
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 1
    CrashBudget = 1
    CancelBudget = 1
    PollerBudget = 0
INVARIANT ProbeBirthCASFailUnreached
