\* T87: contended MODIFY skipped instead of transferred via dirty.
\* The skipped signal may be the only one those bytes ever get —
\* must strand them.
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = FALSE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
PROPERTY EventuallyDrained
