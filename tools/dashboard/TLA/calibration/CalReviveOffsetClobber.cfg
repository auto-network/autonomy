\* Revive-clobber: WkPersist writes its offset monotonically with no
\* cursor CAS (the pre-fix design).  A session relaunch resets the row
\* cursor to 0 for a full backfill WITHOUT claiming the drain gate; an
\* in-flight pre-relaunch ack then Max-writes its high offset back,
\* reconciliation sees nothing to drain, and the promised backfill
\* never happens (RelaunchBackfills is violated).
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "processFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
    RelaunchBudget = 1
    RelaunchOffsetCAS = FALSE
PROPERTY RelaunchBackfills
