\* B5: cancellation of the drain awaiter skips the busy release; the
\* gate is pinned for the process lifetime and every MODIFY only
\* sets dirty.
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "none"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 1
    PollerBudget = 0
    RelaunchBudget = 0
    RelaunchOffsetCAS = FALSE
PROPERTY EventuallyDrained
