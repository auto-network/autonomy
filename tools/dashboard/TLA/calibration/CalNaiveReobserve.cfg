\* A6: unconditional re-observation of terminal tracks recreates the
\* same track every tick — quarantine/observe/expire churns forever.
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "always"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
PROPERTY CharacterizingResolves
