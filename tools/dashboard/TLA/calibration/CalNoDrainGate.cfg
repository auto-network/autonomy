\* T84: no single-owner drain gate; concurrent tails from snapshot
\* offsets (persist-first, the shipped code shape).  Must double-
\* deliver lines.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA", "wB"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = FALSE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "persistFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
INVARIANT NoDuplicates
