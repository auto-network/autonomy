\* A4: the offset is persisted before entries are processed (the
\* shipped _tail_one order).  A crash between persist and process
\* permanently advances past the startup burst.
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "persistFirst"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    RestartBudget = 0
    CrashBudget = 1
    CancelBudget = 0
    PollerBudget = 0
PROPERTY EventuallyDrained
