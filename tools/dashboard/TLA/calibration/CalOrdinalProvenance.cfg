\* T102: 'the first startup file never needs categorization' —
\* first-observed trusted for unresolved rows, categorization skipped.
\* Must adopt the child on a late scan (restart-mid-fork shape).
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "c1"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA"}
    MaxLines = 2
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = FALSE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    OrderedHandover = TRUE
    MortalWatermark = FALSE
    LateFlushBudget = 0
    RestartBudget = 0
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
INVARIANT NoChildAdoption
