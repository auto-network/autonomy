\* Green liveness over the rollover chain: the newest written file
\* is eventually linked and drained even across a restart that
\* swallows the rollover IN_CREATE (findings N2/N3 regression pin).
SPECIFICATION FairSpec
CONSTANTS
    SESSIONS = {"s1"}
    FILES = {"m1", "m2", "m3"}
    FKind <- ScenFKind
    FSession <- ScenFSession
    FSucc <- ScenFSucc
    FFirst <- ScenFFirst
    WORKERS = {"wA", "wB"}
    MaxLines = 1
    AttachCatchUp = TRUE
    RetainUnknown = TRUE
    TriStateClassifier = TRUE
    ContinuityProvenance = TRUE
    DrainGate = TRUE
    DirtyTransfer = TRUE
    TimeDrivenDeadline = TRUE
    SuppressPreDrainBroadcast = TRUE
    PersistOrder = "idempotent"
    SyncSchedulesDrain = TRUE
    ReobserveMode = "progress"
    CASRetry = TRUE
    PerSessionGate = TRUE
    EpochBarrier = TRUE
    MergeHarnessAtWrite = TRUE
    GateReleaseOnCancel = "guarded"
    RestartBudget = 1
    CrashBudget = 0
    CancelBudget = 0
    PollerBudget = 0
PROPERTY EventuallyDrained
PROPERTY EventuallyLinked
PROPERTY CharacterizingResolves
PROPERTY NoDurableStartingCard
