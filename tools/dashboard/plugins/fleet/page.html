<div x-data="fleetPage()" class="fleet-page pb-safe" data-testid="fleet-fragment-root">
  <div class="fleet-shell">
    <header class="fleet-header">
      <div class="min-w-0 flex-1">
        <h1>Your fleet</h1>
        <p class="fleet-verdict" :class="fleetTone()" x-show="view"><i></i><span x-text="fleetStatusLine()"></span></p>
      </div>
      <button type="button" class="fleet-refresh" @click="load()" :disabled="loading" aria-label="Refresh fleet">
        <span :class="loading ? 'animate-spin' : ''">↻</span>
      </button>
    </header>

    <div x-show="loading && !view" class="fleet-state" data-testid="fleet-loading">Loading fleet…</div>
    <div x-show="error && !view" class="fleet-state fleet-state-error" data-testid="fleet-error">
      <strong>Fleet is unavailable</strong>
      <span x-text="error"></span>
      <button type="button" @click="load()">Try again</button>
    </div>

    <div x-show="view" class="fleet-body">
      <div class="fleet-content-grid">
        <main class="min-w-0">
          <div class="fleet-section-heading">
            <h2>Machines</h2>
          </div>
          <div class="fleet-machine-list" data-testid="fleet-machine-list">
            <template x-for="admission in admissions" :key="admission.sourceApprovalId || admission.standingChangedAt">
              <article class="fleet-machine" data-row-kind="pending_admission" :data-standing="admission.standing" :class="admission.standing === 'admission_failed' ? 'failed' : 'warn'">
                <div class="fleet-machine-toggle" role="button" tabindex="0"
                     @click="reviewApproval(admission)"
                     @keydown.enter="reviewApproval(admission)">
                  <span class="fleet-line1">
                    <span class="fleet-dot" :class="admission.standing === 'admission_failed' ? 'failed' : 'warn'"></span>
                    <strong>New machine</strong>
                    <span class="fleet-face-status" :class="admission.standing === 'admission_failed' ? 'failed' : 'warn'"
                          x-text="admissionWord(admission)"></span>
                  </span>
                  <span class="fleet-line2">
                    <span x-text="admissionLine(admission)"></span>
                  </span>
                </div>
              </article>
            </template>
            <template x-for="machine in orderedMachines()" :key="machine.entryId">
              <article class="fleet-machine" data-row-kind="roster_machine" data-standing="authorized" :class="machineClass(machine)">
                <div class="fleet-machine-toggle" role="button" tabindex="0"
                     @click="expandedId = expandedId===machine.entryId ? null : machine.entryId"
                     @keydown.enter="expandedId = expandedId===machine.entryId ? null : machine.entryId"
                     :aria-expanded="expandedId === machine.entryId">
                  <span class="fleet-line1">
                    <span class="fleet-dot" :class="dotClass(machine)"></span>
                    <template x-if="renamingId === machine.entryId">
                      <input class="fleet-rename-in" x-model="renameDraft" maxlength="80" aria-label="Machine name"
                             x-init="$nextTick(() => { $el.focus(); $el.select(); })"
                             @click.stop @keydown.enter.stop.prevent="commitRename(machine)"
                             @keydown.escape.stop="renamingId = null"
                             @blur="commitRename(machine)">
                    </template>
                    <template x-if="renamingId !== machine.entryId">
                      <strong x-text="machine.displayLabel"></strong>
                    </template>
                    <button x-show="expandedId === machine.entryId && renamingId !== machine.entryId"
                            class="fleet-rename-btn" aria-label="Rename machine" @click.stop="beginRename(machine)">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                    </button>
                    <span class="fleet-face-status" x-show="statusWord(machine)" :class="statusTone(machine)" x-text="statusWord(machine)"></span>
                  </span>
                  <span class="fleet-line2" x-show="subLine(machine) || (!machine.isLocalMachine && machine.lastSuccessfulSyncAt)">
                    <span x-text="subLine(machine)"></span>
                    <span x-show="!machine.isLocalMachine && machine.lastSuccessfulSyncAt"
                          x-text="(machineState(machine).id === 'synced' ? '' : 'Synced ') + timeLabel(machine.lastSuccessfulSyncAt, 'never')"></span>
                  </span>
                </div>
                <div x-show="expandedId === machine.entryId" class="fleet-machine-detail">
                  <p x-show="machineState(machine).note" class="fleet-reason"
                     :class="machineState(machine).tone === 'failed' ? 'err' : ''"
                     x-text="machineState(machine).note"></p>
                  <template x-if="machine.isLocalMachine">
                    <dl>
                      <div><dt>Synced</dt><dd x-text="timeLabel(localLastSync(), 'never')"></dd></div>
                      <div x-show="servingMachineId === machine.entryId && machine.connectorArmed != null"><dt>Connector</dt><dd :class="machine.connectorArmed ? '' : 'error-code'" x-text="machine.connectorArmed ? 'Online' : 'Waiting for unlock'"></dd></div>
                      <div x-show="servingMachineId === machine.entryId && machine.tunnelServing != null"><dt>Tunnel</dt><dd :class="machine.tunnelServing ? '' : 'error-code'" x-text="machine.tunnelServing ? 'Serving' : 'Down'"></dd></div>
                      <div x-show="servingMachineId === machine.entryId && machine.certStatus"><dt>Certificate</dt><dd :class="certExpired(machine) ? 'error-code' : ''"
                           x-text="machine.certValidUntil == null ? 'None' : certExpired(machine) ? 'Expired' : remainingLabel(machine.certValidUntil)"></dd></div>
                      <div x-show="machine.runningStale"><dt>Software</dt><dd class="error-code">Restart needed</dd></div>
                      <div><dt>Changes</dt><dd class="mono" x-text="numberLabel(fleetChanges())"></dd></div>
                      <div><dt>Received</dt><dd class="mono" x-text="bytesLabel(fleetReceived())"></dd></div>
                      <div><dt>Sent</dt><dd class="mono" x-text="bytesLabel(fleetSent())"></dd></div>
                    </dl>
                  </template>
                  <div class="fleet-detail-actions" x-show="machine.isLocalMachine && servingMachineId === machine.entryId && machine.connectorArmed === false">
                    <button type="button" class="fleet-primary-action" style="width:auto;min-height:2.4rem;margin:0;padding:0 .9rem"
                            :disabled="actionBusy" @click="beginUnlock(machine)"
                            x-text="actionBusy === 'unlock' ? 'Unlocking…' : 'Unlock…'"></button>
                  </div>

                  <template x-if="!machine.isLocalMachine">
                    <div>
                      <dl x-show="machineState(machine).id !== 'first'">
                        <div><dt>Synced</dt><dd x-text="timeLabel(machine.lastSuccessfulSyncAt, 'never')"></dd></div>
                        <div><dt>Received</dt><dd class="mono" x-text="bytesLabel(machine.bytesReceived)"></dd></div>
                        <div><dt>Sent</dt><dd class="mono" x-text="bytesLabel(machine.bytesSent)"></dd></div>
                        <div><dt>Changes</dt><dd class="mono" x-text="numberLabel(machine.transactionsApplied)"></dd></div>
                        <div><dt>Failures</dt><dd class="mono" x-text="numberLabel(machine.attemptsFailed)"></dd></div>
                        <div x-show="machine.lastErrorCode"><dt>Error</dt><dd class="error-code mono" x-text="machine.lastErrorCode"></dd></div>
                        <div class="fleet-remove-cell" :class="confirmRemove===machine.entryId ? 'confirming' : ''"
                             x-show="machine.entryId !== servingMachineId">
                          <button x-show="confirmRemove!==machine.entryId" type="button" class="fleet-remove"
                                  @click="confirmRemove=machine.entryId">Remove from fleet…</button>
                          <template x-if="confirmRemove===machine.entryId">
                            <span style="display:flex;gap:.5rem">
                              <button type="button" class="fleet-keep" @click="confirmRemove=null">Keep</button>
                              <button type="button" class="fleet-danger" :disabled="actionBusy"
                                      @click="beginRemove(machine)"
                                      x-text="actionBusy === 'remove' ? 'Removing…' : 'Remove machine'"></button>
                            </span>
                          </template>
                        </div>
                      </dl>
                      <div class="fleet-detail-actions" x-show="machineState(machine).id === 'first' && machine.entryId !== servingMachineId">
                        <button x-show="confirmRemove!==machine.entryId" type="button" class="fleet-remove"
                                @click="confirmRemove=machine.entryId">Remove from fleet…</button>
                        <template x-if="confirmRemove===machine.entryId">
                          <span style="display:flex;gap:.5rem">
                            <button type="button" class="fleet-keep" @click="confirmRemove=null">Keep</button>
                            <button type="button" class="fleet-danger" :disabled="actionBusy"
                                    @click="beginRemove(machine)"
                                    x-text="actionBusy === 'remove' ? 'Removing…' : 'Remove machine'"></button>
                          </span>
                        </template>
                      </div>
                      <p x-show="actionErrors[machine.entryId]" class="fleet-inline-error"
                         x-text="actionErrors[machine.entryId]"></p>
                    </div>
                  </template>
                  <p x-show="machine.isLocalMachine && actionErrors[machine.entryId]" class="fleet-inline-error"
                     x-text="actionErrors[machine.entryId]"></p>
                </div>
              </article>
            </template>
            <div x-show="!machines.length && !admissions.length" class="fleet-empty">No authorized machines or active admission requests.</div>
          </div>
        </main>

        <aside class="fleet-aside">
          <div class="fleet-side-card">
            <div class="fleet-side-title">
              <h2>Invitation</h2>
              <span :class="invitation.status === 'active' ? 'active' : ''"
                    x-text="invitation.status === 'active' ? 'Active' : invitation.status === 'publishing' ? 'Waiting' : invitation.status === 'awaiting_signature' ? 'Finish' : invitation.status === 'inactive' ? 'Off' : 'Inactive'"></span>
            </div>
            <template x-if="invitation.status === 'active'">
              <div>
                <p class="fleet-no-invite" style="margin-top:.5rem">A new machine can use this link to ask to join your fleet.</p>
                <button type="button" class="fleet-invite-code" @click="copyInvitation()"
                        x-text="invitation.url" aria-label="Copy fleet invitation link"></button>
                <div class="fleet-invite-meta">
                  <span x-text="expiryLabel()"></span>
                </div>
                <button type="button" class="fleet-primary-action" @click="copyInvitation()"
                        x-text="copied ? 'Link copied' : 'Copy invitation link'"></button>
                <button type="button" class="fleet-secondary-action" @click="copyBootstrapCode()"
                        x-text="bootstrapCopied ? 'Install code copied' : 'Copy install code'"></button>
                <button type="button" class="fleet-remove" style="width:100%;margin-top:.45rem;min-height:2.4rem"
                        :disabled="inviteBusy" @click="disableInvitation()"
                        x-text="inviteBusy ? 'Disabling…' : 'Disable invitation…'"></button>
              </div>
            </template>
            <template x-if="invitation.status === 'publishing'">
              <p class="fleet-no-invite">Publication is waiting in the approval inbox. No machine can request access yet.</p>
            </template>
            <template x-if="invitation.status === 'awaiting_signature'">
              <div>
                <p class="fleet-no-invite">The route is published. Sign the invitation with your personal root to activate it.</p>
                <button type="button" class="fleet-primary-action"
                        :disabled="inviteBusy" @click="finishInvitation()"
                        x-text="inviteBusy ? 'Signing…' : 'Activate invitation'"></button>
              </div>
            </template>
            <template x-if="invitation.status === 'inactive'">
              <div>
                <p class="fleet-no-invite">This invitation is deactivated. Reactivate it to let a machine that already joined through it finish and start syncing.</p>
                <button type="button" class="fleet-invite-code" @click="copyInvitation()"
                        x-text="invitation.url" aria-label="Copy fleet invitation link"></button>
                <button type="button" class="fleet-primary-action"
                        :disabled="inviteBusy" @click="reactivateInvitation()"
                        x-text="inviteBusy ? 'Reactivating…' : 'Reactivate invitation'"></button>
              </div>
            </template>
            <template x-if="invitation.status === 'none' || invitation.status === 'failed'">
              <div>
                <p class="fleet-no-invite">No invitation is active. New machines can't join.</p>
                <button type="button" class="fleet-primary-action"
                        :disabled="inviteBusy" @click="createInvitation()"
                        x-text="inviteBusy ? 'Requesting…' : 'Create invitation'"></button>
              </div>
            </template>
            <p x-show="invitation.error || invitationError" class="fleet-inline-error"
               x-text="invitationError || invitation.error"></p>
          </div>
        </aside>
      </div>
    </div>
  </div>
</div>
