id: presentations
api_version: 1
org: autonomy

paths:
  - /presentations
  - /present

assets:
  template: page.html
  script: page.js
  style: page.css

nav:
  label: Slides

frontend:
  alpine_root: presentationsPage

# Agent-facing publishing doc. Embedded into every session's workspace
# primer while this plugin is enabled; also served at
# GET /api/plugins/presentations/skill.
skill: SKILL.md

entrypoints:
  api: tools.dashboard.plugins.presentations.entrypoints.api:routes
  schemas:
    - tools.dashboard.plugins.presentations.entrypoints.schemas:PresentationDeckV1
