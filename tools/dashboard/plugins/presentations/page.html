<link rel="stylesheet" href="/static/plugins/presentations/page.css">
<div data-testid="presentations-fragment-root"
     x-data="presentationsPage()"
     class="present-page pb-safe"
     :class="{ 'present-page-deck': mode === 'deck' }">

  <template x-if="mode === 'library'">
    <section class="present-library" data-testid="present-library">
      <template x-if="loading">
        <div class="present-empty" data-testid="present-loading">Loading decks...</div>
      </template>

      <template x-if="!loading && !error && decks.length === 0">
        <div class="present-empty" data-testid="present-empty">No slide decks in this organization yet.</div>
      </template>

      <div class="present-deck-list" x-show="!loading && decks.length > 0" data-testid="present-deck-list">
        <template x-for="deck in decks" :key="deck.design_id || deck.key">
          <a class="present-deck-card" data-testid="present-deck-card" :href="deckHref(deck)">
            <div class="present-deck-thumb">
              <span class="present-deck-blank" aria-hidden="true" x-text="(deck.name || '?').trim().charAt(0).toUpperCase()"></span>
              <img x-show="thumbnailUrl(deck) && !failedThumbnails[deck.latest_revision_id]" :src="thumbnailUrl(deck)" alt="" loading="lazy" decoding="async"
                   @error="failedThumbnails[deck.latest_revision_id] = true">
            </div>
            <div class="present-deck-main">
              <span class="present-deck-name" x-text="deck.name || 'Untitled deck'"></span>
              <span class="present-deck-meta">
                <span x-text="(deck.slide_count || 1) + ((deck.slide_count || 1) === 1 ? ' slide' : ' slides')"></span>
                <span aria-hidden="true">·</span>
                <time :datetime="deck.modified_at || deck.created_at" :title="deck.modified_at || deck.created_at" x-text="formatDate(deck.modified_at || deck.created_at)"></time>
              </span>
            </div>
          </a>
        </template>
      </div>
    </section>
  </template>

  <template x-if="mode === 'deck'">
    <section class="present-deck-view" data-testid="present-deck-view">
      <div class="present-stage" data-testid="present-stage">
        <iframe id="present-iframe"
                title="Presentation deck"
                data-testid="present-iframe"
                class="present-iframe"></iframe>
        <div class="present-progress"
             role="group"
             aria-label="Slide navigation"
             @pointerdown.prevent="startProgressScrub($event)"
             @pointermove.window="moveProgressScrub($event)"
             @pointerup.window="endProgressScrub($event)"
             @pointercancel.window="endProgressScrub($event)">
          <template x-for="idx in slideIndexes" :key="idx">
            <button type="button"
                    :class="{ active: idx === activeSlide }"
                    @click="goToSlide(idx)"
                    :aria-label="'Go to slide ' + (idx + 1)"></button>
          </template>
        </div>
      </div>
    </section>
  </template>

  <template x-if="error">
    <div class="present-error" data-testid="present-error" x-text="error"></div>
  </template>
</div>
