<div x-data="backupPage()"
     data-testid="backup-fragment-root"
     class="bk-page max-w-3xl mx-auto px-3 md:px-6 pb-12">

<style>
  /* Scoped tokens: calm slate surface, verdict colors reserved for
     verdicts only, so a wall of green never hides one red line. */
  .bk-page { color: rgb(226 232 240); }
  .bk-page .bk-card {
    background: rgb(15 23 42 / 0.6);
    border: 1px solid rgb(51 65 85);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .bk-page .bk-ok   { color: rgb(74 222 128); }
  .bk-page .bk-warn { color: rgb(250 204 21); }
  .bk-page .bk-bad  { color: rgb(248 113 113); }
  .bk-page .bk-hero-ok   { border-color: rgb(34 97 61); }
  .bk-page .bk-hero-warn { border-color: rgb(133 106 20); }
  .bk-page .bk-hero-bad  { border-color: rgb(153 47 47); }
  .bk-page .bk-mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .bk-page .bk-muted { color: rgb(148 163 184); }
  .bk-page h2 {
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgb(148 163 184); margin: 22px 0 8px;
  }
  .bk-page table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .bk-page td, .bk-page th {
    padding: 5px 8px; text-align: left;
    border-bottom: 1px solid rgb(30 41 59);
  }
  .bk-page th { color: rgb(148 163 184); font-weight: 500; }
  .bk-page .bk-num { text-align: right; font-variant-numeric: tabular-nums; }
  .bk-page .bk-tier-btn {
    padding: 3px 10px; border-radius: 8px; font-size: 12px;
    border: 1px solid rgb(51 65 85); color: rgb(148 163 184);
  }
  .bk-page .bk-tier-btn.bk-active {
    color: rgb(226 232 240); background: rgb(30 41 59);
  }
</style>

  <template x-if="loading">
    <div class="bk-muted py-8 text-center text-sm">Loading backup state…</div>
  </template>
  <template x-if="error">
    <div class="bk-bad py-4 text-sm" x-text="error"></div>
  </template>

  <template x-if="summary && !loading">
    <div>
      <!-- Am I safe now -->
      <div class="bk-card mt-2"
           data-testid="backup-hero"
           :class="{'bk-hero-ok': summary.overall === 'ok',
                    'bk-hero-warn': summary.overall === 'stale',
                    'bk-hero-bad': summary.overall === 'failing'}">
        <div class="flex items-baseline justify-between gap-3">
          <div class="text-xl font-semibold"
               :class="statusClass(summary.overall === 'ok' ? 'ok' : summary.overall)"
               data-testid="backup-overall"
               x-text="overallLabel()"></div>
          <button class="bk-tier-btn" @click="refreshFromDisk()">refresh</button>
        </div>
        <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
          <template x-for="tier in summary.tiers" :key="tier.tier">
            <div class="flex items-center justify-between gap-2 text-sm"
                 :data-testid="'backup-tier-' + tier.tier">
              <span>
                <span :class="statusClass(tier.status)"
                      x-text="{ok:'✓', stale:'⚠', failing:'✗'}[tier.status] || '?'"></span>
                <span class="ml-1" x-text="tier.tier"></span>
              </span>
              <span class="bk-muted">
                <span x-text="age(tier.age_seconds)"></span>
                <span class="ml-2" x-text="fmtBytes(tier.total_bytes)"></span>
                <span class="ml-2 bk-mono" x-text="'offsite:' + (tier.offsite || '?')"></span>
              </span>
            </div>
          </template>
        </div>
      </div>

      <!-- Does restore actually work -->
      <h2>Restore drill</h2>
      <div class="bk-card" data-testid="backup-drill-panel">
        <template x-if="summary.running_drill">
          <div class="text-sm bk-warn">
            Drill running since
            <span x-text="summary.running_drill.started_at"></span>
          </div>
        </template>
        <template x-if="!summary.running_drill && summary.last_drill">
          <div class="text-sm">
            <span :class="statusClass(summary.last_drill.verdict)"
                  x-text="summary.last_drill.verdict.toUpperCase()"></span>
            <span class="bk-muted ml-2"
                  x-text="summary.last_drill.finished_at || summary.last_drill.started_at"></span>
            <span class="bk-muted ml-2"
                  x-text="(summary.last_drill.checks || []).length + ' checks'"></span>
            <div class="mt-1 space-y-0.5">
              <template x-for="check in summary.last_drill.checks || []" :key="check.name">
                <div class="bk-mono">
                  <span :class="statusClass(check.status)" x-text="check.status"></span>
                  <span class="ml-1" x-text="check.name"></span>
                  <span class="bk-muted ml-1" x-text="check.detail"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
        <template x-if="!summary.running_drill && !summary.last_drill">
          <div class="text-sm bk-warn">Never drilled — an untested backup
            is a hope, not a backup.</div>
        </template>
      </div>

      <!-- When was the last good copy -->
      <h2>Capture runs</h2>
      <div class="bk-card" data-testid="backup-run-stream">
        <template x-if="!runStream.length">
          <div class="text-sm bk-muted">No capture runs recorded yet.</div>
        </template>
        <div class="space-y-1">
          <template x-for="run in runStream" :key="run.key">
            <div class="text-sm" :data-testid="'backup-run-' + run.key">
              <span :class="statusClass(run.verdict)"
                    x-text="run.verdict === 'complete' ? '✓' : '✗'"></span>
              <span class="bk-mono ml-1" x-text="run.key"></span>
              <span class="bk-muted ml-2"
                    x-text="run.store_count + ' stores · '
                            + run.beads_databases + ' beads dbs · '
                            + fmtBytes(run.total_bytes)
                            + ' · offsite:' + run.offsite
                            + ' · ' + run.origin"></span>
              <template x-for="reason in run.failures || []" :key="reason">
                <div class="bk-bad bk-mono ml-5" x-text="'! ' + reason"></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- What exactly was captured -->
      <h2>
        Stores
        <span class="ml-2">
          <button class="bk-tier-btn" :class="{'bk-active': storeTier === 'hourly'}"
                  @click="storeTier = 'hourly'">hourly</button>
          <button class="bk-tier-btn ml-1" :class="{'bk-active': storeTier === 'daily'}"
                  @click="storeTier = 'daily'">daily</button>
        </span>
      </h2>
      <div class="bk-card" data-testid="backup-store-table">
        <template x-if="!storeRows.length">
          <div class="text-sm bk-muted">No per-store detail for this tier yet
            (run reports land with bead auto-yj2wa).</div>
        </template>
        <table x-show="storeRows.length">
          <thead><tr><th>store</th><th>action</th><th>status</th>
            <th class="bk-num">bytes</th></tr></thead>
          <tbody>
            <template x-for="row in storeRows" :key="row.name">
              <tr>
                <td class="bk-mono" x-text="row.name"></td>
                <td class="bk-muted" x-text="row.action"></td>
                <td><span :class="statusClass(row.status)" x-text="row.status"></span>
                  <span class="bk-muted bk-mono ml-1" x-text="row.reason"></span></td>
                <td class="bk-num bk-mono" x-text="fmtBytes(row.bytes)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Policy in force -->
      <h2>Configuration</h2>
      <div class="bk-card bk-mono text-xs" data-testid="backup-config">
        <template x-for="key in Object.keys(summary.config || {}).sort()" :key="key">
          <div>
            <span class="bk-muted" x-text="key + ' = '"></span>
            <span x-text="summary.config[key]"></span>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
