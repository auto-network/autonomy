<link rel="stylesheet" href="/static/plugins/design_studio/page.css">
<div data-testid="design-studio-fragment-root" x-data="designStudioPage()" x-init="init()" class="design-studio-page">
  <template x-if="mode === 'library'">
    <div class="design-studio-library" data-testid="design-library">
      <section class="design-studio-strip" data-testid="design-strip" aria-label="Filter designs">
        <input
          class="design-studio-search"
          type="search"
          placeholder="Search designs"
          x-model="query"
          @input="scheduleLoad()"
          data-testid="design-search">
        <div class="design-studio-seg" role="group" aria-label="Form factor" data-testid="design-form-factor">
          <template x-for="opt in formFactorOptions" :key="opt.value">
            <button type="button"
                    class="design-studio-seg-btn"
                    :class="formFactor === opt.value ? 'is-on' : ''"
                    :aria-pressed="formFactor === opt.value ? 'true' : 'false'"
                    :title="opt.title"
                    @click="setFormFactor(opt.value)">
              <span x-html="opt.icon"></span><span class="design-studio-seg-label" x-text="opt.label"></span>
            </button>
          </template>
        </div>
        <button type="button" class="design-studio-toggle" :class="liveOnly ? 'is-on' : ''"
                :aria-pressed="liveOnly ? 'true' : 'false'" @click="liveOnly = !liveOnly" data-testid="design-live-toggle">
          <span class="design-studio-toggle-dot"></span>Live
        </button>
        <button type="button" class="design-studio-toggle" :class="dynamicOnly ? 'is-on' : ''"
                :aria-pressed="dynamicOnly ? 'true' : 'false'" @click="dynamicOnly = !dynamicOnly" data-testid="design-dynamic-toggle">Dynamic</button>
        <button type="button" class="design-studio-toggle" :class="sharedOnly ? 'is-on' : ''"
                :aria-pressed="sharedOnly ? 'true' : 'false'" @click="sharedOnly = !sharedOnly" data-testid="design-shared-toggle">Shared</button>
        <button type="button" class="design-studio-toggle" :class="status !== 'pending' ? 'is-on' : ''"
                :aria-pressed="status !== 'pending' ? 'true' : 'false'" @click="toggleArchived()" data-testid="design-archived-toggle">Archived</button>
        <select class="design-studio-select" x-model="sort" @change="loadDesigns()" data-testid="design-sort" aria-label="Sort">
          <option value="updated">Latest update</option>
          <option value="created">First created</option>
          <option value="revisions">Revision count</option>
          <option value="title">Title</option>
        </select>
        <div class="design-studio-strip-end">
          <span class="design-studio-render-chip"
                x-show="renderChip"
                :class="renderChipWarns ? 'is-off' : (renderStatus.available === false ? 'is-quiet' : '')"
                :title="renderChipTitle"
                x-text="renderChip"
                data-testid="design-render-chip"></span>
          <span class="design-studio-result-count" data-testid="design-result-count">
            <span x-text="visibleDesigns.length.toLocaleString()"></span>
            <span x-text="status === 'pending' ? 'active' : 'archived'"></span>
          </span>
        </div>
      </section>

      <template x-if="loading">
        <div class="design-studio-empty" data-testid="design-loading">Loading designs...</div>
      </template>

      <template x-if="!loading && error">
        <div class="design-studio-error" data-testid="design-error" x-text="error"></div>
      </template>

      <template x-if="!loading && !error && actionError">
        <div class="design-studio-action-error" data-testid="design-action-error" x-text="actionError"></div>
      </template>

      <template x-if="!loading && !error && visibleDesigns.length === 0 && !(sharedOnly && visibleRemoteShares.length)">
        <div class="design-studio-empty" data-testid="design-empty">
          <span x-show="hasFilters">No designs match those filters.</span>
          <span x-show="!hasFilters">No designs found.</span>
        </div>
      </template>

      <section class="design-studio-gallery" data-testid="design-list" x-show="!loading && !error && (visibleDesigns.length || (sharedOnly && visibleRemoteShares.length))">
        <template x-for="share in (sharedOnly ? visibleRemoteShares : [])" :key="'remote:' + share.token">
          <figure class="design-tile is-remote"
                  role="link"
                  tabindex="0"
                  :title="'Shared with ' + (share.org || 'the org') + ' from another machine — opens the auto.network link'"
                  @click="openRemoteShare(share)"
                  @keydown.enter.prevent="openRemoteShare(share)"
                  data-testid="design-remote-share">
            <div class="design-tile-frame">
              <div class="design-tile-blank">
                <span class="design-tile-blank-initial">↗</span>
                <span class="design-tile-blank-note">Shared with org</span>
              </div>
            </div>
            <figcaption class="design-tile-caption">
              <span class="design-tile-title" x-text="share.label || ('Shared ' + share.target_type)"></span>
              <span class="design-tile-meta">
                <span x-text="share.org || ''"></span>
                <span aria-hidden="true">·</span>
                <span x-text="share.expires_at ? 'expires ' + formatDateTime(new Date(share.expires_at * 1000).toISOString()) : 'no expiry'"></span>
              </span>
            </figcaption>
          </figure>
        </template>
        <template x-for="design in visibleDesigns" :key="design.design_id">
          <figure class="design-tile"
                  :class="[design.thumbnail_url ? 'has-thumbnail' : 'no-thumbnail', design.status !== 'pending' ? 'is-archived' : '']"
                  role="button"
                  tabindex="0"
                  :title="design.description || design.title"
                  @click="openDesign(design)"
                  @keydown.enter.prevent="openDesign(design)"
                  @keydown.space.prevent="openDesign(design)"
                  data-testid="design-card">
            <div class="design-tile-frame">
              <template x-if="design.thumbnail_url">
                <img class="design-tile-img" :src="design.thumbnail_url" alt="" loading="lazy" decoding="async">
              </template>
              <template x-if="!design.thumbnail_url">
                <div class="design-tile-blank" data-testid="design-tile-blank">
                  <span class="design-tile-blank-initial" x-text="(design.title || '?').trim().charAt(0).toUpperCase()"></span>
                  <span class="design-tile-blank-note" x-text="blankNote(design)"></span>
                </div>
              </template>
              <button class="design-tile-presence"
                      type="button"
                      x-show="design.creator_session_id"
                      :class="isLiveDesign(design) ? 'is-live' : ''"
                      :title="'Open session: ' + sessionLabel(design)"
                      :aria-label="'Open session: ' + sessionLabel(design)"
                      @click.stop="openSession(design)">
                <span class="design-card-presence-dot"></span>
              </button>
              <span class="design-tile-form" x-show="design.form_factor" :title="formFactorTitle(design.form_factor)" x-html="formFactorIcon(design.form_factor)"></span>
              <span class="design-tile-shared" x-show="design.shared" title="Shared by link">↗</span>
              <div class="design-tile-actions" aria-label="Design actions" @click.stop>
                <button class="design-card-action" type="button"
                        :class="designActionState(design, 'render')"
                        :title="renderActionTitle(design)" :aria-label="renderActionTitle(design)"
                        :disabled="isDesignActionBusy(design, 'render')"
                        @click.stop="renderDesignThumbnail(design)" data-testid="design-render-action">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="1.5"/><circle cx="8" cy="8" r="2.5"/></svg>
                </button>
                <button class="design-card-action" type="button"
                        :class="designActionState(design, 'librarian')"
                        :title="designActionTitle(design)" :aria-label="designActionTitle(design)"
                        :disabled="isDesignActionBusy(design, 'librarian')"
                        @click.stop="dispatchDesignLibrarian(design)">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 1.8l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7.7-1.7zM4.8 4.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5.5-1.2zM10.8 8.2l3 3-2.6 2.6-3-3 2.6-2.6zM9.8 7.2l-6.6 6.6-1-1 6.6-6.6 1 1z"/></svg>
                </button>
                <button class="design-card-action" type="button"
                        x-show="design.status === 'pending'"
                        title="Archive design" aria-label="Archive design"
                        :disabled="isDesignActionBusy(design, 'status')"
                        @click.stop="setDesignStatus(design, 'dismissed')">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4h12v2H2zM3 6v7h10V6M6.5 9h3"/></svg>
                </button>
                <button class="design-card-action" type="button"
                        x-show="design.status !== 'pending'"
                        title="Restore design" aria-label="Restore design"
                        :disabled="isDesignActionBusy(design, 'status')"
                        @click.stop="setDesignStatus(design, 'pending')">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-4.8 8.2l1.3-.8A4 4 0 1 0 4.7 6H7v1.5H2V2.5h1.5v2A5.5 5.5 0 0 1 8 2.5z"/></svg>
                </button>
              </div>
            </div>
            <figcaption class="design-tile-caption">
              <span class="design-tile-title" x-text="design.title"></span>
              <span class="design-tile-meta">
                <span x-text="design.revision_count + (design.revision_count === 1 ? ' rev' : ' revs')"></span>
                <span aria-hidden="true">·</span>
                <span x-text="formatDateTime(design.latest_created_at)"></span>
                <span class="design-tile-meta-flag" x-show="design.has_fixture">dynamic</span>
              </span>
            </figcaption>
          </figure>
        </template>
      </section>
    </div>
  </template>

  <template x-if="mode === 'viewer'">
    <div class="design-studio-viewer-shell">
<div data-testid="design-fragment-root">
<style>
/* ── Toolbar state classes (from Design Studio experiment a8ee8212) ── */

/* Chat toggle states (Alpine :class bindings) */
.chat-disconnected { color: #64748b; }
.chat-connected-hidden { color: #22c55e; }
.chat-connected-hidden:hover { background: rgba(34,197,94,0.1); }
.chat-open { background: #312e81; color: #a5b4fc; }
.chat-connected-shown { background: #14532d; color: #22c55e; }

/* Capture states (Alpine :class bindings) */
.capture-idle { color: #64748b; }
.capture-working { color: #a5b4fc; }
.capture-working svg { animation: toolbar-spin 1s linear infinite; }
.capture-success { color: #22c55e; }
.capture-error { color: #ef4444; }

/* Prime states (Alpine :class bindings) */
.prime-idle { color: #818cf8; }
.prime-idle:hover { background: #1e293b; color: #a5b4fc; }
.prime-working { color: #a5b4fc; }
.prime-working svg { animation: toolbar-spin 1s linear infinite; }
.prime-done { color: #22c55e; }

/* Disconnect hover */
.disconnect:hover { color: #f87171; background: rgba(239,68,68,0.08); }

@keyframes toolbar-spin { to { transform: rotate(360deg); } }

/* Session picker — from Design Studio experiment 3b9d8d82 */
.picker-list {
  flex: 1; overflow-y: auto;
  padding: 6px;
  display: flex; flex-direction: column; gap: 4px;
}
.picker-card-wrap { border-radius: 8px; overflow: clip; }
.picker-card {
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 10px;
  background: #0f1623;
  border: none;
  border-left: 4px solid #475569;
  cursor: pointer;
  transition: background 0.1s;
  width: 100%; text-align: left;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.picker-card:hover { background: #162032; }
.picker-card:active { background: #1e2d3d; }
.picker-card-host { border-left-color: #3b82f6; }
.picker-stats {
  display: flex; align-items: center; gap: 3px;
  line-height: 1;
}
.picker-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; vertical-align: 1px; margin-right: 1px;
}
.picker-dot-live { background: #22c55e; box-shadow: 0 0 4px rgba(34,197,94,0.4); }
.picker-dot-dead { background: #374151; }
.picker-role {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 4px;
  font-size: 11px; font-weight: 600;
  color: #cbd5e1; background: #2a3444;
  white-space: nowrap; flex-shrink: 0;
}
.picker-role-host { background: #1e3a5f; color: #93c5fd; }
.picker-tmux {
  font-size: 10px; color: #3d4f63;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  margin-left: auto; white-space: nowrap;
}
.picker-label {
  font-size: 14px; font-weight: 600; color: #f1f5f9;
  line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-preview {
  font-size: 11px; color: #56657a; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-count {
  font-size: 11px; color: #475569;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
</style>
<div x-data="designPage()" class="design-viewer-root" style="display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden">

  <!-- Loading state -->
  <template x-if="state === 'loading'">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#9ca3af">Loading design...</div>
  </template>

  <!-- Error state -->
  <template x-if="state === 'error'">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#f87171">Design not found</div>
  </template>

  <!-- Main content — control strip + surface/chat + input bar -->
  <template x-if="state === 'ready'">
    <div style="display:flex;flex-direction:column;flex:1;min-height:0">

      <!-- ═══ ONE TOOLBAR for both entry paths ═══
           Linked entry (from the session viewer) swaps the hamburger for a
           back-to-session control; everything else — title, revision
           navigation, capture, presence + sharing — is the same. -->
      <div data-testid="design-toolbar"
           class="design-toolbar flex flex-wrap items-center px-2 md:px-3 select-none"
           :class="linkedSessionMode ? 'is-linked' : ''"
           style="flex-shrink:0;z-index:10">

        <!-- Row 1 -->
        <div class="flex items-center gap-2 w-full h-12">

          <template x-if="linkedSessionMode">
            <a class="design-linked-return"
               data-testid="design-linked-return"
               :href="linkedSessionHref"
               :title="'Back to ' + linkedSessionLabel"
               :aria-label="'Back to session ' + linkedSessionLabel"
               @click.prevent="returnToSession()">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.5 3.25 5.75 8l4.75 4.75"></path>
              </svg>
              <span>Session</span>
            </a>
          </template>
          <template x-if="!linkedSessionMode">
            <button data-testid="toolbar-hamburger"
                    @click="window.toggleSidebar()"
                    class="md:hidden w-9 h-11 flex items-center justify-center bg-transparent border-none text-gray-500 cursor-pointer rounded-lg flex-shrink-0"
                    title="Toggle sidebar">
              <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
            </button>
          </template>
          <template x-if="!linkedSessionMode">
            <a class="design-linked-return is-icon"
               data-testid="design-gallery-return"
               href="/design"
               title="Back to Design Studio"
               aria-label="Back to Design Studio"
               @click.prevent="returnToGallery()">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.5 3.25 5.75 8l4.75 4.75"></path>
              </svg>
            </a>
          </template>

          <!-- Design title, with the shown revision and its push time beneath -->
          <span class="design-toolbar-heading flex-1 min-w-0">
            <span data-testid="toolbar-title"
                  class="design-toolbar-title"
                  :style="toolbarState === 'PICKER' ? 'color:#a5b4fc;font-weight:600' : ''"
                  x-text="toolbarState === 'PICKER' ? 'Select Session' : (design?.title || 'Design')"></span>
            <span class="design-toolbar-subtitle" data-testid="toolbar-subtitle" x-show="toolbarState !== 'PICKER'">
              <span x-text="'v' + (iterIndex + 1) + (iterCount > 1 ? ' of ' + iterCount : '')"></span>
              <span aria-hidden="true" x-show="design?.created_at">·</span>
              <span x-show="design?.created_at" x-text="'pushed ' + formatPushedAt(design?.created_at)"></span>
            </span>
          </span>

          <!-- Revision nav — desktop position -->
          <template x-if="toolbar.showIterNav">
            <div data-testid="toolbar-iter-desktop"
                 class="design-toolbar-nav hidden md:flex items-center gap-0.5">
              <button @click="prevIteration()"
                      class="w-7 h-7 flex items-center justify-center bg-transparent border-none cursor-pointer rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-400 disabled:text-gray-700 disabled:cursor-default transition-all"
                      :disabled="!canGoBack" title="Previous">
                <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
              </button>
              <span class="text-xs font-mono text-gray-400 w-[5.5rem] text-center" x-text="(iterIndex + 1) === iterCount ? 'v' + iterCount : (iterIndex + 1) + ' of ' + iterCount"></span>
              <button @click="nextIteration()"
                      class="w-7 h-7 flex items-center justify-center bg-transparent border-none cursor-pointer rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-400 disabled:text-gray-700 disabled:cursor-default transition-all"
                      :disabled="!canGoForward" title="Next">
                <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 2l5 5-5 5"/></svg>
              </button>
              <button x-show="iterIndex < iterCount - 2" @click="jumpToLatest()"
                      class="w-7 h-7 ml-2 flex items-center justify-center bg-transparent border-none cursor-pointer rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-400 transition-all"
                      title="Jump to latest">
                <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 2l5 5-5 5"/><path d="M8 2l5 5-5 5"/></svg>
              </button>
            </div>
          </template>

          <!-- Right actions: close chat (when open), capture, then presence + sharing -->
          <div class="design-toolbar-actions flex items-center gap-1 flex-shrink-0">
            <button type="button"
                    data-testid="design-chat-close"
                    class="design-linked-capture"
                    x-show="!linkedSessionMode && chatOpen"
                    title="Close chat" aria-label="Close chat"
                    @click="chatOpen = false">
              <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l8 8M13 5l-8 8"/></svg>
            </button>
            <button data-testid="design-linked-capture"
                    type="button"
                    @click="captureScreenshot()" :disabled="captureState === 'working'"
                    class="design-linked-capture"
                    :class="'capture-' + captureState"
                    :title="captureState === 'working' ? 'Capturing screenshot' : 'Capture screenshot'"
                    aria-label="Capture screenshot">
              <template x-if="captureState === 'idle'"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3.5" width="14" height="11" rx="1.5"></rect><circle cx="9" cy="9" r="3"></circle></svg></template>
              <template x-if="captureState === 'working'"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7" stroke-dasharray="34 12"></circle></svg></template>
              <template x-if="captureState === 'success'"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9l4 4 6-7"></path></svg></template>
              <template x-if="captureState === 'error'"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l8 8M13 5l-8 8"></path></svg></template>
            </button>

            <div data-testid="design-presence" x-ref="presenceHost" class="design-presence-host"></div>
          </div>
        </div>

        <!-- Row 2a: revision nav — mobile position -->
        <template x-if="toolbar.showIterNav">
          <div data-testid="toolbar-iter-mobile"
               class="flex md:hidden items-center w-full h-10 pb-0.5 justify-center relative">
            <div class="flex items-center gap-0.5">
              <button @click="prevIteration()"
                      class="w-7 h-7 flex items-center justify-center bg-transparent border-none cursor-pointer rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-400 disabled:text-gray-700 disabled:cursor-default transition-all"
                      :disabled="!canGoBack">
                <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
              </button>
              <span class="text-xs font-mono text-gray-400 w-[5.5rem] text-center" x-text="(iterIndex + 1) === iterCount ? 'v' + iterCount : (iterIndex + 1) + ' of ' + iterCount"></span>
              <button @click="nextIteration()"
                      class="w-7 h-7 flex items-center justify-center bg-transparent border-none cursor-pointer rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-400 disabled:text-gray-700 disabled:cursor-default transition-all"
                      :disabled="!canGoForward">
                <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 2l5 5-5 5"/></svg>
              </button>
              <button x-show="iterIndex < iterCount - 2" @click="jumpToLatest()"
                      class="w-7 h-7 ml-2 flex items-center justify-center bg-transparent border-none cursor-pointer rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-400 transition-all"
                      title="Jump to latest">
                <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 2l5 5-5 5"/><path d="M8 2l5 5-5 5"/></svg>
              </button>
            </div>
          </div>
        </template>

        <!-- Row 2b: session row (LIVE_CHAT) -->
        <template x-if="toolbar.row2Session">
          <div data-testid="toolbar-session-row"
               class="flex items-center gap-1.5 w-full h-12 md:h-9 pb-0.5 md:pb-1">
            <span data-testid="toolbar-session-title"
                  class="flex-1 min-w-0 text-xs font-semibold text-green-500 truncate pl-0.5"
                  x-text="chatSessionLabel"></span>
            <div class="flex items-center gap-1 flex-shrink-0">
              <!-- Prime: icon-only mobile, text+icon desktop -->
              <button data-testid="toolbar-prime"
                      @click="injectPrimer()"
                      :disabled="primerState === 'working'"
                      class="w-11 h-11 md:w-auto md:h-8 md:px-2.5 flex items-center justify-center gap-1.5 bg-transparent border-none cursor-pointer rounded-lg text-xs font-semibold transition-all"
                      :class="primerState === 'working' ? 'prime-working' : primerState === 'done' ? 'prime-done' : 'prime-idle'"
                      :title="primerState === 'working' ? 'Injecting primer…' : primerState === 'done' ? 'Primer sent!' : 'Inject design context into session'">
                <template x-if="primerState === 'idle'"><svg class="w-[18px] h-[18px] md:w-3.5 md:h-3.5" viewBox="0 0 16 16" fill="currentColor"><path d="M8.5 1.5L3 9h4.5v5.5L13 7H8.5V1.5z"/></svg></template>
                <template x-if="primerState === 'working'"><svg class="w-[18px] h-[18px] md:w-3.5 md:h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1a7 7 0 017 7" stroke-linecap="round"/></svg></template>
                <template x-if="primerState === 'done'"><svg class="w-[18px] h-[18px] md:w-3.5 md:h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l4 4 6-7"/></svg></template>
                <span class="hidden md:inline" x-text="primerState === 'working' ? 'Priming…' : primerState === 'done' ? 'Primed' : 'Prime'"></span>
              </button>
              <!-- Disconnect: icon-only mobile, text+icon desktop -->
              <button data-testid="toolbar-disconnect"
                      @click="disconnectSession()"
                      class="w-11 h-11 md:w-auto md:h-8 md:px-2.5 flex items-center justify-center gap-1.5 bg-transparent border-none cursor-pointer rounded-lg text-xs font-semibold text-gray-500 transition-all disconnect"
                      title="Disconnect session">
                <svg class="w-[18px] h-[18px] md:w-3.5 md:h-3.5" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="7"/><path d="M6.5 6.5l5 5M11.5 6.5l-5 5"/></svg>
                <span class="hidden md:inline">Disconnect</span>
              </button>
            </div>
          </div>
        </template>

      </div>

      <!-- Design surface (State 1: visible when chat closed) -->
      <div class="design-surface"
           :class="linkedSessionMode || !chatOpen ? 'flex-1 relative overflow-hidden min-h-0' : 'absolute invisible h-0 overflow-hidden'">
        <iframe id="design-iframe" style="width:100%;height:100%;border:none;background:#0f1623"></iframe>
      </div>

      <!-- Chat overlay (State 2: visible when chat open) -->
      <template x-if="!linkedSessionMode">
        <div :class="chatOpen ? 'flex flex-1 flex-col bg-[#1a2332] overflow-hidden min-h-0' : 'absolute invisible h-0 overflow-hidden'">

        <!-- Picker (when not connected) — from Design Studio experiment 3b9d8d82 -->
        <template x-if="!chatConnected">
          <div style="flex:1;display:flex;flex-direction:column;min-height:0">
            <!-- Count + refresh -->
            <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0">
              <span class="picker-count" x-text="chatSessions.length + ' available'"></span>
              <button @click="_loadChatSessions()" style="font-size:11px;color:#818cf8;background:transparent;border:none;cursor:pointer">Refresh</button>
            </div>
            <!-- Session list -->
            <div class="picker-list">
              <template x-if="chatSessions.length === 0">
                <div style="text-align:center;padding:24px;color:#475569;font-size:13px">No live sessions found</div>
              </template>
              <template x-for="s in chatSessions" :key="s.id">
                <div @click="_connectSession(s.id)" style="cursor:pointer">
                  {% include 'partials/session-card.html' %}
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Chat panel (when connected) — powered by unified session viewer -->
        <template x-if="chatConnected">
          <div id="design-chat-panel" x-data="sessionViewerPage({mode:'panel'})" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden">
            <!-- Scrollable entries container -->
            <div x-ref="entriesContainer" @scroll="onScroll()"
                 style="flex:1; overflow-y:auto; min-height:0; padding:8px;">
              {% include "partials/session-entries.html" %}
            </div>
            {# Pending / dictation tiles — same surface as the page-mode viewer.
               Shows the live dictation / pending-send tile while chat is open. #}
            {% include "partials/session-pending-tiles.html" %}
            <!-- Screenshot injected indicator -->
            <div x-show="screenshotInjected" x-transition
                 class="px-2 py-1 bg-green-900/50 text-green-400 text-xs text-center flex-shrink-0">
              Screenshot injected into agent context
            </div>
            <!-- Input bar (shown when session is live and connected) -->
            <template x-if="isLive && _tmuxSession">
              <div class="flex flex-col px-2 bg-gray-800 border-t border-gray-700 flex-shrink-0"
                   style="padding-top:6px; padding-bottom:6px;"
                   x-show="showInlineComposer && !window.Autonomy.voice.shell.hideInlineComposer()"
                   @dragenter.prevent="$el.classList.add('drop-highlight')"
                   @dragover.prevent="$el.classList.add('drop-highlight')"
                   @dragleave.prevent="$el.classList.remove('drop-highlight')"
                   @drop.prevent="$el.classList.remove('drop-highlight'); addFiles($event.dataTransfer.files)">
                <!-- Attachment preview strip -->
                <div x-show="attachments.length > 0" class="flex" style="gap:6px; padding:2px 2px 4px; overflow:visible;">
                  <template x-for="att in attachments" :key="att.id">
                    <div class="thumb-wrap">
                      <template x-if="att.isImage && att.dataUrl">
                        <img :src="att.dataUrl">
                      </template>
                      <template x-if="!att.isImage || !att.dataUrl">
                        <div class="thumb-file">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                          </svg>
                          <span x-text="att.name"></span>
                        </div>
                      </template>
                      <button class="thumb-x" @click="removeAttachment(att.id)">&times;</button>
                    </div>
                  </template>
                </div>
                <div class="sv-input-row">
                  <input type="file" x-ref="fileInput" accept="image/*,*/*" multiple style="display:none"
                         @change="addFiles($event.target.files); $event.target.value=''">
                  <button class="sv-attach" @click="$refs.fileInput.click()" :disabled="uploading" title="Attach file">
                    <template x-if="!uploading">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    </template>
                    <template x-if="uploading">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="animate-spin"><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
                    </template>
                  </button>
                  <div class="sv-input-bubble">
                    <div class="sv-editable"
                         x-ref="messageInput"
                         contenteditable="true"
                         data-placeholder="Message..."
                         role="textbox"
                         aria-multiline="true"
                         oninput="Alpine.$data(this.closest('[x-data]')).onInput(this)"
                         onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();Alpine.$data(this.closest('[x-data]')).sendMessage()}"
                         onpaste="var e=event; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text/plain'));"></div>
                    <button class="sv-send"
                            ontouchend="event.preventDefault(); Alpine.$data(this.closest('[x-data]')).sendMessage()"
                            @click="sendMessage()"
                            onmousedown="event.preventDefault()"
                            :disabled="!canSendComposer || sending">
                      <template x-if="!sending">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94l18.04-8.5a.75.75 0 000-1.38l-18.04-8.5z"/></svg>
                      </template>
                      <template x-if="sending">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="animate-spin"><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
                      </template>
                    </button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

        </div>
      </template>


    </div>
  </template>


</div>
</div>
    </div>
  </template>
</div>
