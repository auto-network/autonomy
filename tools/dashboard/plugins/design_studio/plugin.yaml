id: design_studio
api_version: 1
org: autonomy

paths:
  - /design

assets:
  template: page.html
  script: page.js
  style: page.css

nav:
  label: Design

settings:
  - set_id: dashboard.agent-actions
    schema_revision: 2
    key: design.refresh-preview
    state: canonical
    payload_file: agent_actions/refresh_preview.json
    uninstall: deprecate_if_unchanged

frontend:
  alpine_root: designStudioPage

entrypoints:
  api: tools.dashboard.plugins.design_studio.entrypoints.api:routes
  badge_counter: tools.dashboard.plugins.design_studio.entrypoints.api:badge_counter
