id: example
api_version: 1
org: autonomy

paths:
  - /example

assets:
  template: page.html
  script: page.js

nav:
  label: Example

frontend:
  alpine_root: examplePage

# Backend entrypoints are optional. When present, keep routes under
# /api/plugins/<id>/ and enforce their authentication policy in the handler.
entrypoints:
  api: tools.dashboard.plugins._example.entrypoints.api:routes
  schemas:
    - tools.dashboard.plugins._example.entrypoints.schemas:ExamplePluginRecordV1
