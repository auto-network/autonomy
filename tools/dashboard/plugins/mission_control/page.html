<div x-data="missionControlPage()"
     @picker-change="onPickerChange($event)"
     data-testid="mission-control-root"
     class="mission-control-page bg-gray-900 text-gray-200 antialiased min-h-screen">

  <!-- The app shell's own topbar already names this page "Mission Control"
       -- a second, page-level H1 plus its padding was pure wasted space.
       This bar carries the two things the home page actually needs above
       the fold: status filters and the presence-style picker. -->
  <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-2.5 border-b border-gray-800">
    <div class="flex items-center gap-1.5 overflow-x-auto" data-testid="mc-status-filters">
      {# Standard org filter (same contract as Sessions): dropdown-toggle
         chrome from the shared stylesheet, /api/orgs identities, persisted
         selection. Hidden while every mission shares one org. #}
      <div class="sort-wrap" x-show="missionOrgCount > 1 || selectedOrg" data-testid="mc-org-filter">
        <button type="button" class="sort-toggle"
                @click="orgFilterOpen = !orgFilterOpen"
                data-testid="mc-org-filter-toggle">
          <span class="sc-org" style="width:14px;height:14px"
                :class="orgFilterPicked && orgFilterPicked.favicon ? 'sc-org-favicon' : ''"
                :style="orgFilterPicked && !orgFilterPicked.favicon ? `background:${orgFilterPicked.color}` : (orgFilterPicked ? '' : 'background:#2a3441')">
            <template x-if="orgFilterPicked && orgFilterPicked.favicon">
              <img class="sc-org-img" :src="orgFilterPicked.favicon" :alt="orgFilterPicked.name">
            </template>
            <template x-if="!(orgFilterPicked && orgFilterPicked.favicon)">
              <span class="sc-org-initial" style="font-size:9px;line-height:14px" x-text="orgFilterPicked ? orgFilterPicked.initial : '∞'"></span>
            </template>
          </span>
          <span class="sort-toggle-value" x-text="orgFilterPicked ? orgFilterPicked.name : 'All Orgs'"></span>
          <span class="sort-toggle-icon">▾</span>
        </button>
        <div class="sort-menu" x-show="orgFilterOpen" x-cloak
             @click.away="orgFilterOpen = false" data-testid="mc-org-filter-menu">
          <div class="sort-option" :class="!selectedOrg ? 'selected' : ''"
               @click="pickOrgFilter('')" data-testid="mc-org-filter-option-all">
            <span class="flex items-center gap-2">
              <span class="sc-org" style="width:14px;height:14px;background:#2a3441">
                <span class="sc-org-initial" style="font-size:9px;line-height:14px">∞</span>
              </span>
              <span>All Orgs</span>
            </span>
            <span class="sort-option-check">✓</span>
          </div>
          <template x-for="o in orgFilterList" :key="o.slug">
            <div class="sort-option" :class="selectedOrg === o.slug ? 'selected' : ''"
                 @click="pickOrgFilter(o.slug)"
                 :data-testid="'mc-org-filter-option-' + o.slug">
              <span class="flex items-center gap-2">
                <span class="sc-org" style="width:14px;height:14px"
                      :class="o.favicon ? 'sc-org-favicon' : ''"
                      :style="o.favicon ? '' : `background:${o.color}`">
                  <template x-if="o.favicon">
                    <img class="sc-org-img" :src="o.favicon" :alt="o.name">
                  </template>
                  <template x-if="!o.favicon">
                    <span class="sc-org-initial" style="font-size:9px;line-height:14px" x-text="o.initial"></span>
                  </template>
                </span>
                <span x-text="o.name"></span>
              </span>
              <span class="sort-option-check">✓</span>
            </div>
          </template>
        </div>
      </div>
      <template x-for="f in statusFilters" :key="f.value">
        <button @click="statusFilter = f.value"
                class="px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors"
                :class="statusFilter === f.value ? 'bg-indigo-700 text-white' : 'bg-gray-800/60 text-gray-400 hover:text-gray-200'"
                :data-testid="'mc-filter-' + f.value">
          <span x-text="f.label"></span>
          <span class="opacity-70" x-text="'(' + f.count + ')'"></span>
        </button>
      </template>
    </div>

    <!-- Common control, knows nothing about missions:
         tools/dashboard/static/js/style-picker.js. Chooses how every
         mission's presence area renders below. -->
    <div class="picker-zone shrink-0" x-show="missions.length">
      <div x-data="StylePicker.alpine(presenceStyles)">
        <div class="picker" x-ref="picker" :class="expanded ? 'expanded' : 'idle'"
             :style="'width:' + pickerWidth + 'px'"
             @pointerdown="onDown($event)"
             data-testid="mc-style-picker">
          <template x-for="(s, i) in icons" :key="s.id">
            <div class="pdot" :class="i === active ? 'selected' : ''"
                 :style="'transform:translateX(' + dotOffset(i) + 'px); transition-delay:' + (expanded ? i * 28 : (icons.length - 1 - i) * 22) + 'ms; color:' + s.color">
              <div class="pdot-glow" :style="'background:' + s.color"></div>
              <div class="pdot-ring"></div>
              <div class="pdot-icon" x-html="s.icon"></div>
            </div>
          </template>
          <div class="stem"></div>
        </div>
      </div>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-4 space-y-3">

    <template x-for="m in filteredMissions" :key="m.mission_id">
      <div class="rounded-md border border-gray-800 bg-gray-900/40 p-4 min-w-0" :data-testid="'mc-mission-' + m.mission_id">

        <!-- Headline row: identity + the one action + the one thing that needs you. -->
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-white font-semibold text-base" x-text="m.name"></span>
              {# The org is the mission's entire access boundary — a reader
                 who cannot see it is blind to a mis-homed mission, which
                 happened. Always visible, never inferred. #}
              <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold tracking-wide bg-purple-900/30 text-purple-300"
                    x-show="m.org"
                    :data-testid="'mc-org-' + m.mission_id"
                    x-text="m.org"></span>
              <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide"
                    x-show="m.status !== 'active'"
                    :class="m.status === 'paused' ? 'bg-amber-900/40 text-amber-300' : 'bg-gray-700/60 text-gray-400'"
                    :data-testid="'mc-status-' + m.mission_id"
                    x-text="m.status"></span>
            </div>
            <div class="text-xs text-gray-500 mt-0.5">
              <span x-show="m.current_revision" x-text="'Updated ' + relativeTime(m.current_revision && m.current_revision.created_at)"></span>
              <!-- A structured mission renders from settings items, not pushed
                   revisions -- it always has a site, even before its first item. -->
              <span x-show="!m.current_revision && m.style === 'structured'"
                    class="text-indigo-300">Structured</span>
              <span x-show="!m.current_revision && m.style !== 'structured'" class="text-amber-400">No site yet</span>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span x-show="m.open_question_count > 0"
                  class="px-2 py-0.5 rounded-full bg-amber-900/40 text-amber-300 text-[11px] font-semibold whitespace-nowrap"
                  :data-testid="'mc-open-questions-' + m.mission_id"
                  x-text="m.open_question_count + (m.open_question_count === 1 ? ' open question' : ' open questions')"></span>
            <a :href="'/missions/' + m.mission_id"
               x-show="m.current_revision_id || m.style === 'structured'"
               class="px-3 py-1 rounded bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-medium whitespace-nowrap"
               :data-testid="'mc-view-site-' + m.mission_id">View site &rarr;</a>
          </div>
        </div>

        <!-- Latest change, plain -- no internal revision-number prefix next
             to a note that may carry the author's own separate numbering. -->
        <p class="text-xs text-gray-400 mt-2 leading-snug"
           x-show="m.current_revision && m.current_revision.note"
           x-text="m.current_revision && m.current_revision.note"></p>

        <!-- Presence: one Presence.alpine() surface per mission
             (mission:<id>), not one for the whole page. The picker above
             chooses which variant renders; all variants share this same
             missionPresenceRow state so switching styles never
             re-subscribes the surface. -->
        <div x-data="missionPresenceRow(m.mission_id)" class="mt-3" :data-testid="'mc-presence-' + m.mission_id">

          <div x-show="presenceStyle === 'avatar-row'" class="relative nx-avatar-stack mc-presence-row" style="height:28px">
            <template x-for="(p, i) in participants" :key="p.participant_id">
              <button @click="toggleIdentity(p.participant_id)"
                      class="nx-avatar mc-presence-avatar" :title="p.participant_label"
                      :style="'background:' + participantColor(p.participant_id) + '; left:' + avatarLeft(i) + 'px; z-index:' + (openId === p.participant_id ? 10 : (participants.length - i))"
                      :data-testid="'mc-presence-avatar-' + p.participant_id">
                <!-- _avatarTick is read so Alpine re-evaluates when a photo
                     arrives; the fetch is one per person, not per render. -->
                <img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak
                     :src="participantAvatar(p)" :alt="p.participant_label"
                     class="h-full w-full rounded-full object-cover"
                     :data-testid="'mc-presence-photo-' + p.participant_id">
                <span x-show="!participantAvatar(p)"
                      x-text="participantInitial(p)"></span>
              </button>
            </template>
            <div class="mc-presence-name"
                 :style="'left:' + (avatarLeft(openIndex) + 34) + 'px; opacity:' + (openId ? 1 : 0)">
              <span class="text-xs text-gray-200 font-medium whitespace-nowrap"
                    x-text="openId ? (participants.find(p => p.participant_id === openId) || {}).participant_label : ''"></span>
            </div>
            <span class="mc-presence-hint text-xs text-gray-500"
                  :style="'left:' + (rowWidth + 8) + 'px; opacity:' + (openId ? 0 : 1) + '; display:' + (participants.length ? 'flex' : 'none')"
                  x-text="participants.length + ' here recently'"></span>
            <span class="text-xs text-gray-600" x-show="!participants.length">No one here recently</span>
          </div>

          <div x-show="presenceStyle === 'pan-strip'" class="flex gap-2 overflow-x-auto pb-1" style="scrollbar-width:thin">
            <template x-for="p in participants" :key="'strip' + p.participant_id">
              <div class="flex items-center gap-1.5 shrink-0 bg-gray-800/60 rounded-full pl-1 pr-3 py-1 nx-avatar-stack">
                <span class="nx-avatar" :style="'width:22px;height:22px;font-size:9px;background:' + participantColor(p.participant_id)"><img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak :src="participantAvatar(p)" :alt="p.participant_label" class="h-full w-full rounded-full object-cover"><span x-show="!participantAvatar(p)" x-text="participantInitial(p)"></span></span>
                <span class="text-xs text-gray-200 font-medium" x-text="p.participant_label"></span>
                <span class="text-[10px] text-gray-500" x-text="lastActive(p)"></span>
              </div>
            </template>
            <span class="text-xs text-gray-600" x-show="!participants.length">No one here recently</span>
          </div>

          <div x-show="presenceStyle === 'grouped'">
            <button @click="groupedOpen = !groupedOpen" class="flex items-center gap-2 text-xs text-gray-300 hover:text-white">
              <span class="flex -space-x-1.5 nx-avatar-stack">
                <template x-for="p in participants.slice(0,3)" :key="'g' + p.participant_id">
                  <span class="nx-avatar" :style="'width:22px;height:22px;font-size:9px;background:' + participantColor(p.participant_id)"><img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak :src="participantAvatar(p)" :alt="p.participant_label" class="h-full w-full rounded-full object-cover"><span x-show="!participantAvatar(p)" x-text="participantInitial(p)"></span></span>
                </template>
              </span>
              <span x-text="presenceHumans.length + ' human' + (presenceHumans.length===1?'':'s') + ' · ' + presenceAgents.length + ' agent' + (presenceAgents.length===1?'':'s') + ' here recently'"></span>
              <span x-text="groupedOpen ? '▴' : '▾'" class="text-gray-500"></span>
            </button>
            <div x-show="groupedOpen" x-cloak class="mt-3 grid grid-cols-2 gap-3">
              <div>
                <div class="text-[10px] uppercase tracking-wide text-gray-500 mb-1.5">Human</div>
                <template x-for="p in presenceHumans" :key="p.participant_id">
                  <div class="flex items-center gap-1.5 py-1 nx-avatar-stack">
                    <span class="nx-avatar" :style="'width:22px;height:22px;font-size:9px;background:' + participantColor(p.participant_id)"><img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak :src="participantAvatar(p)" :alt="p.participant_label" class="h-full w-full rounded-full object-cover"><span x-show="!participantAvatar(p)" x-text="participantInitial(p)"></span></span>
                    <div class="text-xs text-gray-300" x-text="p.participant_label"></div>
                    <div class="text-[10px] text-gray-500 ml-auto" x-text="lastActive(p)"></div>
                  </div>
                </template>
                <p class="text-xs text-gray-600" x-show="!presenceHumans.length">None recently</p>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-wide text-gray-500 mb-1.5">Agent</div>
                <template x-for="p in presenceAgents" :key="p.participant_id">
                  <div class="flex items-center gap-1.5 py-1 nx-avatar-stack">
                    <span class="nx-avatar" :style="'width:22px;height:22px;font-size:9px;background:' + participantColor(p.participant_id)"><img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak :src="participantAvatar(p)" :alt="p.participant_label" class="h-full w-full rounded-full object-cover"><span x-show="!participantAvatar(p)" x-text="participantInitial(p)"></span></span>
                    <div class="text-xs text-gray-300" x-text="p.participant_label"></div>
                    <div class="text-[10px] text-gray-500 ml-auto" x-text="lastActive(p)"></div>
                  </div>
                </template>
                <p class="text-xs text-gray-600" x-show="!presenceAgents.length">None recently</p>
              </div>
            </div>
          </div>

          <div x-show="presenceStyle === 'compact'">
            <button @click="compactOpen = !compactOpen" class="text-xs text-gray-500 hover:text-gray-300 flex items-center gap-1.5">
              <span class="relative flex h-1.5 w-1.5" x-show="participants.length">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-400"></span>
              </span>
              <span x-show="participants.length" x-text="participants.length + ' here · last seen ' + lastActive(participants[0])"></span>
              <span x-show="!participants.length">No one here recently</span>
              <span x-show="participants.length" x-text="compactOpen ? '▴' : '▾'"></span>
            </button>
            <div x-show="compactOpen && participants.length" x-cloak class="flex flex-wrap gap-2 mt-3">
              <template x-for="p in participants" :key="'c' + p.participant_id">
                <div class="flex items-center gap-1.5 bg-gray-800/60 rounded-full pl-1 pr-2.5 py-0.5 nx-avatar-stack">
                  <span class="nx-avatar" :style="'width:22px;height:22px;font-size:9px;background:' + participantColor(p.participant_id)"><img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak :src="participantAvatar(p)" :alt="p.participant_label" class="h-full w-full rounded-full object-cover"><span x-show="!participantAvatar(p)" x-text="participantInitial(p)"></span></span>
                  <span class="text-[11px] text-gray-300" x-text="p.participant_label + ' · ' + lastActive(p)"></span>
                </div>
              </template>
            </div>
          </div>

          <!-- delta-feed replaces the badge footer below entirely. -->
          <template x-if="presenceStyle === 'delta-feed'">
            <div>
              <div class="flex items-center gap-2" x-show="participants.length">
                <span class="text-xs text-gray-500" x-text="participants.length + ' here'"></span>
                <span class="flex -space-x-1.5 nx-avatar-stack">
                  <template x-for="p in participants.slice(0,3)" :key="'df' + p.participant_id">
                    <span class="nx-avatar" :style="'width:22px;height:22px;font-size:9px;background:' + participantColor(p.participant_id)"><img x-show="_avatarTick > -1 && participantAvatar(p)" x-cloak :src="participantAvatar(p)" :alt="p.participant_label" class="h-full w-full rounded-full object-cover"><span x-show="!participantAvatar(p)" x-text="participantInitial(p)"></span></span>
                  </template>
                </span>
              </div>
              <div class="mt-3 space-y-2" x-show="m.since_last_visit && (m.since_last_visit.revisions.length || m.since_last_visit.questions.length)">
                <div class="text-[10px] uppercase tracking-wide text-gray-500">Since you were last here</div>
                <template x-for="r in (m.since_last_visit ? m.since_last_visit.revisions : [])" :key="'r' + r.revision_id">
                  <div class="flex items-start gap-2 text-xs">
                    <span class="mt-1 h-1.5 w-1.5 rounded-full shrink-0 bg-indigo-400"></span>
                    <div class="min-w-0">
                      <span class="text-gray-300" x-text="'Revision #' + r.revision_seq + (r.note ? ' — ' + r.note : '')"></span>
                      <span class="text-gray-600 ml-1" x-text="relativeTime(r.created_at)"></span>
                    </div>
                  </div>
                </template>
                <template x-for="q in (m.since_last_visit ? m.since_last_visit.questions : [])" :key="'q' + q.entry_id">
                  <div class="flex items-start gap-2 text-xs">
                    <span class="mt-1 h-1.5 w-1.5 rounded-full shrink-0 bg-amber-400"></span>
                    <div class="min-w-0">
                      <span class="text-gray-300" x-text="q.asked_by_label + ' asked &quot;' + q.question + '&quot;'"></span>
                      <span class="text-gray-600 ml-1" x-text="relativeTime(q.created_at)"></span>
                    </div>
                  </div>
                </template>
              </div>
              <p class="text-xs text-gray-600"
                 x-show="!(m.since_last_visit && (m.since_last_visit.revisions.length || m.since_last_visit.questions.length))">Nothing new since your last visit.</p>
            </div>
          </template>
        </div>

        <!-- Badge form for every style except delta-feed, which replaces
             this footer with the full list above instead. -->
        <div class="mt-3 pt-3 border-t border-gray-800/60"
             x-show="presenceStyle !== 'delta-feed' && m.since_last_visit && (m.since_last_visit.revisions.length || m.since_last_visit.questions.length)">
          <div class="text-[10px] uppercase tracking-wide text-gray-500 mb-2">Since you were last here</div>
          <div class="flex flex-wrap gap-2">
            <span x-show="m.since_last_visit.revisions.length" class="px-2 py-1 rounded-md bg-indigo-900/40 text-indigo-300 text-xs font-medium"
                  x-text="m.since_last_visit.revisions.length + ' new revision' + (m.since_last_visit.revisions.length===1?'':'s')"></span>
            <span x-show="m.since_last_visit.questions.length" class="px-2 py-1 rounded-md bg-amber-900/40 text-amber-300 text-xs font-medium"
                  x-text="m.since_last_visit.questions.length + ' new question' + (m.since_last_visit.questions.length===1?'':'s')"></span>
          </div>
        </div>

        <!-- Pillars: a mission with none renders nothing extra here --
             exactly today's card, unchanged. A pillar is a sub-mission
             with its own coordinator_session and site history; this is a
             compact overview (name, status, open questions, who's there,
             a link to its own site) -- the rich anchored-conversation
             pillar experience lives in the guest-facing embeddable
             widget (SKILL.md), not this operator dashboard. -->
        <div class="mt-3 grid grid-cols-2 gap-2" x-show="(pillars[m.mission_id] || []).length"
             :data-testid="'mc-pillars-' + m.mission_id">
          <template x-for="p in (pillars[m.mission_id] || [])" :key="p.pillar_id">
            <div class="rounded border border-gray-800 bg-gray-900/60 p-2.5 min-w-0"
                 :data-testid="'mc-pillar-' + p.pillar_id" x-data="missionPresenceRow(p.pillar_id, 'pillar')">
              <div class="flex items-center justify-between gap-1.5">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="h-2 w-2 rounded-full shrink-0" :style="'background:' + (p.color || '#6b7280')"></span>
                  <span class="text-xs font-medium text-gray-200 truncate" x-text="p.name"></span>
                </div>
                <span class="px-1 py-0.5 rounded text-[9px] font-semibold uppercase tracking-wide shrink-0"
                      x-show="p.status !== 'active'"
                      :class="p.status === 'paused' ? 'bg-amber-900/40 text-amber-300' : 'bg-gray-700/60 text-gray-400'"
                      x-text="p.status"></span>
              </div>
              <div class="flex items-center justify-between gap-1.5 mt-1.5">
                <span class="text-[10px] text-gray-500" x-text="participants.length ? participants.length + ' here' : 'no one here'"></span>
                <span class="text-[10px] text-amber-300" x-show="p.open_question_count > 0"
                      x-text="p.open_question_count + (p.open_question_count === 1 ? ' q' : ' qs')"></span>
              </div>
              <!-- Structured missions serve every pillar view from items,
                   revision or none — same rule as the mission card above. -->
              <a :href="'/missions/' + m.mission_id + '/pillars/' + p.pillar_id"
                 x-show="p.current_revision_id || m.style === 'structured'"
                 class="block mt-1.5 text-[10px] text-indigo-400 hover:text-indigo-300"
                 :data-testid="'mc-pillar-view-' + p.pillar_id">View site &rarr;</a>
            </div>
          </template>
        </div>

        <button @click="toggleExpand(m.mission_id)" class="text-xs text-gray-500 hover:text-gray-300 mt-3"
                :data-testid="'mc-expand-' + m.mission_id">
          <span x-text="expanded === m.mission_id ? 'Hide details' : 'Details'"></span>
        </button>

        <!-- Reference material: raw id, coordinator, full history. Behind
             the click, never in the headline view (graph://97ace518-788 §0). -->
        <div x-show="expanded === m.mission_id" class="mt-3 pt-3 border-t border-gray-800/60 space-y-3" :data-testid="'mc-detail-' + m.mission_id">
          <div class="text-xs text-gray-500 space-y-0.5">
            <div>id: <span class="break-all" x-text="m.mission_id"></span></div>
            <div>coordinator: <span x-text="m.coordinator_session || '(none)'"></span></div>
          </div>

          <div>
            <div class="text-xs text-gray-500 mb-1">Revision history</div>
            <div class="space-y-1 max-h-48 overflow-y-auto">
              <template x-for="r in (revisions[m.mission_id] || [])" :key="r.revision_id">
                <div class="text-xs flex items-center flex-wrap gap-x-2 gap-y-1 border-b border-gray-800/40 py-1"
                     :data-testid="'mc-revision-' + r.revision_id">
                  <span class="font-mono text-amber-300" x-text="'#' + r.revision_seq"></span>
                  <span class="text-gray-300 flex-1 min-w-[6rem] truncate" x-text="r.note || '(no note)'"></span>
                  <span class="text-gray-500" x-text="r.byte_size + 'B'"></span>
                  <span class="text-emerald-400 text-[10px] font-bold" x-show="r.revision_id === m.current_revision_id">CURRENT</span>
                </div>
              </template>
              <p class="text-xs text-gray-500" x-show="(revisions[m.mission_id] || []).length === 0">No revisions yet.</p>
            </div>
          </div>

          <div>
            <div class="text-xs text-gray-500 mb-1">Questions</div>
            <div class="space-y-1.5 max-h-48 overflow-y-auto">
              <template x-for="q in (conversation[m.mission_id] || [])" :key="q.entry_id">
                <div class="text-xs border-b border-gray-800/40 py-1" :data-testid="'mc-question-' + q.entry_id">
                  <div class="text-gray-300"><span class="text-gray-500" x-text="q.asked_by_label + ':'"></span> <span x-text="q.question"></span></div>
                  <div class="text-gray-500 mt-0.5" x-show="q.answer"><span class="text-emerald-400">Answered:</span> <span x-text="q.answer"></span></div>
                  <div class="text-amber-400 mt-0.5" x-show="!q.answer">Awaiting answer</div>
                </div>
              </template>
              <p class="text-xs text-gray-500" x-show="(conversation[m.mission_id] || []).length === 0">No questions yet.</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <p class="text-xs text-gray-500" x-show="missions.length === 0" data-testid="mc-empty">No missions yet.</p>
    <p class="text-xs text-gray-500" x-show="missions.length > 0 && filteredMissions.length === 0" data-testid="mc-empty-filtered">No missions match this filter.</p>

  </main>
</div>
