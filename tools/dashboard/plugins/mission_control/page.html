<div x-data="missionControlPage()"
     data-testid="mission-control-root"
     class="mission-control-page bg-gray-900 text-gray-200 antialiased min-h-screen">

  <header class="border-b border-gray-800 px-4 sm:px-6 py-4">
    <h1 class="text-2xl font-bold text-white">Mission Control</h1>
    <p class="text-sm text-gray-400">
      Missions and their chromeless native sites — read-only. Missions are
      created and updated by agent sessions via the API
      (<code class="text-gray-300">POST /api/missions</code>,
      <code class="text-gray-300">POST /api/missions/&lt;id&gt;/site</code>),
      not from this page.
    </p>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <section data-testid="mc-missions">
      <h2 class="text-sm font-semibold text-white mb-2">Missions</h2>
      <div class="space-y-3">
        <template x-for="m in missions" :key="m.mission_id">
          <div class="rounded-md border border-gray-800 bg-gray-900/40 p-4 min-w-0" :data-testid="'mc-mission-' + m.mission_id">
            <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-2">
              <div class="min-w-0">
                <span class="text-white font-semibold" x-text="m.name"></span>
                <span class="text-gray-500 text-xs sm:ml-2 break-all" x-text="m.mission_id"></span>
              </div>
              <a :href="'/missions/' + m.mission_id" target="_blank" data-hard-reload
                 class="text-indigo-400 text-xs hover:underline shrink-0"
                 x-show="m.current_revision_id"
                 :data-testid="'mc-view-site-' + m.mission_id">View site &rarr;</a>
            </div>
            <div class="text-xs text-gray-500 mt-1">
              coordinator: <span x-text="m.coordinator_session || '(none)'"></span>
            </div>
            <div class="text-xs text-gray-500 mt-1" x-show="m.current_revision">
              current: rev<span x-text="m.current_revision && m.current_revision.revision_seq"></span>
              <span x-show="m.current_revision && m.current_revision.note">
                &mdash; <span x-text="m.current_revision && m.current_revision.note"></span>
              </span>
            </div>
            <div class="mt-3">
              <button @click="toggleExpand(m.mission_id)" class="text-xs text-gray-400 hover:text-white"
                      :data-testid="'mc-expand-' + m.mission_id">
                <span x-text="expanded === m.mission_id ? 'Hide revision history' : 'Show revision history'"></span>
              </button>
            </div>
            <div x-show="expanded === m.mission_id" class="mt-3" :data-testid="'mc-detail-' + m.mission_id">
              <div class="space-y-1 max-h-48 overflow-y-auto">
                <template x-for="r in (revisions[m.mission_id] || [])" :key="r.revision_id">
                  <div class="text-xs flex items-center flex-wrap gap-x-2 gap-y-1 border-b border-gray-800/40 py-1"
                       :data-testid="'mc-revision-' + r.revision_id">
                    <span class="font-mono text-amber-300" x-text="'#' + r.revision_seq"></span>
                    <span class="text-gray-300 flex-1 min-w-[6rem] truncate" x-text="r.note || '(no note)'"></span>
                    <span class="text-gray-500" x-text="r.byte_size + 'B'"></span>
                    <span class="text-emerald-400 text-[10px] font-bold" x-show="r.revision_id === m.current_revision_id">CURRENT</span>
                  </div>
                </template>
                <p class="text-xs text-gray-500" x-show="(revisions[m.mission_id] || []).length === 0">No revisions yet.</p>
              </div>
            </div>
          </div>
        </template>
        <p class="text-xs text-gray-500" x-show="missions.length === 0" data-testid="mc-empty">No missions yet.</p>
      </div>
    </section>

  </main>
</div>
