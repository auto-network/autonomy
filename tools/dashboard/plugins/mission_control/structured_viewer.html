<!-- Structured mission viewer — the platform's standard template.
     Served by structured.render_screen() with __MC_STRUCTURED_DATA__
     replaced by the mission's baked item JSON. Everything renders
     client-side, once, into the DOM; view switching is CSS-only so the
     platform chrome's anchor/ask discovery sees every item at load. -->
<style>
  :root{
    --bg:#0c0f14; --bg2:#11151d; --card:#151a23; --card2:#1a2029;
    --line:#262d3a; --line2:#303948;
    --ink:#e6e9f0; --ink2:#aab3c4; --ink3:#7c8698;
    --accent:#8b85ff; --accent-dim:#46448c;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --serious:#ec835a;
    --neut:#8391a8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html{background:#0c0f14}
  body{background:#0c0f14;margin:0}
  #mc-app,#mc-app *{box-sizing:border-box}
  #mc-app{
    max-width:1060px;margin:0 auto;padding:14px 14px 80px;
    color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #mc-app a{color:var(--accent)}
  .mc-tabs{display:flex;gap:18px;margin:4px 0 14px;border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mc-tabs::-webkit-scrollbar{display:none}
  .mc-tabs button{background:none;border:0;cursor:pointer;font:inherit;
    padding:9px 2px;font-size:.85rem;color:var(--ink3);flex:none;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .mc-tabs button.on{color:#fff;border-color:var(--accent)}
  #mc-app .mc-sub{color:var(--ink3);font-size:.82rem;margin:0 0 14px}

  /* glance chips */
  .mc-glance{display:flex;gap:6px;flex-wrap:nowrap;align-items:stretch;
    margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
  .mc-glance::-webkit-scrollbar{display:none}
  .mc-glance .g{
    flex:none;display:flex;align-items:baseline;gap:4px;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:6px 7px;
    cursor:pointer;font:inherit;color:inherit;white-space:nowrap;
  }
  .mc-gset{flex:none;display:inline-flex;background:var(--card);
    border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .mc-gset .g{border:0;border-radius:0;border-left:1px solid var(--line)}
  .mc-gset .g:first-child{border-left:0}
  .mc-gset .g.on{box-shadow:inset 0 0 0 1px var(--accent-dim)}
  .mc-glance .g:hover{border-color:var(--line2)}
  .mc-glance .g.on{border-color:var(--accent-dim);background:#232345}
  .mc-glance .g.on span{color:var(--ink2)}
  .mc-glance .g b{font-size:.95rem;color:#fff}
  .mc-glance .g span{font-size:.66rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
  .mc-glance .g.gd b{color:var(--good)} .mc-glance .g.gw b{color:var(--warn)}
  .mc-glance .g.gc b{color:var(--crit)} .mc-glance .g.ga b{color:var(--accent)}

  /* ── activity grid ── */
  .mc-activity{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin:0 0 16px}
  .mc-activity .hd{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;margin-bottom:8px}
  .mc-activity .hd .t{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
  .mc-activity .legend{display:flex;align-items:center;gap:3px;font-size:.68rem;color:var(--ink3)}
  .mc-activity .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .mc-act-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;
    scrollbar-width:thin}
  .mc-act-table{border-collapse:separate;border-spacing:2px}
  .mc-act-table td,.mc-act-table th{padding:0}
  .mc-act-table th{font:400 .74rem/1.2 inherit;color:var(--ink2);text-align:left;
    padding-right:8px;white-space:nowrap;max-width:216px;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer}
  .mc-act-table th .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:6px;vertical-align:1px}
  .mc-act-cell{width:11px;height:11px;border-radius:3px;background:var(--card2)}
  .mc-act-cell.a1{background:#2b2f52}.mc-act-cell.a2{background:#46448c}
  .mc-act-cell.a3{background:#6a63c8}.mc-act-cell.a4{background:#8f87ff}
  .mc-act-table .dayrow td{padding-top:3px}
  .mc-act-table .daylab{font-size:.6rem;color:var(--ink3);text-align:center;padding:0 1px}

  /* ── nav ── */
  .mc-nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;
    position:sticky;top:3rem;background:var(--bg);z-index:5;
    scrollbar-width:none}
  .mc-nav::-webkit-scrollbar{display:none}
  .mc-nav button{
    flex-shrink:0;font:600 .78rem/1 inherit;color:var(--ink2);background:var(--bg2);
    border:1px solid var(--line);border-radius:16px;padding:7px 13px;cursor:pointer;
    white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .mc-nav button .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .mc-nav button .n{font-weight:400;color:var(--ink3);font-size:.72rem}
  .mc-nav button.on{color:#fff;border-color:var(--accent-dim);background:#232345}
  .mc-nav button.warns .n{color:var(--warn)}
  .mc-nav button.mc-dim{opacity:.45}
  .mc-glance .g.mc-dim{opacity:.5}
  .mc-seg{display:inline-flex;gap:2px;background:var(--bg2);border:1px solid var(--line);
    border-radius:8px;padding:2px}
  .mc-seg button{background:none;border:0;cursor:pointer;font:600 .74rem/1 inherit;
    color:var(--ink3);border-radius:6px;padding:5px 10px}
  .mc-seg .mc-seg-on{background:#232345;color:#fff}
  .mc-news-seg{margin:0 0 12px}
  .mc-qa-seg{margin:0 0 12px}
  .mc-qa{cursor:pointer}
  .mc-qa:hover{border-color:var(--line2)}
  .mc-qa-peek{font-size:.8rem;color:var(--ink3);margin-top:6px;
    border-left:2px solid var(--line2);padding-left:9px;font-style:italic}
  .mc-qa-state{font-size:.68rem;color:var(--ink3);text-transform:uppercase;
    letter-spacing:.05em;margin-top:7px}
  .mc-qa-ask{display:flex;justify-content:flex-start;margin:4px 0 0}
  .mc-subtabs{display:flex;gap:14px;margin:0 0 12px;border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none}
  .mc-subtabs::-webkit-scrollbar{display:none}
  .mc-subtabs button{background:none;border:0;cursor:pointer;font:inherit;
    font-size:.78rem;color:var(--ink3);padding:7px 2px;flex:none;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .mc-subtabs button .n{font-size:.68rem;color:var(--ink3);opacity:.8}
  .mc-subtabs button.on{color:var(--ink);border-color:var(--line2)}
  .mc-group{font-size:.72rem;color:var(--ink3);letter-spacing:.06em;
    text-transform:uppercase;margin:16px 0 8px}
  .mc-news .body{margin-top:2px}
  .mc-news-foot{display:flex;justify-content:flex-end;margin-top:6px}
  .mc-news-reply{background:none;border:0;cursor:pointer;font:600 .74rem/1 inherit;
    color:var(--accent);padding:2px 4px}
  .mc-gout{display:none!important}

  /* ── views ── */
  .mc-view{display:none}
  .mc-view.on{display:block}
  .mc-sec{margin:22px 0 8px}
  .mc-sec h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink3);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .mc-empty{color:var(--ink3);font-size:.86rem;padding:14px;background:var(--bg2);
    border:1px dashed var(--line);border-radius:10px}
  .mc-empty code{font-family:var(--mono);font-size:.8em;color:var(--ink2)}

  /* ── item cards ── */
  .mc-item{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line2);
    border-radius:0 10px 10px 0;padding:12px 14px;margin:0 0 10px;
  }
  .mc-item.st-proven,.mc-item.st-done,.mc-item.st-settled{border-left-color:var(--good)}
  .mc-item.st-active,.mc-item.st-code_only,.mc-item.st-open{border-left-color:var(--warn)}
  .mc-item.st-blocked{border-left-color:var(--crit)}
  .mc-item.k-incident{border-left-color:var(--serious)}
  .mc-item.mc-hidden,.mc-hidden{display:none !important}
  .mc-item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mc-item .top .where{font-size:.7rem;color:var(--ink3);display:flex;gap:6px;align-items:center}
  .mc-item .top .where .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .mc-item h3{font-size:.95rem;line-height:1.35;margin:4px 0 2px;color:var(--ink);font-weight:600}
  .mc-item .body{font-size:.86rem;color:var(--ink2);margin:4px 0 0}
  .mc-item .body p{margin:5px 0}
  .mc-item details{margin:7px 0 0}
  .mc-item summary{cursor:pointer;font-size:.78rem;color:var(--accent);list-style:none;user-select:none}
  .mc-item summary::before{content:"▸ ";color:var(--ink3)}
  .mc-item details[open] summary::before{content:"▾ "}
  .mc-item .ev{font-size:.8rem;color:var(--ink2);border-left:1px solid var(--line);
    margin:6px 0 0 3px;padding:2px 0 2px 11px}
  .mc-item .ev p{margin:4px 0}
  .mc-refs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .mc-refs span{font-family:var(--mono);font-size:.68rem;color:var(--ink3);
    background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .mc-when{font-size:.7rem;color:var(--ink3);margin-top:7px}

  /* a mirror card (cross-pillar views) is a door to its home item */
  .mc-item.mc-mirror{cursor:pointer}
  .mc-item.mc-mirror:hover{border-color:var(--line2);background:#181e29}
  .mc-item.mc-flash{animation:mcflash 1.6s ease-out 1}
  @keyframes mcflash{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

  /* finished items fold away per section: the count stays honest, the
     scroll goes. */
  details.mc-finished{margin:2px 0 10px;border:1px dashed var(--line);
    border-radius:10px;padding:0}
  details.mc-finished > summary{cursor:pointer;list-style:none;user-select:none;
    color:var(--ink3);font-size:.8rem;padding:9px 13px}
  details.mc-finished > summary::before{content:"▸ ";color:var(--ink3)}
  details.mc-finished[open] > summary::before{content:"▾ "}
  details.mc-finished > .mc-item{margin-left:10px;margin-right:10px}
  details.mc-finished[open]{padding-bottom:8px}

  /* pills */
  .mc-pill{display:inline-block;flex-shrink:0;font:700 .64rem/1 inherit;letter-spacing:.05em;
    text-transform:uppercase;padding:4px 8px;border-radius:12px;white-space:nowrap}
  .p-good{color:var(--good);background:rgba(12,163,12,.13);border:1px solid rgba(12,163,12,.3)}
  .p-warn{color:var(--warn);background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.3)}
  .p-crit{color:#ff7b7b;background:rgba(208,59,59,.15);border:1px solid rgba(208,59,59,.4)}
  .p-neut{color:var(--neut);background:rgba(131,145,168,.1);border:1px solid rgba(131,145,168,.28)}

  /* decision fields */
  .mc-dec{font-size:.84rem;color:var(--ink2);margin-top:6px}
  .mc-dec b{color:var(--ink3);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;
    display:block;margin:7px 0 1px}
  .mc-dec p{margin:0}
  .mc-dec .ifw{color:#e8b8ac}

  /* checkpoints (ordered arc) */
  .mc-arc{position:relative}
  .mc-arc .mc-item{display:grid;grid-template-columns:34px 1fr;gap:12px}
  .mc-arc .stepno{
    width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);
    border-radius:8px;background:var(--bg2);color:var(--accent);
    font:600 .78rem var(--mono);
  }
  .mc-arc .mc-item > div:last-child{min-width:0}
  .mc-arc .mc-item .top{margin-top:2px}

  /* metric tiles */
  .mc-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:8px;margin:0 0 10px}
  .mc-metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .mc-metric b{display:block;font-size:1.05rem;color:#fff}
  .mc-metric span{display:block;font-size:.72rem;color:var(--ink3);margin-top:3px;line-height:1.35}

  /* pillar summary cards (overview) */
  .mc-psum{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;margin:0 0 10px;cursor:pointer;
  }
  .mc-psum:hover{border-color:var(--line2)}
  .mc-psum .hd{display:flex;align-items:flex-start;gap:8px}
  .mc-psum .hd b{flex:1;min-width:0}
  .mc-psum .hd .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center}
  .mc-psum .hd b{color:#fff;font-size:.95rem}
  .mc-mini{flex:none;display:inline-flex;align-items:center;margin-left:auto;
    border:1px solid var(--line);border-radius:6px;overflow:hidden;
    font-size:.66rem;line-height:1;background:var(--bg2);margin-top:1px}
  .mc-mini i{font-style:normal;font-weight:700;padding:3px 6px;
    border-left:1px solid var(--line)}
  .mc-mini i:first-child{border-left:0}
  .mc-mini .m-a{color:var(--accent)} .mc-mini .m-c{color:var(--crit)}
  .mc-mini .m-w{color:var(--warn)} .mc-mini .m-g{color:var(--good)}
  .mc-mini .m-z{opacity:.35}
  .mc-psum .last{font-size:.83rem;color:var(--ink2);margin:6px 0 0}
  .mc-psum .stat{font-size:.8rem;color:var(--ink3);margin:6px 0 0;font-style:italic}

  /* feed */
  .mc-feed-day{font-size:.72rem;color:var(--ink3);text-transform:uppercase;
    letter-spacing:.06em;margin:18px 0 8px}
  .mc-feed-row{display:flex;gap:9px;align-items:baseline;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 6px;
    font-size:.84rem}
  .mc-feed-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;align-self:center}
  .mc-feed-row .t{color:var(--ink);flex:1 1 auto;min-width:0}
  .mc-feed-row .k{color:var(--ink3);font-size:.7rem;flex-shrink:0;max-width:88px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-feed-row .mc-pill{margin-left:auto;align-self:center}
  .mc-feed-note{display:inline-flex;align-items:center;gap:6px;font:600 .74rem/1 inherit;
    color:#fff;background:#232345;border:1px solid var(--accent-dim);border-radius:14px;
    padding:6px 11px;margin:0 0 10px;cursor:pointer}
  .mc-act-table th{cursor:pointer}
  .mc-act-table th:hover{color:var(--ink)}

  /* non-stateful kinds: no pill, neutral spine */
  .mc-item.k-scope,.mc-item.k-status{border-left-color:var(--line2)}
  .mc-item.k-scope .mc-pill,.mc-item.k-status .mc-pill{display:none}
  /* An open question under an "Open questions" heading needs no OPEN badge;
     the amber spine already carries the state. */
  .mc-item.k-question.st-open .mc-pill{display:none}
  .mc-item.k-question.st-open{cursor:pointer}
  .mc-item.k-question.st-open:hover{border-color:var(--line2)}

  .mc-foot{color:var(--ink3);font-size:.72rem;margin-top:36px;text-align:center}

  @media(min-width:680px){
    #mc-app{padding:18px 24px 90px}
    .mc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mc-two .mc-item{margin:0}
  }
</style>

<div id="mc-app">
  <nav class="mc-tabs" id="mc-tabs"></nav>
  <div class="mc-glance" id="mc-glance"></div>

  <div class="mc-activity">
    <div class="hd">
      <span class="t">Activity</span>
      <span class="legend">less
        <i style="background:var(--card2)"></i><i style="background:#2b2f52"></i>
        <i style="background:#46448c"></i><i style="background:#6a63c8"></i>
        <i style="background:#8f87ff"></i> more</span>
    </div>
    <div class="mc-act-scroll"><table class="mc-act-table" id="mc-act"></table></div>
  </div>

  <nav class="mc-nav" id="mc-nav"></nav>
  <div id="mc-views"></div>

  <div class="mc-foot">Structured mission · rendered by the platform from
    <code>dashboard.mission.item</code> · <span id="mc-genat"></span></div>
</div>

<script id="mc-data" type="application/json">__MC_STRUCTURED_DATA__</script>
<script>
(function () {
  "use strict";
  var T_SCRIPT = performance.now();   // chrome boot + HTML parse end at our turn
  var DATA = JSON.parse(document.getElementById("mc-data").textContent);
  var T_PARSED = performance.now();
  var ITEMS = DATA.items || [];
  var PILLARS = DATA.pillars || [];
  var MID = DATA.mission.mission_id;

  // ── vocab ───────────────────────────────────────────────────────
  var PILL = {
    proven:"p-good", done:"p-good", settled:"p-good",
    active:"p-warn", code_only:"p-warn", open:"p-warn",
    blocked:"p-crit",
    next:"p-neut", specified:"p-neut", deferred:"p-neut", retired:"p-neut"
  };
  var STATE_LABEL = {
    proven:"Proven", done:"Done", settled:"Settled", active:"Active",
    code_only:"Code only", open:"Open", blocked:"Blocked", next:"Next",
    specified:"Specified", deferred:"Deferred", retired:"Retired"
  };
  var SECTION_OF = {scope:"Objective and scope", work:"The work",
    checkpoint:"The work", metric:"The work", incident:"The work",
    exhibit:"The work", decision:"Decisions", question:"Open questions",
    status:"Where it stands"};
  var SECTION_ORDER = ["Objective and scope","The work","Decisions",
    "Open questions","Where it stands"];

  var byId = {};
  PILLARS.forEach(function (p) { byId[p.pillar_id] = p; });
  function surfName(sid){ return sid===MID ? "Overview" : (byId[sid]||{}).name || sid; }
  function shortName(sid){
    var words = surfName(sid).split(" ");
    var n = words[0].replace(/[^\w-]/g,"");
    if (/^(Mission|The|A|An|Core)$/i.test(n) && words[1])
      n += " " + words[1].replace(/[^\w-]/g,"");
    return n || surfName(sid);
  }
  function surfColor(sid){ return sid===MID ? "#8b85ff" : (byId[sid]||{}).color || "#8391a8"; }
  function when(it){
    var t = it.happened_at || it.updated_at || it.created_at || "";
    var d = new Date(t);
    return isNaN(d) ? null : d;
  }
  function live(it){ return it.state !== "retired"; }
  function agoText(d){
    var s = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s/60) + "m ago";
    if (s < 86400) return Math.round(s/3600) + "h ago";
    return Math.round(s/86400) + "d ago";
  }

  // ── tiny DOM helpers (no innerHTML for item text — coordinator
  //    prose is data, not markup; exhibits are the one trusted hole) ──
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function paras(container, text, cls){
    String(text||"").split(/\n\s*\n/).forEach(function (p) {
      if (p.trim()) container.appendChild(el("p", cls||null, p.trim()));
    });
  }
  function pill(state){
    var s = el("span", "mc-pill " + (PILL[state]||"p-neut"), STATE_LABEL[state]||state);
    s.setAttribute("data-mc-noexcerpt", "");
    return s;
  }
  function dot(color){
    var d = el("span","dot"); d.style.background = color; return d;
  }

  // ── header ──────────────────────────────────────────────────────
  // The mission title lives in the platform bar; the page starts at its
  // navigation.
  var liveItems = ITEMS.filter(live);
  // PRIMARY NAVIGATION, under the title where a reader looks first. The
  // pillars tab is home (the overview, or the filtered pillar's page);
  // the rest are the cross-pillar views. Replaces the "6 pillars · 187
  // items" caption, which named the same things without being tappable.
  var TABS = [
    // The landing screen — the activity grid and one card per pillar —
    // IS the status screen, and its tab says so. It stays home: tapping
    // it clears any pillar filter and returns to the summary.
    {id: "overview",  label: "Status"},
    {id: "pillars",   label: "Pillars"},
    {id: "decisions", label: "Decisions"},
    {id: "questions", label: "Questions"},
    {id: "news",      label: "News"},
    {id: "feed",      label: "Feed"},
  ];
  var tabsHost = document.getElementById("mc-tabs");
  TABS.forEach(function (t) {
    var b = el("button", null, t.label);
    b.id = "tab-" + t.id;
    b.addEventListener("click", function () {
      show(t.id === "overview" ? MID : t.id);
    });
    tabsHost.appendChild(b);
  });
  var counts = {proven:0, activeish:0, blocked:0, asks:0};
  liveItems.forEach(function (it) {
    if (it.state==="proven"||it.state==="done"||it.state==="settled") counts.proven++;
    if (it.state==="active"||it.state==="code_only") counts.activeish++;
    if (it.state==="blocked") counts.blocked++;
    if (it.kind==="question" && it.state==="open" && it.ask) counts.asks++;
  });
  // The hero numbers are single-select filters: tap one to see exactly the
  // items it counts, across every pillar; tap it again to put the screen
  // back the way it was. Selecting a chip while another is on switches to
  // it — never two at once.
  var GLANCE = [
    {key:"asks",    cls:"ga", n:counts.asks,     label:"asks",
     match:function (it) { return it.kind==="question" && it.state==="open" && !!it.ask; },
     empty:"Nothing is waiting on you."},
    {key:"blocked", cls:"gc", n:counts.blocked,  label:"blocked",
     match:function (it) { return it.state==="blocked"; },
     empty:"Nothing is blocked."},
    {key:"flight",  cls:"gw", n:counts.activeish, label:"in flight",
     match:function (it) { return it.state==="active"||it.state==="code_only"; },
     empty:"Nothing in flight."},
    {key:"proven",  cls:"gd", n:counts.proven,   label:"done",
     match:function (it) { return it.state==="proven"||it.state==="done"||it.state==="settled"; },
     empty:"Nothing proven or done yet."},
  ];
  // Every item wears the one glance bucket it belongs to (states are
  // single-valued, so the buckets never overlap); the global filter and
  // the nav counts both read it.
  function glanceKeyOf(it){
    for (var i = 0; i < GLANCE.length; i++)
      if (GLANCE[i].match(it)) return GLANCE[i].key;
    return "";
  }
  var glance = document.getElementById("mc-glance");
  var glanceActive = null, glanceReturn = null;
  function chipTitle(g){ return {proven:"Proven / done", flight:"In flight",
    blocked:"Blocked", asks:"Asks for you"}[g.key]; }
  // EVERY NUMBER DESCRIBES WHAT IS ON SCREEN. When a pillar (or a
  // pillar-narrowed feed) is the view, the hero chips count that pillar's
  // items, not the mission's — a "94 proven" over a screen showing one
  // pillar is a number about somewhere else. Mission-wide views count
  // mission-wide.
  function viewScope(){
    var v = pillarFilter || "";
    if (!v) return null;
    return function (it) { return it.surface_id === v; };
  }
  function updateChips(){
    document.querySelectorAll(".mc-nav button").forEach(function (n) {
      n.classList.toggle("on", !!pillarFilter && n.id === "nav-"+pillarFilter);
    });
    var base = viewScope();
    GLANCE.forEach(function (g) {
      var n = liveItems.filter(function (it) {
        return g.match(it) && (!base || base(it));
      }).length;
      g.numEl.textContent = String(n);
      g.btn.classList.toggle("mc-dim", n === 0 && glanceActive !== g.key);
      g.btn.classList.toggle("on", glanceActive === g.key);
      g.btn.setAttribute("aria-pressed", glanceActive === g.key ? "true" : "false");
    });
    updateNavCounts();
  }
  // The active chip hides everything outside its bucket, in every view:
  // items, feed rows, then the furniture that would otherwise sit empty
  // (folds, sections). Day headers are the feed filter's problem — it
  // already walks them, so it just has to also respect .mc-gout.
  function applyGlance(){
    var key = glanceActive, pf = pillarFilter;
    document.querySelectorAll("#mc-views .mc-item, #mc-views .mc-feed-row")
      .forEach(function (n) {
        n.classList.toggle("mc-gout",
          (!!key && ("glance" in n.dataset) && n.dataset.glance !== key) ||
          (!!pf && !!n.dataset.surface && n.dataset.surface !== pf));
      });
    document.querySelectorAll("#mc-views details.mc-finished").forEach(function (d) {
      var vis = d.querySelectorAll(".mc-item:not(.mc-gout):not(.mc-hidden)").length;
      if (key) d.open = vis > 0;
      d.classList.toggle("mc-gout", !!key && !vis);
    });
    document.querySelectorAll("#mc-views section.mc-sec").forEach(function (sec) {
      if (!sec.querySelector(".mc-item")) return;
      var vis = sec.querySelectorAll(".mc-item:not(.mc-gout):not(.mc-hidden)").length;
      sec.classList.toggle("mc-gout", !!key && !vis);
    });
    applyFeedFilter();
    rescueEmpties();
  }
  function rescueEmpties(){
    document.querySelectorAll("#mc-views .mc-view").forEach(function (v) {
      var old = v.querySelector(".mc-noresult");
      if (old) old.remove();
      if (!glanceActive && !pillarFilter) return;
      var scopeEl = v;
      if (v.id === "view-pillars"){
        var act = null;
        v.querySelectorAll("section.mc-sec").forEach(function (sec) {
          if (sec.style.display !== "none" && !act) act = sec;
        });
        if (act) scopeEl = act;
      }
      var cards = scopeEl.querySelectorAll(".mc-item");
      if (!cards.length) return;
      if (scopeEl.querySelectorAll(".mc-item:not(.mc-gout):not(.mc-hidden)").length) return;
      var n = el("div","mc-empty mc-noresult");
      n.appendChild(document.createTextNode(
        "Nothing here matches the active filters. "));
      var b = el("button","mc-news-reply","Show everything");
      b.addEventListener("click", function () {
        glanceActive = null; glanceReturn = null; pillarFilter = null;
        var fv = document.getElementById("view-feed");
        if (fv) fv.dataset.filter = "";
        applyGlance();
        updateChips();
      });
      n.appendChild(b);
      (v.id === "view-pillars" ? v : scopeEl).insertBefore(
        n, v.id === "view-pillars" ? v.firstChild : scopeEl.firstChild);
      if (v.id === "view-pillars" && scopeEl.classList) scopeEl.classList.remove("mc-gout");
    });
  }
  function toggleGlance(key){
    if (glanceActive === key){
      glanceActive = null;
      applyGlance();
      var back = glanceReturn; glanceReturn = null;
      if (currentView === "glance-" + key) show(back || MID);
      else updateChips();
      return;
    }
    if (glanceActive === null) glanceReturn = currentView;
    glanceActive = key;
    applyGlance();
    // FILTERS STACK. From the overview a chip opens the cross-pillar
    // list it counts; from anywhere else it narrows the view you are
    // already in — pick a pillar, then "proven", and you see that
    // pillar's proven items, with every nav count recomputed to match.
    if (currentView === MID || String(currentView).indexOf("glance-") === 0)
      show("glance-" + key);
    else updateChips();
  }
  var glanceCluster = el("div","mc-gset");
  GLANCE.forEach(function (g) {
    var c = el("button","g "+g.cls);
    g.numEl = el("b",null,String(g.n));
    c.appendChild(g.numEl);
    c.appendChild(el("span",null,g.label));
    c.setAttribute("aria-pressed","false");
    c.addEventListener("click",function(){ toggleGlance(g.key); });
    g.btn = c;
    (g.key === "asks" ? glance : glanceCluster).appendChild(c);
  });
  glance.appendChild(glanceCluster);

  // ── activity grid: surfaces × days from item timestamps ─────────
  (function activity(){
    // WHAT'S BEEN HAPPENING LATELY, not a calendar. The last ~100 item
    // events (real happened_at/updated_at stamps) sliced into eight
    // recency columns ending at now — a dense mission's grid spans hours,
    // a sparse one's spans weeks, and either way the right edge is
    // "lately", which is the only thing a reader wants from it. Day
    // labels meant nothing at that variable scale and are gone; the
    // narrow graphic gives the pillar names their room back.
    var COLS = 8, LAST = 100;
    // LIVE items decide the row: a mission surface holding only retired
    // history is content-free, and its grid row retires with it.
    var hasMissionItems = liveItems.some(function (it) { return it.surface_id===MID; });
    var surfaces = (hasMissionItems ? [{id:MID}] : [])
      .concat(PILLARS.map(function(p){return {id:p.pillar_id};}));
    var events = [];
    ITEMS.forEach(function (it) {
      var d = when(it); if (!d) return;
      events.push({t: d.getTime(), sid: it.surface_id});
    });
    events.sort(function (a,b){ return a.t - b.t; });
    if (events.length > LAST) events = events.slice(events.length - LAST);
    var buckets = {};   // sid -> [count per recency column, oldest first]
    surfaces.forEach(function (s) { buckets[s.id] = new Array(COLS).fill(0); });
    if (events.length){
      var t0 = events[0].t, span = Math.max(1, Date.now() - t0);
      events.forEach(function (e) {
        var idx = Math.min(COLS - 1, Math.floor((e.t - t0) / span * COLS));
        if (buckets[e.sid]) buckets[e.sid][idx]++;
      });
    }
    var max = 1;
    surfaces.forEach(function (s) { buckets[s.id].forEach(function (n) { if (n>max) max=n; }); });
    var lvl = function (n) {
      if (!n) return "";
      var r = n / max;
      return r > .75 ? "a4" : r > .5 ? "a3" : r > .25 ? "a2" : "a1";
    };
    var table = document.getElementById("mc-act");
    surfaces.forEach(function (s) {
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      th.appendChild(dot(surfColor(s.id)));
      th.appendChild(document.createTextNode(surfName(s.id)));
      th.title = "Show " + surfName(s.id) + "'s updates over time";
      th.addEventListener("click", function () { showFeedFor(s.id); });
      tr.appendChild(th);
      buckets[s.id].forEach(function (n) {
        var td = document.createElement("td");
        var cell = el("div","mc-act-cell " + lvl(n));
        cell.title = surfName(s.id) + ": " + n + " item change" + (n===1?"":"s");
        td.appendChild(cell); tr.appendChild(td);
      });
      table.appendChild(tr);
    });
  })();

  // ── item card renderer ──────────────────────────────────────────
  function card(it, opts){
    opts = opts || {};
    var c = el("article","mc-item st-"+it.state+" k-"+it.kind
                 + (opts.mirror ? " mc-mirror" : ""));
    if (opts.mirror){
      // A mirror is a pointer, not the record: tapping it lands on the
      // REAL item in its home view — where the chrome's anchor control
      // (and for open asks, the Answer flow) is mounted.
      c.title = "Open in " + surfName(it.surface_id);
      c.addEventListener("click", function (ev) {
        if (ev.target.closest("a,button,summary")) return;
        if (pillarFilter && pillarFilter !== it.surface_id) {
          pillarFilter = it.surface_id;
          var fv = document.getElementById("view-feed");
          if (fv) fv.dataset.filter = pillarFilter;
          applyGlance();
        }
        show("pillars");
        var target = document.querySelector(
          '.mc-view [data-mc-anchor="' + it.key + '"]');
        if (target){
          var pv = document.getElementById("view-pillars");
          var secEl = target.closest("section.mc-sec");
          if (pv && pv._showSection && secEl && secEl.dataset.sec)
            pv._showSection(secEl.dataset.sec);
          var fold = target.closest("details.mc-finished");
          if (fold) fold.open = true;
          target.scrollIntoView({behavior:"smooth", block:"center"});
          target.classList.remove("mc-flash");
          void target.offsetWidth;   // restart the animation
          target.classList.add("mc-flash");
          // An OPEN ASK's tap should finish the job: the platform chrome
          // mounts its Answer control inside the real item — press it, so
          // one tap on the mirror lands in the answer flow instead of at
          // a card with a small chip still to find.
          if (it.kind === "question" && it.state === "open" && it.ask){
            setTimeout(function () {
              var ctl = target.querySelector("[data-mc-control] button")
                     || target.querySelector("[data-mc-control]");
              if (ctl && ctl.click) ctl.click();
            }, 350);
          }
        }
      });
    }
    if (!opts.mirror){
      c.setAttribute("data-mc-anchor", it.key);
      if (it.kind==="question" && it.state==="open" && it.ask){
        c.setAttribute("data-mc-ask", it.ask);
        // The chrome mounts its Answer control inside this card as a small
        // chip. The card itself is the honest tap target — forward a tap
        // anywhere on it to that control.
        c.addEventListener("click", function (ev) {
          if (ev.target.closest("a,summary")) return;
          var ctl = c.querySelector("[data-mc-control] button")
                 || c.querySelector("[data-mc-control]");
          if (ctl && ctl.click && !ev.target.closest("[data-mc-control]"))
            ctl.click();
        });
      }
    }
    c.dataset.state = it.state; c.dataset.kind = it.kind;
    c.dataset.glance = glanceKeyOf(it);
    c.dataset.surface = it.surface_id;
    c.dataset.search = (it.title+" "+it.body+" "+(it.evidence||[]).join(" ")).toLowerCase();

    var inner = c;
    if (opts.stepno != null){
      var wrap = el("div");
      c.appendChild(el("div","stepno", String(opts.stepno)));
      c.appendChild(wrap); inner = wrap;
    }
    var top = el("div","top");
    top.setAttribute("data-mc-noexcerpt", "");
    var where = el("span","where");
    if (opts.showSurface){
      where.appendChild(dot(surfColor(it.surface_id)));
      where.appendChild(document.createTextNode(shortName(it.surface_id)));
    }
    if (it.owner) where.appendChild(document.createTextNode(
      (opts.showSurface ? " · " : "") + "owner: " + it.owner));
    top.appendChild(where);
    top.appendChild(pill(it.state));
    inner.appendChild(top);
    inner.appendChild(el("h3",null,it.title));

    if (it.kind==="decision" && (it.fork || it.chosen || it.if_wrong)){
      var dv = el("div","mc-dec");
      if (it.fork){ dv.appendChild(el("b",null,"Fork")); paras(dv,it.fork); }
      if (it.chosen){ dv.appendChild(el("b",null,"Chosen")); paras(dv,it.chosen); }
      if (it.if_wrong){ dv.appendChild(el("b",null,"If wrong")); paras(dv,it.if_wrong,"ifw"); }
      inner.appendChild(dv);
      if (it.body){ var b0 = el("div","body"); paras(b0,it.body); inner.appendChild(b0); }
    } else if (it.body){
      var b = el("div","body"); paras(b,it.body); inner.appendChild(b);
    }
    if (it.kind==="exhibit" && it.html){
      var ex = el("div","body"); ex.innerHTML = it.html;   // trusted, same as freeform
      inner.appendChild(ex);
    }
    if ((it.evidence||[]).length){
      var det = document.createElement("details");
      det.appendChild(el("summary",null,"Evidence ("+it.evidence.length+")"));
      var ev = el("div","ev");
      it.evidence.forEach(function (e) { ev.appendChild(el("p",null,e)); });
      det.appendChild(ev); inner.appendChild(det);
    }
    if ((it.refs||[]).length){
      var refs = el("div","mc-refs");
      refs.setAttribute("data-mc-noexcerpt", "");
      it.refs.forEach(function (r) { refs.appendChild(el("span",null,r)); });
      inner.appendChild(refs);
    }
    var d = when(it);
    var whenEl = null;
    if (d) {
      inner.appendChild(whenEl = el("div","mc-when",
        (it.happened_at ? "" : "updated ") + agoText(d)));
      whenEl.title = d.toLocaleString();
      whenEl.setAttribute("data-mc-noexcerpt", "");
    }
    return c;
  }

  // ── per-surface view builder ────────────────────────────────────
  function surfaceView(sid){
    var v = el("div","mc-view"); v.id = "view-"+(sid || "pillars");
    var mine = (sid ? liveItems.filter(function (it) { return it.surface_id===sid; })
                    : liveItems.slice())
      .sort(function (a,b){ return (a.order||0)-(b.order||0) ||
        String(a.title).localeCompare(String(b.title)); });
    if (!mine.length){
      var em = el("div","mc-empty");
      em.appendChild(document.createTextNode("No items yet. Add the first: "));
      var code = el("code",null,'graph mission add '+
        (sid ? surfName(sid).toLowerCase() : "<pillar>")+
        ' <item-id> --kind work --title "…"');
      em.appendChild(code); v.appendChild(em);
      return v;
    }
    var showSurf = !sid;
    var sections = {};
    mine.forEach(function (it) {
      var canon = (it.section && SECTION_ORDER.indexOf(it.section) >= 0)
        ? it.section : (SECTION_OF[it.kind] || "The work");
      (sections[canon] = sections[canon] || []).push(it);
    });
    var names = SECTION_ORDER.filter(function (s) { return sections[s]; });
    var host = el("div"); v.appendChild(host);
    var secEls = {};
    var subs = el("div","mc-subtabs");
    function showSection(name){
      names.forEach(function (n) {
        if (secEls[n]) secEls[n].style.display = (n === name) ? "" : "none";
      });
      [].forEach.call(subs.children, function (b) {
        b.classList.toggle("on", b.dataset.sec === name);
      });
      if (typeof rescueEmpties === "function") rescueEmpties();
    }
    v._showSection = showSection;
    names.forEach(function (name) {
      var b = el("button", null, name);
      b.dataset.sec = name;
      b.appendChild(el("span","n"," " + sections[name].length));
      b.addEventListener("click", function () { showSection(name); });
      subs.appendChild(b);
    });
    names.forEach(function (name) {
      var sec = el("section","mc-sec");
      sec.dataset.sec = name;
      secEls[name] = sec;
      var list = sections[name].slice().sort(function (a, b) {
        var ga = (a.section && a.section !== name) ? a.section : "";
        var gb = (b.section && b.section !== name) ? b.section : "";
        return ga.localeCompare(gb) || (a.order||0)-(b.order||0) ||
          String(a.title).localeCompare(String(b.title));
      });
      var metrics = list.filter(function (it) { return it.kind==="metric"; });
      if (metrics.length){
        var mrow = el("div","mc-metrics");
        metrics.forEach(function (m) {
          var t = el("div","mc-metric");
          t.setAttribute("data-mc-anchor", m.key);
          t.appendChild(el("b",null,m.value||"—"));
          t.appendChild(el("span",null,m.title));
          mrow.appendChild(t);
        });
        sec.appendChild(mrow);
      }
      var steps = list.filter(function (it) { return it.kind==="checkpoint"; });
      var rest = list.filter(function (it) { return it.kind!=="metric" && it.kind!=="checkpoint"; });
      if (steps.length){
        var arc = el("div","mc-arc");
        steps.forEach(function (s,i){ arc.appendChild(card(s,{stepno:i+1})); });
        sec.appendChild(arc);
      }
      // FINISHED WORK FOLDS AWAY. The record stays (count on the fold, cards
      // one tap away, anchors still in the DOM for the chrome), but a reader
      // scrolling a pillar sees what is ALIVE. Checkpoints stay unfolded —
      // an arc's completed gates are its narrative, not clutter — and
      // decisions/scope/status are their own sections with their own logic.
      var FOLDS = {work:1, incident:1, question:1};
      var TERMINAL = {proven:1, done:1, settled:1, deferred:1};
      var live_ = rest.filter(function (it) { return !(FOLDS[it.kind] && TERMINAL[it.state]); });
      var finished = rest.filter(function (it) { return FOLDS[it.kind] && TERMINAL[it.state]; });
      var lastGroup = null;
      live_.forEach(function (it) {
        var g = (it.section && it.section !== name) ? it.section : "";
        if (g !== lastGroup){
          if (g) sec.appendChild(el("h3","mc-group",g));
          lastGroup = g;
        }
        sec.appendChild(card(it, {showSurface: showSurf}));
      });
      if (finished.length){
        var fold = document.createElement("details");
        fold.className = "mc-finished";
        fold.appendChild(el("summary",null,
          finished.length + " finished item" + (finished.length>1?"s":"") +
          " — proven, done, settled, deferred"));
        finished.forEach(function (it) { fold.appendChild(card(it, {showSurface: showSurf})); });
        sec.appendChild(fold);
      }
      host.appendChild(sec);
    });
    if (names.length > 1) v.insertBefore(subs, v.firstChild);
    showSection(names[0]);
    return v;
  }

  // ── overview view (mission surface + pillar summaries) ──────────
  function overviewView(){
    var v = el("div","mc-view"); v.id = "view-"+MID;
    var sec = el("section","mc-sec");
    sec.appendChild(el("h2",null,"Pillars"));
    PILLARS.forEach(function (p) {
      var pc = el("div","mc-psum");
      pc.addEventListener("click",function(){
        pillarFilter = p.pillar_id;
        var fv = document.getElementById("view-feed");
        if (fv) fv.dataset.filter = p.pillar_id;
        applyGlance();
        show("pillars");
      });
      var hd = el("div","hd");
      hd.appendChild(dot(p.color || "#8391a8"));
      hd.appendChild(el("b",null,p.name));
      var mine = liveItems.filter(function (it) { return it.surface_id===p.pillar_id; });
      var n = {};
      mine.forEach(function (it) { n[it.state]=(n[it.state]||0)+1; });
      var blocked = n.blocked || 0;
      var flight = (n.active || 0) + (n.code_only || 0);
      var done = (n.proven || 0) + (n.done || 0) + (n.settled || 0);
      var asks = mine.filter(function (it) {
        return it.kind==="question" && it.state==="open" && it.ask; }).length;
      var mini = el("span","mc-mini");
      mini.title = blocked + " blocked \u00b7 " + flight + " in flight \u00b7 "
        + done + " done" + (asks ? " \u00b7 " + asks + " asks for you" : "");
      if (asks) mini.appendChild(el("i","m-a",String(asks)));
      [[blocked,"m-c"],[flight,"m-w"],[done,"m-g"]].forEach(function (seg) {
        var cell = el("i",seg[1],String(seg[0]));
        if (!seg[0]) cell.className += " m-z";
        mini.appendChild(cell);
      });
      hd.appendChild(mini); pc.appendChild(hd);
      var status = mine.filter(function (it) { return it.kind==="status"; })[0];
      if (status) pc.appendChild(el("div","last",
        String(status.body||status.title).split(/\n\s*\n/)[0]));
      else if (p.last_done) pc.appendChild(el("div","last",p.last_done));
      pc.appendChild(el("div","stat", mine.length + " items"));
      sec.appendChild(pc);
    });
    v.appendChild(sec);
    return v;
  }

  // ── cross-pillar views ──────────────────────────────────────────
  function collectionView(id, title, filter, empty){
    var v = el("div","mc-view"); v.id = "view-"+id;
    var all = liveItems.filter(filter).sort(function (a,b){
      var da = when(a), db_ = when(b);
      return (db_?db_.getTime():0) - (da?da.getTime():0);
    });
    if (!all.length){ v.appendChild(el("div","mc-empty",empty)); return v; }
    var host = el("section","mc-sec");
    host.appendChild(el("h2",null,title+" — every pillar"));
    all.forEach(function (it) {
      host.appendChild(card(it,{showSurface:true, mirror:true})); });
    v.appendChild(host);
    return v;
  }

  function feedView(){
    var v = el("div","mc-view"); v.id = "view-feed";
    var dated = liveItems.map(function (it) { return {it:it, d:when(it)}; })
      .filter(function (x) { return x.d; })
      .sort(function (a,b){ return b.d - a.d; });
    if (!dated.length){ v.appendChild(el("div","mc-empty",
      "No dated items yet — the feed builds itself from item timestamps.")); return v; }
    var lastDay = "";
    dated.forEach(function (x) {
      var day = x.d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      if (day !== lastDay){ v.appendChild(el("div","mc-feed-day",day)); lastDay = day; }
      var row = el("div","mc-feed-row");
      row.dataset.surface = x.it.surface_id;
      row.dataset.glance = glanceKeyOf(x.it);
      row.appendChild(dot(surfColor(x.it.surface_id)));
      row.appendChild(el("span","k",shortName(x.it.surface_id)));
      row.appendChild(el("span","t",x.it.title));
      row.appendChild(pill(x.it.state));
      row.style.cursor = "pointer";
      row.addEventListener("click",function(){
        show(x.it.surface_id===MID ? MID : x.it.surface_id);
        var target = document.querySelector('[data-mc-anchor="'+x.it.key+'"]');
        if (target) target.scrollIntoView({behavior:"smooth",block:"center"});
      });
      v.appendChild(row);
    });
    return v;
  }

  // A pillar's own timeline: the feed, narrowed to one surface. Reached
  // by tapping the pillar's row in the activity grid; one chip clears it.
  function applyFeedFilter(){
    var v = document.getElementById("view-feed");
    if (!v) return;
    var sid = v.dataset.filter || "";
    var old = v.querySelector(".mc-feed-note");
    if (old) old.remove();
    v.querySelectorAll(".mc-feed-row").forEach(function (r) {
      r.classList.toggle("mc-hidden", !!sid && r.dataset.surface !== sid);
    });
    function rowShown(r){
      return !r.classList.contains("mc-hidden")
          && !r.classList.contains("mc-gout");
    }
    var kids = [].slice.call(v.children);
    for (var i = 0; i < kids.length; i++){
      if (!kids[i].classList.contains("mc-feed-day")) continue;
      var any = false;
      for (var j = i + 1; j < kids.length
           && !kids[j].classList.contains("mc-feed-day"); j++){
        if (kids[j].classList.contains("mc-feed-row") && rowShown(kids[j]))
          any = true;
      }
      kids[i].classList.toggle("mc-hidden", !any);
    }
    if (sid){
      var chip = el("button","mc-feed-note",
        "Showing " + surfName(sid) + " only — show all");
      chip.addEventListener("click", function () {
        v.dataset.filter = ""; applyFeedFilter(); updateChips();
      });
      v.insertBefore(chip, v.firstChild);
    }
  }
  function showFeedFor(sid){
    pillarFilter = sid || null;
    var v = document.getElementById("view-feed");
    if (v){ v.dataset.filter = sid || ""; }
    applyGlance();
    show("feed");
    applyFeedFilter();
    updateChips();
  }

  // ── assemble views + nav ────────────────────────────────────────
  var views = document.getElementById("mc-views");
  views.appendChild(overviewView());
  views.appendChild(surfaceView(null));
  GLANCE.forEach(function (g) {
    views.appendChild(collectionView("glance-"+g.key, chipTitle(g), g.match, g.empty));
  });
  views.appendChild(collectionView("decisions","Decisions",
    function (it) { return it.kind==="decision"; },
    "No decisions recorded yet."));
  var qView = collectionView("questions","Open questions",
    function (it) { return it.kind==="question" && it.state==="open"; },
    "Nothing is waiting on an answer.");
  qView.appendChild(qaSection());
  views.appendChild(qView);

  // ── Q&A conversations, inline under the Questions tab. This was the
  // one thing only the bar's chat bubble showed; the bubble is gone, so
  // the record lives here — filterable, tappable through to the chrome's
  // entry view, with Ask summoning the chrome's composer. ──
  function qaSection(){
    var entries = [];
    try {
      entries = JSON.parse(
        document.getElementById("mc-state").textContent).questions || [];
    } catch (e) {}
    var sec = el("section","mc-sec");
    var hd = el("h2",null,"Q&A");
    sec.appendChild(hd);
    var openQ = function (q) { return !q.closed_at && !q.answer; };
    var mode = "all";
    var seg = el("div","mc-seg mc-qa-seg");
    var host = el("div");
    function draw(){
      var counts = {all: entries.length,
                    open: entries.filter(openQ).length};
      counts.done = counts.all - counts.open;
      seg.innerHTML = "";
      [["all","All"],["open","Open"],["done","Answered"]].forEach(function (m) {
        var b = el("button", mode === m[0] ? "mc-seg-on" : "",
                   m[1] + " " + counts[m[0]]);
        b.addEventListener("click", function () { mode = m[0]; draw(); });
        seg.appendChild(b);
      });
      host.innerHTML = "";
      var shown = entries.filter(function (q) {
        if (mode === "open") return openQ(q);
        if (mode === "done") return !openQ(q);
        return true;
      }).sort(function (a, b) {
        return (parseFloat(b.created_at)||0) - (parseFloat(a.created_at)||0);
      });
      if (!shown.length){
        var em = el("div","mc-empty");
        em.textContent = "No conversations here yet.";
        host.appendChild(em);
      }
      shown.forEach(function (q) {
        var c = el("article","mc-item mc-qa");
        c.dataset.surface = q.pillar_id || MID;
        var top = el("div","top");
        var wh = el("span","where");
        wh.appendChild(dot(q.pillar_id ? surfColor(q.pillar_id) : "#8391a8"));
        wh.appendChild(document.createTextNode(
          (q.pillar_id ? surfName(q.pillar_id) : "Mission")
          + (q.asked_by_label ? " \u00b7 " + q.asked_by_label : "")));
        top.appendChild(wh);
        top.appendChild(el("span","mc-when",
          agoText(new Date((parseFloat(q.created_at)||0)*1000))));
        c.appendChild(top);
        var b = el("div","body"); paras(b, q.question || ""); c.appendChild(b);
        if (q.answer){
          var pk = el("div","mc-qa-peek");
          pk.textContent = String(q.answer).split(/\n/)[0].slice(0, 140);
          c.appendChild(pk);
        }
        c.appendChild(el("div","mc-qa-state",
          openQ(q) ? "open" : (q.answer ? "answered" : "closed")));
        c.addEventListener("click", function () {
          document.dispatchEvent(new CustomEvent("mc:open-entry",
            {detail: {entry_id: q.entry_id}}));
        });
        host.appendChild(c);
      });
      var askRow = el("div","mc-qa-ask");
      var ask = el("button","mc-news-reply","Ask a question");
      ask.addEventListener("click", function (ev) {
        ev.stopPropagation();
        document.dispatchEvent(new CustomEvent("mc:open-ask"));
      });
      askRow.appendChild(ask);
      host.appendChild(askRow);
    }
    draw();
    sec.appendChild(seg);
    sec.appendChild(host);
    return sec;
  }
  views.appendChild(feedView());
  views.appendChild(newsView());

  function newsView(){
    var v = el("div","mc-view"); v.id = "view-news";
    var posts = [];
    try {
      posts = JSON.parse(
        document.getElementById("mc-state").textContent).status_posts || [];
    } catch (e) {}
    if (!posts.length){
      var em = el("div","mc-empty");
      em.textContent = "No pillar has reported anything yet.";
      v.appendChild(em);
      return v;
    }
    var mode = "time";
    var seg = el("div","mc-seg mc-news-seg");
    [["time","By time"],["pillar","By pillar"]].forEach(function (m) {
      var b = el("button", mode === m[0] ? "mc-seg-on" : "", m[1]);
      b.addEventListener("click", function () {
        mode = m[0];
        [].forEach.call(seg.children, function (c, i) {
          c.className = (["time","pillar"][i] === mode) ? "mc-seg-on" : "";
        });
        draw();
      });
      seg.appendChild(b);
    });
    var host = el("div");
    function postCard(p, inGroup){
      var c = el("article","mc-item mc-news");
      c.dataset.surface = p.pillar_id;
      var top = el("div","top");
      var wh = el("span","where");
      if (!inGroup){
        wh.appendChild(dot(p.color || "#8391a8"));
        wh.appendChild(document.createTextNode(p.pillar_name || ""));
      }
      top.appendChild(wh);
      top.appendChild(el("span","mc-when", p.ago || ""));
      c.appendChild(top);
      var b = el("div","body"); paras(b, p.text || ""); c.appendChild(b);
      var foot = el("div","mc-news-foot");
      var r = el("button","mc-news-reply","Reply");
      r.addEventListener("click", function () {
        document.dispatchEvent(new CustomEvent("mc:open-post",
          {detail: {post_id: p.post_id}}));
      });
      foot.appendChild(r); c.appendChild(foot);
      return c;
    }
    function draw(){
      host.innerHTML = "";
      if (mode === "time"){
        posts.forEach(function (p) { host.appendChild(postCard(p, false)); });
      } else {
        var order = [], groups = {};
        posts.forEach(function (p) {
          if (!groups[p.pillar_id]){ groups[p.pillar_id] = []; order.push(p.pillar_id); }
          groups[p.pillar_id].push(p);
        });
        order.forEach(function (pid) {
          var sec = el("section","mc-sec");
          var h = el("h2",null,"");
          h.appendChild(dot(surfColor(pid)));
          h.appendChild(document.createTextNode(" " + surfName(pid)));
          sec.appendChild(h);
          groups[pid].forEach(function (p) { sec.appendChild(postCard(p, true)); });
          host.appendChild(sec);
        });
      }
      applyGlance();
    }
    v.appendChild(seg); v.appendChild(host);
    draw();
    return v;
  }

  var nav = document.getElementById("mc-nav");
  var NAVS = [];
  function navBtn(id,label,color,base,warnWhen){
    var b = el("button",null,"");
    if (color) b.appendChild(dot(color));
    b.appendChild(document.createTextNode(label));
    if (base){
      var n = el("span","n","");
      b.appendChild(n);
      NAVS.push({base:base, el:n, btn:b, warn:warnWhen});
    }
    b.id = "nav-"+id;
    b.addEventListener("click",function(){ togglePillar(id); });
    nav.appendChild(b);
  }
  // A count is a claim about what tapping the chip will show, so it obeys
  // the active glance filter: "done" on plus a pillar chip reading 3 means
  // three done items live there. A chip at 0 dims instead of vanishing —
  // the destination still exists, it is just empty under this filter.
  function updateNavCounts(){
    NAVS.forEach(function (nv) {
      var n = liveItems.filter(function (it) {
        return nv.base(it) &&
          (!glanceActive || glanceKeyOf(it) === glanceActive);
      }).length;
      nv.el.textContent = n ? String(n) : (glanceActive ? "0" : "");
      nv.btn.classList.toggle("warns", !!nv.warn && n > 0 && !glanceActive);
      nv.btn.classList.toggle("mc-dim", !!glanceActive && n === 0);
    });
  }
  PILLARS.forEach(function (p) {
    navBtn(p.pillar_id, shortName(p.pillar_id), p.color || "#8391a8",
      function (it) { return it.surface_id===p.pillar_id; });
  });
  updateNavCounts();

  var pillarFilter = null;
  function togglePillar(pid){
    pillarFilter = (pillarFilter === pid) ? null : pid;
    var fv = document.getElementById("view-feed");
    if (fv) fv.dataset.filter = pillarFilter || "";
    applyGlance();
    if (currentView === "feed") applyFeedFilter();
    updateChips();
  }

  var currentView = null;
  function show(id){
    currentView = id;
    updateChips();
    document.querySelectorAll(".mc-view").forEach(function (n) {
      n.classList.toggle("on", n.id === "view-"+id);
    });
    var named = {pillars:"Pillars", decisions:"Decisions",
                 questions:"Questions", feed:"Feed", news:"News"};
    var fam = named[id] ? id : "overview";
    document.querySelectorAll(".mc-tabs button").forEach(function (b) {
      b.classList.toggle("on", b.id === "tab-" + fam);
    });
    var strip = document.getElementById("mc-nav");
    if (strip) strip.style.display = (fam === "overview") ? "none" : "";
  }
  // The activity panel is mission-wide chrome, but it belongs to the
  // overview: pillar views get their vertical room back.
  var ov = document.getElementById("view-"+MID);
  ov.insertBefore(document.querySelector(".mc-activity"), ov.firstChild);

  // LANDING IS THE OVERVIEW, from every door: the mission URL, a pillar
  // URL out of the session viewer, a PWA restoring its last route. The
  // baked focus stays in the data for anything that wants it, but the
  // reader always starts at the summary and taps into a pillar from
  // there — arriving somewhere unnameable was worse than one extra tap.
  show(MID);

  var gen = new Date((DATA.generated_at||0)*1000);
  document.getElementById("mc-genat").textContent =
    isNaN(gen) ? "" : "generated " + gen.toLocaleString();

  // ── load diagnostics — visible, so a slow open can be read off the
  //    screen instead of guessed at. All times are ms since navigation
  //    start (the moment the link was tapped, srcdoc paths excepted). ──
  (function diag(){
    // Mission accomplished (5.3 s -> tens of ms) and retired from the
    // screen. The instrumentation stays: add ?diag=1 to any mission URL
    // to bring the strip back, and the console.log below always fires.
    var DIAG_ON = /[?&]diag=1/.test(location.search);
    var T_DONE = performance.now();
    var kb = function (n) { return (n/1024).toFixed(0) + " KB"; };
    var ms = function (n) { return n >= 2500 ? (n/1000).toFixed(1) + " s"
                                             : Math.round(n) + " ms"; };
    var itemsKB = document.getElementById("mc-data").textContent.length;
    var nav = (performance.getEntriesByType &&
               performance.getEntriesByType("navigation")[0]) || null;
    var parts = [];
    if (nav && nav.decodedBodySize)
      parts.push("doc " + kb(nav.decodedBodySize) +
                 (nav.transferSize ? " (wire " + kb(nav.transferSize) + ")" : ""));
    if (nav && nav.responseEnd)
      parts.push("net " + ms(nav.responseEnd - nav.startTime));
    parts.push("chrome+parse " + ms(T_SCRIPT));
    parts.push("items " + kb(itemsKB) + "/" + (DATA.items||[]).length);
    parts.push("render " + ms(T_DONE - T_SCRIPT));
    parts.push("interactive " + ms(T_DONE));
    // Which serving path built this document. A srcdoc frame is the relay
    // share-link viewer: its bootloader fetched the document over the
    // tunnel BEFORE this page's clock started, so seconds of white screen
    // with fast numbers here means the time went to that transport layer.
    var framed = !!document.querySelector('base[href="about:srcdoc"]') ||
                 location.protocol === "about:";
    parts.push(framed ? "via relay srcdoc (transport not visible here)"
                      : "direct");
    var line = el("div", null, "⏱ " + parts.join(" · "));
    line.id = "mc-diag";
    line.style.cssText = "font-family:var(--mono);font-size:.68rem;" +
      "color:var(--ink3);background:var(--bg2);border:1px solid var(--line);" +
      "border-radius:7px;padding:5px 9px;margin:0 0 12px;overflow-x:auto;" +
      "white-space:nowrap";
    if (DIAG_ON) {
      var glance = document.getElementById("mc-glance");
      glance.parentNode.insertBefore(line, glance.nextSibling);
    }
    // Late chrome/network work shows up as the page staying busy after we
    // finish; stamp the load event too so the gap is attributable.
    window.addEventListener("load", function () {
      line.textContent += " · window.load " + ms(performance.now());
    });
    if (window.console && console.log)
      console.log("mc-structured diag", {script_at: T_SCRIPT,
        json_parse: T_PARSED - T_SCRIPT, render: T_DONE - T_PARSED,
        items_bytes: itemsKB, nav: nav});
  })();
})();
</script>
