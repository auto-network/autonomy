id: mission
api_version: 1
org: personal

# Enabled by default: fresh installs show Mission Control (operator hand-out,
# 2026-09-27). The cutover is done: the legacy mission_control plugin is
# default-disabled and carries no CLI, so `graph mission` has exactly one owner
# (this plugin's entrypoints.cli). An org's explicit enable row still wins.
default_enabled: true

paths:
  - /mission

assets:
  template: page.html
  script: page.js

nav:
  label: Mission Control

frontend:
  alpine_root: missionPage
  voice:
    live_transcript: true
    replace_caption: true
    replace_controls: true

# Agent-facing doctrine + verbs. Embedded into every session's workspace
# primer while this plugin is enabled; served at GET /api/plugins/mission/skill.
skill: SKILL.md

entrypoints:
  api: tools.dashboard.plugins.mission.entrypoints.api:routes
  session_contributions: tools.dashboard.plugins.mission.entrypoints.api:session_contributions
  cli: tools.dashboard.plugins.mission.entrypoints.cli:register
  schemas:
    - tools.dashboard.plugins.mission.entrypoints.schemas:MissionV1
    - tools.dashboard.plugins.mission.entrypoints.schemas:MissionPillarV1
    - tools.dashboard.plugins.mission.entrypoints.schemas:MissionContentV1
    - tools.dashboard.plugins.mission.entrypoints.schemas:MissionChatV1
