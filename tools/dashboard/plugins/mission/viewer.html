<!-- Structured mission viewer — the platform's standard template.
     Served by structured.render_screen() with __MC_STRUCTURED_DATA__
     replaced by the mission's baked item JSON. Everything renders
     client-side, once, into the DOM; view switching is CSS-only so the
     platform chrome's anchor/ask discovery sees every item at load. -->
<style>
  :root{
    --bg:#0c0f14; --bg2:#11151d; --card:#151a23; --card2:#1a2029;
    --line:#262d3a; --line2:#303948;
    --ink:#e6e9f0; --ink2:#aab3c4; --ink3:#7c8698;
    --accent:#8b85ff; --accent-dim:#46448c; --ind:#7d78ea;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --serious:#ec835a;
    --neut:#8391a8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html{background:#0c0f14}
  body{background:#0c0f14;margin:0}
  #mc-app,#mc-app *{box-sizing:border-box}
  #mc-app{
    max-width:1060px;margin:0 auto;padding:14px 14px 80px;
    color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #mc-app a{color:var(--accent)}
  .mc-tabs{display:flex;gap:18px;margin:4px 0 14px;border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mc-tabs::-webkit-scrollbar{display:none}
  .mc-tabs button{background:none;border:0;cursor:pointer;font:inherit;
    padding:9px 2px;font-size:.85rem;color:var(--ink3);flex:none;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .mc-tabs button.on{color:#fff;border-color:var(--accent)}
  #mc-app .mc-sub{color:var(--ink3);font-size:.82rem;margin:0 0 14px}

  /* glance chips */
  .mc-glance{display:flex;gap:6px;flex-wrap:nowrap;align-items:stretch;
    margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
  .mc-glance::-webkit-scrollbar{display:none}
  .mc-glance .g{
    flex:none;display:flex;align-items:baseline;gap:4px;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:6px 7px;
    cursor:pointer;font:inherit;color:inherit;white-space:nowrap;
  }
  .mc-gset{flex:none;display:inline-flex;background:var(--card);
    border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .mc-gset .g{border:0;border-radius:0;border-left:1px solid var(--line)}
  .mc-gset .g:first-child{border-left:0}
  .mc-gset .g.on{box-shadow:inset 0 0 0 1px var(--accent-dim)}
  .mc-glance .g:hover{border-color:var(--line2)}
  .mc-glance .g.on{border-color:var(--accent-dim);background:#232345}
  .mc-glance .g.on span{color:var(--ink2)}
  .mc-glance .g b{font-size:.95rem;color:#fff}
  .mc-glance .g span{font-size:.66rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
  .mc-glance .g.gd b{color:var(--good)} .mc-glance .g.gw b{color:var(--warn)}
  .mc-glance .g.gc b{color:var(--crit)} .mc-glance .g.ga b{color:var(--accent)}

  /* ── activity grid ── */
  .mc-activity{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin:0 0 16px}
  .mc-activity .hd{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;margin-bottom:8px}
  .mc-activity .hd .t{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
  .mc-activity .legend{display:flex;align-items:center;gap:3px;font-size:.68rem;color:var(--ink3)}
  .mc-activity .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .mc-act-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;
    scrollbar-width:thin}
  .mc-act-table{border-collapse:separate;border-spacing:2px 2px}
  .mc-act-table th .pband{height:10px}
  .mc-act-table td,.mc-act-table th{padding:0}
  .mc-act-table th{text-align:left;padding-right:42px;max-width:232px;
    overflow:hidden;cursor:pointer;font-size:0;line-height:0;color:var(--ink3)}
  .mc-act-table th .thw{display:inline-flex;align-items:center;gap:3px;max-width:100%;
    color:var(--ink3)}
  .mc-act-table th .thn{font-weight:400;font-size:.64rem;line-height:1;
    color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-act-table th .pband{height:10px}
  .mc-act-cell{width:11px;height:11px;border-radius:3px;background:var(--card2)}
  .mc-act-cell.a1{background:#2b2f52}.mc-act-cell.a2{background:#46448c}
  .mc-act-cell.a3{background:#6a63c8}.mc-act-cell.a4{background:#8f87ff}
  /* desktop line-chart mode: one chart, pillar-colored series. The
     legend overlays the top-left of the plot — the early-history corner
     is the least important pixels — so the chart keeps every row. */
  .mc-act-chart{position:relative}
  .mc-act-chart svg{display:block;
    /* same fade as the homepage cards: the legend overlays the
       early-history corner, so the plot dims beneath it */
    -webkit-mask-image:linear-gradient(to right, rgba(0,0,0,.05),
      rgba(0,0,0,.05) max(5%, 28px), #000 max(16%, 85px));
    mask-image:linear-gradient(to right, rgba(0,0,0,.05),
      rgba(0,0,0,.05) max(5%, 28px), #000 max(16%, 85px))}
  .mc-act-lgd{position:absolute;top:2px;left:4px;z-index:2;
    display:flex;flex-direction:column;gap:4px;max-width:46%}
  .mc-act-lgd .lchip{display:inline-flex;align-items:center;gap:7px;
    font-size:.82rem;color:var(--ink2);cursor:pointer;white-space:nowrap;
    overflow:hidden;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  .mc-act-lgd .lchip>span{overflow:hidden;text-overflow:ellipsis}
  .mc-act-lgd .lchip:hover{color:var(--ink)}
  .mc-act-lgd .lchip .pband{height:11px;flex:none}
  .mc-act-axis{display:flex;justify-content:space-between;
    font-size:.62rem;color:var(--ink3);padding:3px 2px 0}

  /* ── nav ── */
  .mc-psel{position:relative;margin:0 0 12px;display:flex;
    align-items:center;gap:8px}
  .mc-psel-btn{display:flex;align-items:center;gap:5px;background:none;
    border:0;padding:4px 0;flex:1;min-width:0;cursor:pointer;font:inherit;
    color:var(--ink)}
  .mc-plabel{flex:1;min-width:0;display:flex;align-items:center;gap:5px;
    overflow:hidden;text-align:left}
  .mc-plabel > :last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .mc-psel-btn b{font-size:.95rem;color:#fff}
  .mc-psel-btn .pband{height:16px}
  .mc-psel-btn .caret{color:var(--ink3);font-size:.7rem;border:1px solid var(--line);
    border-radius:7px;padding:4px 9px;background:var(--card)}
  .mc-psel-menu{display:none}
  .mc-psel.open .mc-psel-menu{display:block;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;
    background:#11151d;border:1px solid var(--line2);border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    max-height:min(60vh,420px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .mc-psel-row{display:flex;align-items:center;gap:5px;width:100%;padding:10px 13px;
    background:none;border:0;border-top:1px solid #1c2230;cursor:pointer;
    font:inherit;color:var(--ink2);font-size:.88rem;text-align:left}
  .mc-psel-row:first-child{border-top:0}
  .mc-psel-row:hover{background:#171b26}
  .mc-psel-row.on{color:#fff;background:#171b26}
  .mc-secfilters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .mc-secfilters button{font:inherit;font-weight:600;font-size:.68rem;
    line-height:1;color:var(--ink3);background:var(--bg2);
    border:1px solid var(--line);border-radius:12px;padding:5px 10px;cursor:pointer}
  .mc-secfilters button.on{color:#fff;border-color:var(--accent-dim);background:#232345}
  .mc-flegend{display:flex;gap:12px;align-items:baseline;margin:0 0 10px;flex-wrap:wrap}
  /* Phones: the entries split the row evenly — spacing self-balances,
     so growing counts compress whitespace instead of wrapping. */
  @media (max-width:400px){
    .mc-flegend{gap:0}
    .mc-flegend .fl{gap:3px;flex:1 1 0;min-width:0;justify-content:flex-start}
    .mc-flegend .fl b{font-size:.76rem}
    .mc-flegend .fl .w2{font-size:.6rem;letter-spacing:.02em}
  }
  @media (max-width:380px){
    .mc-flegend .fl{gap:2px}
    .mc-flegend .fl b{font-size:.72rem}
    .mc-flegend .fl .w2{font-size:.56rem;letter-spacing:0}
  }
  .mc-flegend .fl{background:none;border:0;padding:2px 0 4px;cursor:pointer;
    font:inherit;font-size:.72rem;color:var(--ink3);display:inline-flex;
    gap:5px;align-items:baseline}
  .mc-flegend .fl .mk2{font-weight:700}
  .mc-flegend .fl b{font-size:.82rem}
  .mc-flegend .fl .w2{text-transform:uppercase;letter-spacing:.04em;font-size:.64rem}
  .mc-flegend .fl.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--line2)}
  .mc-flegend .fl.dim{opacity:.4}
  .gx-dot{font-size:1.45em;line-height:.7}
  .gx-arr svg{width:.95em;height:.95em;vertical-align:-0.1em}
  .gx-stop svg{width:.95em;height:.95em;vertical-align:-0.1em}
  .gx-news svg{width:.95em;height:.95em;vertical-align:-0.12em}
  .gx-ring{font-size:.88em}
  .md-pre{background:var(--card2);border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;overflow-x:auto;font-size:.74rem;line-height:1.5;
    font-family:var(--mono);margin:8px 0}
  .md-pre code{background:none;padding:0}
  .mc-bead.q-open .bmk{color:var(--warn)}
  .mc-bead.q-blocking .bmk{color:var(--crit)}
  .mc-bead.q-answered .bmk{color:var(--good)}
  .qe{margin:0 0 14px}
  .qe .qwho{font-size:.7rem;color:var(--ink3);margin-bottom:3px}
  .qe .qwho b{color:var(--ink2);font-weight:600}
  .qe .qtx{font-size:.88rem;color:var(--ink2);line-height:1.55}
  .qprog{display:flex;gap:7px;align-items:baseline;font-size:.74rem;
    color:var(--ink3);margin:0 0 10px}
  .qprog .qpm{color:var(--warn);font-weight:700}
  .qprog .qpa{margin-left:auto;flex:none;font-size:.66rem}
  .qcomp{margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
  .qcomp textarea{background:var(--card2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:16px;
    padding:10px 12px;min-height:64px;resize:vertical}
  @media (min-width:700px){.qcomp textarea{font-size:.85rem}}
  .qcomp .qsend{align-self:flex-end;background:var(--card2);color:var(--ink2);
    border:1px solid var(--line2);border-radius:8px;padding:6px 16px;
    font:inherit;font-size:.78rem;cursor:pointer}
  .qhint{font-size:.68rem;color:var(--ink3);line-height:1.5}

  .mc-seg{display:inline-flex;gap:2px;background:var(--bg2);border:1px solid var(--line);
    border-radius:8px;padding:2px}
  .mc-seg button{background:none;border:0;cursor:pointer;font:600 .74rem/1 inherit;
    color:var(--ink3);border-radius:6px;padding:5px 10px}
  .mc-seg .mc-seg-on{background:#232345;color:#fff}
  .mc-news-seg{margin:0 0 12px}
  .mc-qa-seg{margin:0 0 12px}
  .mc-qa{cursor:pointer}
  .mc-qa:hover{border-color:var(--line2)}
  .mc-qa-peek{font-size:.8rem;color:var(--ink3);margin-top:6px;
    border-left:2px solid var(--line2);padding-left:9px;font-style:italic}
  .mc-qa-state{font-size:.68rem;color:var(--ink3);text-transform:uppercase;
    letter-spacing:.05em;margin-top:7px}
  .mc-qa-ask{display:flex;justify-content:flex-start;margin:4px 0 0}
  .mc-subtabs{display:flex;gap:14px;margin:0 0 9px;border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none}
  .mc-subtabs::-webkit-scrollbar{display:none}
  .mc-subtabs button{background:none;border:0;cursor:pointer;font:inherit;
    font-size:.78rem;color:var(--ink3);padding:7px 2px;flex:none;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .mc-subtabs button sup.n{font-size:.62rem;color:var(--warn);
    margin-left:4px;line-height:0}
  .mc-subtabs button.on{color:var(--ink);border-color:var(--line2)}
  .mc-subtabs button.off{opacity:.32;cursor:default}
  .mc-charter{padding:2px 0 6px}
  .mc-newsstamp{font-size:.68rem;color:var(--ink3);margin:0 0 4px;
    letter-spacing:.01em}
  .mc-bead.d-row .bmk{color:var(--ink3);font-size:.72rem}
  .mc-bead .x2{font-size:.76rem;color:var(--ink3);margin-top:3px}
  .mc-critpage .mk3.c-dec{color:var(--ink3)}
  .mc-bead.d-fav .bmk{color:var(--warn)}
  .dstar{background:none;border:0;cursor:pointer;font:inherit;
    font-size:.95rem;color:var(--ink3);padding:0 4px;margin-left:8px;
    vertical-align:-1px}
  .dstar.on{color:var(--warn)}
  .tk.tk-link{cursor:pointer}
  .tk.tk-link:hover .tt{color:var(--ink)}
  .ifw3{color:var(--ink3);font-style:italic}
  .pinfo{flex:none;background:none;cursor:pointer;color:var(--ink3);
    border:0;padding:3px 7px;display:inline-flex;align-items:center}
  .pinfo svg{width:15px;height:15px}
  .pinfo.on{color:var(--accent)}
  .mc-status-prose .body{font-size:.9rem;color:var(--ink2)}
  .md-a{color:var(--accent);text-decoration:underline dotted}
  .md-c{font-family:var(--mono);font-size:.82em;background:var(--bg2);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .md-h{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink3);margin:14px 0 4px}
  .md-ul{margin:6px 0;padding-left:20px}
  .md-ul li{margin:3px 0}
  .md-gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .md-gallery img{height:84px;border-radius:8px;border:1px solid var(--line);
    cursor:zoom-in;object-fit:cover}
  .md-lightbox{position:fixed;inset:0;z-index:60;background:rgba(2,6,12,.93);
    display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:18px}
  .md-lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  .mc-status-prose .body p{margin:6px 0}
  .mc-status-prose .mc-when{font-size:.7rem;color:var(--ink3);margin-top:7px}
  .mc-crit{display:flex;gap:10px;align-items:baseline;padding:9px 2px;
    border-top:1px solid #1c2230}
  .mc-crit:first-of-type,.mc-status-prose + .mc-crit{border-top:0;margin-top:6px}
  .mc-crit .mk{flex:none;width:18px;text-align:center;font-weight:700}
  .mc-crit.c-ok .mk{color:var(--good)} .mc-crit.c-run .mk{color:var(--warn)}
  .mc-crit.c-bad .mk{color:var(--crit)} .mc-crit.c-ask .mk{color:var(--accent)}
  .mc-crit.c-todo .mk{color:var(--ind)}
  .mc-crit .bx{flex:1;min-width:0}
  .mc-crit .t{font-size:.88rem;color:var(--ink)}
  .mc-crit.c-ok .t{color:var(--ink2)}
  .mc-crit .d{font-size:.76rem;color:var(--ink3);margin-top:2px}
  .mc-crit .word{flex:none;font-size:.64rem;text-transform:uppercase;
    letter-spacing:.05em}
  .mc-crit .word.w-ok{color:var(--good)} .mc-crit .word.w-run{color:var(--warn)}
  .mc-crit .word.w-todo{color:var(--ink3)}
  .mc-crit .tl2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .mc-crit .n2{font-size:.68rem;color:var(--ink3)}
  .mc-crit .rdy{font-size:.64rem;font-weight:700;color:var(--warn);
    text-transform:uppercase;letter-spacing:.05em}
  .tk{display:flex;gap:7px;align-items:baseline;margin-top:5px;min-width:0}
  .tk .tmk{flex:none;width:14px;text-align:center;font-size:.72rem}
  .tk.s-complete .tmk{color:var(--good)} .tk.s-running .tmk{color:var(--warn)}
  .tk.s-specified .tmk{color:var(--ind)}
  .tk.s-defined .tmk{color:var(--ink3)}
  .tk .tt{font-size:.76rem;color:var(--ink3);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mc-critpage{position:fixed;inset:0;z-index:55;background:var(--bg);
    overflow-y:auto;overscroll-behavior:contain}
  .mc-critpage .cbar{position:sticky;top:0;display:flex;align-items:center;gap:10px;
    background:#111318;border-bottom:1px solid #1e293b;padding:0;z-index:2}
  /* the back button IS the bar: the whole horizontal surface taps back,
     not just the word (operator ruling, all breadcrumb tiles) */
  .mc-critpage .cback{background:none;border:0;color:#94a3b8;font:inherit;
    font-size:.88rem;cursor:pointer;padding:12px 14px;flex:1;
    display:flex;align-items:center;text-align:left;min-width:0}
  .mc-critpage .cback span:last-child{overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .mc-critpage .cpos{font-size:.7rem;color:var(--ink3);
    text-transform:uppercase;letter-spacing:.06em;align-self:center}
  .mc-critpage .cback .chv{margin-right:9px;color:var(--ink3)}
  .mc-critpage .cbody{max-width:720px;margin:0 auto;padding:16px 16px 60px}
  .mc-critpage .hd3{display:flex;gap:10px;align-items:flex-start}
  .mc-critpage .hd3 b{flex:1;color:#fff;font-size:1.08rem;line-height:1.35}
  .mc-critpage .mk3{flex:none;font-weight:700;margin-top:3px;font-size:1rem}
  .mc-critpage .mk3.c-ok{color:var(--good)} .mc-critpage .mk3.c-run{color:var(--warn)}
  .mc-critpage .mk3.c-todo{color:var(--ind)}
  .mc-critpage .mk3.c-blk{color:var(--crit)}
  .mc-critpage .meta3{font-size:.72rem;color:var(--ink3);text-transform:uppercase;
    letter-spacing:.05em;margin:6px 0 0}
  .mc-critpage .sh3{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink3);margin:20px 0 8px}
  .mc-critpage .body3{font-size:.9rem;color:var(--ink2)}
  .mc-critpage .body3 p{margin:7px 0}
  .mc-critpage .evblock{margin:0 0 14px}
  .provt{background:none;border:0;padding:0;cursor:pointer;font:inherit;
    color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
  .provpop{position:fixed;z-index:70;background:#1a2029;border:1px solid var(--line2);
    border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:10px 13px;
    font-size:.76rem;color:var(--ink2);display:flex;flex-direction:column;gap:5px;
    text-transform:none;letter-spacing:0}
  .mc-critpage .evprov{font-size:.7rem;color:var(--ink3);font-family:var(--mono);
    margin:0 0 3px}
  .mc-critpage .evblock .md-gallery img{height:120px}
  .mc-critpage .tk .tst{flex:none;font-size:.64rem;color:var(--ink3);
    text-transform:uppercase;letter-spacing:.05em}
  .mc-critpage .cnav{display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin-top:26px}
  .mc-critpage .cnb{background:var(--card);border:1px solid var(--line);
    border-radius:9px;color:var(--ink2);font:inherit;font-size:.82rem;
    padding:8px 14px;cursor:pointer}
  .mc-critpage .cnb:disabled{opacity:.3;cursor:default}
  .md-video{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px}
  .mc-bead{display:flex;gap:10px;padding:9px 2px;border-top:1px solid #1c2230;
    align-items:baseline}
  .mc-bead:first-of-type{border-top:0}
  .mc-bead .bmk{flex:none;width:16px;text-align:center;font-weight:700}
  .mc-bead.s-complete .bmk{color:var(--good)} .mc-bead.s-running .bmk{color:var(--warn)}
  .mc-bead.s-specified .bmk{color:var(--ind)}
  .mc-bead .ep{flex:none;font-size:.6rem;font-weight:700;color:var(--accent);
    text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--accent-dim);
    border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px}
  .mc-bead.s-defined .bmk{color:var(--ink3)}
  .mc-bead .bx2{flex:1;min-width:0}
  .mc-bead .t2{font-size:.88rem;color:var(--ink)}
  .mc-bead.s-done .t2{color:var(--ink3)}
  .mc-bead .m2{font-size:.68rem;color:var(--ink3);margin-top:2px;font-family:var(--mono)}
  .mc-bead details{margin-top:4px}
  .mc-bead summary{cursor:pointer;font-size:.72rem;color:var(--good);list-style:none}
  .mc-bead .ev2{background:#0f1a12;border:1px solid #14532d;border-radius:8px;
    padding:8px 10px;font-size:.78rem;color:#bbf7d0;white-space:pre-wrap;margin-top:5px}
  .mc-group{font-size:.72rem;color:var(--ink3);letter-spacing:.06em;
    text-transform:uppercase;margin:16px 0 8px}
  .mc-news .body{margin-top:2px}
  .mc-news-foot{display:flex;justify-content:flex-end;margin-top:6px}
  .mc-news-reply{background:none;border:0;cursor:pointer;font:600 .74rem/1 inherit;
    color:var(--accent);padding:2px 4px}

  /* ── views ── */
  .mc-view{display:none}
  .mc-view.on{display:block}
  .mc-sec{margin:22px 0 8px}
  .mc-sec h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink3);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .mc-empty{color:var(--ink3);font-size:.86rem;padding:14px;background:var(--bg2);
    border:1px dashed var(--line);border-radius:10px}
  .mc-empty code{font-family:var(--mono);font-size:.8em;color:var(--ink2)}

  /* ── item cards ── */
  .mc-item{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line2);
    border-radius:0 10px 10px 0;padding:12px 14px;margin:0 0 10px;
  }
  .mc-item.st-confirmed,.mc-item.st-answered{border-left-color:var(--good)}
  .mc-item.st-in_progress,.mc-item.st-open{border-left-color:var(--warn)}
  .mc-ask{border-left:3px solid var(--accent);background:rgba(139,133,255,.07);
    border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0}
  .mc-ask b{display:block;color:var(--accent);font-size:.66rem;
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .mc-ask p{margin:4px 0;color:var(--ink);font-size:.85rem;line-height:1.5}
  .mc-item.k-incident{border-left-color:var(--serious)}
  .mc-item.mc-hidden,.mc-hidden{display:none !important}
  .mc-item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mc-item .top .where{font-size:.7rem;color:var(--ink3);display:flex;gap:4px;
    align-items:center;min-width:0}
  .mc-item .top .where .pband{height:9px}
  .mc-item .top .where .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .mc-item h3{font-size:.95rem;line-height:1.35;margin:4px 0 2px;color:var(--ink);font-weight:600}
  .mc-item .body{font-size:.86rem;color:var(--ink2);margin:4px 0 0}
  .mc-item .body p{margin:5px 0}
  .mc-item details{margin:7px 0 0}
  .mc-item summary{cursor:pointer;font-size:.78rem;color:var(--accent);list-style:none;user-select:none}
  .mc-item summary::before{content:"▸ ";color:var(--ink3)}
  .mc-item details[open] summary::before{content:"▾ "}
  .mc-item .ev{font-size:.8rem;color:var(--ink2);border-left:1px solid var(--line);
    margin:6px 0 0 3px;padding:2px 0 2px 11px}
  .mc-item .ev p{margin:4px 0}
  .mc-refs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .mc-refs span{font-family:var(--mono);font-size:.68rem;color:var(--ink3);
    background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .mc-when{font-size:.7rem;color:var(--ink3);margin-top:7px}

  /* a mirror card (cross-pillar views) is a door to its home item */
  .mc-item.mc-mirror{cursor:pointer}
  .mc-item.mc-mirror:hover{border-color:var(--line2);background:#181e29}
  .mc-item.mc-flash{animation:mcflash 1.6s ease-out 1}
  @keyframes mcflash{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

  /* finished items fold away per section: the count stays honest, the
     scroll goes. */
  details.mc-finished{margin:2px 0 10px;border:1px dashed var(--line);
    border-radius:10px;padding:0}
  details.mc-finished > summary{cursor:pointer;list-style:none;user-select:none;
    color:var(--ink3);font-size:.8rem;padding:9px 13px}
  details.mc-finished > summary::before{content:"▸ ";color:var(--ink3)}

  /* pills */
  .mc-pill{display:inline-block;flex-shrink:0;font:700 .64rem/1 inherit;letter-spacing:.05em;
    text-transform:uppercase;padding:4px 8px;border-radius:12px;white-space:nowrap}
  .p-good{color:var(--good);background:rgba(12,163,12,.13);border:1px solid rgba(12,163,12,.3)}
  .p-warn{color:var(--warn);background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.3)}
  .p-crit{color:#ff7b7b;background:rgba(208,59,59,.15);border:1px solid rgba(208,59,59,.4)}
  .p-neut{color:var(--neut);background:rgba(131,145,168,.1);border:1px solid rgba(131,145,168,.28)}

  /* decision fields */
  .mc-dec{font-size:.84rem;color:var(--ink2);margin-top:6px}
  .mc-dec b{color:var(--ink3);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;
    display:block;margin:7px 0 1px}
  .mc-dec p{margin:0}
  .mc-dec .ifw{color:#e8b8ac}

  /* checkpoints (ordered arc) */
  .mc-arc{position:relative}
  .mc-arc .mc-item{display:grid;grid-template-columns:34px 1fr;gap:12px}
  .mc-arc .stepno{
    width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);
    border-radius:8px;background:var(--bg2);color:var(--accent);
    font:600 .78rem var(--mono);
  }
  .mc-arc .mc-item > div:last-child{min-width:0}
  .mc-arc .mc-item .top{margin-top:2px}

  /* metric tiles */
  .mc-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:8px;margin:0 0 10px}
  .mc-metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .mc-metric b{display:block;font-size:1.05rem;color:#fff}
  .mc-metric span{display:block;font-size:.72rem;color:var(--ink3);margin-top:3px;line-height:1.35}

  /* pillar summary cards (overview) */
  .mc-psum{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 13px 12px;margin:0 0 10px;cursor:pointer;
  }
  .mc-psum:hover{border-color:var(--line2)}
  .mc-psum .hd{display:flex;align-items:flex-start;gap:4px}
  .mc-psum .hd b{flex:1;min-width:0;font-size:.88rem}
  .mc-minirow{display:flex;align-items:baseline;margin:12px 0 0}
  .mc-minirow .ago{font-size:.7rem;color:var(--ink3)}
  .mc-minirow .grow{flex:1}
  .pband{width:4px;height:14px;border-radius:999px;flex:none;display:inline-block;
    align-self:center;vertical-align:-2px}
  .mc-psum .hd .pband{height:15px}
  .mc-psum .hd b{color:#fff;font-size:.88rem}
  .mc-mini{flex:none;display:inline-flex;align-items:baseline;margin-left:auto;
    border:1px solid var(--line);border-radius:6px;overflow:hidden;
    font-size:.66rem;line-height:1;background:var(--bg2)}
  .mc-mini i{font-style:normal;font-weight:700;padding:3px 6px;
    border-left:1px solid var(--line)}
  .mc-mini i:first-child{border-left:0}
  .mc-mini .m-a{color:var(--accent)} .mc-mini .m-c{color:var(--crit)}
  .mc-mini .m-w{color:var(--warn)} .mc-mini .m-g{color:var(--good)}
  .mc-mini .m-z{opacity:.35}
  .mc-psum .last{font-size:.79rem;color:var(--ink2);margin:5px 0 0}
  .mc-statbar{display:flex;height:4px;border-radius:3px;overflow:hidden;
    background:var(--card2);flex:1}
  .mc-statrow{display:flex;align-items:center;gap:8px;margin:6px 0 0}
  .mc-statrow .lb.lb-link{cursor:pointer}
  @media (hover:hover){
    .mc-statrow .lb.lb-link:hover{text-decoration:underline}
  }
  .mc-mini{cursor:pointer}
  .mc-statrow .lb{flex:none;width:48px;font-size:.58rem;font-weight:700;
    color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;text-align:left}
  .mc-statrow .fr{flex:none;font-size:.66rem;color:var(--ink3);min-width:26px}
  .mc-statbar i{height:100%}
  .mc-statmeta{font-size:.72rem;color:var(--ink3);margin-top:5px}

  /* feed */
  .mc-feed-day{font-size:.72rem;color:var(--ink3);text-transform:uppercase;
    letter-spacing:.06em;margin:18px 0 8px}
  .mc-feed-row{display:flex;gap:10px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 6px;
    font-size:.84rem;cursor:pointer}
  .mc-feed-row .fmk{flex:none;width:18px;text-align:center;font-weight:700;
    margin-top:1px;margin-right:4px}
  .mc-feed-row.fe-blocking .fmk{color:var(--crit)}
  .mc-feed-row.fe-progress .fmk{color:var(--warn)}
  .mc-feed-row.fe-finished .fmk{color:var(--good)}
  .mc-feed-row.fe-news .fmk,.mc-feed-row.fe-decided .fmk{color:var(--ink3)}
  .mc-feed-row .fago{flex:none;font-size:.68rem;color:var(--ink3);margin-top:2px}
  .fl-line{display:flex;align-items:baseline;gap:10px}
  .fl-line .fl-lab{flex:none;width:44px;font-size:.6rem;font-weight:700;
    color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
  .fl-line .mc-flegend{margin:0 0 3px;flex:1}
  .mc-chatlog{margin:2px 0 0}
  #view-chat{padding-bottom:calc(16px + var(--mc-kb, 0px))}
  .mc-critpage .cbody{padding-bottom:calc(16px + var(--mc-kb, 0px))}

  .mc-feed-row:hover{border-color:var(--line2)}
  .mc-feed-row .main{flex:1;min-width:0}
  .mc-feed-row .who{display:flex;align-items:center;gap:4px;margin:0 0 2px}
  .mc-feed-row .who .pband{height:9px}
  .mc-feed-row .who .k{color:var(--ink3);font-size:.7rem;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .mc-feed-row .t{color:var(--ink);min-width:0}
  .mc-feed-row .mc-pill{flex:none;align-self:center}
  .mc-feed-row .mc-pill.sm{font-size:.58rem;padding:2px 6px}
  .mc-feed-filtered .mc-feed-row .who{display:none}
  .mc-bhidden{display:none!important}
  .mc-feed-note{display:inline-flex;align-items:center;gap:6px;font:600 .74rem/1 inherit;
    color:#fff;background:#232345;border:1px solid var(--accent-dim);border-radius:14px;
    padding:6px 11px;margin:0 0 10px;cursor:pointer}
  .mc-act-table th{cursor:pointer}
  .mc-act-table th:hover{color:var(--ink)}

  /* non-stateful kinds: no pill, neutral spine */
  .mc-item.k-scope,.mc-item.k-status{border-left-color:var(--line2)}
  .mc-item.k-scope .mc-pill,.mc-item.k-status .mc-pill{display:none}
  /* An open question under an "Open questions" heading needs no OPEN badge;
     the amber spine already carries the state. */
  .mc-item.k-question.st-open .mc-pill{display:none}
  .mc-item.k-question.st-open{cursor:pointer}
  .mc-item.k-question.st-open:hover{border-color:var(--line2)}

  .mc-foot{color:var(--ink3);font-size:.72rem;margin-top:36px;text-align:center}

  @media(min-width:680px){
    #mc-app{padding:18px 24px 90px}
    .mc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mc-two .mc-item{margin:0}
  }
</style>

<script id="mc-data" type="application/json">__MC_STRUCTURED_DATA__</script>
<script>
(function () {
  "use strict";
  var T_SCRIPT = performance.now();   // chrome boot + HTML parse end at our turn
  var DATA = JSON.parse(document.getElementById("mc-data").textContent);
  var T_PARSED = performance.now();
  var ITEMS = DATA.items || [];
  var PILLARS = DATA.pillars || [];
  var MID = DATA.mission.mission_id;

  // ── vocab ───────────────────────────────────────────────────────
  // Schema v2 — greenfield. A state exists only where it means
  // something: checkpoints climb confirmed/in_progress/pending,
  // questions are open/answered. Prose and records carry no state.
  var PILL = {
    confirmed:"p-good", answered:"p-good",
    in_progress:"p-warn", open:"p-warn",
    pending:"p-neut"
  };
  var STATE_LABEL = {
    confirmed:"Confirmed", in_progress:"In progress", pending:"Pending",
    open:"Open", answered:"Answered"
  };
  var SECTION_OF = {scope:"News", status:"News",
    checkpoint:"Delivery", decision:"Decisions", question:"Questions"};
  var SECTION_ORDER = ["News","Delivery","Tasks",
    "Questions","Decisions"];

  var byId = {};
  PILLARS.forEach(function (p) { byId[p.pillar_id] = p; });
  function surfName(sid){ return sid===MID ? "Overview" : (byId[sid]||{}).name || sid; }
  function shortName(sid){
    var words = surfName(sid).split(" ");
    var n = words[0].replace(/[^\w-]/g,"");
    if (/^(Mission|The|A|An|Core)$/i.test(n) && words[1])
      n += " " + words[1].replace(/[^\w-]/g,"");
    return n || surfName(sid);
  }
  function surfColor(sid){ return sid===MID ? "#8b85ff" : (byId[sid]||{}).color || "#8391a8"; }
  function when(it){
    var t = it.happened_at || it.updated_at || it.created_at || "";
    var d = new Date(t);
    return isNaN(d) ? null : d;
  }
  function live(it){ return !it.retired; }
  function agoText(d){
    var s = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s/60) + "m ago";
    if (s < 86400) return Math.round(s/3600) + "h ago";
    return Math.round(s/86400) + "d ago";
  }

  // ── tiny DOM helpers (no innerHTML for item text — coordinator
  //    prose is data, not markup; exhibits are the one trusted hole) ──
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function paras(container, text, cls){
    String(text||"").split(/\n\s*\n/).forEach(function (p) {
      if (p.trim()) container.appendChild(el("p", cls||null, p.trim()));
    });
  }
  function pill(state){
    var s = el("span", "mc-pill " + (PILL[state]||"p-neut"), STATE_LABEL[state]||state);
    s.setAttribute("data-mc-noexcerpt", "");
    return s;
  }
  function dot(color){
    var d = el("span","dot"); d.style.background = color; return d;
  }
  // A filter that reads as a legend: flat inline entries (mark, count,
  // word), the active one underlined in its own colour, the rest dimmed.
  // One reusable control for every filter-with-counts surface.
  function filterLegend(defs, onChange, opts){
    if (typeof onChange !== "function"){
      var swap = onChange; onChange = opts; opts = swap;
    }
    var host = el("div","mc-flegend");
    var active = {};
    defs.forEach(function (d) {
      if (!d.count && !(opts && opts.showEmpty)) return;
      var b = el("button","fl");
      if (d.mark) b.appendChild(markSpan("mk2", d.mark));
      var num = el("b", null, String(d.count));
      if (d.color) num.style.color = d.color;
      b.appendChild(num);
      b.appendChild(el("span","w2", d.word));
      b.addEventListener("click", function () {
        active[d.word] = !active[d.word];
        var act = Object.keys(active).filter(function (k) { return active[k]; });
        [].forEach.call(host.children, function (c) {
          var on = act.indexOf(c.dataset.word) >= 0;
          c.classList.toggle("on", on);
          c.classList.toggle("dim", !!act.length && !on);
        });

        onChange(act);
      });
      b.dataset.word = d.word;
      if (d.color) b.dataset.color = d.color;
      host.appendChild(b);
    });
    return (host.children.length > 1
      || (opts && opts.always && host.children.length)) ? host : el("span");
  }

  function provTap(label, buildDetail){
    var frag = document.createDocumentFragment();
    var t = el("button","provt", label);
    t.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var old = document.querySelector(".provpop");
      if (old) old.remove();
      var pop = el("div","provpop");
      buildDetail(pop);
      document.body.appendChild(pop);
      var r = t.getBoundingClientRect();
      var pw = Math.min(300, innerWidth - 24);
      pop.style.maxWidth = pw + "px";
      var left = Math.min(Math.max(12, r.left), innerWidth - pw - 12);
      pop.style.left = left + "px";
      pop.style.top = (r.bottom + 8) + "px";
      // one tap anywhere dismisses — including on the popover itself,
      // except its links, which must still be tappable
      setTimeout(function () {
        function dismiss(e2){
          if (e2.target.closest && e2.target.closest(".provpop a")) return;
          pop.remove();
          document.removeEventListener("click", dismiss, true);
        }
        document.addEventListener("click", dismiss, true);
      }, 0);
    });
    frag.appendChild(t);
    return frag;
  }

  // THE CRITERION PAGE: full-screen overlay — back to the pillar, the
  // demonstration and its evidence (screenshots, video) at full size,
  // and prev/next to walk the ladder in order.
  function openCriterion(crits, idx, ctx){
    var old = document.getElementById("mc-critpage");
    if (old) old.remove();
    var it = crits[idx];
    var bk = ctx.bucket(it.state);
    var linked = ctx.linkedOf(it);
    var page = el("div","mc-critpage");
    page.id = "mc-critpage";
    var bar = el("div","cbar");
    var back = el("button","cback");
    back.appendChild(el("span","chv","\u2039"));
    back.appendChild(el("span",null,
      "Delivery \u2014 " + surfName(it.surface_id)));
    back.addEventListener("click", function () { page.remove(); });
    bar.appendChild(back);
    page.appendChild(bar);
    var body = el("div","cbody");
    var hd = el("div","hd3");
    hd.appendChild(markSpan("mk3 c-" + bk.cls, bk.mark));
    hd.appendChild(el("b",null,it.title));
    body.appendChild(hd);
    var d0 = when(it);
    var work = it.work || [];
    var lastW = work.length ? work[work.length-1] : null;
    var meta = el("div","meta3");
    meta.appendChild(document.createTextNode(bk.word + (d0 ? " \u00b7 " : "")));
    if (d0){
      meta.appendChild(provTap(
        (it.happened_at ? "" : "updated ") + agoText(d0),
        function (box) {
          box.appendChild(el("div",null,d0.toLocaleString()));
          if (it.confirmed_by){
            box.appendChild(linkEl(
              it.confirmed_by
                + (it.confirmed_turn ? " \u00b7 turn " + it.confirmed_turn : ""),
              "/graph/" + it.confirmed_by
                + (it.confirmed_turn ? "#turn-" + it.confirmed_turn : "")));
          }
        }));
    }
    if (lastW && bk.word === "in progress"){
      meta.appendChild(document.createTextNode(" \u00b7 worked "));
      meta.appendChild(provTap(agoText(new Date(lastW.at)), function (box) {
        box.appendChild(el("div",null,new Date(lastW.at).toLocaleString()));
        box.appendChild(linkEl(lastW.by, "/graph/" + lastW.by));
      }));
    }
    body.appendChild(meta);
    if (it.body){
      body.appendChild(el("div","sh3","Demonstration"));
      var b3 = el("div","body3"); mdInto(b3, it.body); body.appendChild(b3);
    }
    var evs = (it.evidence || []);
    var beadEv = linked.filter(function (b) { return b.state === "complete" && b.evidence; });
    if (evs.length || beadEv.length){
      body.appendChild(el("div","sh3","Evidence"));
      evs.forEach(function (e2) {
        var entry = (typeof e2 === "string") ? {text: e2} : (e2 || {});
        var e4 = el("div","evblock");
        if (entry.at || entry.by){
          var pl = el("div","evprov");
          pl.appendChild(provTap(entry.at || "when", function (box) {
            if (entry.at) box.appendChild(el("div",null,entry.at));
            if (entry.by){
              box.appendChild(linkEl(
                entry.by + (entry.turn ? " \u00b7 turn " + entry.turn : ""),
                "/graph/" + entry.by
                  + (entry.turn ? "#turn-" + entry.turn : "")));
            }
          }));
          e4.appendChild(pl);
        }
        var tx = el("div","body3"); mdInto(tx, entry.text || "");
        e4.appendChild(tx);
        body.appendChild(e4);
      });
      beadEv.forEach(function (b) {
        var e3 = el("div","evblock");
        e3.appendChild(el("div","evprov", b.id + " \u00b7 close reason"));
        var tx2 = el("div","body3");
        tx2.appendChild(document.createTextNode(b.evidence));
        e3.appendChild(tx2);
        body.appendChild(e3);
      });
    }
    if (linked.length){
      body.appendChild(el("div","sh3","Tasks"));
      linked.forEach(function (b) {
        var ln = el("div","tk s-" + b.state);
        ln.appendChild(markSpan("tmk", BEAD_MARK[b.state] || "\u25E6"));
        ln.appendChild(el("span","tt", b.title));
        ln.appendChild(el("span","tst", b.state));
        body.appendChild(ln);
      });
    }
    if (work.length){
      body.appendChild(el("div","sh3","Work log"));
      work.forEach(function (w) {
        var pr = el("div","qprog");
        pr.appendChild(markSpan("qpm","\u27F3"));
        pr.appendChild(el("span",null,w.text));
        pr.appendChild(el("span","qpa",agoText(new Date(w.at))));
        body.appendChild(pr);
      });
    }
    var nav = el("div","cnav");

  function mdStrip(t){
    return String(t||"")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/^#{1,3} /gm, "");
  }
  function goInternal(href){
    return function (ev) {
      try {
        if (window.parent !== window &&
            typeof window.parent.navigateTo === "function"){
          ev.preventDefault();
          window.parent.navigateTo(href);
        }
      } catch (e) {}
    };
  }
  function linkEl(label, href){
    var a = el("a","md-a", label);
    a.href = href;
    if (/^https?:\/\//.test(href)){ a.target = "_blank"; a.rel = "noopener"; }
    else a.addEventListener("click", goInternal(href));
    return a;
  }
  function mdInto(host, text){
    var gallery = [];
    function inline(node, t){
      var re = /!\[([^\]]*)\]\(([^)\s]+)\)|\[([^\]]+)\]\(([^)\s]+)\)|`([^`]+)`|\*\*([^*]+)\*\*|graph:\/\/([a-f0-9][a-f0-9-]{4,})/g;
      var last = 0, m;
      while ((m = re.exec(t))){
        if (m.index > last) node.appendChild(document.createTextNode(t.slice(last, m.index)));
        if (m[2] != null){                     // image -> gallery
          gallery.push({alt: m[1] || "", src: m[2]});
        } else if (m[4] != null){              // [text](url)
          if (/^(https?:\/\/|\/)/.test(m[4]))
            node.appendChild(linkEl(m[3], m[4]));
          else node.appendChild(el("span",null,m[3]));
        } else if (m[5] != null){
          node.appendChild(el("code","md-c", m[5]));
        } else if (m[6] != null){
          node.appendChild(el("b", null, m[6]));
        } else if (m[7] != null){              // graph://id
          node.appendChild(linkEl("graph://" + m[7], "/graph/" + m[7]));
        }
        last = re.lastIndex;
      }
      if (last < t.length) node.appendChild(document.createTextNode(t.slice(last)));
    }
    var fence = null, list = null, para = [];
    function flushPara(){
      if (!para.length) return;
      var pEl = el("p"); inline(pEl, para.join(" ")); host.appendChild(pEl);
      para = [];
    }
    function flushList(){ if (list){ host.appendChild(list); list = null; } }
    String(text || "").split("\n").forEach(function (raw) {
      var l = raw.trim();
      if (fence){
        if (/^```/.test(l)){
          var pre = el("pre","md-pre");
          pre.appendChild(el("code",null,fence.join("\n")));
          host.appendChild(pre); fence = null;
        } else fence.push(raw);
        return;
      }
      if (/^```/.test(l)){ flushPara(); flushList(); fence = []; return; }
      if (!l){ flushPara(); flushList(); return; }
      var m2 = /^([-*]|\d+[.)])\s+(.*)$/.exec(l);
      if (m2){
        flushPara();
        var ordered = /^\d/.test(m2[1]);
        if (!list || (list.tagName === "OL") !== ordered){
          flushList();
          list = el(ordered ? "ol" : "ul","md-ul");
        }
        var li = el("li"); inline(li, m2[2]); list.appendChild(li);
        return;
      }
      var mh = /^#{1,4}\s+(.*)$/.exec(l);
      if (mh){
        flushPara(); flushList();
        var h = el("div","md-h"); inline(h, mh[1]); host.appendChild(h);
        return;
      }
      flushList();
      para.push(l);
    });
    flushPara(); flushList();
    if (fence){
      var pre2 = el("pre","md-pre");
      pre2.appendChild(el("code",null,fence.join("\n")));
      host.appendChild(pre2);
    }
    if (gallery.length){
      var g2 = el("div","md-gallery");
      gallery.forEach(function (im) {
        if (!/^(https?:\/\/|\/)/.test(im.src)) return;
        if (/\.(mp4|webm|mov)(\?|$)/i.test(im.src)){
          var vid = document.createElement("video");
          vid.src = im.src; vid.controls = true; vid.playsInline = true;
          vid.className = "md-video";
          g2.appendChild(vid);
          return;
        }
        var img = document.createElement("img");
        img.src = im.src; img.alt = im.alt; img.loading = "lazy";
        img.addEventListener("click", function () {
          var box = el("div","md-lightbox");
          var big = document.createElement("img");
          big.src = im.src; big.alt = im.alt;
          box.appendChild(big);
          box.addEventListener("click", function () { box.remove(); });
          document.body.appendChild(box);
        });
        g2.appendChild(img);
      });
      if (g2.children.length) host.appendChild(g2);
    }
  }
