      if (t.id === "pillars") { show(selectedPillar()); return; }
      show(t.id === "overview" ? MID : t.id);
    });
    tabsHost.appendChild(b);
  });

  // ── activity: recency of item events, rendered to the width ─────
  // WHAT'S BEEN HAPPENING LATELY, not a calendar. Recent item events
  // sliced into recency buckets ending at now — a dense mission's
  // window spans hours, a sparse one's weeks. Two renderings of the
  // same data: compact blocks where width is scarce (phones), one
  // smooth line chart per surface where it isn't (desktop). Lines are
  // drawn at the container's native pixel width and redrawn on resize,
  // never stretched — stretching is what makes SVG strokes jagged.
  (function activity(){
    var table = document.getElementById("mc-act");
    var scEl = document.querySelector(".mc-act-scroll");
    var WIDE = 700;
    var lastMode = null, lastW = 0;

    function collect(limit){
      var hasMissionItems = liveItems.some(function (it) { return it.surface_id===MID; });
      var surfaces = (hasMissionItems ? [{id:MID}] : [])
        .concat(PILLARS.map(function(p){return {id:p.pillar_id};}));
      var events = [];
      ITEMS.forEach(function (it) {
        var d = when(it); if (!d) return;
        events.push({t: d.getTime(), sid: it.surface_id});
      });
      events.sort(function (a,b){ return a.t - b.t; });
      if (events.length > limit) events = events.slice(events.length - limit);
      return {surfaces: surfaces, events: events};
    }

    function bucketize(surfaces, events, cols){
      var buckets = {};
      surfaces.forEach(function (s) { buckets[s.id] = new Array(cols).fill(0); });
      var t0 = events.length ? events[0].t : Date.now();
      if (events.length){
        var span = Math.max(1, Date.now() - t0);
        events.forEach(function (e) {
          var idx = Math.min(cols - 1, Math.floor((e.t - t0) / span * cols));
          if (buckets[e.sid]) buckets[e.sid][idx]++;
        });
      }
      return {buckets: buckets, t0: t0};
    }

    function nameCell(sid){
      var th = document.createElement("th");
      var thw = el("span","thw");
      thw.appendChild(band(surfColor(sid)));
      thw.appendChild(el("span","thn",surfName(sid)));
      th.appendChild(thw);
      th.title = "Show " + surfName(sid) + "'s updates over time";
      th.addEventListener("click", function () { showFeedFor(sid); });
      return th;
    }

    function renderBlocks(){
      var COLS = 8;
      var got = collect(100);
      var bk = bucketize(got.surfaces, got.events, COLS);
      var buckets = bk.buckets;
      var max = 1;
      got.surfaces.forEach(function (s) { buckets[s.id].forEach(function (n) { if (n>max) max=n; }); });
      var lvl = function (n) {
        if (!n) return "";
        var r = n / max;
        return r > .75 ? "a4" : r > .5 ? "a3" : r > .25 ? "a2" : "a1";
      };
      got.surfaces.forEach(function (s) {
        var tr = document.createElement("tr");
        tr.appendChild(nameCell(s.id));
        buckets[s.id].forEach(function (n) {
          var td = document.createElement("td");
          var cell = el("div","mc-act-cell " + lvl(n));
          cell.title = surfName(s.id) + ": " + n + " item change" + (n===1?"":"s");
          td.appendChild(cell); tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      // SELF-BALANCING, LOCKED: full names at full size come first; every
      // pixel left over becomes the gap that pushes the cells right. No
      // static widths, no tuning — the row divides itself.
      if (scEl && scEl.clientWidth){
        var cellsBlock = COLS * 13 + (COLS - 1) * 2;
        var names2 = table.querySelectorAll(".thn");
        var need = 0;
        [].forEach.call(names2, function (n) {
          need = Math.max(need, n.scrollWidth);
        });
        var nameCol = need + 12;                       // band + its gap
        var avail = scEl.clientWidth - cellsBlock - 9;
        var fs = 0.64;
        while (nameCol > avail && fs > 0.5){           // tiny screens only
          fs -= 0.02;
          [].forEach.call(names2, function (n) {
            n.style.fontSize = fs.toFixed(2) + "rem"; });
          need = 0;
          [].forEach.call(names2, function (n) {
            need = Math.max(need, n.scrollWidth); });
          nameCol = need + 12;
        }
        var pad = Math.max(8, avail - nameCol);
        table.querySelectorAll("th").forEach(function (th) {
          th.style.width = (nameCol + pad) + "px";
          th.style.maxWidth = (nameCol + pad) + "px";
          th.style.paddingRight = pad + "px";
        });
      }
    }

    function svgEl(tag, attrs){
      var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // Catmull-Rom through the bucket midpoints, emitted as cubic
    // beziers; control-point y clamped to the plot band so a spike
    // never makes the curve dip below its own baseline.
    function smoothPath(pts, yMin, yMax){
      var cl = function (y) { return Math.min(yMax, Math.max(yMin, y)); };
      var r = function (v) { return Math.round(v * 10) / 10; };
      if (!pts.length) return "";
      var d = "M" + r(pts[0][0]) + "," + r(pts[0][1]);
      for (var i = 0; i < pts.length - 1; i++){
        var p0 = pts[Math.max(0, i-1)], p1 = pts[i],
            p2 = pts[i+1], p3 = pts[Math.min(pts.length-1, i+2)];
        d += "C" + r(p1[0] + (p2[0]-p0[0])/6) + "," + r(cl(p1[1] + (p2[1]-p0[1])/6))
           + " " + r(p2[0] - (p3[0]-p1[0])/6) + "," + r(cl(p2[1] - (p3[1]-p1[1])/6))
           + " " + r(p2[0]) + "," + r(p2[1]);
      }
      return d;
    }

    function renderLines(w){
      var got = collect(400);
      var COLS = Math.max(24, Math.min(72, Math.floor(w / 16)));
      var bk = bucketize(got.surfaces, got.events, COLS);
      // light smoothing turns integer bucket counts into an intensity
      // curve; the raw counts stay in the hover title
      var K = [1,3,6,8,6,3,1], KS = 28, KH = 3;
      var smoothed = {}, sharedMax = 0.001;
      got.surfaces.forEach(function (s) {
        var raw = bk.buckets[s.id], out = new Array(COLS).fill(0);
        for (var i = 0; i < COLS; i++){
          var acc = 0;
          for (var j = 0; j < K.length; j++){
            var idx = i + j - KH;
            if (idx >= 0 && idx < COLS) acc += raw[idx] * K[j];
          }
          out[i] = acc / KS;
          if (out[i] > sharedMax) sharedMax = out[i];
        }
        smoothed[s.id] = out;
      });
      // ONE chart, every surface a colored series on the shared scale —
      // the pillar colors are the series identity, the legend names them
      var wrap = el("div","mc-act-chart");
      wrap.id = "mc-act-lines";
      var lg = el("div","mc-act-lgd");
      got.surfaces.forEach(function (s) {
        var chip = el("span","lchip");
        chip.appendChild(band(surfColor(s.id)));
        chip.appendChild(el("span","",surfName(s.id)));
        chip.title = "Show " + surfName(s.id) + "'s updates over time";
        chip.addEventListener("click", function () { showFeedFor(s.id); });
        lg.appendChild(chip);
      });
      wrap.appendChild(lg);
      // tall enough that the overlaid legend never swallows the plot
      var H = Math.max(150, got.surfaces.length * 24 + 40), padT = 8;
      var chartW = Math.max(220, w - 4);
      var baseY = H - 4;
      var svg = svgEl("svg", {width: chartW, height: H,
                              viewBox: "0 0 " + chartW + " " + H});
      svg.appendChild(svgEl("line", {x1: 0, y1: baseY, x2: chartW,
        y2: baseY, stroke: "var(--line)", "stroke-width": 1}));
      got.surfaces.forEach(function (s) {
        var pts = smoothed[s.id].map(function (v, i) {
          return [ (i + 0.5) / COLS * chartW,
                   baseY - (v / sharedMax) * (baseY - padT) ];
        });
        svg.appendChild(svgEl("path", {d: smoothPath(pts, padT, baseY),
          fill: "none", stroke: surfColor(s.id), "stroke-width": 2,
          "stroke-linecap": "round", "stroke-linejoin": "round",
          "stroke-opacity": 0.9}));
      });
      // hover layer: one hit column per bucket, titled with every
      // surface that moved there plus the bucket's recency
      var span = Math.max(1, Date.now() - bk.t0);
      for (var i = 0; i < COLS; i++){
        var lines = [];
        got.surfaces.forEach(function (s) {
          var n = bk.buckets[s.id][i];
          if (n) lines.push(surfName(s.id) + ": " + n);
        });
        if (!lines.length) continue;
        var hit = svgEl("rect", {x: i / COLS * chartW, y: 0,
          width: chartW / COLS, height: H, fill: "transparent"});
        var t = svgEl("title", {});
        t.textContent = agoText(new Date(bk.t0 + (i + 0.5) / COLS * span))
          + "\n" + lines.join("\n");
        hit.appendChild(t);
        svg.appendChild(hit);
      }
      wrap.appendChild(svg);
      var ax = el("div","mc-act-axis");
      ax.appendChild(el("span","", got.events.length
        ? agoText(new Date(bk.t0)) : ""));
      ax.appendChild(el("span","","now"));
      wrap.appendChild(ax);
      scEl.appendChild(wrap);
    }

    function render(){
      var w = scEl ? scEl.clientWidth : 0;
      if (!w && lastMode) return;              // hidden: keep last render
      var mode = w >= WIDE ? "lines" : "blocks";
      table.innerHTML = "";
      var old = document.getElementById("mc-act-lines");
      if (old) old.remove();
      table.style.display = (mode === "lines") ? "none" : "";
      if (mode === "lines") renderLines(w); else renderBlocks();
      var lg = document.querySelector(".mc-activity .legend");
      if (lg) lg.style.display = (mode === "lines") ? "none" : "";
      lastMode = mode; lastW = w;
    }

    render();
    var rt = null;
    window.addEventListener("resize", function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        var w = scEl ? scEl.clientWidth : 0;
        if (!w) return;
        var mode = w >= WIDE ? "lines" : "blocks";
        if (mode !== lastMode || (mode === "lines" && Math.abs(w - lastW) > 32))
          render();
      }, 180);
    });
  })();

  // ── item card renderer ──────────────────────────────────────────
  function card(it, opts){
    opts = opts || {};
    var c = el("article","mc-item"+(it.state?" st-"+it.state:"")+" k-"+it.kind
                 + (opts.mirror ? " mc-mirror" : ""));
    if (opts.mirror){
      // A mirror is a pointer, not the record: tapping it lands on the
      // REAL item in its home view — where the chrome's anchor control
      // (and for open asks, the Answer flow) is mounted.
      c.title = "Open in " + surfName(it.surface_id);
      c.addEventListener("click", function (ev) {
        if (ev.target.closest("a,button,summary")) return;
        if (!document.getElementById("view-" + viewIdFor(it.surface_id))) return;
        rememberPillar(viewIdFor(it.surface_id));
        show(viewIdFor(it.surface_id));
        var target = document.querySelector(
          '.mc-view [data-mc-anchor="' + it.key + '"]');
        if (target){
          var pv = document.getElementById("view-" + viewIdFor(it.surface_id));
          var secEl = target.closest("section.mc-sec");
          if (pv && pv._showSection && secEl && secEl.dataset.sec)
            pv._showSection(secEl.dataset.sec);
          var fold = target.closest("details.mc-finished");
          if (fold) fold.open = true;
          target.scrollIntoView({behavior:"smooth", block:"center"});
          target.classList.remove("mc-flash");
          void target.offsetWidth;   // restart the animation
          target.classList.add("mc-flash");
        }
      });
    }
    if (!opts.mirror){
      c.setAttribute("data-mc-anchor", it.key);
      if (it.kind==="question" && it.state==="open" && it.ask){
        c.setAttribute("data-mc-ask", it.ask);
        // The chrome mounts its Answer control inside this card as a small
        // chip. The card itself is the honest tap target — forward a tap
        // anywhere on it to that control.
        c.addEventListener("click", function (ev) {
          if (ev.target.closest("a,summary")) return;
          var ctl = c.querySelector("[data-mc-control] button")
                 || c.querySelector("[data-mc-control]");
          if (ctl && ctl.click && !ev.target.closest("[data-mc-control]"))
            ctl.click();
        });
      }
    }
    if (it.state) c.dataset.state = it.state;
    c.dataset.kind = it.kind;
    c.dataset.surface = it.surface_id;
    c.dataset.search = (it.title+" "+it.body+" "+(it.evidence||[]).join(" ")).toLowerCase();

    var inner = c;
    if (opts.stepno != null){
      var wrap = el("div");
      c.appendChild(el("div","stepno", String(opts.stepno)));
      c.appendChild(wrap); inner = wrap;
    }
    var top = el("div","top");
    top.setAttribute("data-mc-noexcerpt", "");
    var where = el("span","where");
    if (opts.showSurface){
      where.appendChild(band(surfColor(it.surface_id)));
      where.appendChild(document.createTextNode(shortName(it.surface_id)));
    }
    if (it.owner) where.appendChild(document.createTextNode(
      (opts.showSurface ? " · " : "") + "owner: " + it.owner));
    top.appendChild(where);
    if (it.state) top.appendChild(pill(it.state));
    inner.appendChild(top);
    inner.appendChild(el("h3",null,it.title));

    // THE ASK IS THE POINT: a reader-directed question's carefully
    // worded decision prompt was stored but never shown (only counted
    // in badges + stamped as a dead data-mc-ask attribute). Render it
    // as the card's emphasized lead, above the context body.
    if (it.kind==="question" && it.ask){
      var av = el("div","mc-ask");
      av.appendChild(el("b",null,"Asks you"));
      paras(av, it.ask);
      inner.appendChild(av);
    }
    if (it.kind==="decision" && (it.fork || it.chosen || it.if_wrong)){
      var dv = el("div","mc-dec");
      if (it.fork){ dv.appendChild(el("b",null,"Fork")); paras(dv,it.fork); }
      if (it.chosen){ dv.appendChild(el("b",null,"Chosen")); paras(dv,it.chosen); }
      if (it.if_wrong){ dv.appendChild(el("b",null,"If wrong")); paras(dv,it.if_wrong,"ifw"); }
      inner.appendChild(dv);
      if (it.body){ var b0 = el("div","body"); paras(b0,it.body); inner.appendChild(b0); }
    } else if (it.body){
      var b = el("div","body"); paras(b,it.body); inner.appendChild(b);
    }
    if (it.kind==="exhibit" && it.html){
      var ex = el("div","body"); ex.innerHTML = it.html;   // trusted, same as freeform
      inner.appendChild(ex);
    }
    if ((it.evidence||[]).length){
      var det = document.createElement("details");
      det.appendChild(el("summary",null,"Evidence ("+it.evidence.length+")"));
      var ev = el("div","ev");
      it.evidence.forEach(function (e) { ev.appendChild(el("p",null,e)); });
      det.appendChild(ev); inner.appendChild(det);
    }
    if ((it.refs||[]).length){
      var refs = el("div","mc-refs");
      refs.setAttribute("data-mc-noexcerpt", "");
      it.refs.forEach(function (r) { refs.appendChild(el("span",null,r)); });
      inner.appendChild(refs);
    }
    var d = when(it);
    var whenEl = null;
    if (d) {
      inner.appendChild(whenEl = el("div","mc-when",
        (it.happened_at ? "" : "updated ") + agoText(d)));
      whenEl.title = d.toLocaleString();
      whenEl.setAttribute("data-mc-noexcerpt", "");
    }
    return c;
  }

  // ── per-surface view builder ────────────────────────────────────
  function viewIdFor(sid){ return sid === MID ? "mission-legacy" : sid; }
  function surfaceView(sid){
    var v = el("div","mc-view"); v.id = "view-"+viewIdFor(sid);
    var mine = (sid ? liveItems.filter(function (it) { return it.surface_id===sid; })
                    : liveItems.slice())
      .sort(function (a,b){ return (a.order||0)-(b.order||0) ||
        String(a.title).localeCompare(String(b.title)); });
    if (!mine.length){
      var em = el("div","mc-empty");
      em.appendChild(document.createTextNode("No items yet. Add the first: "));
      var code = el("code",null,'graph mission add '+
        (sid ? surfName(sid).toLowerCase() : "<pillar>")+
        ' <item-id> --kind work --title "…"');
      em.appendChild(code); v.appendChild(em);
      return v;
    }
    var showSurf = !sid;
    var sections = {};
    var charter = [];
    mine.forEach(function (it) {
      if (it.kind === "scope"){ charter.push(it); return; }
      var canon = (it.section && SECTION_ORDER.indexOf(it.section) >= 0)
        ? it.section : (SECTION_OF[it.kind] || "News");
      (sections[canon] = sections[canon] || []).push(it);
    });
    var names = SECTION_ORDER.filter(function (s) {
      if (s === "Tasks") return !!(beadsFor(sid) || {}).length || sections[s];
      return sections[s];
    });
    var host = el("div"); v.appendChild(host);
    var secEls = {};
    var subs = el("div","mc-subtabs");
    var activeName = names[0];
    function showSection(name){
      activeName = name;
      names.forEach(function (n) {
        if (!secEls[n]) return;
        secEls[n].style.display = (n === name) ? "" : "none";
        // the .on class is semantics, not styling: reportWhere and the
        // sweeps identify the active section by it
        secEls[n].classList.toggle("on", n === name);
      });
      [].forEach.call(subs.children, function (b) {
        b.classList.toggle("on", b.dataset.sec === name);
      });
      try { reportWhere(); } catch (e) {}
    }
    v._showSection = showSection;
    SECTION_ORDER.forEach(function (name) {
      var b = el("button", null, name);
      b.dataset.sec = name;
      if (names.indexOf(name) < 0){
        b.classList.add("off");
        b.disabled = true;
        subs.appendChild(b);
        return;
      }
      var hot = 0;
      if (name === "Delivery")
        hot = (sections[name] || []).filter(function (it) {
          return it.kind==="checkpoint" && it.state==="in_progress"; }).length;
      else if (name === "Tasks")
        hot = (beadsFor(sid) || []).filter(function (b2) {
          return b2.state==="running"; }).length;
      else if (name === "Questions")
        hot = (sections[name] || []).filter(function (it) {
          return it.state==="open"; }).length;
      else if (name === "Decisions")
        hot = (sections[name] || []).filter(function (it) {
          return it.faq; }).length;
      if (hot) b.appendChild(el("sup","n", String(hot)));
      b.addEventListener("click", function () { showSection(name); });
      subs.appendChild(b);
    });
    names.forEach(function (name) {
      var sec = el("section","mc-sec");
      sec.dataset.sec = name;
      secEls[name] = sec;
      // THE FILTERS LIVE WHERE THEY APPLY: each section offers toggles
      // for exactly the states its own cards are in — none at all on
      // Objective and scope, which is prose, not a worklist.
      (function sectionFilters(){
        if (name === "Delivery" || name === "Questions") return;
        if (name === "Tasks" && beadsFor(sid)) return;
        var present = {};
        sections[name].forEach(function (it) {
          if (it.state) present[it.state] = (present[it.state]||0)+1;
        });
        var keys = Object.keys(present);
        if (keys.length < 2) return;
        var on = {};
        var fb = el("div","mc-secfilters");
        function apply(){
          var act = Object.keys(on).filter(function (k) { return on[k]; });
          sec.querySelectorAll(".mc-item").forEach(function (n) {
            n.classList.toggle("mc-hidden",
              !!act.length && act.indexOf(n.dataset.state) < 0);
          });
          sec.querySelectorAll("details.mc-finished").forEach(function (d) {
            var vis = d.querySelectorAll(".mc-item:not(.mc-hidden)").length;
            d.open = !!act.length && vis > 0;
            d.classList.toggle("mc-hidden", !!act.length && !vis);
          });
        }
        keys.sort().forEach(function (k) {
          var b = el("button", null, (STATE_LABEL[k] || k) + " " + present[k]);
          b.addEventListener("click", function () {
            on[k] = !on[k]; b.classList.toggle("on", !!on[k]); apply();
          });
          fb.appendChild(b);
        });
        sec.appendChild(fb);
      })();
      var list = (sections[name] || []).slice().sort(function (a, b) {
        var ga = (a.section && a.section !== name) ? a.section : "";
        var gb = (b.section && b.section !== name) ? b.section : "";
        return ga.localeCompare(gb) || (a.order||0)-(b.order||0) ||
          String(a.title).localeCompare(String(b.title));
      });
      // ACCEPTANCE CRITERIA: structured, top-to-bottom, each with its
      // tracked state — the demonstrable-value ladder. Scope prose (the
      // objective) renders as the intro; criteria are the checklist.
      if (name === "Delivery"){
        // Three states by definition: confirmed (demonstrated end-to-end),
        // in progress, pending. Item states map onto that vocabulary.
        function bucket(st){
          if (st==="confirmed") return {mark:"\u2713", cls:"ok", word:"confirmed"};
          if (st==="in_progress") return {mark:"\u27F3", cls:"run", word:"in progress"};
          return {mark:"\u25CB", cls:"todo", word:"pending"};
        }
        var depthMemo = {};
        function beadDepth(sid2, id){
          if (id in depthMemo) return depthMemo[id];
          depthMemo[id] = 0;                       // cycle guard
          var b = beadById(sid2, id);
          if (!b || b.state === "complete") return (depthMemo[id] = 0);
          var d2 = 1;
          (b.deps || []).forEach(function (dep) {
            d2 = Math.max(d2, 1 + beadDepth(sid2, dep));
          });
          return (depthMemo[id] = d2);
        }
        function critRank(it){
          var linked2 = (it.refs || []).filter(function (x) {
            return String(x).indexOf("bead:") === 0; });
          if (!linked2.length) return 99;          // unlinked: authored order, last
          var r2 = 0;
          linked2.forEach(function (x) {
            r2 = Math.max(r2, beadDepth(it.surface_id, x.slice(5)));
          });
          return r2;
        }
        var crits = list.filter(function (it) { return it.kind === "checkpoint"; })
          .sort(function (a,b){
            var ca = bucket(a.state).word === "confirmed" ? 0 : 1;
            var cb = bucket(b.state).word === "confirmed" ? 0 : 1;
            return (ca - cb) || (critRank(a) - critRank(b))
              || (a.order||0) - (b.order||0);
          });
        var counts2 = {confirmed:0, "in progress":0, pending:0};
        crits.forEach(function (it) { counts2[bucket(it.state).word]++; });
        sec.appendChild(filterLegend([
          {word:"confirmed",   count:counts2["confirmed"],
           mark:"\u2713", color:"var(--good)"},
          {word:"in progress", count:counts2["in progress"],
           mark:"\u27F3", color:"var(--warn)", spin:true},
          {word:"pending",     count:counts2["pending"],
           mark:"\u25CB", color:"var(--ind)"},
        ], function (act) {
          sec.querySelectorAll(".mc-crit").forEach(function (r) {
            r.classList.toggle("mc-hidden",
              !!act.length && act.indexOf(r.dataset.word) < 0);
          });
        }));
        function linkedOf(it){
          return (it.refs || []).filter(function (x) {
            return String(x).indexOf("bead:") === 0; })
            .map(function (x) { return beadById(it.surface_id, x.slice(5)); })
            .filter(Boolean);
        }
        crits.forEach(function (it) {
          var bk = bucket(it.state);
          var r = el("div","mc-crit c-" + bk.cls);
          r.setAttribute("data-mc-anchor", it.key);
          r.dataset.state = it.state; r.dataset.kind = it.kind;
          r.dataset.surface = it.surface_id;
          r.dataset.word = bk.word;
          r.style.cursor = "pointer";
          (function (idx2) {
            r.addEventListener("click", function (ev) {
              if (ev.target.closest("a,button")) return;
              openCriterion(crits, idx2, {bucket: bucket, linkedOf: linkedOf});
            });
          })(crits.indexOf(it));
          r.appendChild(markSpan("mk c-" + bk.cls, bk.mark));
          var bx = el("div","bx");
          bx.appendChild(el("div","t", it.title));
          if (it.body) bx.appendChild(el("div","d",
            String(it.body).split(/\n/)[0].slice(0, 140)));
          // TASKS ARE BEADS: a criterion's bead refs render as live
          // progress. All-done work does NOT confirm the criterion — it
          // only says the demonstration is ready to be made.
          var linked = (it.refs || []).filter(function (x) {
            return String(x).indexOf("bead:") === 0; })
            .map(function (x) { return beadById(it.surface_id, x.slice(5)); })
            .filter(Boolean);
          if (linked.length){
            var doneN = linked.filter(function (b) { return b.state === "complete"; }).length;
            if (doneN === linked.length && bk.word === "pending"){
              var rl = el("div","tl2");
              rl.appendChild(el("span","rdy","ready to confirm"));
              bx.appendChild(rl);
            } else if (bk.word === "in progress"){
              linked.forEach(function (b) {
                var ln = el("div","tk s-" + b.state);
                ln.appendChild(markSpan("tmk", BEAD_MARK[b.state] || "\u25E6"));
                ln.appendChild(el("span","tt", b.title));
                ln.title = b.id + " \u00b7 " + b.state;
                bx.appendChild(ln);
              });
            }
          }
          r.appendChild(bx);
          sec.appendChild(r);
        });
        list.filter(function (it) { return it.kind !== "checkpoint"; })
          .forEach(function (it) { sec.appendChild(card(it)); });
        host.appendChild(sec);
        return;
      }
      // The Status section is one standing statement, not a work list:
      // no card chrome, no restated title — just the prose and its age.
      // The anchor survives so comments and asks still attach.
      if (name === "News"){
        // News order: an explicit `order` pins; otherwise newest first.
        // Never alphabetical — a reader expects fresh on top.
        list.sort(function (a, b) {
          return (a.order||0) - (b.order||0)
            || ((when(b)||0) - (when(a)||0));
        });
        list.forEach(function (it) {
            var w = el("div","mc-status-prose");
            w.setAttribute("data-mc-anchor", it.key);
            if (it.state) w.dataset.state = it.state;
            w.dataset.kind = it.kind;
            w.dataset.surface = it.surface_id;
            var d0 = when(it);
            if (d0){
              // Full local timestamp leads every entry — consistent as
              // you scroll — with the no-math relative tail for the
              // recent past (a week).
              var full = d0.toLocaleString(undefined, {
                month:"short", day:"numeric", year:"numeric",
                hour:"numeric", minute:"2-digit", timeZoneName:"short"});
              var rel = (Date.now() - d0.getTime() < 7*86400e3)
                ? " \u00b7 " + agoText(d0) : "";
              var st = el("div","mc-newsstamp", full + rel);
              st.setAttribute("data-mc-noexcerpt","");
              w.appendChild(st);
            }
            var b = el("div","body"); mdInto(b, it.body || it.title);
            w.appendChild(b);
            sec.appendChild(w);
          });
        host.appendChild(sec);
        return;
      }
      if (name === "Tasks"){
        var bl = beadsFor(sid);
        if (bl && bl.length){
          // Same legend control as Delivery; the four-state task ladder
          // is the only vocabulary this tab speaks.
          var bc = {};
          bl.forEach(function (b) { bc[b.state] = (bc[b.state]||0)+1; });
          sec.appendChild(filterLegend([
            {word:"defined", count:bc.defined||0, mark:"\u25E6", color:"var(--ink3)"},
            {word:"specified", count:bc.specified||0, mark:"\u25CB", color:"var(--ind)"},
            {word:"running", count:bc.running||0, mark:"\u27F3", color:"var(--warn)"},
            {word:"complete", count:bc.complete||0, mark:"\u2713", color:"var(--good)"}
          ], {showEmpty: true}, function (act) {
            sec.querySelectorAll(".mc-bead").forEach(function (r) {
              r.classList.toggle("mc-hidden",
                !!act.length && act.indexOf(r.dataset.bstate) < 0);
            });
          }));
          // SINGLE SOURCE OF TRUTH: the work is the beads, read from bd —
          // never duplicated into mission items. Evidence rides along.
          var ORD = {running:0, specified:1, defined:2, complete:3};
          var sorted2 = bl.slice().sort(function (a,b) {
            return (ORD[a.state]||0) - (ORD[b.state]||0);
          });
          sorted2.forEach(function (b, bi) {
            var row = el("div","mc-bead s-" + b.state);
            row.dataset.bstate = b.state;
            row.appendChild(markSpan("bmk", BEAD_MARK[b.state] || "\u25E6"));
            var bx2 = el("div","bx2");
            var t2 = el("div","t2");
            // An epic's parent bead is the pillar's final-acceptance task.
            if (b.epic) t2.appendChild(el("span","ep","acceptance"));
            t2.appendChild(document.createTextNode(b.title));
            bx2.appendChild(t2);
            var meta2 = el("div","m2");
            meta2.appendChild(el("span",null, b.id));
            bx2.appendChild(meta2);
            row.appendChild(bx2);
            row.addEventListener("click", function () {
              openTask(sorted2, bi, {pillar: surfName(sid)}); });
            sec.appendChild(row);
          });
          host.appendChild(sec);
          return;
        }
      }
      if (name === "Questions"){
        var qs2 = list.filter(function (it) { return it.kind === "question"; });
        function qWhen(q){
          return when(q) || (q.asked_at ? new Date(q.asked_at) : 0);
        }
        function newestFirst(a, b){ return (qWhen(b)||0) - (qWhen(a)||0); }
        var blocks = qs2.filter(function (q) {
          return q.state === "open" && q.blocking; }).sort(newestFirst);
        var opens = qs2.filter(function (q) {
          return q.state === "open" && !q.blocking; }).sort(newestFirst);
        var dones = qs2.filter(function (q) { return q.state !== "open"; })
          .sort(newestFirst);
        var ordered = blocks.concat(opens, dones);
        function qRow(q){
          var qcat = q.state !== "open" ? "answered"
            : (q.blocking ? "blocking" : "open");
          var row = el("div","mc-bead q-" + (qcat === "blocking" ? "blocking" : qcat === "open" ? "open" : "answered"));
          row.setAttribute("data-mc-anchor", q.key);
          row.appendChild(markSpan("bmk",
            qcat === "blocking" ? "\u2298" : qcat === "open" ? "?" : "\u2713"));
          var bx3 = el("div","bx2");
          bx3.appendChild(el("div","t2", q.title));
          var replies = (q.discussion || []).filter(function (e2) {
            return e2.type !== "progress"; }).length;
          var d4 = when(q) || (q.asked_at ? new Date(q.asked_at) : null);
          bx3.appendChild(el("div","m2",
            "asked by " + whoName(q.asked_by || "?")
            + (d4 ? " \u00b7 " + agoText(d4) : "")
            + (replies ? " \u00b7 " + replies + " repl" + (replies>1?"ies":"y") : "")));
          row.appendChild(bx3);
          row.addEventListener("click", function () {
            openQuestion(ordered, ordered.indexOf(q));
          });
          return row;
        }
        sec.appendChild(filterLegend([
          {word:"blocking", count:blocks.length, mark:"\u2298", color:"var(--crit)"},
          {word:"open", count:opens.length, mark:"?", color:"var(--warn)"},
          {word:"answered", count:dones.length, mark:"\u2713", color:"var(--good)"}
        ], {showEmpty: true}, function (act) {
          sec.querySelectorAll(".mc-bead").forEach(function (r) {
            r.classList.toggle("mc-hidden",
              !!act.length && act.indexOf(r.dataset.qstate) < 0);
          });
        }));
        ordered.forEach(function (q) {
          var row = qRow(q);
          row.dataset.qstate = q.state !== "open" ? "answered"
            : (q.blocking ? "blocking" : "open");
          sec.appendChild(row);
        });
        host.appendChild(sec);
        return;
      }
      if (name === "Decisions"){
        var decs = list.filter(function (it) { return it.kind === "decision"; })
          .sort(function (a, b) { return (when(b)||0) - (when(a)||0); });
        var favN = decs.filter(function (d) { return d.faq; }).length;
        var dlg = filterLegend([
          {word:"decided", count:decs.length, mark:"\u25C6", color:"var(--ink2)"},
          {word:"favorite", count:favN, mark:"\u2605", color:"var(--warn)"}
        ], {always: true, showEmpty: true}, function (act) {
          sec.querySelectorAll(".mc-bead").forEach(function (r) {
            var cats = (r.dataset.dcat || "").split(" ");
            r.classList.toggle("mc-hidden",
              !!act.length && !act.some(function (a) {
                return cats.indexOf(a) >= 0; }));
          });
        });
        sec.appendChild(dlg);
        sec._dlg = dlg;
        decs.forEach(function (d, di) {
          var row = el("div","mc-bead d-row" + (d.faq ? " d-fav" : ""));
          row.setAttribute("data-mc-anchor", d.key);
          row.dataset.dcat = "decided" + (d.faq ? " favorite" : "");
          row.appendChild(el("span","bmk", d.faq ? "\u2605" : "\u25C6"));
          var bx4 = el("div","bx2");
          bx4.appendChild(el("div","t2", d.title));
          var pick = mdStrip(String(d.chosen || d.body || "").split(/\n/)[0]);
          if (pick) bx4.appendChild(el("div","x2", pick.slice(0, 120)));
          row.appendChild(bx4);
          row.addEventListener("click", function () { openDecision(decs, di); });
          sec.appendChild(row);
        });
        host.appendChild(sec);
        return;
      }
      var steps = list.filter(function (it) { return it.kind==="checkpoint"; });
      var rest = list.filter(function (it) { return it.kind!=="checkpoint"; });
      if (steps.length){
        var arc = el("div","mc-arc");
        steps.forEach(function (s,i){ arc.appendChild(card(s,{stepno:i+1})); });
        sec.appendChild(arc);
      }
      // FINISHED WORK FOLDS AWAY. The record stays (count on the fold, cards
      // one tap away, anchors still in the DOM for the chrome), but a reader
      // scrolling a pillar sees what is ALIVE. Checkpoints stay unfolded —
      // an arc's completed gates are its narrative, not clutter — and
      // decisions/scope/status are their own sections with their own logic.
      var FOLDS = {question:1};
      var TERMINAL = {answered:1};
      var live_ = rest.filter(function (it) { return !(FOLDS[it.kind] && TERMINAL[it.state]); });
      var finished = rest.filter(function (it) { return FOLDS[it.kind] && TERMINAL[it.state]; });
      var lastGroup = null;
      live_.forEach(function (it) {
        var g = (it.section && it.section !== name) ? it.section : "";
        if (g !== lastGroup){
          if (g) sec.appendChild(el("h3","mc-group",g));
          lastGroup = g;
        }
        sec.appendChild(card(it, {showSurface: showSurf}));
      });
      if (finished.length){
        var fold = document.createElement("details");
        fold.className = "mc-finished";
        fold.appendChild(el("summary",null,
          finished.length + " answered question" + (finished.length>1?"s":"")));
        finished.forEach(function (it) { fold.appendChild(card(it, {showSurface: showSurf})); });
        sec.appendChild(fold);
      }
      host.appendChild(sec);
    });
    if (names.length) v.insertBefore(subs, v.firstChild);
    if (charter.length){
      var cpan = el("div","mc-charter");
      charter.forEach(function (it) {
        var w2 = el("div","mc-status-prose");
        w2.setAttribute("data-mc-anchor", it.key);
        var b2 = el("div","body"); mdInto(b2, it.body || it.title);
        w2.appendChild(b2);
        var d5 = when(it);
        if (d5){
          var wh2 = el("div","mc-when","updated " + agoText(d5));
          wh2.title = d5.toLocaleString();
          w2.appendChild(wh2);
        }
        cpan.appendChild(w2);
      });
      cpan.style.display = "none";
      v._charterOpen = false;
      v._toggleCharter = function () {
        v._charterOpen = !v._charterOpen;
        cpan.style.display = v._charterOpen ? "" : "none";
        subs.style.display = v._charterOpen ? "none" : "";
        host.style.display = v._charterOpen ? "none" : "";
        return v._charterOpen;
      };
      v.insertBefore(cpan, v.firstChild);
    }
    showSection(names[0]);
    return v;
  }

  // ── overview view (mission surface + pillar summaries) ──────────
  function overviewView(){
    var v = el("div","mc-view"); v.id = "view-"+MID;
    var sec = el("section","mc-sec");
    sec.appendChild(el("h2",null,"Pillars"));
    PILLARS.forEach(function (p) {
      var pc = el("div","mc-psum");
      // Card taps land on News; the tasks/delivery labels and the ask
      // badge deep-link to their own sections (operator ruling).
      function goTo(section){
        rememberPillar(p.pillar_id);
        show(p.pillar_id);
        var pv = document.getElementById("view-" + p.pillar_id);
        if (!pv || !pv._showSection) return;
        var ok = pv.querySelector('.mc-sec[data-sec="' + section + '"]');
        var first = pv.querySelector(".mc-sec");
        pv._showSection(ok ? section
          : (first && first.dataset.sec) || section);
      }
      pc.addEventListener("click",function(){ goTo("News"); });
      var hd = el("div","hd");
      hd.appendChild(band(p.color || "#8391a8"));
      hd.appendChild(el("b",null,p.name));
      var mine = liveItems.filter(function (it) { return it.surface_id===p.pillar_id; });
      // blocked = an open question is preventing forward progress.
      // Task dependency order is sequencing, not blockage.
      var blocked = mine.filter(function (it) {
        return it.kind === "question" && it.state === "open" && it.blocking;
      }).length;
      var asks = mine.filter(function (it) {
        return it.kind==="question" && it.state==="open" && it.ask; }).length;
      pc.appendChild(hd);
      var status = mine.filter(function (it) { return it.kind==="status"; })[0];
      if (status) pc.appendChild(el("div","last",
        mdStrip(String(status.body||status.title).split(/\n\s*\n/)[0])));
      else if (p.last_done) pc.appendChild(el("div","last",p.last_done));
      // Between the text and the colour bar, per the operator: freshness
      // left, ask/blocked badges right; the title keeps its full width
      // above.
      var freshest0 = mine.slice().sort(function (a,b) {
        return (when(b)||0) - (when(a)||0); })[0];
      var fw0 = freshest0 && when(freshest0);
      if (asks || blocked || fw0) {
        var miniRow = el("div","mc-minirow");
        if (fw0) miniRow.appendChild(el("span","ago","active " + agoText(fw0)));
        miniRow.appendChild(el("span","grow"));
        if (asks || blocked) {
          var mini = el("span","mc-mini");
          mini.title = (asks ? asks + " waiting on you" : "")
            + (asks && blocked ? " \u00b7 " : "")
            + (blocked ? blocked + " blocked" : "");
          mini.addEventListener("click", function (ev) {
            ev.stopPropagation();
            goTo("Questions");
          });
          if (asks) mini.appendChild(el("i","m-a",asks + " ask" + (asks>1?"s":"")));
          if (blocked) mini.appendChild(el("i","m-c",blocked + " blocked"));
          miniRow.appendChild(mini);
        }
        pc.appendChild(miniRow);
      }
      // TWO BARS, TWO TRUTHS. Criteria bound the mission: confirmed /
      // in progress / pending is the value ladder. Beads are the work
      // underneath. Each bar reads its own source; neither pretends to
      // be the other.
      function segbar(segs, total, title){
        var bar = el("div","mc-statbar");
        segs.forEach(function (sg) {
          if (!sg[0]) return;
          var i3 = el("i"); i3.style.width = (100*sg[0]/total) + "%";
          i3.style.background = sg[1];
          bar.appendChild(i3);
        });
        bar.title = title;
        return bar;
      }
      function statrow(label, bar, frac, section){
        var row = el("div","mc-statrow");
        var lb = el("span","lb lb-link",label);
        lb.addEventListener("click", function (ev) {
          ev.stopPropagation();
          goTo(section);
        });
        row.appendChild(lb);
        row.appendChild(bar);
        row.appendChild(el("span","fr",frac));
        return row;
      }
      var bl2 = beadsFor(p.pillar_id);
      if (bl2 && bl2.length){
        var bc2 = {complete:0, running:0, specified:0, defined:0};
        bl2.forEach(function (b) { bc2[b.state] = (bc2[b.state]||0)+1; });
        pc.appendChild(statrow("tasks",
          segbar([[bc2.complete,"var(--good)"],[bc2.running,"var(--warn)"],
                  [bc2.specified,"var(--accent-dim)"],[bc2.defined,"var(--line2)"]],
            bl2.length,
            bc2.complete + " complete \u00b7 " + bc2.running + " running \u00b7 "
              + bc2.specified + " specified \u00b7 " + bc2.defined + " defined"),
          bc2.complete + "/" + bl2.length, "Tasks"));
      }
      var crits2 = mine.filter(function (it) { return it.kind === "checkpoint"; });
      if (crits2.length){
        var cc = {ok:0, run:0, todo:0};
        crits2.forEach(function (it) {
          if (it.state==="confirmed") cc.ok++;
          else if (it.state==="in_progress") cc.run++;
          else cc.todo++;
        });
        pc.appendChild(statrow("delivery",
          segbar([[cc.ok,"var(--good)"],[cc.run,"var(--warn)"],[cc.todo,"var(--line2)"]],
            crits2.length,
            cc.ok + " confirmed \u00b7 " + cc.run + " in progress \u00b7 " + cc.todo + " pending"),
          cc.ok + "/" + crits2.length, "Delivery"));
      }

      sec.appendChild(pc);
    });
    v.appendChild(sec);
    return v;
  }

  // ── cross-pillar views ──────────────────────────────────────────
  function collectionView(id, title, filter, empty){
    var v = el("div","mc-view"); v.id = "view-"+id;
    var all = liveItems.filter(filter).sort(function (a,b){
      var da = when(a), db_ = when(b);
      return (db_?db_.getTime():0) - (da?da.getTime():0);
    });
    if (!all.length){ v.appendChild(el("div","mc-empty",empty)); return v; }
    var host = el("section","mc-sec");
    host.appendChild(el("h2",null,title+" — every pillar"));
    all.forEach(function (it) {
      host.appendChild(card(it,{showSurface:true, mirror:true})); });
    v.appendChild(host);
    return v;
  }

  // THE FEED IS EVENTS, NOT ITEMS — derived entirely from streams the
  // item store already records (history transitions, work entries,
  // discussion, answers, post and decision timestamps). No new stream.
  function feedView(){
    var v = el("div","mc-view"); v.id = "view-feed";
    var events = [];
    function ev(cat, at, it, text){
      var d = at instanceof Date ? at : new Date(at);
      if (isNaN(d)) return;
      events.push({cat:cat, d:d, it:it, text:text});
    }
    liveItems.forEach(function (it) {
      if (it.kind === "checkpoint"){
        (it.history || []).forEach(function (h) {
          if (h.to === "confirmed") ev("finished", h.at, it, "confirmed: " + it.title);
          else if (h.to === "in_progress") ev("progress", h.at, it, "started: " + it.title);
        });
        (it.work || []).forEach(function (w) { ev("progress", w.at, it, w.text); });
        if (!(it.history || []).length && it.state === "confirmed" && when(it))
          ev("finished", when(it), it, "confirmed: " + it.title);
      } else if (it.kind === "question"){
        var askedAt = it.asked_at || (when(it) && when(it).toISOString());
        if (askedAt)
          ev(it.blocking && it.state === "open" ? "blocking" : "progress",
             askedAt, it, "asked: " + it.title);
        (it.discussion || []).forEach(function (e2) { ev("progress", e2.at, it, e2.text); });
        if (it.answer && it.answer.at)
          ev("finished", it.answer.at, it, "answered: " + it.title);
      } else if (it.kind === "status"){
        if (when(it)) ev("news", when(it), it,
          mdStrip(String(it.body || it.title).split(/\n/)[0]).slice(0, 140));
      } else if (it.kind === "decision"){
        if (when(it)) ev("decided", when(it), it, it.title);
      }
    });
    events.sort(function (a, b) { return b.d - a.d; });
    if (!events.length){ v.appendChild(el("div","mc-empty",
      "Nothing has happened yet \u2014 the feed builds itself from what the pillars record.")); return v; }
    var CATS = [
      {key:"blocking", word:"blocking", mark:"\u2298", color:"var(--crit)"},
      {key:"progress", word:"progress", mark:"\u27F3", color:"var(--warn)"},
      {key:"finished", word:"finished", mark:"\u2713", color:"var(--good)"},
      {key:"news",     word:"news",     mark:"\u2022", color:"var(--ink2)"},
      {key:"decided",  word:"decided",  mark:"\u25C6", color:"var(--ink2)"}
    ];
    var cc2 = {};
    events.forEach(function (e2) { cc2[e2.cat] = (cc2[e2.cat]||0)+1; });
    // 3+2 on purpose: the work pulse (state colours) on one line, the
    // record (stateless kinds) on the other, each with its label.
    var actFeed = {};
    function applyCats(){
      var act = Object.keys(actFeed).filter(function (k) { return actFeed[k]; });
      v.querySelectorAll(".mc-feed-row").forEach(function (r) {
        r.classList.toggle("mc-bhidden",
          !!act.length && act.indexOf(r.dataset.bucket) < 0);
      });
      v.querySelectorAll(".mc-flegend .fl").forEach(function (c) {
        var on = act.indexOf(c.dataset.word) >= 0;
        c.classList.toggle("on", on);
        c.classList.toggle("dim", !!act.length && !on);
      });
      applyFeedFilter();
    }
    [["tasks", CATS.slice(0,3)], ["updates", CATS.slice(3)]].forEach(function (grp) {
      var lg = filterLegend(
        grp[1].map(function (c) {
          return {word:c.word, count:cc2[c.key]||0, mark:c.mark, color:c.color};
        }),
        {always: true, showEmpty: true},
        function () {});
      lg.classList.add("fl-grp");
      lg.querySelectorAll(".fl").forEach(function (b) {
        b.addEventListener("click", function (ev2) {
          ev2.stopImmediatePropagation();
          actFeed[b.dataset.word] = !actFeed[b.dataset.word];
          applyCats();
        }, true);
      });
      var wrap = el("div","fl-line");
      wrap.appendChild(el("span","fl-lab",grp[0]));
      wrap.appendChild(lg);
      v.appendChild(wrap);
    });
    var MARKS2 = {};
    CATS.forEach(function (c) { MARKS2[c.key] = c.mark; });
    var lastDay = "";
    events.forEach(function (e2) {
      var day = e2.d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      if (day !== lastDay){ v.appendChild(el("div","mc-feed-day",day)); lastDay = day; }
      var row = el("div","mc-feed-row fe-" + e2.cat);
      row.dataset.surface = e2.it.surface_id;
      row.dataset.bucket = e2.cat;
      row.appendChild(markSpan("fmk", MARKS2[e2.cat]));
      var main = el("div","main");
      var who = el("div","who");
      who.appendChild(band(surfColor(e2.it.surface_id)));
      who.appendChild(el("span","k",surfName(e2.it.surface_id)));
      main.appendChild(who);
      main.appendChild(el("div","t",e2.text));
      row.appendChild(main);
      row.appendChild(el("span","fago",agoText(e2.d)));
      row.addEventListener("click",function(){ gotoItem(e2.it); });
      v.appendChild(row);
    });
    return v;
  }

  // A pillar's own timeline: the feed, narrowed to one surface. Reached
  // by tapping the pillar's row in the activity grid; one chip clears it.
  function applyFeedFilter(){
    var v = document.getElementById("view-feed");
    if (!v) return;
    var sid = v.dataset.filter || "";
    // Filtered to one pillar, the per-row pillar name is redundant.
    v.classList.toggle("mc-feed-filtered", !!sid);
    var old = v.querySelector(".mc-feed-note");
    if (old) old.remove();
    v.querySelectorAll(".mc-feed-row").forEach(function (r) {
      r.classList.toggle("mc-hidden", !!sid && r.dataset.surface !== sid);
    });
    function rowShown(r){
      return !r.classList.contains("mc-hidden")
          && !r.classList.contains("mc-bhidden");
    }
    var kids = [].slice.call(v.children);
    for (var i = 0; i < kids.length; i++){
      if (!kids[i].classList.contains("mc-feed-day")) continue;
      var any = false;
      for (var j = i + 1; j < kids.length
           && !kids[j].classList.contains("mc-feed-day"); j++){
        if (kids[j].classList.contains("mc-feed-row") && rowShown(kids[j]))
          any = true;
      }
      kids[i].classList.toggle("mc-hidden", !any);
    }
    if (sid){
      var chip = el("button","mc-feed-note",
        "Showing " + surfName(sid) + " only — show all");
      chip.addEventListener("click", function () {
        v.dataset.filter = ""; applyFeedFilter();
      });
      v.insertBefore(chip, v.firstChild);
    }
  }
  // The one way any reference reaches an item: its pillar's page, with
  // the section revealed and the card flashed.
  function gotoItem(it){
    var vid = viewIdFor(it.surface_id);
    if (!document.getElementById("view-" + vid)) return;
    rememberPillar(vid);
    show(vid);
    var target = document.querySelector(
      '#view-' + (window.CSS && CSS.escape ? CSS.escape(vid) : vid)
      + ' [data-mc-anchor="' + it.key + '"]');
    if (!target) return;
    var pv = document.getElementById("view-" + vid);
    var secEl = target.closest("section.mc-sec");
    if (pv && pv._showSection && secEl && secEl.dataset.sec)
      pv._showSection(secEl.dataset.sec);
    var fold = target.closest("details.mc-finished");
    if (fold) fold.open = true;
    target.scrollIntoView({behavior:"smooth", block:"center"});
    target.classList.remove("mc-flash");
    void target.offsetWidth;
    target.classList.add("mc-flash");
  }

  function showFeedFor(sid){
    var v = document.getElementById("view-feed");
    if (v){ v.dataset.filter = sid || ""; }
    show("feed");
    applyFeedFilter();
  }

  // ── assemble views + nav ────────────────────────────────────────
  var views = document.getElementById("mc-views");
  views.appendChild(overviewView());
  PILLARS.forEach(function (p) { views.appendChild(surfaceView(p.pillar_id)); });
  if (liveItems.some(function (it) { return it.surface_id === MID; }))
    views.appendChild(surfaceView(MID));

  // ── ONE PILLAR AT A TIME. The selector is a name: closed, it shows
  // only the current pillar; tap it for the list. No merged view, no
  // chip strip — choosing is the page's first act. ──
  var PSEL_KEY = "mcSelectedPillar:" + MID;
  function pillarChoices(){
    var out = PILLARS.map(function (p) {
      return {id: p.pillar_id, name: p.name, color: p.color || "#8391a8"};
    });
    if (document.getElementById("view-mission-legacy"))
      out.push({id: "mission-legacy", name: "Mission (legacy)", color: "#e2e8f0"});
    return out;
  }
  function selectedPillar(){
    var saved = null;
    try { saved = localStorage.getItem(PSEL_KEY); } catch (e) {}
    if (saved && document.getElementById("view-" + saved)) return saved;
    return pillarChoices()[0].id;
  }
  function rememberPillar(pid){
    try { localStorage.setItem(PSEL_KEY, pid); } catch (e) {}
  }
  // BUILT ONCE, TOGGLED BY CLASS. Rebuilding the selector's DOM on every
  // toggle put freshly-created nodes under an in-flight tap whenever
  // anything re-rendered between paint and touch (the chrome re-renders
  // on every live presence event) — on a phone the tap landed on nothing
  // or on the wrong row. Stable nodes; only a class changes.
  var pselOpen = false, pselFor = null;
  function renderPsel(){
    var host = document.getElementById("mc-psel");
    var cur = pillarChoices().filter(function (c) {
      return c.id === currentView; })[0];
    if (!cur){ host.innerHTML = ""; pselFor = null; return; }
    if (pselFor !== cur.id){
      host.innerHTML = "";
      var btn = el("button","mc-psel-btn");
      var lbl = el("span","mc-plabel");
      lbl.appendChild(band(cur.color));
      lbl.appendChild(el("b",null,cur.name));
      btn.appendChild(lbl);
      btn.addEventListener("click", function () {
        pselOpen = !pselOpen; renderPsel();
      });
      host.appendChild(btn);
      var vEl = document.getElementById("view-" + cur.id);
      if (vEl && vEl._toggleCharter){
        var eye = el("button","pinfo");
        eye.title = "About this pillar";
        eye.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true">'
          + '<circle cx="8" cy="8" r="6.4" fill="none" '
          + 'stroke="currentColor" stroke-width="1.3"/>'
          + '<circle cx="8" cy="5.1" r="1.05" fill="currentColor"/>'
          + '<path d="M8 7.3v4.2" stroke="currentColor" '
          + 'stroke-width="1.7" stroke-linecap="round"/></svg>';
        eye.classList.toggle("on", !!vEl._charterOpen);
        eye.addEventListener("click", function () {
          eye.classList.toggle("on", vEl._toggleCharter());
        });
        host.appendChild(eye);
      }
      var menu = el("div","mc-psel-menu");
      pillarChoices().forEach(function (c) {
        var r = el("button","mc-psel-row" + (c.id === cur.id ? " on" : ""));
        var rl = el("span","mc-plabel");
        rl.appendChild(band(c.color));
        rl.appendChild(el("span",null,c.name));
        r.appendChild(rl);
        r.addEventListener("click", function () {
          pselOpen = false;
          rememberPillar(c.id);
          show(c.id);
        });
        menu.appendChild(r);
      });
      host.appendChild(menu);
      pselFor = cur.id;
    }
    host.classList.toggle("open", pselOpen);
    // The name shrinks to fit before it ellipsizes: a long pillar name on
    // a phone reads smaller, not truncated. No-op where there is room.
    var nameEl = host.querySelector(".mc-psel-btn b");
    if (nameEl){
      nameEl.style.fontSize = "";
      var size = 0.95;
      while (nameEl.scrollWidth > nameEl.clientWidth && size > 0.6){
        size -= 0.02;
        nameEl.style.fontSize = size.toFixed(2) + "rem";
      }
    }
  }
  // BLOCKERS: the mission-level cut is only what stands in the way —
  // open questions flagged blocking, grouped by the pillar they block.
  var qView = el("div","mc-view");
  qView.id = "view-questions";
  (function buildBlockers(){
    var blocks = liveItems.filter(function (it) {
      return it.kind === "question" && it.state === "open" && it.blocking;
    });
    if (!blocks.length){
      qView.appendChild(el("div","mc-empty",
        "No blockers \u2014 nothing is preventing forward progress."));
      return;
    }
    var surfOrder = [MID].concat(PILLARS.map(function (p) { return p.pillar_id; }));
    surfOrder.forEach(function (sid2) {
      var mineB = blocks.filter(function (q) { return q.surface_id === sid2; })
        .sort(function (a, b) { return (when(b)||0) - (when(a)||0); });
      if (!mineB.length) return;
      var sec2 = el("section","mc-sec");
      var h2 = el("h2");
      h2.appendChild(band(surfColor(sid2)));
      h2.appendChild(document.createTextNode(" " + surfName(sid2)));
      sec2.appendChild(h2);
      mineB.forEach(function (q, qi) {
        var row = el("div","mc-bead q-blocking");
        row.appendChild(markSpan("bmk","\u2298"));
        var bx5 = el("div","bx2");
        bx5.appendChild(el("div","t2", q.title));
        var d7 = when(q) || (q.asked_at ? new Date(q.asked_at) : null);
        bx5.appendChild(el("div","m2",
          "asked by " + whoName(q.asked_by || "?")
          + (d7 ? " \u00b7 " + agoText(d7) : "")));
        row.appendChild(bx5);
        row.addEventListener("click", function () {
          openQuestion(mineB, qi, {back: "Blockers"}); });
        sec2.appendChild(row);
      });
      qView.appendChild(sec2);
    });
  })();
  views.appendChild(qView);

  // ── Q&A conversations, inline under the Questions tab. This was the
  // one thing only the bar's chat bubble showed; the bubble is gone, so
  // the record lives here — filterable, tappable through to the chrome's
  // entry view, with Ask summoning the chrome's composer. ──
  views.appendChild(feedView());
  views.appendChild(chatView());
  function chatView(){
    var v = el("div","mc-view"); v.id = "view-chat";
    var CHAT = {};
    try {
      var cEl = document.getElementById("mc-chat");
      if (cEl) CHAT = JSON.parse(cEl.textContent);
    } catch (e) {}
    var cur = PILLARS.length ? PILLARS[0].pillar_id : null;
    var head = el("div","mc-psel");
    var log = el("div","mc-chatlog");
    var open2 = false;
    function renderHead(){
      head.innerHTML = "";
      var pb = el("button","mc-psel-btn");
      var lbl2 = el("span","mc-plabel");
      lbl2.appendChild(band(surfColor(cur)));
      lbl2.appendChild(el("b",null,surfName(cur)));
      pb.appendChild(lbl2);
      pb.addEventListener("click", function () { open2 = !open2; renderHead(); });
      head.appendChild(pb);
      if (open2){
        head.classList.add("open");
        var menu = el("div","mc-psel-menu");
        PILLARS.forEach(function (p2) {
          var r = el("button","mc-psel-row" + (p2.pillar_id === cur ? " on" : ""));
          var rl = el("span","mc-plabel");
          rl.appendChild(band(p2.color));
          rl.appendChild(el("span",null,p2.name));
          r.appendChild(rl);
          r.addEventListener("click", function () {
            cur = p2.pillar_id; open2 = false; renderHead(); renderLog();
          });
          menu.appendChild(r);
        });
        head.appendChild(menu);
      } else head.classList.remove("open");
    }
    function msgEl(m){
      var en = el("div","qe");
      var wh = el("div","qwho");
      wh.appendChild(el("b",null,whoName(m.by)));
      wh.appendChild(document.createTextNode(" \u00b7 " + agoText(new Date(m.at))));
      en.appendChild(wh);
      var tx = el("div","qtx"); mdInto(tx, m.text);
      en.appendChild(tx);
      return en;
    }
    function renderLog(){
      log.innerHTML = "";
      var msgs = (CHAT[cur] || []).slice().sort(function (a,b) {
        return new Date(a.at) - new Date(b.at);
      });
      if (!msgs.length)
        log.appendChild(el("div","mc-empty","No messages yet."));
      msgs.forEach(function (m) { log.appendChild(msgEl(m)); });
    }
    var comp = el("div","qcomp");
    var ta = document.createElement("textarea");
    ta.placeholder = "Message the pillar\u2026";
    comp.appendChild(ta);
    var send = el("button","qsend","Send");
    // Dictation integration seam: the voice layer fills the textarea via
    // system dictation and triggers SEND here — window.__missionChatSend()
    // or postMessage("mission:chat-send"). It never needs the live text.
    window.__missionChatSend = function (text) {
      if (typeof text === "string" && text.trim()) ta.value = text;
      send.click();
    };
    window.addEventListener("message", function (ev) {
      if (ev && ev.data === "mission:chat-send") send.click();
    });
    send.addEventListener("click", function () {
      var t2 = ta.value.trim();
      if (!t2) return;
      (CHAT[cur] = CHAT[cur] || []).push(
        {by:"you", at:new Date().toISOString(), text:t2});
      ta.value = ""; renderLog();
      try {
        var pid = cur;
        fetch("/api/mission/chat/" + MID + "/" + pid, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: t2})
        }).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (out) {
            if (out && out.entries && pid === cur){
              CHAT[pid] = out.entries; renderLog();
            }
          }).catch(function () {});
      } catch (e) {}
    });
    comp.appendChild(send);
    comp.appendChild(el("div","qhint",
      "A free conversation with the pillar \u2014 nothing here is tracked. "
      + "The pillar decides what becomes a question, a decision, or a task."));
    renderHead(); renderLog();
    v.appendChild(head); v.appendChild(log); v.appendChild(comp);
    return v;
  }
  var currentView = null;
  function show(id){
    currentView = id;
    document.querySelectorAll(".mc-view").forEach(function (n) {
      n.classList.toggle("on", n.id === "view-"+id);
    });
    var named = {questions:"Questions", feed:"Feed", chat:"Chat"};
    var fam = named[id] ? id
      : (id === MID ? "overview" : "pillars");
    document.querySelectorAll(".mc-tabs button").forEach(function (b) {
      b.classList.toggle("on", b.id === "tab-" + fam);
    });
    var psel = document.getElementById("mc-psel");
    if (psel) psel.style.display = (fam === "pillars") ? "" : "none";
    if (fam === "pillars") renderPsel();
    reportWhere();
  }
  function reportWhere(){
    try {
      if (window.parent === window) return;
      var v = document.querySelector(".mc-view.on");
      var sec = v && v.querySelector && v.querySelector(".mc-sec.on");
      window.parent.postMessage({
        type: "mission:where",
        view: currentView === MID ? "overview" : currentView,
        section: (sec && sec.dataset.sec) || "",
      }, "*");
    } catch (e) {}
  }
  // The activity panel is mission-wide chrome, but it belongs to the
  // overview: pillar views get their vertical room back.
  var ov = document.getElementById("view-"+MID);
  ov.insertBefore(document.querySelector(".mc-activity"), ov.firstChild);

  // LANDING IS THE OVERVIEW, from every door: the mission URL, a pillar
  // URL out of the session viewer, a PWA restoring its last route. The
  // baked focus stays in the data for anything that wants it, but the
  // reader always starts at the summary and taps into a pillar from
  // there — arriving somewhere unnameable was worse than one extra tap.
  show(MID);

  // ── load diagnostics — visible, so a slow open can be read off the
  //    screen instead of guessed at. All times are ms since navigation
  //    start (the moment the link was tapped, srcdoc paths excepted). ──
  (function diag(){
    // Mission accomplished (5.3 s -> tens of ms) and retired from the
    // screen. The instrumentation stays: add ?diag=1 to any mission URL
    // to bring the strip back, and the console.log below always fires.
    var DIAG_ON = /[?&]diag=1/.test(location.search);
    var T_DONE = performance.now();
    var kb = function (n) { return (n/1024).toFixed(0) + " KB"; };
    var ms = function (n) { return n >= 2500 ? (n/1000).toFixed(1) + " s"
                                             : Math.round(n) + " ms"; };
    var itemsKB = document.getElementById("mc-data").textContent.length;
    var nav = (performance.getEntriesByType &&
               performance.getEntriesByType("navigation")[0]) || null;
    var parts = [];
    if (nav && nav.decodedBodySize)
      parts.push("doc " + kb(nav.decodedBodySize) +
                 (nav.transferSize ? " (wire " + kb(nav.transferSize) + ")" : ""));
    if (nav && nav.responseEnd)
      parts.push("net " + ms(nav.responseEnd - nav.startTime));
    parts.push("chrome+parse " + ms(T_SCRIPT));
    parts.push("items " + kb(itemsKB) + "/" + (DATA.items||[]).length);
    parts.push("render " + ms(T_DONE - T_SCRIPT));
    parts.push("interactive " + ms(T_DONE));
    // Which serving path built this document. A srcdoc frame is the relay
    // share-link viewer: its bootloader fetched the document over the
    // tunnel BEFORE this page's clock started, so seconds of white screen
    // with fast numbers here means the time went to that transport layer.
    var framed = !!document.querySelector('base[href="about:srcdoc"]') ||
                 location.protocol === "about:";
    parts.push(framed ? "via relay srcdoc (transport not visible here)"
                      : "direct");
    var line = el("div", null, "⏱ " + parts.join(" · "));
    line.id = "mc-diag";
    line.style.cssText = "font-family:var(--mono);font-size:.68rem;" +
      "color:var(--ink3);background:var(--bg2);border:1px solid var(--line);" +
      "border-radius:7px;padding:5px 9px;margin:0 0 12px;overflow-x:auto;" +
      "white-space:nowrap";
    if (DIAG_ON) {
      var glance = document.getElementById("mc-glance");
      glance.parentNode.insertBefore(line, glance.nextSibling);
    }
    // Late chrome/network work shows up as the page staying busy after we
    // finish; stamp the load event too so the gap is attributable.
    window.addEventListener("load", function () {
      line.textContent += " · window.load " + ms(performance.now());
    });
    if (window.console && console.log)
      console.log("mc-structured diag", {script_at: T_SCRIPT,
        json_parse: T_PARSED - T_SCRIPT, render: T_DONE - T_PARSED,
        items_bytes: itemsKB, nav: nav});
  })();
})();
</script>
