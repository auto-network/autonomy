<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control — Planning desk</title><script src="/static/vendor/tailwind-browser-4.3.3.min.js"></script><script defer src="/static/vendor/alpine-3.15.12.min.js"></script></head><body>
<style>
:root{color-scheme:dark;--bg:#111619;--panel:#1b2226;--line:#333e44;--muted:#a0afb6;--text:#eef0ed;--accent:#dcc9a5;--green:#a8cbb5}*{box-sizing:border-box}body{margin:0;background:var(--bg)!important;color:var(--text)!important;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:inherit}[x-cloak]{display:none!important}h1,h2,h3,p{margin:0}.shell{max-width:1280px;margin:auto;padding:0 26px 32px}.top{min-height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}.brand{font-size:17px;font-weight:650;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}.mark{display:grid;grid-template-columns:7px 7px;gap:4px;transform:rotate(-8deg)}.mark i{height:7px;border:1px solid var(--accent);border-radius:1px}.mark i:last-child{background:var(--accent)}.eyebrow{font-size:10px;font-weight:650;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.ghost{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:transparent;min-height:44px}.ghost:hover{background:#293239}.primary{display:inline-flex;align-items:center;justify-content:center;gap:16px;border:1px solid var(--accent);background:var(--accent);color:#24211b;border-radius:7px;padding:12px 18px;font-weight:650;min-height:46px;text-decoration:none}.primary:hover{background:#ecddbf}.textbtn{border:0;background:none;color:var(--muted);padding:10px 0;min-height:44px}.textbtn:hover{color:var(--text)}.intro{padding:28px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:clamp(29px,3.2vw,38px);font-weight:500;letter-spacing:-1.3px;line-height:1.18}.intro p{margin-top:9px;color:var(--muted)}.hero{display:grid;border:1px solid #685e4d;border-radius:9px;overflow:hidden;background:#25231f}.heromain{padding:24px 27px}.hero .eyebrow{color:var(--accent)}.hero h2{font-size:27px;line-height:1.25;font-weight:500;letter-spacing:-.7px;margin:12px 0;max-width:610px}.hero p{color:#c6bfb2;max-width:610px;font-size:14px}.heroside{background:#2e2a23;padding:23px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;font-size:12px;color:#c8bfae}.heroside strong{display:block;color:#eee4d2;font-size:15px;font-weight:550;margin:5px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:27px 0 15px;gap:16px}h3{font-size:16px;font-weight:550}.filters{display:flex;gap:5px;overflow:auto;margin-bottom:18px}.filter{border:1px solid transparent;background:none;border-radius:6px;color:var(--muted);padding:7px 11px;min-height:38px;white-space:nowrap}.filter.active{background:#293239;border-color:#455158;color:var(--text)}.filter small{margin-left:8px;color:var(--muted)}.headers,.workrow{gap:20px;align-items:center;padding-left:14px;padding-right:14px}.headers{padding-bottom:10px}.workrow{display:grid;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding-top:15px;padding-bottom:15px;text-align:left;min-height:86px}.workrow:hover{background:#1e282e}.headline{font-size:15px;font-weight:550;letter-spacing:-.1px}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.phase{display:flex;align-items:center;gap:8px;font-size:12px}.dot{height:7px;width:7px;border-radius:50%;background:#91aaba;flex-shrink:0}.wait .dot{background:var(--accent)}.done .dot{background:var(--green)}.neutral .dot{background:#7e8d95}.next{font-size:12px;color:#d0d8dc}.next small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.arrow{text-align:right;color:#83969f;font-size:19px}.footer{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:20px;color:#83969f;font-size:11px}.back{border:0;background:none;display:flex;gap:12px;align-items:center;padding:10px 0;min-height:44px}.detail{max-width:1080px;margin:32px auto 0}.detailhead{max-width:790px;margin-bottom:31px}.detailhead h1{font-size:clamp(30px,3.8vw,43px);margin:13px 0}.detailhead p{font-size:16px;color:var(--muted)}.brief{display:grid;gap:42px}.block{margin-bottom:25px}.block .eyebrow{margin-bottom:12px}.block p{font-size:15px;color:#c5cfd4;line-height:1.8}.recommendation{border-left:2px solid #958569;padding-left:18px;margin-top:24px}.recommendation p{font-size:14px;color:#d3c7b1}.people{padding-top:20px;border-top:1px solid var(--line)}.person{display:flex;gap:12px;align-items:center;padding:10px 0}.avatar{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid #4b5c66;border-radius:50%;font-size:10px;background:#25323a;flex-shrink:0}.person a{font-size:13px;text-decoration:none}.person a:hover{text-decoration:underline}.person small{display:block;font-size:11px;color:var(--muted)}.answerbox{align-self:start;border:1px solid #45545d;background:var(--panel);padding:24px;border-radius:10px;overflow:hidden}.answerbox h2{font-size:23px;line-height:1.4;font-weight:500;letter-spacing:-.4px;margin:12px 0 19px}.answerbox textarea,.input{width:100%;display:block;border:1px solid #566771;border-radius:7px;background:#11191d;color:var(--text);padding:14px;min-height:155px;resize:vertical;line-height:1.65;font-size:16px}.answerbox textarea::placeholder,.input::placeholder{color:#8a9ba4}.composebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px}.mic{display:flex;gap:8px;align-items:center;border:0;background:none;font-size:12px;padding:8px 0;min-height:44px;color:#cad4d9}.hint{font-size:11px;line-height:1.65;color:var(--muted);margin-top:12px}.receipt{padding:16px;border:1px solid #4d6456;background:#203329;border-radius:7px;margin:16px 0;color:#d4e4d9}.receipt blockquote{margin:12px 0;padding:12px 0;border-top:1px solid #476050;white-space:pre-wrap}.receipt p{font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.refs{border-top:1px solid var(--line);padding-top:14px;margin-top:24px;font-size:12px;color:var(--muted)}.refs summary{cursor:pointer;min-height:35px}.refs a{display:inline-block;padding:8px 12px 8px 0}.checks{list-style:none;padding:0;margin:14px 0}.checks li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:11px;font-size:13px;color:#c4d1d7}.checks li span{color:var(--green)}.report{max-width:690px;margin:36px auto}.report label{display:block;margin:22px 0 8px;color:var(--muted)}.input{min-height:48px}.report textarea{min-height:200px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 22px;border-radius:7px;background:var(--accent);color:#24211b;z-index:10;font-size:13px}.empty{padding:40px;text-align:center;color:var(--muted)}
.top{min-height:64px}.intro{padding:21px 0 19px}.hero h2{font-size:25px;margin:9px 0}.heromain{padding:19px 24px}.heroside{padding:17px 23px;gap:14px}.sectionhead{margin:22px 0 12px}.filters{margin-bottom:13px}.workrow{min-height:69px;padding-top:11px;padding-bottom:11px}.options{display:grid;gap:8px;margin:14px 0}.option{background:#222e35;border:1px solid #495b65;border-radius:7px;text-align:left;padding:12px 14px}.option:hover{border-color:var(--accent)}.option strong{display:block;font-size:13px;font-weight:550}.option small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.intro{padding:15px 0 12px}.intro h1{font-size:32px}.heromain{padding:15px 22px}.heroside{padding:14px 23px}.sectionhead{margin-top:16px}.filters{margin-bottom:9px}
.workrow{min-height:64px;padding-top:9px;padding-bottom:9px}
.hero{margin-top:22px}.heroside{justify-content:center;background:transparent}.session-id{display:block;font:11px/1.9 ui-monospace,SFMono-Regular,monospace;color:#bdcad2;text-decoration:none;width:fit-content}.session-id:hover{color:var(--text);text-decoration:underline}.worktitle{display:block;border:0;background:none;text-align:left;padding:0;width:100%}.worktitle:hover .headline{color:var(--accent)}.phase-track{height:7px;width:100%;max-width:150px;background:#303b42;border-radius:3px;overflow:hidden;margin-top:9px}.phase-fill{height:100%;background:#91aaba;border-radius:0}.wait .phase-fill{background:#c7ab77}.done .phase-fill{background:#93b7a1}.neutral .phase-fill{background:#8699a5}.time{color:var(--muted);font-size:12px;white-space:nowrap}.workrow{cursor:default}.rowopen{border:0;background:none;padding:6px;color:#8ca1ad;font-size:20px;min-height:40px}.mobilemeta{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.headline,.subtitle,.detailhead,.block,.person{overflow-wrap:anywhere;min-width:0}.shell{width:100%}.phase-track{max-width:150px}.answerbox{min-width:0}.receipt blockquote{overflow-wrap:anywhere}</style>
<script>__OPS_SCRIPT__</script>
<script type="application/json" id="ops-config">__OPS_CONFIG__</script>
<main x-data="window.missionOps(JSON.parse(document.getElementById('ops-config').textContent))" data-testid="ops-root" x-cloak class="shell" @keydown.escape.window="if(view!=='overview')back()">
<template x-if="view==='overview'"><div><header class="top"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Mission Control</div><button class="ghost" @click="report()">＋ Report an issue</button></header>
<template x-if="featured"><div class="hero md:grid-cols-[minmax(0,1fr)_230px]"><div class="heromain"><h2 x-text="featured.shortQuestion||featured.question"></h2><p x-text="featured.briefing||featured.subtitle"></p></div><div class="heroside"><button class="primary" @click="open(featured.id)">Answer <span aria-hidden="true">↗</span></button></div></div></template>

<div role="status" class="hint" data-testid="ops-loading" x-show="loading">Loading current records…</div><template x-for="error in errors"><p class="hint" role="alert" x-text="error.message"></p></template><div class="sectionhead"><h3>Work <span class="muted" style="margin-left:9px;font-weight:400" x-text="issues.length"></span></h3><button class="ghost" @click="refresh()" :disabled="loading">Refresh</button></div><p class="hint" x-text="scopeLabel"></p><input class="input" style="min-height:44px;margin:12px 0" x-model="search" aria-label="Search work or sessions" placeholder="Find an issue or session…">
<nav class="filters" aria-label="Filter work"><template x-for="f in filters" :key="f[0]"><button class="filter" :class="{'active':filter===f[0]}" :aria-pressed="filter===f[0]" @click="filter=f[0];limit=100"><span x-text="f[1]"></span><small x-text="count(f[0])"></small></button></template></nav>
<div class="headers hidden md:grid md:grid-cols-[minmax(0,1.8fr)_150px_160px_85px_24px] eyebrow"><span>Issue</span><span>Phase</span><span>Sessions</span><span x-text="filter==='completed'?'Completed':'Updated'"></span><span></span></div>
<template x-for="issue in rows" :key="issue.id"><div class="workrow grid-cols-1 md:grid-cols-[minmax(0,1.8fr)_150px_160px_85px_24px]">
<div style="min-width:0"><button class="worktitle" @click="open(issue.id)"><span class="headline" x-text="issue.headline"></span><span class="subtitle" style="display:block" x-text="issue.subtitle"></span></button>
<div class="mobilemeta md:hidden"><div :class="issue.tone" style="flex:1"><span class="phase" x-text="issue.phase"></span><div class="phase-track" role="img" :aria-label="issue.phase+' — stage, not percent complete'"><div class="phase-fill" :style="'width:'+(issue.stageWidth||0)+'%'"></div></div></div><time class="time" :datetime="issue.completedAt||issue.updatedAt" :title="timeTitle(issue)" x-text="ago(issue.completedAt||issue.updatedAt)"></time></div>
<div class="md:hidden" style="margin-top:10px"><template x-for="p in issue.people" :key="p[3]"><a class="session-id" :title="p[1]+': '+p[2]" :href="sessionHref(p[3])" target="_top" rel="noopener" x-text="p[3]"></a></template><span x-show="!issue.people.length" class="muted">Unassigned</span></div></div>
<div class="hidden md:block" :class="issue.tone"><span class="phase" x-text="issue.phase"></span><div class="phase-track" role="img" :aria-label="issue.phase+' — stage, not percent complete'" title="Stage of work, not estimated effort completed"><div class="phase-fill" :style="'width:'+(issue.stageWidth||0)+'%'"></div></div></div>
<div class="hidden md:block"><template x-for="p in issue.people" :key="p[3]"><a class="session-id" :title="p[1]+': '+p[2]" :href="sessionHref(p[3])" target="_top" rel="noopener" x-text="p[3]"></a></template><span x-show="!issue.people.length" class="muted">Unassigned</span></div>
<time class="time hidden md:block" :datetime="issue.completedAt||issue.updatedAt" :title="timeTitle(issue)" x-text="ago(issue.completedAt||issue.updatedAt)"></time><button class="rowopen hidden md:block" @click="open(issue.id)" :aria-label="'Open '+issue.headline">↗</button></div></template><div x-show="!rows.length" class="empty">No work in this view.</div>
<button class="ghost" x-show="filteredRows.length>limit" @click="limit+=100">Load more</button><p class="hint" x-text="rows.length+' shown · '+filteredRows.length+' match this view'"></p><details class="refs"><summary x-text="sessions.length+' live sessions · '+unlinkedSessions.length+' without linked task ownership'"></summary><template x-for="s in unlinkedSessions" :key="s.id"><div><a class="session-id" :href="sessionHref(s.id)" target="_top" x-text="s.id"></a><span x-text="s.label"></span><small class="muted"> · No linked task; activity unknown</small></div></template></details><details class="refs"><summary>Coordinator routing</summary><template x-for="seat in seats" :key="seat.key"><p><span x-text="seat.label"></span> · <span x-text="seat.status"></span> <a class="session-id" x-show="seat.session" :href="sessionHref(seat.session)" target="_top" x-text="seat.session"></a></p></template></details><footer class="footer"><span><span x-text="scopeLabel"></span></span><span class="hidden md:block">Bars show stage, not % complete. Updated = source record timestamp.</span></footer></div></template>
<template x-if="view==='detail' && current"><div><header class="top"><button class="back" @click="back()">← <span>All work</span></button><span class="eyebrow hidden md:block" x-text="current.question?'One thing to resolve':current.group==='check'?'Close the loop':'Plan the next move'"></span><button class="textbtn" @click="report()">Report something else</button></header>
<div class="detail"><div class="detailhead"><div class="phase" :class="current.tone"><i class="dot"></i><span x-text="current.phase"></span></div><h1 x-text="current.headline"></h1><p x-text="current.subtitle"></p></div><div class="brief md:grid-cols-[minmax(0,1fr)_minmax(0,1.05fr)]"><div><div class="block"><div class="eyebrow">The background</div><p style="white-space:pre-wrap;overflow-wrap:anywhere" x-text="current.background"></p></div><div class="block" x-show="current.impact||current.recommendation"><div class="eyebrow">What this moves forward</div><p x-text="current.impact"></p><div class="recommendation" x-show="current.recommendation"><div class="eyebrow">My recommendation</div><p x-text="current.recommendation"></p></div></div>
<div class="actions"><template x-for="artifact in current.artifacts" :key="artifact.href"><a class="ghost" :href="artifact.href" target="_top" rel="noopener" x-text="artifact.label+' ↗'"></a></template></div><div class="people"><div class="eyebrow">Sessions and routing</div><template x-for="p in current.people" :key="p[3]"><div class="person"><span class="avatar" x-text="p[0]"></span><div><a :href="sessionHref(p[3])" target="_top" rel="noopener" x-text="p[1]+' ↗'"></a><small x-text="p[2]"></small></div></div></template><p x-show="!current.people.length" class="muted">No owner assigned yet.</p></div><details class="refs"><summary>Progress and source details</summary><template x-for="change in current.changes"><p style="margin:8px 0" x-text="change"></p></template><template x-for="ref in current.refs"><span style="display:inline-block;margin-right:12px"><template x-if="refHref(ref)"><a :href="refHref(ref)" target="_top" rel="noopener" x-text="ref+' ↗'"></a></template><template x-if="!refHref(ref)"><span x-text="ref"></span></template></span></template><p>Task assignment is not proof of activity. Stage reflects an explicit report; missing or stale reports are labeled.</p></details></div>
<div class="answerbox order-first md:order-last"><div><div class="eyebrow" x-text="current.question?'Question':'Feedback'"></div><h2 x-text="current.question||'What needs to change?'"></h2><p class="hint" x-text="current.recipientLabel"></p></div>
<div class="options" x-show="current.question && !answers[selectedId]"><template x-for="option in current.options"><button class="option" @click="draft=option.text"><strong x-text="option.label"></strong><small x-text="option.consequence"></small></button></template></div>
<template x-if="answers[selectedId]"><div class="receipt" role="status"><strong x-text="answers[selectedId].receipt"></strong><blockquote x-text="answers[selectedId].text"></blockquote><p>Saved to the record. A relay receipt does not mean the owner has acknowledged it.</p><div class="actions"><button class="ghost" @click="copy()">Copy text</button><button class="textbtn" @click="edit()">Write a follow-up</button></div></div></template>
<div x-show="!answers[selectedId]" style="margin-top:20px"><label for="answer" class="eyebrow" style="display:block;margin-bottom:9px">Your words</label><textarea id="answer" x-ref="answer" x-model="draft" :placeholder="current.question?'Tell me what you want to do, or ask me to clarify…':'Give the owner a next step, or describe what still needs work…'"></textarea><div class="composebar"><button class="mic" @click="dictate()" aria-label="Focus answer for keyboard dictation"><svg width="16" height="20" viewBox="0 0 18 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="1" width="6" height="12" rx="3"/><path d="M3 9v2a6 6 0 0 0 12 0V9M9 17v4M5 21h8"/></svg>Use keyboard dictation</button><button class="primary" @click="submit()" :disabled="sending||!draft.trim()||!current.canSend">Send ↑</button></div><p class="hint" x-show="dictationHint" role="status">The answer field is focused. Use your keyboard’s microphone or device dictation shortcut. This field uses your keyboard dictation, not the floating voice capsule.</p><p class="hint">Send adds to the conversation. Only Resolve marks a question answered.</p></div><div class="actions"><button class="ghost" @click="clarify()" :disabled="sending||!current.canSend">Needs clarification</button><button class="ghost" x-show="current.canResolve" @click="resolve()" :disabled="sending||!draft.trim()">Resolve question</button></div><p class="hint" role="alert" x-show="sendError" x-text="sendError"></p><p class="hint" x-show="!current.canSend">No writable question or connected pillar here. Open the source or session to continue.</p></div></div></div></div></template>
<template x-if="view==='report'"><div><header class="top"><button class="back" @click="back()">← All work</button><span class="eyebrow">Report</span></header><form class="report" @submit.prevent="addReport()"><div class="eyebrow">A new concern</div><h1 style="margin:14px 0">Tell me what happened.</h1><p class="muted"><span x-text="reportRecipient"></span></p><label for="report-title">A headline you’ll recognize</label><input id="report-title" class="input" x-model="reportTitle" required placeholder="The sharing menu won’t close"><label for="report-body">What happened, and what did you expect?</label><textarea id="report-body" class="input" x-model="reportBody" required placeholder="Type or use your keyboard’s microphone. Keep it in your own words."></textarea><div class="actions"><button type="submit" class="primary" :disabled="sending||!reportTitle.trim()||!reportBody.trim()||!reportPillar">Send report ↑</button></div><p class="hint">Saves in Mission Control Infrastructure chat and attempts relay to its coordinator. The receipt confirms what happened; no task is created automatically.</p><p class="hint" role="alert" x-text="sendError"></p></form></div></template>
<div class="toast" role="status" x-show="notice" x-text="notice" x-transition></div>
</main></body></html>
