<div x-data="missionPage()" data-testid="mission-fragment-root"
     class="h-full flex flex-col">
  <style>
    /* The mission list speaks the mission screens' design language:
       same palette, type scale, icon vocabulary, flat controls. */
    .msn-list{--bg:#0c0f14;--card:#12151d;--card2:#161a24;--line:#232837;
      --line2:#39415a;--ink:#e8ebf2;--ink2:#aab3c4;--ink3:#8391a8;
      --accent:#8b85ff;--warn:#fab219;--crit:#f4597b;--good:#34d399;
      background:var(--bg);padding:14px 14px 40px;flex:1;overflow-y:auto}
    .msn-row{background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:12px 14px 11px;margin:0 0 10px;
      cursor:pointer}
    .msn-row:active{background:var(--card2)}
    .msn-row.done{opacity:.55}
    .msn-name{color:var(--ink);font-weight:650;line-height:1.25;
      white-space:nowrap;overflow:hidden}
    .msn-grid{display:flex;gap:2px;align-items:flex-end;height:13px;
      margin:8px 0 7px}
    .msn-grid i{flex:1;border-radius:1px;background:var(--accent)}
    .msn-grid i.z{height:2px!important;background:var(--line);opacity:.7}
    .msn-meta{display:flex;align-items:baseline;gap:11px;
      font-size:.7rem;color:var(--ink3);white-space:nowrap;min-width:0}
    .msn-meta .ago{overflow:hidden;text-overflow:ellipsis;min-width:0}
    .msn-meta b{font-weight:700;font-size:.76rem}
    .msn-ct{flex:none;display:inline-flex;gap:4px;align-items:baseline}
    .msn-ct .mk{font-weight:700}
    .msn-ct.crit .mk,.msn-ct.crit b{color:var(--crit)}
    .msn-ct.warn .mk,.msn-ct.warn b{color:var(--warn)}
    .msn-ct.dim .mk,.msn-ct.dim b{color:var(--ink2)}
    .msn-ct svg{width:.95em;height:.95em;vertical-align:-0.1em}
    .msn-life{flex:none;margin-left:auto;display:inline-flex;gap:12px;
      align-items:baseline}
    .msn-life button{background:none;border:0;padding:2px 0 3px;
      cursor:pointer;font:inherit;font-size:.66rem;text-transform:uppercase;
      letter-spacing:.05em;color:var(--ink3)}
    .msn-life button.on{color:var(--ink);
      box-shadow:inset 0 -2px 0 var(--line2)}
    .msn-life:not(.open) button:not(.on){display:none}
    .msn-life.open button{display:inline}
    .msn-empty{color:var(--ink3);font-size:.85rem;padding:18px 4px}
    .msn-err{color:var(--crit);font-size:.8rem;padding:12px 4px}
  </style>

  <!-- the mission screen, embedded — never a page navigation -->
  <template x-if="current">
    <div class="flex-1 flex flex-col min-h-0">
      <div class="flex items-center gap-2 px-3 py-1.5 border-b"
           style="border-color:#232837;background:#0c0f14">
        <button @click="back()" style="color:#8391a8"
                class="text-sm px-2 py-1">&#8249; Missions</button>
        <span class="text-sm font-medium truncate" style="color:#aab3c4"
              x-text="(missions.find(m => m.mission_id === current) || {}).name || ''"></span>
      </div>
      <iframe :src="frameSrc()" class="flex-1 w-full border-0 min-h-0"
              title="Mission screen"></iframe>
    </div>
  </template>

  <template x-if="!current">
    <div class="msn-list">
      <template x-if="loaded && error">
        <p class="msn-err" x-text="'Could not load missions: ' + error"></p>
      </template>
      <template x-if="loaded && !error && !missions.length">
        <p class="msn-empty">No missions yet — the first
          <code>mission.registry</code> row becomes a screen the moment it
          exists.</p>
      </template>

      <template x-for="m in missions" :key="m.mission_id">
        <div class="msn-row" :class="m.status === 'complete' ? 'done' : ''"
             @click="open(m)">
          <div class="msn-name" x-init="fitName($el)" x-text="m.name"></div>

          <div class="msn-grid" aria-label="activity, last 28 days">
            <template x-for="(b, i) in bars(m)" :key="i">
              <i :class="b.on ? '' : 'z'"
                 :style="'height:' + b.h + '%;opacity:' + b.op"></i>
            </template>
          </div>

          <div class="msn-meta">
            <span class="ago" x-text="ago(m)"></span>
            <template x-for="c in counts(m)" :key="c.key">
              <span class="msn-ct" :class="c.cls">
                <span class="mk" x-html="c.mark"></span><b x-text="c.n"></b>
              </span>
            </template>
            <span class="msn-life" :class="lifeOpen === m.mission_id ? 'open' : ''"
                  @click.stop>
              <template x-for="st in ['active','paused','complete']" :key="st">
                <button :class="m.status === st ? 'on' : ''"
                        @click="lifeTap(m, st)" x-text="st"></button>
              </template>
            </span>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
