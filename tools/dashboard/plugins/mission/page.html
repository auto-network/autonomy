<div x-data="missionPage()" data-testid="mission-fragment-root"
     class="h-full flex flex-col">

  <!-- the mission screen, embedded — never a page navigation -->
  <template x-if="current">
    <div class="flex-1 flex flex-col min-h-0">
      <div class="flex items-center gap-2 px-3 py-1.5 border-b border-gray-800">
        <button @click="back()"
                class="text-gray-400 hover:text-gray-100 text-sm px-2 py-1">
          &#8249; Missions
        </button>
        <span class="text-gray-200 text-sm font-medium truncate"
              x-text="(missions.find(m => m.mission_id === current) || {}).name || ''"></span>
      </div>
      <iframe :src="frameSrc()" class="flex-1 w-full border-0 min-h-0"
              title="Mission screen"></iframe>
    </div>
  </template>

  <template x-if="!current">
    <div class="px-4 pt-4 pb-8">

      <template x-if="loaded && error">
        <p class="text-red-400 text-sm mb-3"
           x-text="'Could not load missions: ' + error"></p>
      </template>

      <template x-if="loaded && !error && !missions.length">
        <p class="text-gray-400 text-sm">
          No missions yet — the first
          <code class="text-indigo-300">mission.registry</code> row becomes a
          screen the moment it exists.
        </p>
      </template>

      <div class="space-y-3">
        <template x-for="m in missions" :key="m.mission_id">
          <div class="w-full rounded-xl bg-gray-900/70 border border-gray-800
                      px-4 py-3 cursor-pointer hover:border-gray-700"
               :class="m.status === 'complete' ? 'opacity-60' : ''"
               @click="open(m)">

            <!-- name: full width, one line, auto-fit -->
            <div class="w-full overflow-hidden">
              <div class="text-gray-100 font-semibold leading-tight"
                   x-init="fitName($el)" x-text="m.name"></div>
            </div>

            <!-- activity strip: 14 days, oldest -> today -->
            <div class="flex items-end gap-[3px] h-7 mt-2.5"
                 aria-label="activity, last 14 days">
              <template x-for="(b, i) in bars(m)" :key="i">
                <div class="flex-1 rounded-sm"
                     :class="b.on ? 'bg-indigo-400/80' : 'bg-gray-800'"
                     :style="'height:' + b.h + '%'"></div>
              </template>
            </div>

            <!-- recency + attention counts + lifecycle -->
            <div class="flex items-center mt-2 gap-3 text-xs">
              <span class="text-gray-500" x-text="ago(m)"></span>
              <template x-for="c in counts(m)" :key="c.label">
                <span x-text="c.label"
                      :class="{
                        'text-red-400 font-medium': c.cls === 'crit',
                        'text-amber-400': c.cls === 'warn',
                        'text-gray-500': c.cls === 'dim',
                      }"></span>
              </template>
              <span class="flex-1"></span>
              <div class="flex rounded-lg border border-gray-800 overflow-hidden"
                   @click.stop>
                <template x-for="st in ['active','paused','complete']" :key="st">
                  <button class="px-2.5 py-1 text-[11px] capitalize"
                          :class="m.status === st
                            ? 'bg-gray-700/80 text-gray-100'
                            : 'text-gray-500 hover:text-gray-300'"
                          @click="setStatus(m, st)" x-text="st"></button>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
