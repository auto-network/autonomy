<div x-data="missionPage()" data-testid="mission-fragment-root"
     :class="current ? '' : 'p-6'" class="h-full flex flex-col">

  <!-- the mission screen, embedded — never a page navigation -->
  <template x-if="current">
    <div class="flex-1 flex flex-col min-h-0">
      <div class="flex items-center gap-2 px-3 py-1.5 border-b border-gray-800">
        <button @click="back()"
                class="text-gray-400 hover:text-gray-100 text-sm px-2 py-1">
          &#8249; Missions
        </button>
        <span class="text-gray-200 text-sm font-medium"
              x-text="(missions.find(m => m.mission_id === current) || {}).name || ''"></span>
      </div>
      <iframe :src="frameSrc()" class="flex-1 w-full border-0 min-h-0"
              title="Mission screen"></iframe>
    </div>
  </template>

  <template x-if="!current">
    <div>
      <h2 class="text-xl font-semibold text-gray-100 mb-4">Mission Control</h2>

      <template x-if="loaded && error">
        <p class="text-red-400" x-text="'Could not load missions: ' + error"></p>
      </template>

      <template x-if="loaded && !error && !missions.length">
        <p class="text-gray-400">
          No missions yet. Create one with
          <code class="text-indigo-300">graph set add mission.registry#1</code>
          — the screen renders the moment the row exists.
        </p>
      </template>

      <ul class="space-y-2">
        <template x-for="m in missions" :key="m.mission_id">
          <li>
            <button @click="open(m)"
                    class="w-full text-left px-4 py-3 rounded-lg bg-gray-800/60
                           hover:bg-gray-800 border border-gray-700/60">
              <span class="text-gray-100 font-medium" x-text="m.name"></span>
              <span class="text-gray-500 text-sm ml-2" x-text="m.status"></span>
            </button>
          </li>
        </template>
      </ul>
    </div>
  </template>
</div>
